der de você, e se tem a condição Invisível, não obtém nenhum benefício dela contra você.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 2."],["Esquentar Metal",2,"Transmutação",["bardo","druida"],"Ação","18 metros","V, S, M (um pedaço de ferro e uma chama)","Concentração, até 1 minuto","Escolha um objeto de metal fabricado, como uma arma ou uma armadura de metal pesada ou média, à sua vista e no alcance da magia. Você faz com que o objeto brilhe em brasa. Qualquer criatura em contato físico com o objeto sofre 2d8 pontos de dano ígneo quando você conjura a magia. Enquanto a magia durar, você pode executar uma ação Bônus em cada um dos seus turnos subsequentes para causar esse dano novamente, desde que o objeto esteja no alcance da magia.\n\nSe uma criatura estiver segurando ou usando o objeto e sofrer dano, ela deve ser bem-sucedida em uma salvaguarda de Constituição ou soltar o objeto, se puder. Se não soltar o objeto, ela tem Desvantagem em jogadas de ataque e testes de atributo até o início do seu próximo turno.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 2."],["Estática Sináptica",5,"Encantamento",["bardo","bruxo","feiticeiro","mago"],"Ação","36 metros","V, S","Instantânea","Você faz com que a energia psíquica entre em erupção em um ponto no alcance da magia. Cada criatura em uma Esfera de 6 metros de raio centrada nesse ponto realiza uma salvaguarda de Inteligência, sofrendo 8d6 pontos de dano Psíquico se falhar, ou metade desse dano em caso de sucesso.\n\nSe falhar, um alvo também tem pensamentos confusos por 1 minuto. Durante esse tempo, ele subtrai 1d6 de todas as suas jogadas de ataque e testes de atributo, bem como quaisquer salvaguardas de Constituição para manter a Concentração. A criatura realiza uma salvaguarda de Inteligência no final de cada um dos turnos dela, encerrando o efeito sobre si em caso de sucesso."],["Explosão Elemental",0,"Evocação",["feiticeiro"],"Ação","36 metros","V, S","Instantânea","Você dispara energia arcana contra uma criatura ou objeto no alcance da magia. Realize uma jogada de ataque à distância contra o alvo. Em caso de acerto, o alvo sofre 1d8 pontos de dano de um tipo à sua escolha: Ácido, Elétrico, Gélido, Ígneo, Psíquico, Trovejante ou Venenoso.\n\nSe você tirar um 8 no d8 para esta magia, pode jogar outro d8 e adicionar ao dano. Ao conjurar essa magia, o número máximo de d8 adicionais que você pode somar ao dano da magia é igual ao seu modificador de atributo de conjuração.\n\nAprimoramento de Truque. O dano aumenta em 1d8 quando você atinge os níveis 5 (2d8), 11 (3d8) e 17 (4d8)."],["Explosão Solar",8,"Evocação",["clerigo","druida","feiticeiro","mago"],"Ação","45 metros","V, S, M (um pedaço de pedra solar)","Instantânea","Luz solar brilhante lampeja em uma Esfera de 18 metros de raio centrada em um ponto à sua escolha no alcance da magia. Cada criatura na Esfera realiza uma salvaguarda de Constituição. Se falhar, uma criatura sofre 12d6 pontos de dano Radiante e tem a condição Cego por 1 minuto. Em caso de sucesso, ela sofre apenas metade do dano.\n\nUma criatura Cega por esta magia realiza outra salvaguarda de Constituição no final de cada um dos turnos dela, encerrando o efeito em caso de sucesso. Esta magia dissipa Escuridão criada por qualquer magia em sua área."],["Fabricar",4,"Transmutação",["mago"],"10 minutos","36 metros","V, S","Instantânea","Você converte matérias-primas em produtos do mesmo material. Por exemplo, você pode fabricar uma ponte de madeira a partir de um grupo de árvores, uma corda a partir de um pedaço de cânhamo ou roupas a partir de linho ou lã.\n\nEscolha as matérias-primas à sua vista e no alcance da magia. Você pode fabricar um objeto Grande ou menor (que caiba em um Cubo de 3 metros de lado ou oito Cubos de 1,5 metro de lado conectados) com uma quantidade suficiente de material. Contudo, se você estiver trabalhando com metal, pedra ou outra substância mineral, o objeto fabricado não pode ser maior do que Médio (que caiba em um Cubo de 1,5 metro de lado). A qualidade de quaisquer objetos fabricados é baseada na qualidade das matérias-primas.\n\nCriaturas e itens mágicos não podem ser criados por esta magia. Você também não pode usá-la para criar itens que exijam um alto grau de habilidade — como armas e armaduras — a menos que você tenha proficiência com o tipo de Ferramentas de Artesão usadas para criar tais objetos."],["Faca de Gelo",1,"Invocação",["druida","feiticeiro","mago"],"Ação","18 metros","S, M (uma gota de água ou um pedaço de gelo)","Instantânea","Você cria um fragmento de gelo e o arremessa em uma criatura no alcance da magia. Realize um ataque mágico à distância contra o alvo. Se o ataque for bem-sucedido, o alvo sofre 1d10 pontos de dano Perfurante. Independentemente de ter acertado ou não, o fragmento explode. O alvo e cada criatura a até 1,5 metro dele devem ser bem-sucedidos em uma salvaguarda de Destreza ou sofrem 2d6 pontos de dano Gélido.\n\nUsando um Espaço de Magia de Círculo Superior. O dano Gélido aumenta em 1d6 para cada círculo de espaço de magia acima de 1."],["Fagulha Estelar",0,"Evocação",["bardo","druida"],"Ação","18 metros","V, S","Instantânea","Você lança uma faísca de luz em uma criatura ou objeto no alcance da magia. Realize um ataque mágico à distância contra o alvo. Em caso de acerto, o alvo sofre 1d8 pontos de dano Radiante e, até o final do seu próximo turno, emite Meia-luz em um raio de 3 metros e não pode se beneficiar da condição Invisível.\n\nAprimoramento de Truque. O dano aumenta em 1d8 quando você atinge os níveis 5 (2d8), 11 (3d8) e 17 (4d8)."],["Falar com Animais",1,"Adivinhação",["bardo","bruxo","druida","guardiao"],"Ação ou Ritual","Pessoal","V, S","10 minutos","Pela duração da magia, você pode compreender e se comunicar verbalmente com Feras, e pode usar com elas qualquer uma das opções de perícia da ação Influenciar.\n\nA maioria das Feras oferece pouca informação sobre assuntos que não estejam diretamente ligados à sobrevivência ou ao companheirismo mas, no mínimo, uma Fera pode fornecer informações sobre áreas vizinhas e monstros, incluindo o que percebeu no último dia."],["Falar com Mortos",3,"Necromancia",["bardo","clerigo","mago"],"Ação","3 metros","V, S, M (um incenso aceso)","10 minutos","Você confere uma aparência de vida a um cadáver à sua escolha que esteja no alcance da magia, permitindo que ele responda às perguntas que você fizer. O cadáver precisa ter boca, e a magia falha se a criatura morta era um Morto-Vivo quando pereceu ou se foi o alvo desta magia nos últimos 10 dias.\n\nAté que a magia termine, você pode fazer até cinco perguntas ao cadáver. O cadáver sabe apenas o que sabia em vida, incluindo os idiomas que conhecia. As respostas geralmente são breves, enigmáticas ou repetitivas, e o cadáver não tem obrigação de oferecer uma resposta verdadeira se você for hostil a ele ou se ele o reconhecer como um inimigo. Esta magia não devolve a alma da criatura ao corpo dela, apenas o espírito animado. Assim, o cadáver não pode aprender novas informações, não compreende nada do que aconteceu desde que morreu e não pode discorrer sobre eventos futuros."],["Falar com Plantas",3,"Transmutação",["bardo","druida","guardiao"],"Ação","Pessoal","V, S","10 minutos","Você imbuí plantas em uma Emanação imóvel de 9 metros com razão e intelecto limitado, permitindo que elas se comuniquem com você e sigam seus comandos simples. Você pode questionar as plantas sobre eventos na área da magia nas últimas 24 horas, obtendo informações sobre criaturas que passaram, clima e outras circunstâncias.\n\nAlém disso, você pode transformar Terreno Difícil causado pelo crescimento vegetal (como moitas e vegetação densa) em terreno comum pela duração da magia. Como alternativa, você pode transformar terreno comum onde há plantas em Terreno Difícil, também pela duração da magia.\n\nA magia não permite que as plantas se desloquem, mas elas podem mover seus galhos, cipós e caules para você.\n\nCaso haja uma criatura do tipo Planta na área, você pode se comunicar com ela como se compartilhassem um idioma em comum."],["Favor Divino",1,"Transmutação",["paladino"],"Ação Bônus","Pessoal","V, S","1 minuto","Até que a magia termine, seus ataques com armas causam 1d4 pontos de dano Radiante adicionais em um acerto."],["Flecha Relâmpago",3,"Transmutação",["guardiao"],"Ação Bônus, que você realiza imediatamente após atingir ou errar um alvo com um ataque à distância usando uma arma","Pessoal","V, S","Instantânea","Quando seu ataque atinge ou erra o alvo, a arma ou munição que você está usando se transforma em um relâmpago. Em vez de sofrer qualquer dano ou outros efeitos do ataque, o alvo sofre 4d8 pontos de dano Elétrico em um acerto ou metade desse dano em um erro. Cada criatura em um raio de 3 metros do alvo deve então realizar uma salvaguarda de Destreza, sofrendo 2d8 pontos de dano Elétrico se falhar ou metade desse dano em caso de sucesso.\n\nA arma ou munição retorna então à sua forma normal.\n\nUsando um Espaço de Magia de Círculo Superior. O dano para ambos os efeitos da magia aumenta em 1d8 para cada círculo de espaço de magia acima de 3."],["Flecha Ácida de Melf",2,"Evocação",["mago"],"Ação","27 metros","V, S, M (folha de ruibarbo em pó)","Instantânea","Uma flecha verde brilhante dispara em direção a um alvo no alcance da magia, explodindo em um borrifo de ácido. Realize um ataque mágico à distância contra o alvo. Em caso de acerto, o alvo sofre 4d4 pontos de dano Ácido e 2d4 pontos de dano Ácido no final do próximo turno dele. Se falhar, a flecha respinga ácido no alvo, causando somente metade do dano inicial.\n\nUsando um Espaço de Magia de Círculo Superior. O dano (inicial e posterior) aumenta em 1d4 para cada círculo de espaço de magia acima de 2."],["Fogo das Fadas",1,"Evocação",["bardo","druida"],"Ação","18 metros","V","Concentração, até 1 minuto","Objetos em um Cubo de 6 metros de lado no alcance da magia são delineados por luz azul, verde ou violeta (à sua escolha). Cada criatura no Cubo também é delineada se falhar em uma salvaguarda de Destreza. Pela duração da magia, objetos e criaturas afetadas emitem Meia-Luz em um raio de 3 metros e não podem se beneficiar da condição Invisível.\n\nJogadas de ataque contra uma criatura ou objeto afetado têm Vantagem se o atacante puder vê-la."],["Fome de Hadar",3,"Invocação",["bruxo"],"Ação","45 metros","V, S, M (um tentáculo em conserva)","Concentração, até 1 minuto","Você abre uma porta de entrada para o Reino Distante, uma região infestada de horrores indizíveis. Uma Esfera de Escuridão de 6 metros de raio aparece, centrada em um ponto no alcance e pela duração da magia. A Esfera é considerada Terreno Difícil, e está cheia de sussurros estranhos e sons de sucção que podem ser ouvidos a até 9 metros de distância. Nenhuma luz, seja mágica ou não, pode iluminar a área, e criaturas totalmente dentro da área têm a condição Cego.\n\nQualquer criatura que comece seu turno na área sofre 2d6 pontos de dano Gélido. Qualquer criatura que termine seu turno na área deve ser bem-sucedida em uma salvaguarda de Destreza ou sofre 2d6 pontos de dano Ácido enquanto tentáculos esbranquiçados de outro mundo se esfregam nela.\n\nUsando um Espaço de Magia de Círculo Superior. O dano Ácido ou Gélido (à sua escolha) aumenta em 1d6 para cada círculo de espaço de magia acima de 3."],["Fonte do Luar",4,"Evocação",["bardo","druida"],"Ação","Pessoal","V, S","Concentração, até 10 minutos","Uma luz fria envolve seu corpo pela duração da magia, emitindo Luz Plena em um raio de 6 metros e Meia-luz por mais 6 metros.\n\nAté que a magia termine, você tem Resistência a dano Radiante e seus ataques corpo a corpo causam 2d6 pontos de dano Radiante adicionais em caso de acerto.\n\nAlém disso, imediatamente após sofrer dano de uma criatura à sua vista a até 18 metros de si, você pode executar uma Reação para forçar a criatura a realizar uma salvaguarda de Constituição. Se falhar, a criatura tem a condição Cego até o final do seu próximo turno."],["Forma Etérea",7,"Invocação",["bardo","bruxo","clerigo","feiticeiro","mago"],"Ação","Pessoal","V, S","Até 8 horas","Você entra nas regiões de fronteira do Plano Etéreo, onde ele se sobrepõe ao seu plano atual.\n\nVocê permanece na Fronteira Etérea pela duração da magia. Durante esse período, você pode se mover em qualquer direção. Se você se mover para cima ou para baixo, cada metro de movimento custa um metro adicional. Você pode ver o plano que você deixou, que parece cinza, e você não pode ver nada lá a mais de 18 metros de distância.\n\nEnquanto estiver no Plano Etéreo, você pode afetar ser afetado apenas por criaturas, objetos e efeitos nesse plano. Criaturas que não estão no Plano Etéreo não podem perceber ou interagir com você, a menos que uma característica lhes dê a capacidade de fazê-lo. Quando a magia termina, você retorna ao plano que deixou no local que corresponde ao seu espaço na Fronteira Etérea. Se você aparecer em um espaço ocupado, você é direcionado para o espaço desocupado mais próximo e sofre dano Energético igual a 10 pontos para cada 1,5 metro que é movido.\n\nEsta magia se encerra instantaneamente se você a conjurar enquanto estiver no Plano Etéreo ou em um plano que não faz fronteira com ele, como um dos Planos Externos.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher até três criaturas voluntárias (incluindo você) para cada círculo de espaço de magia acima de 7. As criaturas devem estar a até 3 metros de você quando você conjurar a magia."],["Forma Gasosa",3,"Transmutação",["bruxo","feiticeiro","mago"],"Ação","Toque","V, S, M (um pouco de gaze)","Concentração, até 1 hora","Uma criatura voluntária que você toca multimorfa-se, junto com tudo o que está vestindo e carregando, em uma nuvem de neblina durante a duração da magia. A magia se encerra no alvo se ele for reduzido a 0 Pontos de Vida ou se executar uma ação Usar Magia para encerrá-la.\n\nEnquanto estiver nesta forma, o único método de movimento do alvo é um Deslocamento de Voo de 3 metros, e ele pode pairar. O alvo pode entrar e ocupar o espaço de outra criatura. O alvo tem Resistência a dano Contundente, Cortante e Perfurante; tem Imunidade à condição Caído; e tem Vantagem em salvaguardas de Força, Destreza e Constituição. O alvo pode passar por aberturas estreitas, mas considera líquidos como se fossem superfícies sólidas.\n\nO alvo não pode falar ou manipular objetos, e qualquer objeto que ele estava carregando ou segurando não pode ser derrubado, usado ou interagido de outra forma. Por fim, o alvo não pode atacar ou conjurar magias.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 3."],["Formas Animais",8,"Transmutação",["druida"],"Ação","9 metros","V, S","24 horas","e Escolha qualquer número de criaturas voluntárias à vista e no alcance da magia. Cada alvo se multimorfa em uma Fera Grande ou menor à sua escolha e que tenha um Nível de Desafio igual ou inferior a 4. Você pode escolher uma forma diferente para cada alvo. Em turnos posteriores, você pode executar uma ação Usar Magia para transformar os alvos novamente.\n\nAs estatísticas de jogo de um alvo são substituídas pelas estatísticas da Fera escolhida, mas o alvo mantém seu tipo de criatura, Pontos de Vida, Dados de Pontos de Vida, alinhamento, capacidade de comunicação, e valores de atributo de Inteligência, Sabedoria e Carisma. As ações do alvo são limitadas pela anatomia da forma da Fera, e ele não pode conjurar magias. O equipamento do alvo se funde com a nova forma, e o alvo não pode usar nenhum desses equipamentos enquanto estiver nesta forma.\n\nO alvo adquire um número de Pontos de Vida Temporários igual aos Pontos de Vida da primeira forma que assume. Esses Pontos de Vida Temporários desaparecem, caso ainda restem, quando a magia terminar. A transformação permanece pela duração da magia, até que o alvo encerre voluntariamente a transformação com uma Ação Bônus."],["Força Espectral",2,"Ilusão",["bardo","feiticeiro","mago"],"Ação","18 metros","V, S, M (um pouco de lã)","Concentração, até 1 minuto","Você tenta criar uma ilusão na mente de uma criatura à sua vista e no alcance da magia. O alvo realiza uma salvaguarda de Inteligência. Se falhar, você cria um objeto, criatura ou outro fenômeno espectral que não seja maior do que um cubo de 3 metros de lado e que seja perceptível apenas para o alvo pela duração da magia. O espectro inclui som, temperatura e outros estímulos. O alvo pode executar uma ação Analisar para examinar o espectro com um teste de Inteligência (Investigação) contra a CD para evitar sua magia. Em caso de sucesso, o alvo percebe que o espectro é uma ilusão e a magia se encerra.\n\nEnquanto afetado pela magia, o alvo trata o espectro como se fosse real e racionaliza quaisquer resultados ilógicos da interação com ele. Por exemplo, um alvo que esteja tentando atravessar uma ponte espectral e sobreviva à queda acredita na existência da ponte e tenta achar alguma explicação para a própria queda. Um alvo afetado pode até sofrer dano da ilusão se o espectro representar uma criatura ou risco. Em cada um dos seus turnos, tal espectro pode causar 2d8 pontos de dano Psíquico ao alvo se estiver na área do espectro ou a até 1,5 metro do espectro. O alvo percebe o dano como um tipo apropriado para a ilusão."],["Gargalhada Nefasta de Tasha",1,"Encantamento",["bardo","bruxo","mago"],"Ação","9 metros","V, S, M (uma torta e uma pena)","Concentração, até 1 minuto","Uma criatura à sua escolha à sua vista e no alcance da magia realiza uma salvaguarda de Sabedoria. Se falhar, ela está com as condições Caído e Incapacitado pela duração da magia. Durante esse tempo, ela ri incontrolavelmente se for capaz de rir, e não pode encerrar a condição Caído por si só.\n\nNo final de cada um dos turnos dela e cada vez que sofrer dano, a criatura realiza outra salvaguarda de Sabedoria. O alvo tem Vantagem na salvaguarda se a salvaguarda for acionada por dano. Em caso de sucesso, a magia encerra.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 1."],["Glifo de Proteção",3,"Abjuração",["bardo","clerigo","mago"],"1 hora","Toque","V, S, M (um diamante em pó no valor de 200 ou mais PO, que a magia consome)","Até ser dissipada ou acionada","Você inscreve um glifo que mais tarde aciona um efeito mágico. Você o inscreve em uma superfície (como uma mesa ou uma seção de piso no chão) ou dentro de um objeto que pode ser fechado (como um livro ou baú) para ocultar o glifo. O glifo pode cobrir uma área não superior a 3 metros de diâmetro. Se a superfície ou objeto for movido a mais de 3 metros de onde você conjurou esta magia, o glifo é quebrado e a magia encerra sem ser acionada.\n\nO glifo é quase imperceptível e requer um teste bem-sucedido de Sabedoria (Percepção) contra a CD para evitar sua magia para ser notado.\n\nQuando inscreve o glifo, você define o gatilho dele e escolhe se ele é uma runa explosiva ou um glifo de magia, conforme explicado abaixo.\n\nDefina o Gatilho. Você decide o que aciona o glifo quando conjura a magia. Para glifos inscritos em uma superfície, os gatilhos comuns incluem tocar ou pisar no glifo, remover outro objeto que o cubra ou se aproximar a uma certa distância dele. Para glifos inscritos em um objeto, os gatilhos comuns incluem abrir esse objeto ou ver o glifo. Uma vez que um glifo é acionado, esta magia se encerra.\n\nVocê pode ajustar o gatilho para que apenas criaturas de certos tipos o ativem (por exemplo, o glifo pode ser definido para afetar Aberrações). Você também pode definir condições para criaturas que não acionam o glifo, como aquelas que dizem uma determinada senha.\n\nRuna Explosiva. Quando acionado, o glifo irrompe com energia mágica em uma Esfera de 6 metros de raio centrada no glifo. Cada criatura na área realiza uma salvaguarda de Destreza. Se falhar, uma criatura sofre 5d8 pontos de dano Ácido, Elétrico, Gélido, Ígneo ou Trovejante (à sua escolha ao criar o glifo), ou metade desse dano em caso de sucesso.\n\nGlifo de Magia. Você pode armazenar uma magia preparada de 3º círculo ou inferior no glifo, conjurando-a como parte da criação do glifo. A magia deve ter como alvo uma única criatura ou uma área. A magia que está sendo armazenada não tem efeito imediato quando conjurada desse modo.\n\nQuando o glifo é acionado, a magia armazenada entra em efeito. Se a magia tiver um alvo, ela tem como alvo a criatura que acionou o glifo. Se a magia afetar uma área, a área está centrada nessa criatura. Se a magia invocar criaturas hostis ou criar objetos ou armadilhas prejudiciais, elas aparecem o mais próximo possível do intruso e o atacam. Se a magia exigir Concentração, ela dura até o final da duração total da magia.\n\nUsando um Espaço de Magia de Círculo Superior. O dano de uma runa explosiva aumenta em 1d8 para cada círculo de espaço de magia acima de 3. Se você criar um glifo de magia, você pode armazenar qualquer magia de até o mesmo círculo que o espaço de magia que você usa para o Glifo de Proteção ."],["Globo de Invulnerabilidade",6,"Abjuração",["feiticeiro","mago"],"Ação","Pessoal","V, S, M (uma conta de vidro)","Concentração, até 1 minuto","Uma barreira imóvel e cintilante aparece em uma Emanação de 3 metros ao seu redor e permanece pela duração da magia.\n\nQualquer magia de 5º círculo ou inferior conjurada de fora da barreira não pode afetar nada dentro dela. Tal magia pode ter como alvo criaturas e objetos dentro da barreira, mas a magia não tem efeito sobre eles. Da mesma forma, a área dentro da barreira é excluída das áreas de efeito criadas por tais magias.\n\nUsando um Espaço de Magia de Círculo Superior. A barreira bloqueia magias de 1º círculo ou superior para cada círculo de espaço de magia acima de 6."],["Golpe Certeiro",0,"Adivinhação",["bardo","bruxo","feiticeiro","mago"],"Ação","Pessoal","S, M (uma arma com a qual você tem proficiência e que vale 1 ou mais PC)","Instantânea","Guiado pelo lampejo de uma intuição mágica, você realiza um ataque com a arma usada na conjuração da magia. O ataque usa seu atributo de conjuração para as jogadas de ataque e dano em vez de usar Força ou Destreza. Se o ataque causar dano, ele pode ser Radiante ou do tipo de dano normal da arma (à sua escolha).\n\nAprimoramento de Truque. Seja o dano Radiante ou o tipo de dano normal da arma, o ataque causa dano Radiante adicional quando você atinge os níveis 5 (1d6), 11 (2d6) e 17 (3d6)."],["Golpe Constritor",1,"Invocação",["guardiao"],"Ação Bônus, que você realiza imediatamente após atingir uma criatura com uma arma","Pessoal","V","Concentração, até 1 minuto","Ao acertar o alvo, vinhas agarradoras aparecem nele e ele realiza uma salvaguarda de Força. Uma criatura Grande ou maior tem Vantagem nesta salvaguarda. Se falhar, o alvo está com a condição Contido até que a magia termine. Em caso de sucesso, as videiras murcham e a magia se encerra.\n\nEnquanto Contido desse modo, o alvo sofre 1d6 pontos de dano Perfurante no início de cada um dos turnos dele. O alvo ou uma criatura ao alcance dele pode executar uma ação para realizar um teste de Força (Atletismo) contra a CD para evitar sua magia. Em caso de sucesso, as videiras desaparecem.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 pontos para cada círculo de espaço de magia acima de 1."],["Golpe de Arço",5,"Invocação",["guardiao","mago"],"Ação","9 metros","S, M (uma arma Corpo a Corpo que vale 1 ou mais PP)","Instantânea","Você brande a arma usada na conjuração e então desaparece para atacar com rapidez. Escolha até cinco criaturas à sua vista e no alcance da magia. Realize um ataque mágico corpo a corpo contra cada alvo. Em caso de acerto, o alvo sofre 6d10 pontos de dano Energético. Você então se teleporta para um espaço desocupado à sua vista a até 1,5 metro de um dos alvos."],["Graxa",1,"Invocação",["feiticeiro","mago"],"Ação","18 metros","V, S, M (um pouco de banha de porco ou manteiga)","1 minuto","Uma graxa não inflamável cobre o solo em um quadrado de 3 metros de lados centrado em um ponto no alcance da magia e o transforma em Terreno Difícil pela duração da magia.\n\nQuando a graxa aparece, cada criatura em pé e na área da magia deve ser bem-sucedida em uma salvaguarda de Destreza ou tem a condição Caído. Uma criatura que entra na área ou termina o turno nela também deve ser bem-sucedida nessa salvaguarda ou fica Caída."],["Guardiões Espirituais",3,"Invocação",["clerigo"],"Ação","Pessoal","V, S, M (um pergaminho de oração)","Concentração, até 10 minutos","Espíritos protetores voam ao seu redor em uma Emanação de 4,5 metros pela duração da magia. Se você for bom ou neutro, a forma espectral deles parece angelical ou feérica (à sua escolha). Se você é mau, eles parecem ínferos.\n\nAo conjurar esta magia, você pode escolher criaturas que não serão afetadas. O Deslocamento de quaisquer outras criaturas é reduzido pela metade na Emanação. Sempre que a Emanação entrar no espaço de uma criatura ou uma criatura entrar na Emanação, ou terminar seu turno nela, ela deve realizar uma salvaguarda de Sabedoria. Se falhar, a criatura sofre 3d8 pontos de dano Radiante (se você for bom ou neutro) ou 3d8 pontos de dano Necrótico (se for mau). Em caso de sucesso, a criatura sofre metade do dano. Cada criatura realiza essa salvaguarda apenas uma vez por turno.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 3."],["Heroísmo",1,"Encantamento",["bardo","paladino"],"Ação","Toque","V, S","Concentração, até 1 minuto","Você toca uma criatura voluntária que se torna imbuída de bravura. Até que a magia termine, a criatura é imune à condição Amedrontado e recebe Pontos de Vida Temporários igual ao seu modificador de atributo de conjuração no início de cada um dos turnos dela.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 1."],["Identificar",1,"Adivinhação",["bardo","mago"],"1 minuto ou Ritual","Toque","V, S, M (uma pérola no valor de 100 ou mais PO)","Instantânea","Você toca um objeto durante a conjuração da magia. Se for um item mágico ou algum outro objeto mágico, você descobre suas propriedades e como usá-las, se ele requer Sintonização e quantas cargas possui, se houver. Você também descobre se alguma magia está afetando o item e quais são elas. Se o item foi criado por uma magia, você identifica o nome dessa magia. Se em vez disso você tocar uma criatura durante a conjuração, você descobre quais magias a estão afetando, caso estejam."],["Ilusão Menor",0,"Ilusão",["bardo","bruxo","feiticeiro","mago"],"Ação","9 metros","S, M (um pouco de lã)","1 minuto","Você cria um som ou uma imagem de um objeto no alcance da magia que permanece pela duração da magia. Veja as descrições abaixo para os efeitos de cada um. A ilusão encerra se você conjurar essa magia novamente. Se uma criatura executar uma ação Analisar para examinar o som ou a imagem, ela pode determinar que é uma ilusão com um teste bem-sucedido de Inteligência (Investigação) contra a CD para evitar sua magia. Se a criatura perceber a ilusão pelo que ela realmente é, a ilusão se torna tênue para essa criatura.\n\nSom. Se você criar um som, o volume pode variar de um sussurro a um grito. Pode ser sua voz, a voz de outra pessoa, o rugido de um leão, o bater de tambores ou qualquer outro som que você escolher. O som continua ininterrupto pela duração da magia, ou você pode criar sons distintos em diferentes momentos antes que a magia termine.\n\nImagem. Se você criar a imagem de um objeto — como uma cadeira, pegadas enlameadas ou um pequeno baú — ela não pode ter dimensões superiores a um cubo de 1,5 metro de lados. A imagem não pode gerar som, luz, cheiro ou qualquer outro efeito sensorial. A interação física com a imagem demonstra que se trata de uma ilusão, pois os objetos podem atravessá-la."],["Ilusão Programada",6,"Ilusão",["bardo","mago"],"Ação","36 metros","V, S, M (pó de jade no valor de 25 ou mais PO)","Até ser dissipada","Você cria a ilusão de um objeto, criatura ou outro fenômeno visível no alcance da magia, ativada por um gatilho específico. A ilusão permanece imperceptível até o gatilho ocorrer. Ela não pode ser maior que um Cubo de 9 metros de lado. Ao conjurar a magia, você define o comportamento da ilusão e os sons que ela emite, com duração máxima de 5 minutos.\n\nQuando o gatilho especificado ocorre, a ilusão aparece e age conforme você a descreveu. Após a conclusão, ela desaparece e permanece inativa por 10 minutos, podendo ser ativada novamente depois desse período. O gatilho pode ser tão geral ou detalhado quanto você desejar, mas deve se basear em fenômenos visuais ou audíveis que ocorram a até 9 metros da área. Por exemplo, você pode criar uma ilusão de si mesmo que aparece para alertar aqueles que tentarem abrir uma porta com armadilha.\n\nInteração física com a imagem revela sua natureza ilusória, já que objetos podem atravessá-la. Uma criatura que executa a ação Analisar para examinar a imagem pode determinar que se trata de uma ilusão com um teste bem-sucedido de Inteligência (Investigação) contra a CD para evitar sua magia. Se uma criatura perceber a ilusão, ela pode ver através da imagem, e qualquer som que a ilusão emita parece vago para essa criatura."],["Imagem Maior",3,"Ilusão",["bardo","bruxo","feiticeiro","mago"],"Ação","36 metros","V, S, M (um pouco de lã)","Concentração, até 10 minutos","Você cria a imagem de um objeto, uma criatura ou algum outro fenômeno visível que não seja maior do que um Cubo de 6 metros. A imagem aparece em um local à sua vista e no alcance da magia e permanece pela duração. A imagem parece real, incluindo sons, cheiros e temperatura apropriados para a coisa representada, mas não pode causar danos ou condições.\n\nSe você estiver dentro do alcance da imagem, pode usar a ação Usar Magia para movê-la para outro ponto no alcance da magia. Durante essa movimentação, você pode alterar sua aparência para que os movimentos pareçam naturais. Por exemplo, ao mover a imagem de uma criatura, pode fazê-la parecer que está andando. Além disso, você pode fazer com que a imagem emita sons diferentes em momentos distintos, como continuar uma conversa.\n\nA interação física com a imagem revela que ela é uma ilusão, pois as coisas podem passar por ela. Uma criatura que executa uma ação Analisar para examinar a imagem pode determinar que ela é uma ilusão com um teste bem-sucedido de Inteligência (Investigação) contra a CD para evitar sua magia. Se uma criatura perceber a ilusão pelo que ela é, ela pode ver através da imagem, e suas outras qualidades sensoriais tornam-se fracas para a criatura.\n\nUsando um Espaço de Magia de Círculo Superior. A magia dura até ser dissipada, sem exigir Concentração, se conjurada com um espaço de magia de 4º círculo ou superior."],["Imagem Silenciosa",1,"Ilusão",["bardo","feiticeiro","mago"],"Ação","18 metros","V, S, M (um pouco de lã)","Concentração, até 10 minutos","Você cria a imagem de um objeto, uma criatura ou algum outro fenômeno visível que não seja maior do que um Cubo de 4,5 metros de lado. A imagem aparece em um local pela duração e no alcance da magia. A imagem é puramente visual; não é acompanhada por som, cheiro ou outros efeitos sensoriais.\n\nComo uma ação Usar Magia, você pode mover a imagem para qualquer ponto no alcance da magia. À medida que a imagem muda de local, você pode alterar a aparência da imagem para que os movimentos dela pareçam naturais para a imagem. Por exemplo, se você criar a imagem de uma criatura e movê-la, pode alterá-la para que pareça estar andando.\n\nA interação física com a imagem revela que ela é uma ilusão, pois as coisas podem passar por ela. Uma criatura que executa uma ação Analisar para examinar a imagem pode determinar que ela é uma ilusão com um teste bem-sucedido de Inteligência (Investigação) contra a CD para evitar sua magia. Se uma criatura perceber a ilusão pelo que ela é, a criatura pode ver através da imagem."],["Indetectável",3,"Abjuração",["bardo","guardiao","mago"],"Ação","Toque","V, S, M (uma pitada de poeira de diamante no valor de 25 ou mais PO, que a magia consome)","8 horas","Pela duração da magia, você protege um alvo que tocar contra magias de Adivinhação. O alvo pode ser uma criatura voluntária, um local ou um objeto que não exceda 3 metros em qualquer dimensão. O alvo não pode ser afetado por nenhuma magia de Adivinhação nem percebido através de sensores mágicos de vidência."],["Infligir Ferimentos",1,"Necromancia",["clerigo"],"Ação","Toque","V, S","Instantânea","Uma criatura que você tocar realiza uma salvaguarda de Constituição, sofrendo 2d10 pontos de dano Necrótico se falhar ou metade desse dano em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d10 para cada círculo de espaço de magia acima de 1."],["Inseto Gigante",4,"Invocação",["druida"],"Ação","18 metros","V, S","Concentração, até 10 minutos","Você invoca uma aranha, centopeia ou vespa gigante (escolhida ao conjurar a magia). Ela se manifesta em um espaço desocupado à sua vista e no alcance da magia e usa o bloco de estatísticas do Inseto Gigante . A forma escolhida determina certos detalhes no bloco de estatísticas da criatura. A criatura desaparece ao ser reduzida a 0 Pontos de Vida ou quando a magia termina. A criatura é uma aliada sua e de seus aliados. Em combate, ela compartilha sua contagem de Iniciativa, mas o turno dela é imediatamente após o seu. Ele obedece aos seus comandos verbais (nenhuma ação é necessária). Se você não emitir nenhum, ela executa a ação Esquivar e usa o movimento dela para evitar o perigo.\n\nUsando um Espaço de Magia de Círculo Superior. Use o círculo do espaço de magia para o círculo da magia no bloco de estatísticas.\n\nInseto Gigante Fera Grande, Sem Alinhamento\n\nCA 11 + o círculo da magia\n\nPV 30 + 10 para cada círculo de magia acima do 4\n\nDeslocamento 12 m, Escalada 12 m, Voo 12 m (apenas Vespa) MOD SG MOD SG MOD SG\n\nFor 17 +3 +3 Des 13 +1 +1 Con 15 +2 +2\n\nInt 4 –3 –3 Sab 3 –3 –3 Car 14 +2 +2\n\nSentidos: Visão no Escuro 18 m, Percepção Passiva 12\n\nIdiomas Compreende os idiomas que você conhece\n\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência) Traços\n\nEscalada de Aranha. O inseto pode escalar superfícies difíceis, inclusive ao longo de tetos, sem precisar realizar um teste de atributo.\n\nAções\n\nAtaques Múltiplos. O inseto realiza um número de ataques igual à metade do círculo da magia (arredondado para baixo).\n\nPunição Venenosa. Jogada de Ataque Corpo a Corpo. Bônus é igual ao seu modificador de ataque mágico, alcance 3 m. Dano: 1d6 + 3 mais o círculo da magia em pontos de dano Perfurante mais 1d4 pontos de dano Venenoso.\n\nRaio de Teia (Apenas Aranha). Jogada de Ataque à Distância . Bônus é igual ao seu modificador de ataque mágico, alcance 18 m. Dano: 1d10 + 3 mais o círculo da magia em pontos de dano Contundente, e o Deslocamento do alvo é reduzido a 0 até o início do próximo turno do inseto.\n\nAções Bônus\n\nCuspe Venenoso (Apenas Centopeia). Salvaguarda de Constituição . Sua CD para evitar magia, uma criatura à vista do inseto a até 3 metros. Falha: O alvo tem a condição Envenenado até o início do próximo turno do inseto."],["Inverter a Gravidade",7,"Transmutação",["druida","feiticeiro","mago"],"Ação","30 metros","V, S, M (uma pedra-ímã e raspas de ferro)","Concentração, até 1 minuto","Esta magia inverte a gravidade em um Cilindro de 15 metros de raio e 30 metros de altura, centrado em um ponto ao alcance da magia. Todas as criaturas e objetos na área que não estão fixos ao chão são levados para cima até o topo do Cilindro. Uma criatura pode realizar uma salvaguarda de Destreza para agarrar um objeto fixo que possa alcançar, evitando assim a queda ascendente. Se um teto ou objeto ancorado for encontrado nessa subida, criaturas e objetos colidem com ele como em uma queda normal. Se chegarem ao topo do Cilindro sem colidir com nada, pairam lá pela duração da magia. Quando a magia termina, criaturas e objetos afetados caem."],["Invisibilidade",2,"Ilusão",["bardo","bruxo","feiticeiro","mago"],"Ação","Toque","V, S, M (um cílio envolto em goma arábica)","Concentração, até 1 hora","Uma criatura que você toca tem a condição Invisível até que a magia termine. A magia se encerra antes se o alvo realizar uma jogada de ataque, causar dano ou conjurar uma magia.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 2."],["Invisibilidade Maior",4,"Ilusão",["bardo","feiticeiro","mago"],"Ação","Toque","V, S","Concentração, até 1 minuto","Uma criatura que você toca tem a condição Invisível até que a magia termine."],["Invocar Aberração",4,"Invocação",["bruxo","mago"],"Ação","27 metros","V, S, M (um tentáculo em conserva e um globo ocular em um frasco incrustado de platina no valor de 400 ou mais PO)","Concentração, até 1 hora","Você invoca um Espírito Aberrante. Ele se manifesta em um espaço desocupado à sua vista e no alcance da magia e usa o bloco de estatísticas do Espírito Aber-\n\nrante . Ao conjurar a magia, escolha entre Devorador de Mentes, Pseudo-observador ou Slaad. A criatura se assemelha a uma Aberração desse tipo, o que determina certos detalhes no bloco de estatísticas da criatura. A criatura desaparece ao ser reduzida a 0 Pontos de Vida ou quando a magia termina.\n\nA criatura é uma aliada sua e de seus aliados. Em combate, ela compartilha sua contagem de Iniciativa, mas o turno dela é imediatamente após o seu. Ela obedece aos seus comandos verbais (nenhuma ação é necessária). Se você não emitir nenhum, ela executa a ação Esquivar e usa o movimento dela para evitar o perigo.\n\nUsando um Espaço de Magia de Círculo Superior. Use o círculo do espaço de magia para o círculo da magia no bloco de estatísticas.","Espírito Aberrante\nAberração Média, Neutra\nCA 11 + o círculo da magia\nPV 40 + 10 para cada círculo de magia acima de 4\nDeslocamento 9 m; Voo 9 m (pairar; apenas Pseudoobservador)\nMOD SG MOD SG MOD SG\nFor 16 +3 +3 Des 10 +0 +0 Con 15 +2 +2\nInt 16 +3 +3 Sab 10 +0 +0 Car 6 –2 –2\nImunidades Psíquico\nSentidos Visão no Escuro 18 m, Percepção Passiva 10\nIdiomas Dialeto Obscuro, entende os idiomas que você fala\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência)\nTraços\nAura Sussurrante (Apenas Devorador de Mentes). No início de cada turno do espírito, ele emite energia psiônica se não tem condição Incapacitado. Salvaguarda de Sabedoria: CD é igual a\nCD para evitar sua magia, cada criatura (exceto você) a até 1,5 metro do espírito. Falha: 2d6 pontos de dano Psíquico.\nRegeneração (Apenas Slaad). O espírito recupera 5 Pontos de\nVida no início do turno dele se tiver pelo menos 1 Ponto de Vida.\nAções\nAtaques Múltiplos. O espírito realiza um número de ataques igual à metade do círculo da magia (arredondado para baixo).\nGarras (Apenas Slaad). Jogada de Ataque Corpo a Corpo: Bônus é igual ao seu modificador de ataque mágico, alcance 1,5 m.\nDano: 1d10 + 3 mais o círculo da magia em pontos de dano\nCortante, e o alvo não pode recuperar Pontos de Vida até o início do próximo turno do espírito.\nPancada Psíquica (Apenas Devorador de Mentes). Jogada de\nAtaque Corpo a Corpo: Bônus é igual ao seu modificador de ataque mágico, alcance 1,5 m. Dano: 1d8 + 3 mais o círculo da magia em pontos de dano Psíquico.\nRaio Ocular (Somente Pseudo-observador). Jogada de Ataque à\nDistância: Bônus é igual ao seu modificador de ataque mágico, alcance 45 m. Dano: 1d8 + 3 mais o círculo da magia em pontos de dano Psíquico."],["Invocar Animais",3,"Invocação",["druida","guardiao"],"Ação","18 metros","V, S","Concentração, até 10 minutos","Você conjura espíritos da natureza que aparecem como um grande bando de animais espectrais e intangíveis em um espaço desocupado à sua vista e no alcance da magia. O bando permanece pela duração da magia e você escolhe a forma animal dos espíritos, como lobos, serpentes ou pássaros.\n\nVocê tem Vantagem em salvaguardas de Força enquanto estiver a até 1,5 metro do bando e, quando se a mover no seu turno, também pode mover o bando até 9 metros para um espaço desocupado à sua vista. Sempre que o bando se mover até 3 metros de uma criatura à sua vista ou quando uma criatura à sua vista entrar ou terminar seu turno a até 3 metros do bando, você pode forçá-la a realizar uma salvaguarda de Destreza. Se falhar, a criatura sofre 3d10 pontos de dano Cortante. Cada criatura só realiza essa salvaguarda uma vez por turno.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d10 para cada círculo de espaço de magia acima de 3."],["Invocar Barragem",3,"Invocação",["guardiao"],"Ação","Pessoal","V, S, M (uma arma Corpo a Corpo ou à Distância que vale pelo menos 1 PP)","Instantânea","Você brande a arma usada para conjurar a magia e invoca armas espectrais semelhantes (ou munição apropriada para a arma) que são lançadas adiante e depois desaparecem. Cada criatura à sua escolha à sua vista em um Cone de 18 metros realiza uma salvaguarda de Destreza, sofrendo 5d8 pontos de dano Energético se falhar, ou metade desse dano em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 3."],["Invocar Celestial",7,"Invocação",["clerigo"],"Ação","27 metros","V, S","Concentração, até 10 minutos","Você conjura um espírito dos Planos Superiores, que se manifesta como um pilar de luz em um Cilindro de 3 metros de raio e 12 metros de altura centrado em um ponto no alcance da magia. Para cada criatura à sua vista no Cilindro, escolha qual dessas luzes brilha sobre ela:\n\nLuz Curativa. O alvo recupera Pontos de Vida iguais a 4d12 mais seu modificador de atributo de conjuração.\n\nLuz Ardente. O alvo realiza uma salvaguarda de Destreza, sofrendo 6d12 pontos de dano Radiante se falhar, ou metade desse dano em caso de sucesso. Até que a magia termine, Luz Plena preenche o Cilindro e, quando você se mover no seu turno, também pode mover o Cilindro até 9 metros.\n\nSempre que o Cilindro se mover para o espaço de uma criatura à sua vista e sempre que uma criatura à sua vista entrar no Cilindro ou terminar seu turno lá, você pode envolvê-lo com uma das luzes. Uma criatura pode ser afetada por esta magia apenas uma vez por turno.\n\nUsando um Espaço de Magia de Círculo Superior. A cura e o dano aumentam em 1d12 para cada círculo de espaço de magia acima de 7."],["Invocar Constructo",4,"Invocação",["mago"],"Ação","27 metros","V, S, M (um cofre no valor de 400 ou mais PO)","Concentração, até 1 hora","Você invoca o espírito de um Construto. Ele se manifesta em um espaço desocupado à sua vista e no alcance da magia e usa o bloco de estatísticas do Espírito do\n\nConstructo . Ao conjurar a magia, escolha um material: Argila, Metal ou Pedra. A criatura se assemelha a uma estátua animada (você determina a aparência) composto do material escolhido, que determina certos detalhes no bloco de estatísticas da criatura. A criatura desaparece ao ser reduzida a 0 Pontos de Vida ou quando a magia termina.\n\nA criatura é uma aliada sua e de seus aliados. Em combate, ela compartilha sua contagem de Iniciativa, mas o turno dela é imediatamente após o seu. Ela obedece aos seus comandos verbais (nenhuma ação é necessária). Se você não emitir nenhum, ela executa a ação Esquivar e usa o movimento dela para evitar o perigo.\n\nUsando um Espaço de Magia de Círculo Superior. Use o círculo do espaço de magia para o círculo da magia no bloco de estatísticas.","Espírito do Constructo\nConstructo Médio, Neutro\nCA 13 + o círculo da magia\nPV 40 + 15 para cada círculo de magia acima de 4\nDeslocamento 9 m\nMOD SG MOD SG MOD SG\nFor 18 +4 +4 Des 10 +0 +0 Con 18 +4 +4\nInt 14 +2 +2 Sab 11 +0 +0 Car 5 –3 –3\nResistências Venenoso\nImunidades Amedrontado, Enfeitiçado, Envenenado, Exaustão, Paralisado\nSentidos Visão no Escuro 18 m, Percepção Passiva 10\nIdiomas Compreende os idiomas que você fala\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência)\nTraços\nCorpo Aquecido (Apenas Metal). Uma criatura que atinge o espírito com um ataque corpo a corpo ou que inicia seu turno imobilizando o espírito sofre 1d10 pontos de dano Ígneo.\nLetargia Empedernida (Apenas Pedra). Quando uma criatura começa o turno dela a até 3 metros do espírito, o espírito pode atacá-la com energia mágica se o espírito puder vêla. Salvaguarda de Sabedoria: CD é igual a CD para evitar sua magia. Falha: Até o início do próximo turno do espírito, o alvo não pode realizar Ataques de Oportunidade e seu\nDeslocamento é reduzido pela metade.\nAções\nAtaques Múltiplos. O espírito realiza um número de ataques de Pancada igual à metade do círculo da magia (arredondado para baixo).\nPancada. Jogada de Ataque Corpo a Corpo: Bônus é igual ao seu modificador de ataque mágico, alcance 1,5 m. Dano: 1d8 + 4 + o círculo da magia pontos de dano Contundente.\nReações\nReação Violenta (Apenas Argila). Gatilho: O espírito sofre dano de uma criatura. Reação: O espírito realiza um ataque de Pancada contra essa criatura, se possível, ou o espírito se move até metade do seu Deslocamento em direção a essa criatura sem provocar Ataques de Oportunidade."],["Invocar Dragão",5,"Invocação",["mago"],"Ação","18 metros","V, S, M (um objeto com a imagem de um dragão gravado nele no valor de 500 ou mais PO)","Concentração, até 1 hora","Você invoca um Espírito Dracônico. Ele se manifesta em um espaço desocupado à sua vista e no alcance da magia e usa o bloco de estatísticas do Espírito Dracô-\n\nnico . A criatura desaparece ao ser reduzida a 0 Pontos de Vida ou quando a magia termina.\n\nA criatura é uma aliada sua e de seus aliados. Em combate, ela compartilha sua contagem de Iniciativa, mas o turno dela é imediatamente após o seu. Ele obedece aos seus comandos verbais (nenhuma ação é necessária). Se você não emitir nenhum, ela executa a ação Esquivar e usa o movimento dela para evitar o perigo.\n\nUsando um Espaço de Magia de Círculo Superior. Use o círculo do espaço de magia para o círculo da magia no bloco de estatísticas.","Espírito Dracônico\nDragão Grande, Neutro\nCA 14 + o círculo da magia\nPV 50 + 10 para cada círculo de magia acima de 5\nDeslocamento 9 m, Natação 9 m; Voo 18 m\nMOD SG MOD SG MOD SG\nFor 19 +4 +4 Des 14 +2 +2 Con 17 +3 +3\nInt 10 +0 +0 Sab 14 +2 +2 Car 14 +2 +2\nResistências Ácido, Elétrico, Gélido, Ígneo, Venenoso\nImunidades Amedrontado, Enfeitiçado, Envenenado\nSentidos Visão às Cegas 9 m, Visão no Escuro 18 m, Percepção\nPassiva 12\nIdiomas Dracônico, compreende os idiomas que você fala\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência)\nTraços\nResistências Compartilhadas. Ao invocar o espírito, escolha uma das resistências dele. Você tem Resistência ao tipo de dano escolhido até que a magia termine.\nAções\nAtaques Múltiplos. O espírito realiza um número de ataques de Dilacerar igual à metade do círculo da magia (arredondado para baixo) e usa o Ataque de Sopro.\nAtaque de Sopro. Salvaguarda de Destreza: CD é igual a CD para evitar sua magia, cada criatura em um Cone de 9 metros.\nFalha: 2d6 pontos de dano de um tipo ao qual o espírito tem\nResistência (à sua escolha quando você conjura a magia).\nSucesso: Metade do dano.\nDilacerar. Jogada de Ataque Corpo a Corpo: Bônus é igual ao seu modificador de ataque mágico, alcance 3 m. Dano: 1d6 + 4\n+ o círculo da magia pontos de dano Perfurante."],["Invocar Elementais Menores",4,"Invocação",["druida","mago"],"Ação","Pessoal","V, S","Concentração, até 10 minutos","Você conjura espíritos dos Planos Elementais que voam ao seu redor em uma Emanação de 4,5 metros pela duração da magia. Até que a magia termine, qualquer ataque que você realizar causa 2d8 pontos de dano adicional quando você atinge uma criatura na Emanação. Este dano é Ácido, Elétrico, Gélido ou Ígneo (à sua escolha quando realizar o ataque).\n\nAlém disso, o terreno da Emanação é Terreno Difícil para seus inimigos.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 4."],["Invocar Elemental",5,"Invocação",["druida","mago"],"Ação","18 metros","V, S","Concentração, até 10 minutos","Você conjura um espírito Grande e intangível dos Planos Elementais que aparece em um espaço desocupado no alcance da magia. Escolha o elemento do espírito, que determina o tipo de dano que ele causa: água (Gélido), ar (Elétrico), fogo (Ígneo) ou terra (Trovejante). O espírito permanece pela duração da magia.\n\nSempre que uma criatura à sua vista entrar no espaço do espírito ou iniciar o turno a até 1,5 metro do espírito, você pode forçá-la a realizar uma salvaguarda de Destreza se o espírito não tiver nenhuma criatura Contida. Se falhar, o alvo sofre 8d8 pontos de dano do tipo do espírito, e tem a condição Contido até que a magia termine. No início de cada um dos turnos do alvo Contido, ele repete a salvaguarda. Se falhar, o alvo sofre 4d8 pontos de dano do tipo do espírito. Em caso de sucesso, o alvo não é Contido pelo espírito.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 5."],["Invocar Fera",2,"Invocação",["druida","guardiao"],"Ação","27 metros","V, S, M (uma pluma, tufo de pele e rabo de peixe dentro de uma bolota dourada no valor de 200 ou mais PO)","Concentração, até 1 hora","Você invoca um Espírito Bestial. Ele se manifesta em um espaço desocupado à sua vista e no alcance da magia e usa o bloco de estatísticas do Espírito Bestial . Ao conjurar a magia, escolha um ambiente: Água, Ar ou Terra. A criatura se assemelha a um animal à sua escolha que é nativo do ambiente escolhido, o que determina certos detalhes no bloco de estatísticas da criatura. A criatura desaparece ao ser reduzida a 0 Pontos de Vida ou quando a magia termina.\n\nA criatura é uma aliada sua e de seus aliados. Em combate, ela compartilha sua contagem de Iniciativa, mas o turno dela é imediatamente após o seu. Ele obedece aos seus comandos verbais (nenhuma ação é necessária). Se você não emitir nenhum, ela executa a ação Esquivar e usa o movimento dela para evitar o perigo.\n\nUsando um Espaço de Magia de Círculo Superior. Use o círculo do espaço de magia para o círculo da magia no bloco de estatísticas.","Espírito Bestial\nFera Pequena, Neutra\nCA 11 + o círculo da magia\nPV 20 (apenas Ar) ou 30 (apenas Água e Terra) + 5 para cada círculo de magia acima de 2\nDeslocamento 9 m; Escalada 9 m (Apenas Terra); Natação 9 m\n(Apenas água); Voo 18 m (Apenas Ar)\nMOD SG MOD SG MOD SG\nFor 13 +1 +1 Des 16 +3 +3 Con 15 +2 +2\nInt 10 +0 +0 Sab 10 +0 +0 Car 16 +3 +3\nSentidos: Visão no Escuro 18 m, Percepção Passiva 12\nIdiomas: Compreende os idiomas que você fala\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência)\nTraços\nRespirar na Água (Apenas Água). O espírito só pode respirar debaixo d’água.\nSobrevoo (Apenas Ar). O espírito não provoca Ataques de\nOportunidade quando voa para fora do alcance de um inimigo.\nTáticas de Grupo (Apenas Água e Terra). O espírito tem\nVantagem em uma jogada de ataque contra uma criatura se pelo menos um dos aliados do espírito estiver a até 1,5 metro da criatura e o aliado não tem a condição Incapacitado.\nAções\nAtaques Múltiplos. O espírito realiza um número de ataques de Dilacerar igual à metade do círculo da magia (arredondado para baixo).\nDilacerar. Jogada de Ataque Corpo a Corpo: Bônus é igual ao seu modificador de ataque mágico, alcance 1,5 m. Dano: 1d8\n4 mais o círculo da magia em pontos de dano Perfurante."],["Invocar Feérico",6,"Invocação",["druida"],"Ação","18 metros","V, S","Concentração, até 10 minutos","Você conjura um espírito Médio de Faéria em um espaço desocupado à sua vista e no alcance da magia. O espírito permanece pela duração da magia e se assemelha a uma criatura Feérica à sua escolha. Quando o espírito aparece, você pode realizar um ataque mágico corpo a corpo contra uma criatura a até 1,5 metro dele. Em caso de acerto, o alvo sofre dano Psíquico igual a 3d12 mais o seu modificador de atributo de conjuração, e o alvo tem a condição Amedrontado até o início do seu próximo turno, com você e o espírito como a fonte do medo.\n\nComo uma Ação Bônus em seus turnos posteriores, você pode teleportar o espírito para um espaço desocupado à sua vista a até 9 metros do espaço restante e realizar o ataque contra uma criatura a até 1,5 metro dele.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d12 para cada círculo de espaço de magia acima de 6."],["Invocar Morto-Vivo",3,"Necromancia",["bruxo","mago"],"Ação","27 metros","V, S, M (um crânio dourado no valor de 300 ou mais PO)","Concentração, até 1 hora","Você invoca um Espírito Morto-Vivo. Ele se manifesta em um espaço desocupado à sua vista e no alcance da magia e usa o bloco de estatísticas do Espírito Morto-\n\n-vivo . Ao conjurar a magia, escolha a forma da criatura: Esquelético, Fantasmagórico ou Pútrido. O espírito se assemelha a uma criatura Morta-viva com a forma escolhida, o que determina certos detalhes no bloco de estatísticas da criatura. A criatura desaparece ao ser reduzida a 0 Pontos de Vida ou quando a magia termina. A criatura é uma aliada sua e de seus aliados. Em combate, ela compartilha sua contagem de Iniciativa, mas o turno dela é imediatamente após o seu. Ele obedece aos seus comandos verbais (nenhuma ação é necessária). Se você não emitir nenhum, ela executa a ação Esquivar e usa o movimento dela para evitar o perigo.\n\nUsando um Espaço de Magia de Círculo Superior. Use o círculo do espaço de magia para o círculo da magia no bloco de estatísticas.","Espírito Morto-Vivo\nMorto-vivo Médio, Neutro\nCA 11 + o círculo da magia\nPV 30 (apenas Fantasmagórico e Pútrido) ou 20 (apenas\nEsquelético) + 10 para cada círculo de magia acima de 3\nDeslocamento 9 m; Voo 12 m (pairar; apenas Fantasmagórico)\nMOD SG MOD SG MOD SG\nFor 12 +1 +1 Des 16 +3 +3 Con 15 +2 +2\nInt 4 –3 –3 Sab 10 +0 +0 Car 9 –1 –1\nImunidades Necrótico, Venenoso; Amedrontado, Envenenado, Exaustão, Paralisado\nSentidos Visão no Escuro 18 m, Percepção Passiva 10\nIdiomas Compreende os idiomas que você fala\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência)\nTraços\nAura Purulenta (Apenas Pútrido). Salvaguarda de Constituição:\nCD é igual a CD para evitar sua magia, qualquer criatura\n(exceto você) que inicie o turno dentro de uma Emanação de\n1,5 metro originada a partir do espírito. Falha: A criatura tem a condição Envenenado até o início de seu próximo turno.\nPassagem Incorpórea (Apenas Fantasmagórico). O espírito pode se mover através de outras criaturas e objetos como se fossem Terreno Difícil. Se ele terminar o turno dentro de um objeto, ele é desviado para o espaço desocupado mais próximo e sofre 1d10 pontos de dano Energético por cada 1,5 metro percorrido.\nAções\nAtaques Múltiplos. O espírito realiza um número de ataques igual à metade do círculo da magia (arredondado para baixo).\nGarra Podre (Apenas Pútrido). Jogada de Ataque Corpo a Corpo:\nBônus é igual ao seu modificador de ataque mágico, alcance\n1,5 m. Dano: 1d6 + 3 mais o círculo da magia em pontos de dano Cortante. Se o alvo tem a condição Envenenado, ele tem a condição Paralisado até o final do próximo turno dele.\nRaio da Cova (Somente Esquelético). Jogada de Ataque à\nDistância: Bônus é igual ao seu modificador de ataque mágico, alcance 45 m. Dano: 2d4 + 3 mais o círculo da magia em pontos de dano Necrótico.\nToque Mortal (Apenas Fantasmagórico). Jogada de Ataque\nCorpo a Corpo: Bônus é igual ao seu modificador de ataque mágico, alcance 1,5 m. Dano: 1d8 + 3 mais o círculo da magia em pontos de dano Necrótico, e o alvo tem a condição\nAmedrontado até o final do próximo turno dele."],["Invocar Saraivada",5,"Invocação",["guardiao"],"Ação","45 metros","V, S, M (uma arma Corpo a Corpo ou à Distância no valor de 1 ou mais PP)","Instantânea","Você brande a arma usada para conjurar a magia e escolhe um ponto no alcance da magia. Centenas de armas espectrais similares (ou munição apropriada para a arma) caem em uma saraivada e depois desaparecem. Cada criatura à sua escolha à sua vista em um Cilindro de 12 metros de raio e 6 metros de altura, centrada nesse ponto, realiza uma salvaguarda de Destreza. Uma criatura sofre 8d8 pontos de dano Energético se falhar, ou metade desse dano em caso de sucesso."],["Invocar Seres da Floresta",4,"Invocação",["druida","guardiao"],"Ação","Pessoal","V, S","Concentração, até 10 minutos","Você conjura espíritos da natureza que voam ao seu redor em uma Emanação de 3 metros pela duração da magia. Quando a Emanação invade o espaço de uma criatura à sua vista, ou quando uma criatura à sua vista entra ou termina o turno na Emanação, você pode forçá-la a realizar uma salvaguarda de Sabedoria. Se falhar, a criatura sofre 5d8 pontos de dano Energético ou metade desse dano se tiver sucesso. A criatura realiza essa salvaguarda apenas uma vez por turno.\n\nAlém disso, você pode executar a ação Desengajar como uma Ação Bônus pela duração da magia.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 4."],["Invocar Ínfero",6,"Invocação",["bruxo","mago"],"Ação","27 metros","V, S, M (um frasco com sangue no valor de 600 ou mais PO)","Concentração, até 1 hora","Você invoca um Espírito Ínfero. Ele se manifesta em um espaço desocupado à sua vista e no alcance da magia e usa o bloco de estatísticas do Espírito Ínfero . Ao conjurar a magia, escolha Demônio, Diabo ou Yugoloth. A criatura se assemelha a um Ínfero do tipo escolhido, o que determina certos detalhes no bloco de estatísticas da criatura. A criatura desaparece ao ser reduzida a 0 Pontos de Vida ou quando a magia termina. A criatura é uma aliada sua e de seus aliados. Em combate, ela compartilha sua contagem de Iniciativa, mas o turno dela é imediatamente após o seu. Ela obedece aos seus comandos verbais (nenhuma ação é necessária). Se você não emitir nenhum, ela executa a ação Esquivar e usa o movimento dela para evitar o perigo.\n\nUsando um Espaço de Magia de Círculo Superior. Use o círculo do espaço de magia para o círculo da magia no bloco de estatísticas.","Espírito Ínfero\nÍnfero Grande, Neutro\nCA 12 + o círculo da magia\nPV 50 (apenas Demônio) ou 40 (apenas Diabo) ou 60 (apenas\nYugoloth) + 15 para cada círculo de magia acima de 6\nDeslocamento 12 m; Escalada 12 m (apenas Demônio); Voo\n18 m (apenas Diabo)\nMOD SG MOD SG MOD SG\nFor 13 +1 +1 Des 16 +3 +3 Con 16 +2 +2\nInt 10 +0 +0 Sab 10 +0 +0 Car 16 +3 +3\nResistências Ígneo\nImunidades Venenoso; Envenenado\nSentidos Visão no Escuro 18 m, Percepção Passiva 10\nIdiomas Abissal, Infernal, Telepatia 18 m\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência)\nTraços\nEspasmos da Morte (Apenas Demônio). Quando o espírito é reduzido a 0 Pontos de Vida ou a magia terminar, o espírito explode. Salvaguarda de Destreza: CD é igual a CD para evitar sua magia, cada criatura em uma Emanação de 3 metros originada a partir do espírito. Falha: 2d10 mais o círculo da magia em pontos de dano Ígneo. Sucesso: Metade do dano.\n+\nResistência à Magia. O espírito tem Vantagem em salvaguardas contra magias e outros efeitos mágicos.\nVisão Diabólica (Apenas Diabo). Escuridão Mágica não impede a Visão no Escuro do espírito.\nAções\nAtaques Múltiplos. O espírito realiza um número de ataques igual à metade do círculo da magia (arredondado para baixo).\nArremesso de Chamas (Apenas Diabo). Jogada de Ataque à\nDistância: Bônus é igual ao seu modificador de ataque mágico, alcance 1,5 m ou alcance 45 m. Dano: 2d6 + 3 mais o círculo da magia em pontos de dano pontos de dano Ígneo.\nGarras (Apenas Yugoloth). Jogada de Ataque Corpo a Corpo:\nBônus é igual ao seu modificador de ataque mágico, alcance\n1,5 m. Dano: 1d8 + 3 mais o círculo da magia em pontos de dano Cortante. Imediatamente após o ataque acertar ou errar, o espírito pode se teleportar até 9 metros para um espaço desocupado à vista dele.\nMordida (Apenas Demônio). Jogada de Ataque Corpo a Corpo:\nBônus é igual ao seu modificador de ataque mágico, alcance\n1,5 m. Dano: 1d12 + 3 mais o círculo da magia em pontos de dano Necrótico."],["Invocação Instantânea de Drawmij",6,"Invocação",["mago"],"1 minuto ou Ritual","Toque","V, S, M (uma safira no valor de 1.000 ou mais PO)","Até ser dissipada","Você toca a safira usada na conjuração e um objeto pesando 3 quilos ou menos, cuja dimensão mais longa é de 2 metros ou menos. A magia deixa uma marca invisível nesse objeto e inscreve invisivelmente o nome do objeto na safira. Cada vez que você conjura essa magia, deve usar uma safira diferente.\n\nDepois disso, você pode executar uma ação Usar Magia para proferir o nome do objeto e esmagar a safira. O objeto aparece instantaneamente em sua mão, independentemente das distâncias físicas ou planares, e a magia termina.\n\nSe outra criatura estiver segurando ou carregando o objeto, esmagar a safira não a transporta, mas, em vez disso, você descobre quem é essa criatura e onde ela está localizada no momento."],["Labirinto",8,"Invocação",["mago"],"Ação","18 metros","V, S","Concentração, até 10 minutos","Você bane uma criatura à sua vista e no alcance da magia para um semiplano labiríntico. O alvo permanece lá pela duração ou até escapar do labirinto.\n\nO alvo pode executar uma ação Analisar para tentar escapar. Quando isso acontece, ele realiza um teste de Inteligência (Investigação) CD 20. Em caso de sucesso, ele escapa e a magia se encerra.\n\nQuando a magia termina, o alvo reaparece no espaço que deixou ou, se esse espaço estiver ocupado, no espaço desocupado mais próximo."],["Lendas e Histórias",5,"Adivinhação",["bardo","clerigo","mago"],"10 minutos","Pessoal","V, S, M (incenso no valor de 250 ou mais PO, que a magia consome, e quatro tiras de marfim no valor de 50 ou mais PO cada)","Instantânea","Nomeie ou descreva uma pessoa, lugar ou objeto famoso. A magia traz à sua mente um breve resumo do conhecimento significativo sobre essa coisa famosa, conforme descrito pelo Mestre.\n\nO conhecimento pode incluir detalhes significativos, revelações intrigantes ou até mesmo informações secretas que nunca foram amplamente divulgadas. Quanto mais você já sabe sobre o assunto, mais precisas e detalhadas se tornam as informações que recebe. Essas informações são exatas, mas podem ser expressas em linguagem figurada ou poesia, conforme determinado pelo Mestre. Se a coisa famosa que você escolheu não for realmente famosa, você ouve notas musicais tristes tocadas em um trombone, e a magia falha."],["Lentidão",3,"Transmutação",["bardo","feiticeiro","mago"],"Ação","36 metros","V, S, M (uma gota de melaço)","Concentração, até 1 minuto","Você altera a passagem do tempo em torno de até seis criaturas à sua escolha em um Cubo de 12 metros de lado no alcance da magia. Cada alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou é afetado por esta magia pela sua duração.\n\nO Deslocamento de um alvo afetado é reduzido pela metade, sofre uma penalidade de −2 em salvaguardas de Destreza e na CA e não pode executar Reações. Nos turnos do alvo, ele pode executar uma ação ou uma Ação Bônus, não ambas, e pode realizar apenas um ataque se executar a ação Atacar. Se conjurar uma magia com um componente Somático, há uma chance de 25% da magia falhar como resultado do alvo fazer os gestos da magia muito lentamente.\n\nUm alvo afetado repete a salvaguarda no final de cada um dos turnos dele, encerrando a magia em caso de sucesso."],["Leque Cromático",1,"Ilusão",["bardo","feiticeiro","mago"],"Ação","Pessoal","V, S, M (uma pitada de areia colorida)","Instantânea","Você lança uma série deslumbrante de luzes ofuscantes e coloridas. Cada criatura em um Cone de 4,5 metros originado em você deve ser bem-sucedida em uma salvaguarda de Constituição ou tem a condição Cego até o final do seu próximo turno."],["Levitação",2,"Transmutação",["feiticeiro","mago"],"Ação","18 metros","V, S, M (uma mola de metal)","Concentração, até 10 minutos","Uma criatura ou objeto solto à sua escolha, à sua vista e no alcance da magia sobe verticalmente até 6 metros e permanece suspenso pela duração. A magia pode levitar um objeto que pesa até 200 quilos. Uma criatura involuntária que seja bem-sucedida em uma salvaguarda de Constituição não é afetada.\n\nO alvo pode se mover apenas empurrando ou puxando um objeto ou superfície fixa ao alcance dele (como uma parede ou um teto), o que permite que ele se mova como se estivesse escalando. No seu turno, você pode mudar a altitude do alvo em até 6 metros em qualquer direção. Se você for o alvo, pode se mover para cima ou para baixo como parte de seu movimento. Caso contrário, você pode executar uma ação Usar Magia para mover o alvo, que deve permanecer no alcance da magia.\n\nQuando a magia termina, o alvo flutua suavemente até o chão se ainda estiver no alto."],["Ligação Telepática de Rary",5,"Adivinhação",["bardo","mago"],"Ação ou Ritual","9 metros","V, S, M (dois ovos)","1 hora","Você cria uma ligação telepática entre até oito criaturas voluntárias à sua escolha no alcance da magia, vinculando psiquicamente cada criatura a todas as outras pela duração da magia. Criaturas que não podem se comunicar em nenhum idioma não são afetadas por esta magia.\n\nAté que a magia termine, os alvos podem se comunicar telepaticamente através da ligação, mesmo que não compartilhem um idioma. A comunicação é possível a qualquer distância, embora não possa se estender para outros planos de existência."],["Limpar a Mente",8,"Abjuração",["bardo","mago"],"Ação","Toque","V, S","24 horas","Até que a magia termine, uma criatura voluntária que você toca adquire Imunidade a dano Psíquico e à condição Enfeitiçado. O alvo também fica imune a qualquer coisa que possa detectar suas emoções ou alinhamento, ler seus pensamentos, detectar magicamente sua localização, e nenhuma magia — nem mesmo Desejo — pode obter informações sobre o alvo, observá-lo remotamente ou controlar sua mente."],["Localizar Animais ou Plantas",2,"Adivinhação",["bardo","druida","guardiao"],"Ação ou Ritual","Pessoal","V, S, M (pelo de um cão de caça)","Instantânea","Descreva ou nomeie uma criatura do tipo Fera, Planta ou planta não mágica. Você descobre a direção e a distância até a criatura ou planta mais próxima desse tipo a até 8 quilômetros, se houver alguma presente."],["Localizar Criatura",4,"Adivinhação",["bardo","clerigo","druida","guardiao","mago","paladino"],"Ação","Pessoal","V, S, M (pelo de um cão de caça)","Concentração, até 1 hora","Descreva ou nomeie uma criatura que você conheça bem. Você descobre a direção e a localização da criatura se ela estiver a até 300 metros de distância. Se a criatura estiver se movendo, você sabe em que direção. A magia pode localizar uma criatura específica que você conheça ou a criatura mais próxima de um tipo específico (como um humano ou um unicórnio) se você tiver visto tal criatura de perto — a até 9 metros — ao menos uma vez. Se a criatura que você descreveu ou nomeou estiver em uma forma diferente, como sob os efeitos de uma magia De Carne para Pedra ou Polimorfia , esta magia não localiza a criatura.\n\nEsta magia não pode localizar uma criatura se qualquer espessura de chumbo bloquear um caminho direto entre você e a criatura."],["Localizar Objeto",2,"Adivinhação",["bardo","clerigo","druida","guardiao","mago","paladino"],"Ação","Pessoal","V, S, M (um galho bifurcado)","Concentração, até 10 minutos","Descreva ou nomeie um objeto que você conheça bem. Você descobre a direção e a localização do objeto se ele estiver a até 300 metros de você. Se o objeto estiver se movendo, você sabe em que direção.\n\nA magia pode localizar um objeto específico que você conheça se você o tiver visto de perto — a até 9 metros — ao menos uma vez. Se preferir, a magia pode localizar o objeto mais próximo de um tipo específico, como um certo tipo de traje, joias, mobília, ferramentas ou armas.\n\nEsta magia não pode localizar um objeto se qualquer espessura de chumbo bloquear um caminho direto entre você e o objeto."],["Loquacidade",8,"Encantamento",["bardo","bruxo"],"Ação","Pessoal","V","1 hora","Até que a magia termine, ao realizar um teste de Carisma, você pode substituir o número que você tirou por um 15. Além disso, não importa o que você diga, a magia que determinaria se você está dizendo a verdade indica que você está sendo verdadeiro."],["Lufada de Vento",2,"Evocação",["druida","feiticeiro","guardiao","mago"],"Ação","Pessoal","V, S, M (a semente de um legume)","Concentração, até 1 minuto","Você sopra uma Linha com um vento forte de 18 metros de comprimento e 3 metros de largura em uma direção à sua escolha pela duração da magia. Cada criatura na Linha deve ser bem-sucedida em uma salvaguarda de Força ou é empurrada 4,5 metros para longe de você em uma direção seguindo a Linha. Uma criatura que termine o turno na Linha deve realizar a mesma salvaguarda.\n\nQualquer criatura na Linha deve gastar 3 metros de movimento para cada 1,5 metro que se move ao se aproximar de você.\n\nA lufada dispersa gás ou vapor e extingue velas e chamas desprotegidas similares na área. Isso faz com que as chamas protegidas, como as de lanternas, dancem descontroladamente e possuem 50% de chance de serem extinguidas.\n\nComo uma Ação Bônus em seus turnos posteriores, você pode alterar a direção da Linha soprada por você."],["Luz",0,"Evocação",["bardo","clerigo","feiticeiro","mago"],"Ação","Toque","V, M (um vaga-lume ou musgo fosforescente)","1 hora","Você toca em um objeto Grande ou menor que não está sendo usado ou carregado por outra pessoa. Até que a magia termine, o objeto emite Luz Plena em um raio de 6 metros e Meia-luz por mais 6 metros. A luz pode ter a cor que você desejar.\n\nCobrir o objeto com algo opaco bloqueia a luz. A magia se encerra se você a conjurar novamente."],["Luz do Dia",3,"Evocação",["clerigo","druida","feiticeiro","guardiao","paladino"],"Ação","18 metros","V, S","1 hora","Pela duração da magia, a luz do sol se espalha de um ponto no alcance da magia e preenche uma Esfera de 18 metros de raio. A área da luz do sol é Luz Plena e emite Meia-luz por mais 18 metros.\n\nComo alternativa, você conjura a magia em um objeto que não esteja sendo usado ou carregado, fazendo com que a luz do sol preencha uma Emanação de 18 metros originada desse objeto. Cobrir esse objeto com algo opaco, como uma tigela ou elmo, bloqueia a luz do sol. Se qualquer área desta magia se sobrepuser a uma área de Escuridão criada por uma magia de 3º círculo ou inferior, essa outra magia é dissipada."],["Luzes Dançantes",0,"Ilusão",["bardo","feiticeiro","mago"],"Ação","36 metros","V, S, M (um pouco de fósforo)","Concentração, até 1 minuto","Você cria até quatro luzes do tamanho de tochas no alcance da magia, fazendo com que elas pareçam tochas, lanternas ou esferas brilhantes que pairam pela duração da magia. Como alternativa, você combina as quatro luzes em uma forma Média, brilhante, a qual é vagamente humanoide. Seja qual for a forma que você escolher, cada luz emite Meia-luz em um raio de 3 metros. Como uma Ação Bônus, você pode mover as luzes até 18 metros para um espaço no alcance da magia. Uma luz deve estar a até 6 metros de outra luz criada por esta magia, e uma luz desaparece se ultrapassar o alcance da magia."],["Lâmina Flamejante",2,"Evocação",["druida","feiticeiro"],"Ação Bônus","Pessoal","V, S, M (uma folha de sumagre)","Concentração, até 10 minutos","Você evoca uma lâmina flamejante em sua mão livre. A lâmina é semelhante em tamanho e forma a uma cimitarra e permanece pela duração da magia. Se você soltar a lâmina, ela desaparece, mas você pode evocá-la novamente como uma Ação Bônus.\n\nComo uma ação Usar Magia, você pode realizar um ataque mágico corpo a corpo com a lâmina flamejante. Em caso de acerto, o alvo sofre 3d6 pontos de dano Ígneo mais o seu modificador de atributo de conjuração. A lâmina flamejante emite Luz Plena em um raio de 3 metros e Meia-luz por mais 3 metros.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 para cada círculo de espaço de magia acima de 2."],["Línguas",3,"Adivinhação",["bardo","bruxo","clerigo","feiticeiro","mago"],"Ação","Toque","V, M (um zigurate em miniatura)","1 hora","Esta magia concede à criatura que você toca a capacidade de entender qualquer idioma falado ou com língua de sinais que ela ouça ou veja. Além disso, quando o alvo se comunica falando ou usando sinais, qualquer criatura que conheça pelo menos um idioma pode entendê-lo se essa criatura puder ouvir as palavras ou ver os sinais."],["Malogro",4,"Necromancia",["bruxo","druida","feiticeiro","mago"],"Ação","9 metros","V, S","Instantânea","Uma criatura à sua vista e no alcance da magia realiza uma salvaguarda de Constituição, sofrendo 8d8 pontos de dano Necrótico se falhar ou metade desse dano em caso de sucesso. Uma criatura do tipo Planta falha automaticamente na salvaguarda.\n\nComo alternativa, escolha como alvo uma planta não mágica que não seja uma criatura, como uma árvore ou um arbusto. Ela não realiza uma salvaguarda; ela simplesmente murcha e morre.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 4."],["Mansão Magnífica de Mordenkainen",7,"Invocação",["bardo","mago"],"1 minuto","90 metros","V, S, M (uma porta em miniatura no valor de 15 ou mais PO)","24 horas","Você conjura uma porta cintilante no alcance da magia que permanece por toda a duração da magia. A porta leva a uma moradia extradimensional e tem 1,5 metro de largura e 3 metros de altura. Você e qualquer criatura que você designe ao conjurar a magia podem entrar na residência extradimensional enquanto a porta permanecer aberta. Você pode abri-la ou fechá-la (nenhuma ação é necessária) se estiver a até 9 metros de distância dela. Quando fechada, a porta é imperceptível.\n\nAlém da porta, há um magnífico saguão com várias câmaras ao fundo. A atmosfera da moradia é limpa, fresca e aquecida.\n\nVocê pode criar qualquer projeto que desejar para a moradia, mas ela não pode exceder 50 Cubos contíguos de 3 metros de lado. O local é mobiliado e decorado à sua escolha. Contém comida suficiente para servir um banquete de nove pratos para até 100 pessoas. Mobílias e outros objetos criados por essa magia se dissipam em fumaça se removidos dela.\n\nUma equipe de 100 servos quase transparentes atende a todos que entrarem. Você determina a aparência desses servos e as vestes deles. Eles são invulneráveis e obedecem aos seus comandos. Cada servo pode realizar tarefas que um humano poderia realizar, mas eles não podem atacar ou realizar qualquer ação que cause dano direto a outra criatura. Assim, os servos podem buscar coisas, limpar, remendar, dobrar roupas, acender fogos, servir comida, servir vinho, entre outras atividades. Os servos não podem deixar a moradia. Quando a magia termina, qualquer criatura ou objeto deixado no espaço extradimensional é expulso para os espaços desocupados mais próximos à entrada."],["Manto do Cruzado",3,"Evocação",["paladino"],"Ação","Pessoal","V","Concentração, até 1 minuto","Você irradia uma aura mágica em uma Emanação de 9 metros. Enquanto estiver na aura, você e seus aliados causam 1d4 pontos de dano Radiante adicionais ao atingir com uma arma ou um Ataque Desarmado."],["Marca do Predador",1,"Adivinhação",["guardiao"],"Ação Bônus","27 metros","V","Concentração, até 1 hora","Você marca magicamente como sua presa uma criatura à sua vista e no alcance da magia. Até que a magia termine, você causa 1d6 pontos de dano Energético adicionais ao alvo sempre que o acertar com uma jogada de ataque. Você também tem Vantagem em qualquer teste de Sabedoria (Percepção ou Sobrevivência) que realizar para encontrá-lo.\n\nSe o alvo é reduzido a 0 Pontos de Vida antes que esta magia termine, você pode executar uma ação Bônus para mover a marca para uma nova criatura à sua vista e no alcance da magia.\n\nUsando um Espaço de Magia de Círculo Superior. Sua Concentração pode durar mais com um espaço de magia de 3º–4º círculo (em até 8 horas) ou 5º círculo ou superior (em até 24 horas)."],["Mau Olhado",6,"Necromancia",["bardo","bruxo","feiticeiro","mago"],"Ação","Pessoal","V, S","Concentração, até 1 minuto","Pela duração da magia, seus olhos se tornam um vazio escuro. Uma criatura à sua escolha à sua vista e a até 18 metros de você deve ser bem-sucedida em uma salvaguarda de Sabedoria ou é afetada por um dos seguintes efeitos à sua escolha pela duração da magia. Em cada um dos seus turnos até que a magia termine, você pode executar uma ação Usar Magia para atingir outra criatura, mas não pode atingir uma criatura novamente se ela tiver sido bem-sucedida em uma salvaguarda contra a conjuração desta magia.\n\nAdoecer. O alvo tem a condição Envenenado.\n\nAdormecer. O alvo tem a condição Inconsciente. Ele acorda se sofrer algum dano ou se outra criatura executar uma ação para sacudi-la.\n\nApavorar. O alvo tem a condição Amedrontado. Em cada um dos turnos dele, o alvo Amedrontado deve executar a ação Correr e se afastar de você pela rota mais segura e curta disponível. Se o alvo se mover para um espaço a pelo menos 18 metros de distância de você onde não possa vê-lo, esse efeito encerra."],["Medo",3,"Ilusão",["bardo","bruxo","feiticeiro","mago"],"Ação","Pessoal","V, S, M (uma pena branca)","Concentração, até 1 minuto","Cada criatura em um Cone de 9 metros deve ser bem-sucedida em uma salvaguarda de Sabedoria ou larga o que estiver segurando e tem a condição Amedrontado pela duração da magia.\n\nUma criatura Amedrontada executa a ação Correr e se afasta de você pela rota mais segura em cada um dos turnos dela, a menos que não haja para onde se mover. Se a criatura encerrar o turno dela em um espaço onde não tenha linha de visão para você, a criatura realiza uma salvaguarda de Sabedoria. Em caso de sucesso, a magia encerra naquela criatura."],["Mensageiro Animal",2,"Encantamento",["bardo","druida","guardiao"],"Ação ou Ritual","9 metros","V, S, M (um bocado de comida)","24 horas","Uma Besta Minúscula à sua escolha à sua vista e no alcance da magia deve ser bem-sucedida em uma salvaguarda de Carisma, ou ela tenta entregar uma mensagem por você (se o Nível de Desafio do alvo não for 0, ele é automaticamente bem-sucedido). Você especifica um local que visitou e um destinatário que corresponda a uma descrição geral, como “uma pessoa vestida com o uniforme da guarda da cidade” ou “um anão ruivo usando um chapéu pontudo”. Você também comunica uma mensagem de até vinte e cinco palavras. A Fera viaja pela duração da magia em direção ao local especificado, cobrindo cerca de 40 quilômetros a cada 24 horas ou 80 quilômetros se a Fera puder voar. Quando a Fera chega, ela entrega sua mensagem à criatura que você descreveu, imitando sua comunicação. Se a Fera não chegar ao seu destino antes que a magia termine, a mensagem é perdida e a Besta retorna para onde você conjurou a magia.\n\nUsando um Espaço de Magia de Círculo Superior. A duração da magia aumenta em 48 horas para cada círculo de espaço de magia acima de 2."],["Mensagem",0,"Transmutação",["bardo","druida","feiticeiro","mago"],"Ação","36 metros","S, M (um fio de cobre)","1 rodada","Você aponta para uma criatura no alcance da magia e sussurra uma mensagem. Somente o alvo ouve a mensagem e pode responder em um sussurro que apenas você consegue ouvir.\n\nVocê pode conjurar essa magia através de objetos sólidos se estiver familiarizado com o alvo e souber que ele está além da barreira. Silêncio mágico, 30 centímetros de pedra, metal ou madeira, ou uma fina folha de chumbo bloqueiam a magia."],["Mesclar-se às Rochas",3,"Transmu
