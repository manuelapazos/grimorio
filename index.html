stral","Como uma Ação Bônus, você pode imbuir sua Aura de Proteção com poder sagrado, concedendo os benefícios abaixo por 1 minuto ou até a encerrar (nenhuma ação é necessária). Após usar esta característica, você não pode utilizá-la novamente até completar um Descanso Longo. Você também pode restaurar seu uso gastando um espaço de magia de 5º círculo (nenhuma ação é necessária).\n\nAliviar Desafio. Inimigos na sua aura têm Desvantagem em salvaguardas contra suas magias e opções de Canalizar Divindade.\n\nMagias Ágeis. Sempre que conjurar uma magia que tenha um tempo de conjuração de uma ação, você pode conjurá-la usando uma Ação Bônus.\n\nRegeneração. No início de cada um dos seus turnos, você recupera 10 Pontos de Vida.\n\ne"]].map(a=>({c:a[0],s:a[1],l:a[2],n:a[3],d:a[4]}));
const CLASS_F1={"barbaro":{"Fúria":"Você pode se imbuir com um poder primitivo chamado Fúria, uma força que lhe concede força e resiliência extraordinárias. Você pode entrar em Fúria como uma Ação Bônus, desde que não esteja vestindo armadura Pesada.\n\nVocê pode entrar em Fúria o número de vezes indicado na coluna Fúrias da tabela Características de Bárbaro para seu nível de Bárbaro. Você recupera um uso gasto ao completar um Descanso Curto, e restaura todos os usos gastos ao completar um Descanso Longo. Enquanto ativa, sua Fúria segue as regras abaixo.\n\nResistência a Dano. Você tem Resistência a dano Contundente, Cortante e Perfurante.\n\nDano da Fúria. Quando você realiza um ataque com Força — seja com uma arma ou um Ataque Desarmado — e causar dano ao alvo, você recebe um bônus no dano, que aumenta conforme você adquire níveis como Bárbaro, conforme mostrado na coluna Dano da Fúria da tabela Características de Bárbaro.\n\nVantagem com Força. Você tem Vantagem em testes de Força e salvaguardas de Força.\n\nSem Concentração ou Magias. Você não pode manter a Concentração e não pode conjurar magias.\n\nDuração. A Fúria dura até o final do seu próximo turno, e encerra se você vestir armadura Pesada ou ter a condição Incapacitado. Se sua Fúria ainda estiver ativa no próximo turno, você pode estendê-la por mais um turno ao realizar uma das seguintes ações:\n\n• Realizar uma jogada de ataque contra um inimigo. • Forçar um inimigo a realizar uma salvaguarda. • Executar uma Ação Bônus para estender sua Fúria. Cada vez que a Fúria é estendida, ela permanece até o final do seu próximo turno. Você pode manter uma Fúria por até 10 minutos.","Defesa sem Armadura":"Enquanto você não estiver vestindo nenhuma armadura, sua Classe de Armadura base é igual a 10 mais seus modificadores de Destreza e Constituição. Você pode usar um Escudo e ainda receber este benefício.","Maestria em Arma":"Seu treinamento com armas permite que você utilize as propriedades de maestria com dois tipos de armas Corpo a Corpo Simples ou Marciais à sua escolha, como Machados Grandes e Machadinhas. Sempre que completar um Descanso Longo, você pode praticar movimentos com armas e alterar uma dessas escolhas de armas.\n\nAo alcançar certos níveis de Bárbaro, você adquire a habilidade de usar as propriedades de maestria de mais tipos de armas, conforme mostrado na coluna Maestria em Armas da tabela Características de Bárbaro."},"bardo":{"Inspiração de Bardo":"Você pode inspirar outros sobrenaturalmente por meio de palavras, música ou dança. Essa inspiração é representada pelo seu dado de Inspiração de Bardo, que é um d6.\n\nUsando Inspiração de Bardo. Como uma Ação Bônus, você pode inspirar outra criatura a até 18 metros de você que possa vê-lo ou ouvi-lo. Essa criatura recebe um de seus dados de Inspiração de Bardo. Uma criatura pode ter apenas um dado de Inspiração de Bardo de cada vez.\n\nUma vez, dentro da próxima uma hora, após a criatura falhar em um Teste de D20, ela pode jogar o dado de Inspiração de Bardo e adicionar o resultado ao D20, transformando potencialmente a falha em sucesso. O dado de Inspiração de Bardo é gasto quando for jogado.\n\nQuantidade de Usos. Você pode conceder um dado de Inspiração de Bardo um número de vezes igual ao seu modificador de Carisma (mínimo de uma vez), e você restaura todos os usos gastos ao completar um Descanso Longo.\n\nEm Níveis Superiores. Seu dado de Inspiração de Bardo muda quando você atinge certos níveis de Bardo, conforme mostrado na coluna Dados de Inspiração da tabela Características de Bardo. O dado se torna um d8 no nível 5, um d10 no nível 10 e um d12 no nível 15.","Conjuração":"Você aprendeu a conjurar magias através de suas artes bárdicas. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você utiliza essas regras com as magias de Bardo, explicadas na lista de magias de Bardo mais adiante na descrição da classe.\n\nTruques. Você conhece dois truques à sua escolha da lista de magias de Bardo. Luzes Dançantes e Zombaria Perversa são recomendadas.\n\nSempre que você alcança um nível de Bardo, pode substituir um dos seus truques por outro truque à sua escolha da lista de magias de Bardo.\n\nAo atingir os níveis 4 e 10, você aprende mais um truque à sua escolha da lista de magias de Bardo, conforme mostrado na coluna Truques da tabela Características de Bardo.\n\nEspaços de Magia. A tabela Características de Bardo mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos quando completa um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com esta característica. Para começar, escolha quatro magias de 1º círculo da lista de magias de Bardo. Enfeitiçar Pessoa , Leque Cromático , Palavra Curativa e Sussurros Dissonantes são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você alcança níveis de Bardo, conforme mostrado na coluna Magias Preparadas da tabela Características de Bardo. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Bardo até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Bardo de nível 3, sua lista de magias preparadas pode incluir seis magias de 1º ou 2º círculo em qualquer combinação.\n\nSe outra característica de Bardo lhe der magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas essas magias, de outra forma, contam como magias de Bardo para você.\n\nMudando Suas Magias Preparadas. Sempre que você obtém um nível de Bardo, pode substituir uma magia em sua lista por outra magia de Bardo para a qual você tem espaços de magia.\n\nAtributo de Conjuração. Carisma é seu atributo de conjuração para suas magias de Bardo.\n\nFoco de Conjuração. Você pode usar um Instrumento Musical como Foco de Conjuração para suas magias de Bardo."},"bruxo":{"Invocações Místicas":"Você descobriu Invocações Místicas, fragmentos de conhecimento proibido que lhe conferem uma habilidade mágica permanente ou outros ensinamentos. Você recebe uma invocação à sua escolha, como Pacto do Tomo. As invocações são descritas na seção “Opções de Invocações Místicas” mais adiante na descrição desta classe.\n\nPré-requisitos. Se uma invocação tiver um pré-requisito, você deve atendê-lo para aprender essa invocação. Por exemplo, se uma invocação exigir que você seja um Bruxo de nível 5 ou superior, você pode selecionar a invocação quando alcançar o nível 5 de Bruxo.\n\nSubstituindo e Recebendo outras Invocações. Ao alcançar um nível de Bruxo, você pode substituir uma de suas invocações por outra para a qual se qualifica. Você não pode substituir uma invocação se ela for um pré-requisito para outra invocação que você tenha. Ao alcançar certos níveis de Bruxo, você adquire mais invocações à sua escolha, conforme mostrado na coluna Invocações da tabela Características de Bruxo. Você não pode escolher a mesma invocação mais de uma vez, a menos que a descrição da invocação indique o contrário.","Magia de Pacto":"Por meio de uma cerimônia oculta, você realizou um pacto com uma entidade misteriosa para obter poderes mágicos. Essa voz nas sombras é enigmática, mas a dádiva concedida por ela é clara: a habilidade de conjurar magias. Veja o capítulo 7 para as regras de conjuração. As informações a seguir explicam como aplicar essas regras às magias de Bruxo, que estão listadas mais adiante na descrição da classe.\n\nTruques. Você conhece dois truques de Bruxo à sua escolha. Prestidigitação Arcana e Raio Místico são recomendados. Ao alcançar um nível de Bruxo, você pode substituir um dos seus truques dessa característica por outro truque de Bruxo à sua escolha. Ao atingir os níveis 4 e 10 de Bruxo, você aprende mais um truque de Bruxo à sua escolha, conforme detalhado na coluna Truques da tabela Características de Bruxo.\n\nEspaços de Magia. A tabela Características de Bruxo mostra quantos espaços de magia você tem para conjurar suas magias de Bruxo de 1º a 5º círculo. A tabela também mostra o círculo desses espaços, todos do mesmo círculo. Você restaura todos os espaços de Magia de Pacto gastos ao completar um Descanso Curto ou Longo.\n\nPor exemplo, quando você é um Bruxo de nível 5, você tem dois espaços de magia de 3º círculo. Para conjurar a magia Raio de Bruxa de 1º círculo, você deve gastar um desses espaços e conjurá-la como uma magia de 3º círculo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com essa característica. Para começar, escolha duas magias de Bruxo de 1º círculo. Danação e Enfeitiçar Pessoa são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você alcança níveis de Bruxo, conforme mostrado na coluna Magias Preparadas da tabela Características de Bruxo. Quando esse número aumentar, escolha magias adicionais de Bruxo até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo não superior mostrado na coluna círculo do Espaço da tabela para o seu nível. Quando você atinge o nível 6, por exemplo, você aprende uma nova magia de Bruxo, que pode ser de 1º a 3º círculo.\n\nSe outra característica de Bruxo lhe concede magias sempre preparadas, elas não contam para o número de magias que você pode preparar com essa característica, mas ainda são consideradas magias de Bruxo para você.\n\nMudando Suas Magias Preparadas. Sempre que você ganha um nível de Bruxo, pode substituir uma magia da sua lista por outra magia de Bruxo de um nível elegível.\n\nAtributo de Conjuração. Carisma é o atributo de conjuração para suas magias de Bruxo.\n\nFoco de Conjuração. Você pode usar um Foco Arcano como um Foco de Conjuração para suas magias de Bruxo."},"clerigo":{"Conjuração":"Você aprendeu a conjurar magias por meio de oração e meditação. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras com as magias de Clérigo, explicadas na lista de magias de Clérigo mais adiante na descrição da classe.\n\nTruques. Você conhece três truques à sua escolha da lista de magias de Clérigo. Chama Sagrada , Orientação e Taumaturgia são recomendados.\n\nSempre que você alcança um nível de Clérigo, pode substituir um dos seus truques por outro truque à sua escolha da lista de magias de Clérigo.\n\nQuando alcançar os níveis 4 e 10 de Clérigo, você aprende mais um truque à sua escolha da lista de magias de Clérigo, conforme mostrado na coluna Truques da tabela Características de Clérigo.\n\nEspaços de Magia. A tabela Características de Clérigo mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você recupera todos os espaços gastos quando completa um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de nível 1º circulo ou superior que estão disponíveis para você conjurar com essa característica. Para começar, escolha quatro magias de 1º círculo da lista de magias de Clérigo. Bênção , Curar Ferimentos , Escudo da Fé e Raio Guia são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você alcança níveis de Clérigo, conforme mostrado na coluna Magias Preparadas da tabela Características de Clérigo. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Clérigo até que o número de magias em sua lista seja o mesmo do número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Cléri go de nível 3, sua lista de magias preparadas pode incluir seis magias de 1º ou 2º círculo em qualquer combinação.\n\nSe outra característica de Clérigo lhe der magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas que contam como magias de Clérigo para você.\n\nMudando Suas Magias Preparadas. Sempre que completar um Descanso Longo, você pode definir sua lista de magias preparadas, substituindo qualquer uma das magias por outras magias de Clérigo para as quais você tem espaços de magia.\n\nAtributo de Conjuração. Sabedoria é seu atributo de conjuração para suas magias de Clérigo.\n\nFoco de Conjuração. Você pode usar um Símbolo Sagrado como um Foco de Conjuração para suas magias de Clérigo.","Ordem Divina":"Você se dedicou a um dos seguintes papéis sagrados à sua escolha.\n\nProtetor. Treinado para a batalha, você adquire proficiência com armas Marciais e treinamento com Armadura Pesada.\n\nTaumaturgo. Você conhece um truque adicional da lista de magias de Clérigo. Além disso, sua conexão mística com o divino lhe dá um bônus em seus testes de Inteligência (Arcanismo ou Religião). O bônus é igual ao seu modificador de Sabedoria (mínimo de +1)."},"druida":{"Conjuração":"Você aprendeu a conjurar magias através do estudo das forças místicas da natureza. Veja o capítulo 7 para as regras de conjuração. As informações abaixo detalham como você usa essas regras com magias de Druida, que aparecem na lista de magias de Druida mais adiante na descrição da classe.\n\nTruques. Você conhece dois truques à sua escolha da lista de magias de Druida. Arte Druídica e Criar Chamas são recomendadas.\n\nSempre que você alcança um nível de Druida, pode substituir um de seus truques por outro truque à sua escolha da lista de magias de Druida.\n\nAo atingir os níveis 4 e 10 de Druida, você aprende mais um truque à sua escolha da lista de magias de Druida, conforme mostrado na coluna Truques da tabela Características de Druida.\n\nEspaços de Magia. A tabela Características de Druida mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com esta característica. Para começar, escolha quatro magias de 1º círculo da lista de magias de Druida. Amizade Animal , Curar Ferimentos , Fogo das Fadas e Onda Trovejante são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você alcança níveis de Druida, conforme mostrado na coluna Magias Preparadas da tabela Características de Druida. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Druida até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Druida de nível 3, sua lista de magias preparadas pode incluir seis magias de 1º ou 2º círculo em qualquer combinação.\n\nSe outra característica de Druida lhe der magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas essas magias, de outra forma, contam como magias de Druida para você.\n\nMudando Suas Magias Preparadas. Sempre que completar um Descanso Longo, você pode mudar sua lista de magias preparadas, substituindo qualquer uma das magias por outras magias de Druida para as quais você tem espaços de magia.\n\nAtributo de Conjuração. Sabedoria é seu atributo de conjuração para suas magias de Druida.\n\nFoco de Conjuração. Você pode usar um Foco Druídico como um Foco de Conjuração para suas magias de Druida.","Idioma Druídico":"Você domina Druídico, o idioma secreto dos Druidas. Ao aprender esse idioma antigo, você também adquiriu a habilidade mágica de se comunicar com animais; você sempre tem a magia Falar com Animais preparada. Você pode usar Druídico para deixar mensagens ocultas. Você e outros que conhecem Druídico identificam automaticamente tal mensagem. Outros podem perceber a presença da mensagem com um teste de Inteligência (Investigação) CD 15, mas não podem decifrá-la sem magia.","Ordem Primal":"Você se dedicou a uma das seguintes funções sagradas à sua escolha.\n\nProtetor. Treinado para a batalha, você adquire proficiência com armas Marciais e treinamento com armadura Média.\n\nXamã. Você conhece um truque adicional da lista de magias de Druida. Além disso, sua conexão mística com a natureza lhe concede um bônus em seus testes de Inteligência (Arcanismo ou Natureza). O bônus é igual ao seu modificador de Sabedoria (bônus mínimo de +1)."},"feiticeiro":{"Conjuração":"Através da sua magia inata, você pode conjurar magias. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras com magias de Feiticeiro, que aparecem na lista de magias de Feiticeiro mais adiante na descrição da classe.\n\nTruques. Você conhece quatro truques de Feiticeiro à sua escolha. Explosão Elemental , Luz, Prestidigitação Arcana e Toque Chocante são recomendados. Ao alcançar um nível de Feiticeiro, você pode substituir um dos seus truques dessa característica por outro truque de Feiticeiro à sua escolha.\n\nAo atingir os níveis 4 e 10 de Feiticeiro, você aprende mais um truque de Feiticeiro à sua escolha, conforme detalhado na coluna Truques da tabela Características de Feiticeiro.\n\nEspaços de Magia. A tabela Características de Feiticeiro mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com essa característica. Para começar, escolha duas magias de Feiticeiro de 1º círculo. Detectar Magia e Mãos Flamejantes são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você atinge níveis de Feiticeiro, conforme mostrado na coluna Magias Preparadas da tabela Características de Feiticeiro. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Feiticeiro até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Feiticeiro de nível 3, sua lista de magias preparadas pode incluir seis magias de Feiticeiro de 1º ou 2º círculo em qualquer combinação.\n\nSe outra característica de Feiticeiro lhe concede magias sempre preparadas, elas não contam para o número de magias que você pode preparar com essa característica, mas ainda são consideradas magias de Feiticeiro para você.\n\nMudando Suas Magias Preparadas. Sempre que você obtém um nível de Feiticeiro, pode substituir uma magia em sua lista por outra magia de Feiticeiro para a qual você tem espaços de magia.\n\nAtributo de Conjuração. Carisma é seu atributo de conjuração para suas magias de Feiticeiro.\n\nFoco de Conjuração. Você pode usar um Foco Arcano como um Foco de Conjuração para suas magias de Feiticeiro.","Feitiçaria Inata":"Um evento em seu passado deixou uma marca permanente em você, lhe infundindo magia latente. Como uma Ação Bônus, você pode liberar essa magia por 1 minuto, durante o qual você adquire os seguintes benefícios:\n\nA CD para evitar suas magias de Feiticeiro aumenta em 1.\n\nVocê tem Vantagem nas jogadas de ataque das magias de Feiticeiro que conjurar.\n\nVocê pode usar essa característica duas vezes e restaura todos os usos gastos ao completar um Descanso Longo."},"guardiao":{"Conjuração":"Você aprendeu a canalizar a essência mágica da natureza para conjurar magias. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras com as magias de Guardião, explicadas na lista de magias de Guardião mais adiante na descrição da classe.\n\nEspaços de Magia. A tabela Características de Guardião mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com esta característica. Para começar, escolha duas magias de Guardião de 1º círculo. Curar Ferimentos e Golpe Constritor são recomendadas.\n\n- O número de magias em sua lista aumenta à medida que você atinge níveis de Guardião, conforme mostrado na coluna Magias Preparadas da tabela Características de Guardião. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Guardião até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Guardião de nível 5, sua lista de magias preparadas pode incluir seis magias de Guardião de 1º ou 2º círculo em qualquer combinação.\n\nSe outra característica de Guardião lhe der magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas essas magias, de outra forma, contam como magias de Guardião para você.\n\nMudando Suas Magias Preparadas. Sempre que completar um Descanso Longo, você pode substituir uma magia em sua lista por outra magia de Guardião para a qual você tem espaços de magia.\n\nAtributo de Conjuração. Sabedoria é seu atributo de conjuração para suas magias de Guardião.\n\nFoco de Conjuração. Você pode usar um Foco Druídico como um Foco de Conjuração para suas magias de Guardião.","Inimigo Favorito":"Você sempre tem a magia Marca do Predador preparada. Você pode conjurá-la duas vezes sem gastar um espaço de magia, e você restaura todos os usos gastos desta característica ao completar um Descanso Longo. O número de vezes que você pode conjurar a magia sem um espaço de magia aumenta ao atingir certos níveis de Guardião, conforme mostrado na coluna Inimigo Favorito da tabela Características de Guardião.","Maestria em Arma":"Seu treinamento com armas permite que você use as propriedades de maestria de dois tipos de armas à sua escolha com as quais você tem proficiência, como Arcos Longos e Espadas Curtas.\n\nSempre que completar um Descanso Longo, você pode alterar os tipos de armas que escolheu. Por exemplo, você pode mudar para usar as propriedades de maestria de Cimitarras e Espadas Longas."},"guerreiro":{"Estilo de Luta":"Você aprimorou suas proezas marciais e tem um talento de Estilo de Luta à sua escolha (veja também o capítulo 5).\n\nSempre que atinge um nível de Guerreiro, você pode substituir o talento que escolheu por um talento diferente de Estilo de Luta.","Maestria em Arma":"Seu treinamento com armas permite que você utilize as propriedades de maestria com três tipos de armas Simples ou Marciais à sua escolha. Sempre que completar um Descanso Longo, você pode praticar movimentos com armas e alterar uma dessas escolhas de armas. Ao alcançar certos níveis de Guerreiro, você adquire a habilidade de usar as propriedades de maestria de mais tipos de armas, conforme mostrado na coluna Maestria em Armas da tabela Características de Guerreiro.","Recuperar Fôlego":"Você tem uma reserva limitada de resistência física e mental que pode usar. Como uma Ação Bônus, você pode usá-la para recuperar Pontos de Vida iguais a 1d10 mais seu nível de Guerreiro.\n\nVocê pode usar essa característica duas vezes. Você recupera um uso gasto quando completa um Descanso Curto e restaura todos os usos gastos quando completa um Descanso Longo.\n\nAo atingir certos níveis de Guerreiro, você adquire mais usos dessa característica, conforme mostrado na coluna Recuperar Fôlego da tabela Características de Guerreiro."},"ladino":{"Ataque Furtivo":"Você sabe atacar sutilmente, explorando a distração do inimigo. Uma vez por turno, ao atingir uma criatura com uma jogada de ataque em que tem Vantagem com uma arma com Acuidade ou uma arma à Distância, você pode causar 1d6 pontos de dano adicional do tipo de dano da arma.\n\nVocê não precisa ter Vantagem na jogada de ataque se pelo menos um de seus aliados estiver a até 1,5 metro do alvo, e o aliado não tem a condição Incapacitado e você não tem Desvantagem na jogada de ataque. O dano adicional aumenta à medida que você adquire níveis de Ladino, conforme mostrado na coluna Ataque Furtivo da tabela Características de Ladino.","Especialista":"Você obtém Especialização (veja o glossário de regras) em duas de suas perícias, à sua escolha, nas quais já seja proficiente. Furtividade e Prestidigitação são recomendadas se você tiver proficiência nelas.\n\nNo nível 6 de Ladino, você obtém Especialização em mais duas perícias nas quais já seja proficiente à sua escolha.","Gíria do Ladrão":"Você aprendeu vários idiomas nas comunidades onde usou seus talentos gatunos. Você conhece a Gíria dos Ladrões e outro idioma à sua escolha, que você escolhe nas tabelas de idiomas no capítulo 2.","Maestria em Arma":"Seu treinamento com armas permite que você use as propriedades de maestria de dois tipos de armas à sua escolha com as quais você tem proficiência, como Adagas e Arcos Curtos.\n\nAo completar um Descanso Longo, você pode alterar os tipos de armas que escolheu. Por exemplo, você pode trocar para as propriedades de maestria de Cimitarras e Espadas Curtas."},"mago":{"Adepto de Ritual":"Você pode conjurar qualquer magia como um Ritual se essa magia tiver o marcador Ritual e a magia estiver em seu livro de magias. Você não precisa ter a magia preparada, mas deve ler o livro para conjurar uma magia deste modo.","Conjuração":"Como estudante de magia arcana, você aprendeu a conjurar magias. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras com magias de Mago, que aparecem na lista de magias de Mago mais adiante na descrição da classe.\n\nTruques. Você conhece três truques de Mago à sua escolha. Luz , Mãos Mágicas e Raio de Gelo são recomendados. Ao completar um Descanso Longo, você pode substituir um dos seus truques dessa característica por outro truque de Mago à sua escolha. Ao atingir os níveis 4 e 10 de Mago, você aprende mais um truque de Mago à sua escolha, conforme detalhado na coluna Truques da tabela Características de Mago.\n\nLivro de Magias. Seu aprendizado de mago culminou na criação de um livro único: seu livro de magias. É um objeto Minúsculo que pesa 1,5 quilo, contém 100 páginas e pode ser lido apenas por você ou por alguém que conjure Identificar . Você determina a aparência e os materiais do livro, como um tomo com bordas douradas ou uma coleção de pergaminhos amarrados com barbante.\n\nO livro contém as magias de 1º círculo ou superior que você conhece. Ele começa com seis magias de mago 1º círculo à sua escolha. Armadura Arcana , Detectar Magia , Mísseis Mágicos , Onda Trovejante , Queda Suave e Sono são recomendadas.\n\nAo atingir um nível de Mago após o primeiro, adicione duas magias de Mago à sua escolha ao seu livro de magias. Cada uma dessas magias deve ser de um círculo para o qual você tenha espaços de magia, conforme detalhado na tabela Características de Mago. As magias são o ponto culminante da pesquisa arcana que você faz regularmente.\n\nEspaços de Magia. A tabela Características de Mago mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com essa característica. Para isso, escolha quatro magias do seu livro de magias. As magias escolhidas devem ser de um círculo para o qual você tenha espaços de magia.\n\nO número de magias em sua lista aumenta à medida que você alcança níveis de Mago, conforme detalhado na coluna Magias Preparadas da tabela Características de Mago. Sempre que esse número aumentar, escolha magias adicionais de Mago até que o número de magias em sua lista corresponda ao número na tabela. As magias escolhidas devem ser de um círculo para o qual você possua espaços de magia. Por exemplo, se você é um Mago de nível 3, sua lista de magias preparadas, escolhidas do seu livro de magias, pode incluir seis magias de 1º ou 2º círculo, em qualquer combinação. Se outra característica de Mago lhe conceder magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas essas magias, de outra forma, contam como magias de Mago para você.\n\nMudando Suas Magias Preparadas. Ao completar um Descanso Longo, você pode alterar sua lista de magias preparadas, substituindo qualquer uma das magias por outras do seu livro de magias.\n\nAtributo de Conjuração. Inteligência é seu atributo de conjuração para suas magias de Mago.\n\nFoco de Conjuração. Você pode usar um Foco Arcano ou seu livro de magias como um Foco de Conjuração para suas magias de Mago.","Recuperação Arcana":"Você pode recuperar um pouco de sua energia mágica estudando seu livro de magias. Ao completar um Descanso Curto, você pode escolher recuperar espaços de magia gastos. Os espaços de magia podem ter um círculo combinado igual a não mais da metade do seu nível de Mago (arredondado para cima), e nenhum dos espaços pode ser de 6º círculo ou superior. Por exemplo, se você é um Mago de nível 4, pode recuperar um valor de até dois círculos de espaços de magia, recuperando um espaço de magia de 2º círculo ou dois espaços de magia de 1º círculo.\n\nVocê pode usar esta característica novamente após completar um Descanso Longo."},"monge":{"Artes Marciais":"Sua prática de artes marciais lhe confere domínio de estilos de combate que usam seu Ataque Desarmado e armas de Monge, que incluem:\n\n• Armas Simples Corpo a Corpo • Armas Marciais Corpo a Corpo que tem a propriedade Leve Você adquire os seguintes benefícios enquanto estiver desarmado ou empunhando apenas armas de Monge e não estiver vestindo armadura ou empunhando um Escudo.\n\nAtaque Desarmado Adicional. Você pode realizar um Ataque Desarmado como uma Ação Bônus.\n\nDado de Artes Marciais. Você pode jogar 1d6 ao invés do dano normal de seu Ataque Desarmado ou armas de Monge. Este dado muda à medida que você atinge níveis de Monge, conforme detalhado na coluna Artes Marciais da tabela Características de Monge.\n\nAtaques com Destreza. Você pode usar seu modificador de Destreza em vez de seu modificador de Força para as jogadas de ataque e dano de seus Ataques Desarmados e armas de Monge. Além disso, quando você usa a opção Empurrar ou Imobilizar do seu Ataque Desarmado, você pode usar seu modificador de Destreza em vez de seu modificador de Força para determinar a CD da salvaguarda.","Defesa sem Armadura":"Enquanto você não estiver vestindo armadura ou empunhando um Escudo, sua Classe de Armadura base é igual a 10 mais seus modificadores de Destreza e Sabedoria."},"paladino":{"Conjuração":"Você aprendeu a conjurar magias por meio de oração e meditação. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras com as magias de Paladino, explicadas na lista de magias de Paladino mais adiante na descrição da classe.\n\nEspaços de Magia. A tabela Características de Paladino mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com essa característica. Para começar, escolha duas magias de Paladino de 1º círculo. Destruição Cauterizante e Heroísmo são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você atinge níveis de Paladino, conforme mostrado na coluna Magias Preparadas da tabela Características de Paladino. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Paladino até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Paladino de nível 5, sua lista de magias preparadas pode incluir seis magias de Paladino de 1º ou 2º círculo em qualquer combinação. Se outra característica de Paladino lhe der magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas essas magias, de outra forma, contam como magias de Paladino para você.\n\nMudando Suas Magias Preparadas. Sempre que completar um Descanso Longo, você pode substituir uma magia em sua lista por outra magia de Paladino para a qual você tem espaços de magia.\n\nAtributo de Conjuração. Carisma é seu atributo de conjuração para suas magias de Paladino.\n\nFoco de Conjuração. Você pode usar um Símbolo Sagrado como um Foco de Conjuração para suas magias de Paladino.","Maestria em Arma":"Seu treinamento com armas permite que você use as propriedades de maestria de dois tipos de armas à sua escolha com as quais você tem proficiência, como Azagaia e Espadas Longas.\n\nSempre que completar um Descanso Longo, você pode alterar os tipos de armas que escolheu. Por exemplo, você pode mudar para usar as propriedades de maestria de Alabardas e Manguais.","Mãos Consagradas":"Seu toque abençoado pode aliviar feridas. Você tem uma reserva de poder de cura que reabastece ao completar um Descanso Longo. Com essa reserva, você pode recuperar um número total de Pontos de Vida igual a cinco vezes seu nível de Paladino.\n\nComo uma Ação Bônus, você toca uma criatura (que pode ser você mesmo) e extrair poder dessa reserva de cura para restaurar um número de Pontos de Vida para essa criatura, até o valor máximo restante na reserva. Você também pode gastar 5 Pontos de Vida dessa reserva de poder de cura para remover a condição Envenenado da criatura; esses pontos não restauram Pontos de Vida da criatura."}};
const SPECIES_TR={"aasimar":[{"n":"Resistência Celestial","d":"Você tem Resistência a dano Necrótico e Radiante."},{"n":"Visão no Escuro","d":"Você tem Visão no Escuro com um alcance de 18 metros."},{"n":"Mãos Curativas","d":"Você executa uma ação Usar Magia, toca uma criatura e joga um número de d4s igual ao seu Bônus de Proficiência. A criatura restaura número de Pontos de Vida igual ao total jogado. Após usar esse traço, você não pode usá-lo novamente até completar um Descanso Longo."},{"n":"Portador da Luz","d":"Você conhece o truque Luz . Carisma é seu atributo de conjuração para isso."},{"n":"Revelação Celestial","d":"No nível 3 de personagem, você pode se transformar como uma Ação Bônus usando uma das opções abaixo (escolha a opção cada vez que você se transformar). A transformação se mantém por 1 minuto ou até você a encerrar (nenhuma ação é necessária). Uma vez que você se transforma, não pode fazê-lo novamente até completar um Descanso Longo. Uma vez em cada um dos seus turnos, até que a transformação termine, você pode infligir dano adicional a um alvo ao causar dano a ele com um ataque ou uma magia. O dano adicional é igual ao seu Bônus de Proficiência, e o tipo de dano adicional é Necrótico para Manto Necrótico ou Radiante para Asas Celestiais e Transfiguração Radiante.\n\nAqui estão as opções de transformação:\n\nAsas Celestiais. Duas asas espectrais brotam em suas costas temporariamente. Até que a transformação se encerre, você tem um Deslocamento de Voo igual ao seu Deslocamento.\n\nManto Necrótico. Seus olhos se tornam brevemente poças de escuridão, e asas que não voam brotam em suas costas temporariamente. Criaturas que não sejam seus aliados a até 3 metros de você devem ser bem-sucedidas em uma salvaguarda de Carisma (CD 8 + seu modificador de Carisma e seu Bônus de Proficiência) ou têm a condição Amedrontado até o final do seu próximo turno.\n\nTransfiguração Radiante. Luz abrasadora irradia temporariamente de seus olhos e boca. Pela duração da transformação, você emite Luz Plena em um raio de 3 metros e Meia-luz por mais 3 metros, e no fim de cada um de seus turnos, cada criatura a até 3 metros de você sofre dano Radiante igual ao seu Bônus de Proficiência."}],"anao":[{"n":"Visão no Escuro","d":"Você tem Visão no Escuro com um alcance de 36 metros."},{"n":"Resistência a Toxinas","d":"Você tem Resistência a Dano Venenoso. Você também tem Vantagem nas salvaguardas que realizar para evitar ou encerrar a condição Envenenado."},{"n":"Tenacidade Anã","d":"Seus Pontos de Vida máximos aumentam em 1, e novamente em 1, sempre que você atinge um nível de personagem."},{"n":"Conhecimento de Pedras","d":"Como uma Ação Bônus, você adquire Sismiconsciência com um alcance de 18 metros por 10 minutos. Você deve estar em, ou tocar, uma superfície de pedra para usar a Sismiconsciência. A pedra pode ser natural ou trabalhada.\n\nVocê pode usar essa Ação Bônus um número de vezes igual ao seu Bônus de Proficiência, e você restaura todos os usos gastos quando completa um Descanso Longo."}],"draconato":[{"n":"Herança Dracônica","d":"Sua linhagem deriva de um progenitor dracônico. Escolha o tipo de dragão da tabela Herança Dracônica. Sua escolha afeta suas características de Ataque de Sopro e Resistência a Dano, bem como sua aparência."},{"n":"Ataque de Sopro","d":"Ao executar a ação Atacar no seu turno, você pode substituir um de seus ataques por uma emissão de energia mágica em um Cone de 4,5 metros ou em uma Linha de 9 metros de comprimento e 1,5 metros de largura (escolha a forma a cada vez). Cada criatura nessa área deve realizar uma salvaguarda de Destreza (CD 8 + seu modificador de Constituição e seu Bônus de Proficiência). Se falhar, uma criatura sofre 1d10 pontos de dano do tipo determinado por seu traço Herança Dracônica. Em caso de sucesso, uma criatura sofre metade do dano. Esse dano aumenta em 1d10 quando você atinge os níveis de personagem 5 (2d10), 11 (3d10) e 17 (4d10).\n\nVocê pode usar esse Ataque de Sopro um número de vezes igual ao seu Bônus de Proficiência, e você restaura todos os usos gastos quando completa um Descanso Longo."},{"n":"Resistência a Dano","d":"Você tem Resistência ao tipo de dano determinado por seu traço Herança Dracônica."},{"n":"Visão no Escuro","d":"Você tem Visão no Escuro com um alcance de 18 metros."},{"n":"Voo Dracônico","d":"No nível 5 do personagem, você pode canalizar magia dracônica para beneficiar de um voo temporário. Como uma Ação Bônus, você cria asas espectrais nas costas que duram 10 minutos ou até que você as retraia (nenhuma ação é necessária) ou tem a condição Incapacitado. Pela duração, você tem um Deslocamento de Voo igual ao seu Deslocamento. Suas asas parecem feitas da mesma energia que o seu Ataque de Sopro. Após usar esse traço, você não pode usá-lo novamente até completar um Descanso Longo."}],"elfo":[{"n":"Visão no Escuro","d":"Você tem Visão no Escuro com um alcance de 18 metros."},{"n":"Linhagem Élfica","d":"Você é de uma linhagem que lhe concede habilidades sobrenaturais. Escolha uma linhagem da tabela Linhagem Élfica. Você adquire o benefício de nível 1 dessa linhagem.\n\nAo atingir os níveis 3 e 5, você aprende uma magia de círculo superior, conforme indicado na tabela. Essa magia está sempre preparada e pode ser conjurada uma vez sem usar um espaço de magia, restaurando essa capacidade ao completar um Descanso Longo. Além disso, você pode conjurá-la usando qualquer espaço de magia apropriado que possua.\n\nInteligência, Sabedoria ou Carisma é seu atributo de conjuração para as magias que você conjura com este traço (escolha o atributo quando selecionar a linhagem)."},{"n":"Ancestralidade Feérica","d":"Você tem Vantagem ao realizar salvaguardas para evitar ou encerrar a condição Enfeitiçado."},{"n":"Sentidos Aguçados","d":"Você tem proficiência na perícia Intuição, Percepção ou Sobrevivência."},{"n":"Transe","d":"Você pode completar um Descanso Longo em 4 horas ao meditar, sem a necessidade de dormir, mantendo a consciência, e magia não pode forçá-lo a dormir."}],"gnomo":[{"n":"Visão no Escuro","d":"Você tem Visão no Escuro com um alcance de 18 metros."},{"n":"Astúcia de Gnomo","d":"Você tem Vantagem em salvaguardas de Inteligência, Sabedoria e Carisma."},{"n":"Linhagem Gnômica","d":"Você pertence a uma linhagem que lhe confere habilidades sobrenaturais. Escolha uma das seguintes opções; sua escolha determina se Inteligência, Sabedoria ou Carisma é seu atributo de conjuração para as magias desse traço (escolha o atributo quando selecionar a linhagem):\n\nGnomo das Rochas. Você conhece os truques Prestidigitação Arcana e Reparar . Além disso, você pode gastar 10 minutos conjurando Prestidigitação Arcana para fabricar um dispositivo mecânico minúsculo (CA 5, 1 PV), como um brinquedo, isqueiro mecânico ou caixa de música. Ao fabricar o dispositivo, você determina a função dele escolhendo um efeito de Prestidigitação Arcana ; o dispositivo produz esse efeito sempre que você ou outra criatura executa uma Ação Bônus para ativá-lo com um toque. Se o efeito escolhido tiver opções possíveis, você escolhe uma dessas opções para o dispositivo ao fabricá-lo. Por exemplo, se você escolher o efeito de Brincar com Fogo da magia, você determina se o dispositivo acende ou extingue fogo; o dispositivo não faz ambas as coisas. Você pode ter três desses dispositivos ao mesmo tempo, e cada um se desfaz 8 horas após ser fabricado ou quando você o desmonta com um toque como uma ação Usar Objeto.\n\nGnomo do Bosque. Você conhece o truque Ilusão Menor . Você também sempre tem a magia Falar com Animais preparada. É possível conjurá-la sem um espaço de magia um número de vezes igual ao seu Bônus de Proficiência, e você restaura todos os usos gastos quando completa um Descanso Longo. Você também pode usar qualquer espaço de magia que tiver para conjurá-la."}],"golias":[{"n":"Ancestralidade Gigante","d":"Você é descendente de Gigantes. Escolha um dos seguintes benefícios — um benefício sobrenatural de sua ancestralidade; você pode usar o benefício escolhido um número de vezes igual ao seu Bônus de Proficiência, e você restaura todos os usos gastos quando completa um Descanso Longo:\n\nArrepio do Gelo (Gigante do Gelo). Ao atingir um alvo com uma jogada de ataque e causar dano a ele, você também pode infligir 1d6 pontos de dano Gélido a esse alvo e reduzir o Deslocamento dele em 3 metros até o início do seu próximo turno.\n\nQueimadura de Fogo (Gigante de Fogo). Ao atingir um alvo com uma jogada de ataque e causar dano a ele, você também pode causar 1d10 pontos de dano Ígneo a esse alvo.\n\nResistência da Pedra (Gigante da Pedra). Ao sofrer dano, pode executar uma Reação para jogar 1d12. Adicione seu modificador de Constituição ao número obtido e reduza o dano desse total.\n\nSalto da Nuvem (Gigante das Nuvens). Como uma Ação Bônus, você se teleporta magicamente até 9 metros para um espaço desocupado à sua vista.\n\nTombo da Colina (Gigante da Colina). Ao atingir uma criatura Grande ou menor com uma jogada de ataque e causar dano a ela, você pode impor a esse alvo a condição Caído.\n\nTrovão da Tempestade (Gigante da Tempestade). Ao sofrer dano de uma criatura a até 18 metros de você, você pode executar uma Reação para causar 1d8 pontos de dano Trovejante a essa criatura."},{"n":"Forma Grande","d":"A partir do nível 5 de personagem, você pode alterar seu tamanho para Grande como uma Ação Bônus se estiver em um espaço grande o suficiente. Essa transformação se mantém por 10 minutos ou até que você a encerrar (nenhuma ação é necessária). Pela duração, você tem Vantagem em testes de Força, e seu Deslocamento aumenta em 3 metros. Após usar este traço, você não pode utilizá-lo novamente até completar um Descanso Longo."},{"n":"Porte Poderoso","d":"Você tem Vantagem em qualquer teste de atributo que realizar para encerrar a condição Imobilizado. Você também conta como um tamanho maior ao determinar sua capacidade de carga."}],"humano":[{"n":"Eficiente","d":"Você adquire Inspiração Heroica sempre que completar um Descanso Longo."},{"n":"Hábil","d":"Você adquire proficiência em uma perícia à sua escolha."},{"n":"Versátil","d":"Você adquire um talento de Origem à sua escolha (veja o capítulo 5). Habilidoso é recomendado."}],"orc":[{"n":"Pico de Adrenalina","d":"Você pode executar a ação Correr como uma Ação Bônus. Ao executar isso, você adquire um número de Pontos de Vida Temporários igual ao seu Bônus de Proficiência.\n\nVocê pode usar este traço um número de vezes igual ao seu Bônus de Proficiência, e você restaura todos os usos gastos quando completa um Descanso Curto ou Longo."},{"n":"Visão no Escuro","d":"Você tem Visão no Escuro com um alcance de 36 metros."},{"n":"Vigor Implacável","d":"Ao ser reduzido a 0 Pontos de Vida, mas não morto imediatamente, você fica com 1 Ponto de Vida. Após usar este traço, você não pode fazê-lo novamente até completar um Descanso Longo."}],"pequenino":[{"n":"Corajoso","d":"Você tem Vantagem nas salvaguardas que realizar para evitar ou encerrar a condição Amedrontado."},{"n":"Agilidade Pequenina","d":"Você pode se mover pelo espaço de qualquer criatura que seja um tamanho maior que você, mas você não pode parar no mesmo espaço."},{"n":"Sorte","d":"Ao tirar 1 no D20 de um Teste de D20, você pode jogar novamente o dado e deve usar a nova jogada."},{"n":"Furtividade Natural","d":"Você pode executar a ação Esconder mesmo quando estiver encoberto apenas por uma criatura que seja pelo menos um tamanho maior que você."}],"tiferino":[{"n":"Visão no Escuro","d":"Você tem Visão no Escuro com um alcance de 18 metros."},{"n":"Legado Ínfero","d":"Você é o portador de um legado que lhe confere poderes sobrenaturais. Escolha um legado da tabela Legados Ínferos. Você adquire o benefício de nível 1 do legado escolhido.\n\nAo atingir os níveis de personagem 3 e 5, você aprende magias de círculo superior, conforme indicado na tabela. Essas magias estão sempre preparadas e podem ser conjuradas uma vez sem usar um espaço de magia, sendo restauradas quando completa um Descanso Longo. Além disso, você pode conjurá-las utilizando qualquer espaço de magia que possua do círculo correspondente. Atributos como Inteligência, Sabedoria ou Carisma servem como seu atributo de conjuração para essas magias (escolha um atributo ao selecionar o legado)."},{"n":"Presença Sobrenatural","d":"Você conhece o truque Taumaturgia . Ao conjurar com este traço, a magia usa o mesmo atributo de conjuração que você usa para sua Característica Legado Ínfero."}]};

)\n\nFabricação: Fantasia"},{"n":"Kit de Falsificação","cat":"Ferramenta","p":"15 PO","d":"Atributo: Destreza Peso: 2,5 kg\n\nUsar Objeto: Imitar 10 ou menos palavras escritas de outra pessoa (CD 15) ou duplicar um selo de cera (CD 20)"},{"n":"Kit de Herbalismo","cat":"Ferramenta","p":"5 PO","d":"Atributo: Inteligência Peso: 1,5 kg\n\nUsar Objeto: Identificar uma planta (CD 10)\n\nFabricação: Antitoxina, Kit de Curandeiro, Poção de Cura, Vela"},{"n":"Kit de Jogos","cat":"Ferramenta","p":"Varia","d":"Atributo: Sabedoria Peso: —\n\nUsar Objeto: Discernir se alguém está trapaceando (CD 10) ou ganhar o jogo (CD 20)\n\nVariantes: Dados (1 PP), Xadrez-do-Dragão (1 PO), Baralho (5 PP), Conjunto do Jogo dos Três Dragões (1 PO)"},{"n":"Kit de Veneno","cat":"Ferramenta","p":"50 PO","d":"Atributo: Inteligência Peso: 1 kg\n\nUsar Objeto: Detectar um objeto envenenado (CD 10)\n\nFabricação: Veneno Básico"},{"n":"Ácido","cat":"Equipamento de Aventura","p":"25 PO","d":"Ao executar a ação Atacar, você pode substituir um de seus ataques arremessando um frasco de Ácido. Ataque uma criatura ou objeto à sua vista a até 6 metros de você. O alvo deve ser bem-sucedido em uma salvaguarda de Destreza (CD 8 mais seu modificador de Destreza e Bônus de Proficiência) ou sofre 2d6 pontos de dano Ácido."},{"n":"Água Benta","cat":"Equipamento de Aventura","p":"25 PO","d":"Ao executar a ação Atacar, você pode substituir um de seus ataques arremessando um pote de Água Benta. Escolha como alvo uma criatura à sua vista a até 6 metros de você. O alvo deve ser bem-sucedido em uma salvaguarda de Destreza (CD 8 mais seu modificador de Destreza e Bônus de Proficiência) ou sofre 2d8 pontos de dano Radiante se for um Ínfero ou um Morto-vivo."},{"n":"Algibeira","cat":"Equipamento de Aventura","p":"5 PP","d":"Uma Algibeira comporta até 3 kg em um volume de 6 litros."},{"n":"Aljava","cat":"Equipamento de Aventura","p":"1 PO","d":"Uma Aljava armazena até 20 Flechas."},{"n":"Antitoxina","cat":"Equipamento de Aventura","p":"50 PO","d":"Como uma Ação Bônus, você pode beber um frasco de Antitoxina para obter Vantagem nas salvaguardas para evitar ou encerrar a condição Envenenado por 1 hora."},{"n":"Apito Sinalizador","cat":"Equipamento de Aventura","p":"5 PC","d":"Quando soprado como uma ação Usar Objeto, um Apito Sinalizador produz um som que pode ser ouvido a até 180 metros de distância."},{"n":"Aríete Portável","cat":"Equipamento de Aventura","p":"4 PO","d":"Você pode usar um Aríete Portável para arrombar portas. Ao fazer isso, você recebe um bônus de +4 no teste de Força. Outro personagem pode ajudá-lo a usar o Aríete, concedendo-lhe Vantagem nesse teste."},{"n":"Armadilha de Caça","cat":"Equipamento de Aventura","p":"5 PO","d":"Como uma ação Usar Objeto, você pode armar uma Armadilha de Caça, que é um anel de aço dentado que se fecha quando uma criatura pisa em uma placa de pressão no centro. A armadilha é presa em uma corrente pesada a um objeto imóvel, como uma árvore ou um espigão cravado no chão. Uma criatura que pisa no prato deve ser bem-sucedida em uma salvaguarda de Destreza CD 13 ou sofre 1d4 de dano Perfurante e tem o Deslocamento reduzido a 0 até o início de seu próximo turno. Depois disso, até que a criatura se liberte da armadilha, o movimento dela é limitado pelo comprimento da corrente (normalmente 1 metro). Uma criatura pode executar uma ação para realizar um teste de Força (Atletismo) CD 13, libertando-se ou libertando outra criatura ao alcance dela em caso de sucesso. Cada falha causa 1 ponto de dano Perfurante à criatura presa."},{"n":"Arpéu","cat":"Equipamento de Aventura","p":"2 PO","d":"Como uma ação Usar Objeto, você pode arremessar um Arpéu em um corrimão, uma borda ou outra superfície na qual pode ser ancorado, a até 15 metros de você, e o arpéu se ancora se você for bem-sucedido em um teste de Destreza (Acrobacia) CD 13. Se você amarrar uma corda no gancho, poderá escalá-la."},{"n":"Balde","cat":"Equipamento de Aventura","p":"5 PC","d":"Um Balde armazena até 0,3 metro cúbico de conteúdo."},{"n":"Baliza","cat":"Equipamento de Aventura","p":"5 PC","d":"Uma Baliza tem 3 metros de comprimento. Você pode usá-la para tocar algo a até 3 metros de distância. Se precisar realizar um teste de Força (Atletismo) como parte de um Salto em Altura ou Salto em Distância, você pode utilizar a Baliza para se impulsionar, recebendo Vantagem no teste."},{"n":"Barril","cat":"Equipamento de Aventura","p":"2 PO","d":"Um Barril armazena até 160 litros de líquido ou até 0,16 metro cúbico de produtos secos."},{"n":"Baú","cat":"Equipamento de Aventura","p":"5 PO","d":"Um Baú armazena até 0,35 metros cúbicos (ou 350 litros) de conteúdo."},{"n":"Bolsa de Componentes","cat":"Equipamento de Aventura","p":"25 PO","d":"Uma Bolsa de Componentes é à prova d’água e cheia de compartimentos que contêm todos os componentes Materiais sem custo de suas magias."},{"n":"Cadeado","cat":"Equipamento de Aventura","p":"10 PO","d":"Um Cadeado vem com uma chave. Sem a chave, uma criatura pode usar Ferramentas de Ladrão para abrir este Cadeado com um teste bem-sucedido de Destreza (Prestidigitação) CD 15."},{"n":"Caixa para Fogo","cat":"Equipamento de Aventura","p":"5 PP","d":"Uma Caixa para Fogo é um pequeno recipiente contendo pedra de sílex, aço contra fogo e material muito seco e altamente inflamável (geralmente pano seco embebido em óleo leve) usado para acender um fogo. Usá-lo para acender uma Lâmpada, Lanterna, Tocha ou Vela — ou qualquer outra coisa com combustível exposto — requer uma Ação Bônus. Acender qualquer outro fogo leva 1 minuto."},{"n":"Caneta Tinteiro","cat":"Equipamento de Aventura","p":"2 PC","d":"Usando Tinta, uma Caneta Tinteiro é usada para escrever ou desenhar."},{"n":"Cantil","cat":"Equipamento de Aventura","p":"2 PP","d":"Um Cantil comporta até 2 litros. Se você não beber água suficiente, corre o risco de desidratação (veja o glossário de regras)."},{"n":"Cesta","cat":"Equipamento de Aventura","p":"4 PP","d":"Uma Cesta armazena até 20 quilos dentro de 60 centímetros cúbicos."},{"n":"Cobertor","cat":"Equipamento de Aventura","p":"5 PP","d":"Enquanto estiver envolto em um cobertor, você tem Vantagem em salvaguardas contra frio extremo (veja o Livro do Mestre )."},{"n":"Corda","cat":"Equipamento de Aventura","p":"1 PO","d":"Como uma ação Usar Objeto, você pode dar um nó em uma Corda se for bem-sucedido em um teste de Destreza (Prestidigitação) CD 10. Um teste bem-sucedido de Força (Atletismo) CD 20 pode romper a Corda. Você pode amarrar uma criatura involuntária com a Corda somente se a criatura tem a condição Contido, Imobilizado ou Incapacitado. Se as pernas da criatura estiverem amarradas, a criatura tem a condição Contido até escapar. Escapar da Corda requer que a criatura realize um teste bem-sucedido de Destreza (Acrobacia) CD 15 como uma ação."},{"n":"Cordão","cat":"Equipamento de Aventura","p":"1 PP","d":"Um cordão tem 3 metros de comprimento. Você pode dar um nó nele como uma ação Usar Objeto."},{"n":"Corrente","cat":"Equipamento de Aventura","p":"5 PO","d":"Como uma ação Usar Objeto, você pode enrolar uma Corrente em torno de uma criatura involuntária a até 1,5 metro de você, e ela tem a condição Contido, Imobilizado ou Incapacitado se você for bem-sucedido em um teste de Força (Atletismo) CD 13. Se as pernas da criatura estiverem amarradas, a criatura tem a condição Contido até escapar. Escapar da Corrente requer que a criatura realize um teste bem-sucedido de Destreza (Acrobacia) CD 18 como uma ação. Estourar a Corrente requer um teste bem-sucedido de Força (Atletismo) CD 20 como uma ação."},{"n":"Escada","cat":"Equipamento de Aventura","p":"1 PP","d":"Uma Escada tem 3 metros de altura. Você deve escalar para subir ou descer."},{"n":"Esferas de Metal","cat":"Equipamento de Aventura","p":"1 PO","d":"Como uma ação Usar Objeto, você pode derramar Esferas de Metal de sua algibeira. Elas se espalham para cobrir uma área nivelada quadrada de 3 metros de lados a até 3 metros de você. Uma criatura que entra nesta área pela primeira vez em um turno deve ser bem-sucedida em uma salvaguarda de Destreza CD 10 ou tem a condição Caído. Leva 10 minutos para recolher as Esferas de Metal."},{"n":"Espelho","cat":"Equipamento de Aventura","p":"5 PO","d":"Um espelho de aço portátil é prático tanto para uso pessoal quanto para espiar ao redor de cantos e refletir luz como sinal."},{"n":"Estacas de Ferro","cat":"Equipamento de Aventura","p":"1 PO","d":"Estacas de Ferro vêm em pacotes de dez. Como uma ação Usar Objeto, você pode usar um objeto contundente, como um Martelo Leve, para martelar uma Estaca em madeira, terra ou um material semelhante. Você pode fazer isso para fechar uma porta, amarrar uma corda ou corrente na Estaca."},{"n":"Estojo, Mapa ou Pergaminho","cat":"Equipamento de Aventura","p":"1 PO","d":"Um Estojo de Mapa ou Pergaminho armazena até 10 folhas de papel ou 5 folhas de pergaminho."},{"n":"Estojo, Virote de Besta","cat":"Equipamento de Aventura","p":"1 PO","d":"Um Estojo de Virotes de Besta armazena até 20 Virotes."},{"n":"Estrepes","cat":"Equipamento de Aventura","p":"1 PO","d":"Como uma ação Usar Objeto, você pode espalhar Estrepes de sua bolsa para cobrir uma área quadrada de 1,5 metro de lados a até 1,5 metro de você. Uma criatura que entra nesta área pela primeira vez em um turno deve ser bem-sucedida em uma salvaguarda de Destreza CD 15 ou sofre 1 ponto de dano Perfurante e tem o Deslocamento reduzido a 0 até o início do próximo turno dela. Leva 10 minutos para recolher os Estrepes."},{"n":"Fantasia","cat":"Equipamento de Aventura","p":"5 PO","d":"Enquanto estiver usando uma Fantasia, você tem Vantagem em qualquer teste de atributo que realize para se passar pela pessoa ou tipo de pessoa que a Fantasia representa."},{"n":"Foco Arcano","cat":"Equipamento de Aventura","p":"Varia","d":"Um Foco Arcano assume uma das formas na tabela Foco Arcano e é adornado ou esculpido para canalizar magia arcana. Um Bruxo, Feiticeiro ou Mago pode usar tal item como um Foco de Conjuração.\n\nFocos Arcanos\n\nFoco Peso Custo Cajado (também um Bastão) 2 kg 5 PO Cetro 1 kg 10 PO Cristal 0,5 kg 10 PO Orbe 1,5 kg 20 PO Varinha 0,5 kg 10 PO"},{"n":"Foco Druídico","cat":"Equipamento de Aventura","p":"Varia","d":"Um Foco Druídico assume uma das formas apresentadas na tabela Foco Druídico e é esculpido, amarrado com fita ou pintado para canalizar magia primitiva. Um Druida ou Guardião pode usar um objeto como um Foco de Conjuração.\n\nFocos Druídicos\n\nFoco Peso Custo Cajado de madeira (também um Bastão) 2 kg 5 PO Ramo de visco — 1 PO Varinha de teixo 0,5 kg 10 PO"},{"n":"Fogo Alquímico","cat":"Equipamento de Aventura","p":"50 PO","d":"Ao executar a ação Atacar, você pode substituir um de seus ataques arremessado um frasco de Fogo Alquímico. Escolha como alvo uma criatura ou objeto à sua vista a até 6 metros de você. O alvo deve ser bem-sucedido em uma salvaguarda de Destreza (CD 8 mais seu modificador de Destreza e Bônus de Proficiência) ou sofre 1d4 pontos de dano Ígneo e entra em combustão (veja o glossário de regras)."},{"n":"Frasco","cat":"Equipamento de Aventura","p":"1 PO","d":"Um Frasco armazena até 150 mililitros."},{"n":"Garrafa de Vidro","cat":"Equipamento de Aventura","p":"2 PO","d":"Uma Garrafa de Vidro armazena até 1 litro."},{"n":"Grilhões","cat":"Equipamento de Aventura","p":"2 PO","d":"Como uma ação Usar Objeto, você pode usar Grilhões para prender uma criatura Pequena ou Média involuntária a até 1,5 metro de você que tem a condição Contido, Imobilizado ou Incapacitado, se você for bem-sucedido em um teste de Destreza (Prestidigitação) CD 13. Enquanto presa, uma criatura tem Desvantagem em jogadas de ataque, e a criatura está Contida se os grilhões estiverem presos a uma corrente ou gancho fixo no lugar. Escapar dos grilhões requer um teste bem-sucedido de Destreza (Prestidigitação) CD 20 como uma ação. Estourá-los requer um teste bem-sucedido de Força (Atletismo) CD 25 como uma ação.\n\nUm conjunto de Grilhões vem com uma chave. Sem a chave, uma criatura pode usar Ferramentas de Ladrão para abrir os Grilhões com um teste bem-sucedido de Destreza (Prestidigitação) CD 15."},{"n":"Jarro","cat":"Equipamento de Aventura","p":"2 PC","d":"Um Jarro armazena até 4 litros."},{"n":"Kit de Artista","cat":"Equipamento de Aventura","p":"40 PO","d":"Um Kit de Artista contém os seguintes itens: Caixa para Fogo, Cantil, Espelho, 3 Fantasias, Lanterna Foca-Facho, Mochila, 8 potes de Óleo, 9 dias de Rações, Saco de Dormir, Sino."},{"n":"Kit de Assaltante","cat":"Equipamento de Aventura","p":"16 PO","d":"Um Kit de Assaltante contém os seguintes itens: Caixa para Fogo, Cantil, Corda, Esferas de Metal, Lanterna Coberta, Mochila, 7 potes de Óleo, Pé de Cabra, 5 dias de Rações, Sino e 10 Velas."},{"n":"Kit de Aventureiro","cat":"Equipamento de Aventura","p":"10 PO","d":"Um Kit de Aventureiro contém os seguintes itens: Caixa para Fogo, Cantil, Corda, Mochila, 2 potes de Óleo, 10 dias de Rações, Saco de Dormir, 10 Tochas."},{"n":"Kit de Curandeiro","cat":"Equipamento de Aventura","p":"5 PO","d":"Um Kit de Curandeiro tem dez usos. Como uma ação Usar Objeto, você pode gastar um dos usos para estabilizar uma criatura Inconsciente que tenha 0 Pontos de Vida sem precisar realizar um teste de Sabedoria (Medicina)."},{"n":"Kit de Diplomata","cat":"Equipamento de Aventura","p":"39 PO","d":"Um Kit de Diplomata contém os seguintes itens: Baú, Caixa para Fogo, 5 Canetas Tinteiro, 2 Estojos de Mapa ou Pergaminho, Lâmpada, 4 potes de Óleo, Perfume, 5 folhas de Papel, 5 folhas de Pergaminho, Roupas Finas, Tinta."},{"n":"Kit de Erudito","cat":"Equipamento de Aventura","p":"40 PO","d":"Um Kit de Erudito contém os seguintes itens: Caixa para Fogo, Caneta Tinteiro, Lâmpada, Livro, Mochila, 10 potes de Óleo, 10 folhas de Pergaminho, Tinta."},{"n":"Kit de Escalada","cat":"Equipamento de Aventura","p":"25 PO","d":"Um Kit de Escalada inclui arnês, luvas, pítons e ponteiras de bota. Como uma ação Usar Objeto, você pode usar o Kit de Escalada para se ancorar; quando o fizer, você não pode cair a mais de 7,5 metros do ponto de ancoragem e não pode se mover a mais de 7,5 metros de lá sem desfazer a âncora como uma Ação Bônus."},{"n":"Kit de Explorador de Masmorras","cat":"Equipamento de Aventura","p":"12 PO","d":"Um Kit de Explorador de Masmorras contém os seguintes itens: Caixa para Fogo, Cantil, Corda, Estrepes, Mochila, 2 potes de Óleo, Pé de Cabra, 10 dias de Rações, 10 Tochas."},{"n":"Kit de Sacerdote","cat":"Equipamento de Aventura","p":"33 PO","d":"Um Kit de Sacerdote contém os seguintes itens: Água Benta, Caixa para Fogo, Cobertor, Lâmpada, Mochila, 7 dias de Rações, Túnica."},{"n":"Lâmpada","cat":"Equipamento de Aventura","p":"5 PP","d":"Uma Lâmpada usa Óleo para combustão para emitir Luz Plena em um raio de 4,5 metros e Meia-luz por mais 9 metros."},{"n":"Lanterna Coberta","cat":"Equipamento de Aventura","p":"5 PO","d":"Uma Lanterna Coberta usa Óleo para combustão para emitir Luz Plena em um raio de 9 metros e Meia-luz por mais 9 metros. Como uma Ação Bônus, você pode baixar o capuz, reduzindo a luz para Meia-luz em um raio de 1,5 metro, ou levantá-lo novamente."},{"n":"Lanterna Foca-facho","cat":"Equipamento de Aventura","p":"10 PO","d":"Uma Lanterna Foca-Facho usa Óleo como combustão para emitir Luz Plena em um Cone de 18 metros e Meia-luz por mais 18 metros."},{"n":"Livro","cat":"Equipamento de Aventura","p":"25 PO","d":"Um livro contém texto de ficção ou não-ficção. Se você consultar um livro de não-ficção especializado em um determinado tema, você obtém um bônus de +5 em testes de Inteligência (Arcanismo, História, Natureza ou Religião) que você fizer sobre esse tema."},{"n":"Luneta","cat":"Equipamento de Aventura","p":"1.000 PO","d":"Objetos vistos através de uma Luneta são ampliados até o dobro do seu tamanho."},{"n":"Lupa","cat":"Equipamento de Aventura","p":"100 PO","d":"Uma Lupa concede Vantagem em qualquer teste de atributo realizado para avaliar ou inspecionar um item altamente detalhado. Acender uma fogueira com uma Lupa requer luz tão brilhante quanto a luz do sol para ser focado, lenha para acender e cerca de 5 minutos para o fogo acender."},{"n":"Mapa","cat":"Equipamento de Aventura","p":"1 PO","d":"Se consultar um mapa detalhado, você obtém um bônus de +5 em testes de Sabedoria (Sobrevivência) que realizar para encontrar um caminho no lugar representado nele."},{"n":"Mochila","cat":"Equipamento de Aventura","p":"2 PO","d":"Uma Mochila armazena até 15 quilos dentro de 30 centímetros cúbicos. Também pode servir como um alforje."},{"n":"Munição","cat":"Equipamento de Aventura","p":"varia","d":"Munição é exigida por uma arma que tenha a propriedade Munição. A descrição de uma arma detalha o tipo de munição usada pela arma. A tabela Munição lista os diferentes tipos e a quantidade que você recebe ao comprá-las. A tabela também lista o item que normalmente é usado para comportar cada tipo; o armazenamento deve ser comprado separadamente.\n\nMunição\n\nTipo Quant. Armz. Peso Custo Agulhas 50 Algibeira 0,5 kg 1 PO Balas, Arma de Fogo 10 Algibeira 1 kg 3 PO Balas, Funda 20 Algibeira 750 g 4 PC Flechas 20 Aljava 0,5 kg 1 PO Virotes 20 Estojo 750 g 1 PO"},{"n":"Óleo","cat":"Equipamento de Aventura","p":"1 PP","d":"Você pode cobrir uma criatura, objeto ou área com Óleo ou utilizá-lo como combustível, conforme detalhado abaixo.\n\nCobrindo uma Criatura ou um Objeto . Ao executar a ação Atacar, você pode substituir um de seus ataques por arremessar um pote de Óleo. Escolha uma criatura ou objeto a até 6 metros de distância. O alvo deve ser bem-sucedido em uma salvaguarda de Destreza (CD 8 mais seu modificador de Destreza e seu Bônus de Proficiência) ou fica coberto de óleo. Se o alvo sofrer dano Ígneo antes que o óleo seque (após 1 minuto), ele sofre 5 pontos de dano Ígneo adicionais devido ao óleo em combustão.\n\nCobrindo um Espaço . Você pode executar a ação Usar Objeto para despejar um pote de Óleo em um terreno plano para cobrir uma área quadrada de 1,5 metro de lado a até 1,5 metro de você. Ao ser aceso, o óleo queima até o fim do turno 2 rodadas depois (ou 12 segundos) e causa 5 pontos de dano Ígneo a qualquer criatura que entre ou termine o turno na área. Uma criatura sofre esse dano apenas uma vez por turno.\n\nCombustível. O Óleo serve como combustível para Lâmpadas e Lanternas. Uma vez aceso, um pote de Óleo queima por 6 horas em uma Lâmpada ou Lanterna. Esse tempo de queima não precisa ser consecutivo; você pode extinguir o Óleo em combustão (como uma ação Usar Objeto) e acendê-lo até que ele tenha queimado por um total de 6 horas."},{"n":"Pá","cat":"Equipamento de Aventura","p":"2 PO","d":"Trabalhando por 1 hora, você pode usar uma Pá para cavar um buraco de 1,5 metro de cada lado no solo ou material semelhante."},{"n":"Papel","cat":"Equipamento de Aventura","p":"2 PP","d":"Uma folha de papel pode comportar cerca de 250 palavras escritas à mão."},{"n":"Pé de Cabra","cat":"Equipamento de Aventura","p":"2 PO","d":"Usar um Pé de Cabra concede a você Vantagem em testes de Força, onde a alavancagem do Pé de Cabra pode ser aplicada."},{"n":"Perfume","cat":"Equipamento de Aventura","p":"5 PO","d":"O perfume vem em um frasco de 120 mililitros. Por 1 hora após aplicar o Perfume em si, você tem Vantagem em testes de Carisma (Persuasão) realizados ao executar a ação Influenciar em um Humanoide Indiferente a até 1,5 metro de você."},{"n":"Pergaminho","cat":"Equipamento de Aventura","p":"1 PP","d":"Uma folha de pergaminho pode comportar cerca de 250 palavras escritas à mão."},{"n":"Pergaminho Mágico","cat":"Equipamento de Aventura","p":"Truque, 30 PO; 1º Círculo, 50 PO","d":"Um Pergaminho Mágico (Truque) ou Pergaminho Mágico (1º Círculo) é um item mágico que contém as palavras de um truque ou magia de 1º círculo, respectivamente, determinado pelo criador do pergaminho. Se a magia estiver na lista de magias da sua classe, você pode ler o pergaminho e conjurar a magia usando seu tempo de conjuração normal e sem fornecer nenhum componente Material.\n\nSe a magia exigir uma salvaguarda ou jogada de ataque, a CD para evitar magia é 13 e o bônus de ataque é +5. O pergaminho se desintegra quando a conjuração é concluída."},{"n":"Poção de Cura","cat":"Equipamento de Aventura","p":"50 PO","d":"Esta poção é um item mágico. Como uma Ação Bônus, você pode bebê-la ou administrá-la a outra criatura a até 1,5 metro de você. A criatura que beber o líquido vermelho mágico deste frasco restaura 2d4 + 2 Pontos de Vida."},{"n":"Pote","cat":"Equipamento de Aventura","p":"2 PC","d":"Um Frasco armazena até meio litro."},{"n":"Pote de Ferro","cat":"Equipamento de Aventura","p":"2 PO","d":"Um Pote de Ferro comporta até 4 litros."},{"n":"Rações","cat":"Equipamento de Aventura","p":"5 PP","d":"As rações consistem em alimentos prontos para viagem, incluindo biscoito duro, carne seca, frutas secas e nozes. Veja “Desnutrição” no glossário de regras para os riscos de não comer."},{"n":"Rede","cat":"Equipamento de Aventura","p":"1 PO","d":"Ao executar a ação Atacar, você pode substituir um de seus ataques pelo arremesso de uma Rede. Escolha uma criatura à sua vista a até 4,5 metros de distância. O alvo deve ser bem-sucedido em uma salvaguarda de Destreza (CD 8 mais seu modificador de Destreza e seu Bônus de Proficiência) ou tem a condição Contido até escapar. O alvo é bem-sucedido automaticamente se for de tamanho Enorme ou maior.\n\nPara escapar, o alvo ou uma criatura a até 1,5 metro dele deve executar uma ação para realizar um teste de Força (Atletismo) CD 10, libertando a criatura Contida em caso de sucesso. Destruir a Rede (CA 10; 5 PV; imunidade a dano de Contundente, Psíquico e Venenoso) também liberta o alvo, encerrando a condição."},{"n":"Roldana e Polias","cat":"Equipamento de Aventura","p":"1 PO","d":"Roldana e Polias permitem içar até quatro vezes o peso que você normalmente pode levantar."},{"n":"Roupas, Finas","cat":"Equipamento de Aventura","p":"15 PO","d":"Roupas Finas são feitas de tecidos caros e adornadas com detalhes habilmente trabalhados. Alguns eventos e locais admitem apenas pessoas vestindo essas roupas."},{"n":"Roupas, Viagem","cat":"Equipamento de Aventura","p":"2 PO","d":"Roupas de Viagem são roupas resistentes projetadas para viagens em vários ambientes."},{"n":"Saca","cat":"Equipamento de Aventura","p":"1 PP","d":"Uma Saca armazena até 15 kg dentro de 30 centímetros cúbicos."},{"n":"Saco de Dormir","cat":"Equipamento de Aventura","p":"1 PO","d":"Um Saco de Dormir acomoda uma criatura Pequena ou Média. Enquanto estiver em um Saco de Dormir, você é automaticamente bem-sucedido em salvaguardas contra frio extremo (veja o Livro do Mestre )."},{"n":"Símbolo Sagrado","cat":"Equipamento de Aventura","p":"Varia","d":"Um Símbolo Sagrado assume uma das formas na tabela Símbolo Sagrado e é adornado ou pintado para canalizar magia divina. Um Clérigo ou Paladino pode usar um Símbolo Sagrado como um Foco de Conjuração. A tabela indica se um Símbolo Sagrado precisa ser segurado, usado ou exibido em tecido (como um tabardo ou um emblema) ou um Escudo.\n\nSímbolos Sagrados\n\nSímbolo Peso Custo Amuleto (usado ou segurado) 0,5 kg 5 PO Emblema (exibido em tecido ou em um Escudo) — 5 PO Relicário (segurado) 1 kg 5 PO"},{"n":"Sino","cat":"Equipamento de Aventura","p":"1 PO","d":"Quando tocado como uma ação Usar Objeto, um Sino produz um som que pode ser ouvido a até 18 metros de distância."},{"n":"Tenda","cat":"Equipamento de Aventura","p":"2 PO","d":"Uma Tenda acomoda para dormir até duas criaturas Pequenas ou Médias."},{"n":"Tinta","cat":"Equipamento de Aventura","p":"10 PO","d":"A tinta vem em uma garrafa de 30 mililitros, que fornece tinta suficiente para escrever cerca de 500 páginas."},{"n":"Tocha","cat":"Equipamento de Aventura","p":"1 PC","d":"Uma Tocha entra em combustão por 1 hora, emitindo Luz Plena em um raio de 6 metros e Meia-luz por mais 6 metros. Ao executar a ação Atacar, você pode atacar com a Tocha, usando-a como uma arma Simples Corpo a Corpo. Em caso de acerto, o alvo sofre 1 ponto de dano Ígneo."},{"n":"Túnica","cat":"Equipamento de Aventura","p":"1 PO","d":"Uma Túnica tem significado vocacional ou cerimonial. Alguns eventos e locais admitem apenas pessoas vestindo uma Túnica com certas cores ou símbolos."},{"n":"Vela","cat":"Equipamento de Aventura","p":"1 PC","d":"Por 1 hora, uma Vela acesa emite Luz Plena em um raio de 1,5 metro e Meia-luz por mais 1,5 metro."},{"n":"Veneno Básico","cat":"Equipamento de Aventura","p":"100 PO","d":"Como uma Ação Bônus, você pode usar um frasco de Veneno Básico para revestir uma arma ou até três peças de munição. Uma criatura que sofre dano Perfurante ou Cortante da arma ou munição envenenada sofre 1d4 pontos de dano Venenoso adicional. Uma vez aplicado, o veneno retém a potência por 1 minuto ou até que o dano dele seja causado, o que ocorrer primeiro."}];
const EQ_BY=Object.fromEntries(EQUIP.map(e=>[e.n,e]));
const WPROPS={"Acuidade":"Ao realizar um ataque com uma arma que possui Acuidade, utilize seu modificador de Força ou Destreza, à sua escolha, para as jogadas de ataque e dano. Você deve aplicar o mesmo modificador em ambas as jogadas.","Alcance":"Uma arma com Alcance possui um alcance indicado entre parênteses após a propriedade Munição ou Arremesso. O alcance apresenta dois números: o primeiro representa o alcance normal da arma em metros, enquanto o segundo indica o alcance máximo. Ao atacar um alvo que esteja além do alcance normal, você tem Desvantagem na jogada de ataque. Não é possível atacar um alvo que esteja além do alcance máximo.","Arremesso":"Se uma arma possui a propriedade Arremesso, você pode arremessá-la para realizar um ataque à distância, e pode sacar essa arma como parte do ataque. Se a arma for corpo a corpo, utilize o mesmo modificador de atributo para as jogadas de ataque e dano que você emprega ao realizar um ataque corpo a corpo com essa arma.","Duas Mãos":"Uma arma de Duas Mãos exige o uso de duas mãos quando você ataca com ela.","Extensão":"Uma arma de Extensão adiciona 1,5 metro ao seu alcance quando você ataca com ela, bem como ao determinar seu alcance para realizar Ataques de Oportunidade com ela.","Leve":"Quando você executa a ação Atacar em seu turno e usa uma arma Leve, pode realizar um ataque adicional como uma Ação Bônus mais tarde no mesmo turno. Esse ataque adicional deve ser realizado com uma arma Leve diferente, e você não adiciona seu modificador de atributo ao dano do ataque adicional, a menos que esse modificador seja negativo. Por exemplo, você pode atacar com uma Espada Curta em uma mão e uma Adaga na outra executando a ação Atacar e uma Ação Bônus, mas não adiciona seu modificador de Força ou Destreza à jogada de dano da Ação Bônus, a menos que esse modificador seja negativo.","Munição":"Você só pode usar uma arma com a propriedade Munição para realizar um ataque à distância se tiver munição disponível. O tipo de munição necessária é especificado junto ao alcance da arma. Cada ataque gasta uma peça de munição. Sacar a munição é parte do ataque (você precisa de uma mão livre para carregar uma arma com uma mão). Após uma luta, você pode gastar 1 minuto para recuperar metade da munição (arredondado para baixo) que utilizou na luta; o restante é perdido.","Pesada":"Você tem Desvantagem em jogadas de ataque com uma arma Pesada se for uma arma Corpo a Corpo e seu valor de Força for inferior a 13, ou se for uma arma à Distância e seu valor de Destreza for inferior a 13.","Recarga":"Você pode disparar apenas uma única peça de munição de uma arma com Recarga ao executar uma ação, uma Ação Bônus ou uma Reação para dispará-la, independentemente do número de ataques que você normalmente pode realizar.","Versátil":"Uma arma Versátil pode ser usada com uma ou duas mãos. Um valor de dano entre parênteses aparece com a propriedade. A arma causa esse dano quando usada com as duas mãos ao realizar um ataque corpo a corpo.","Afligir":"Se você atingir uma criatura com esta arma e causar dano a ela, você tem Vantagem em sua próxima jogada de ataque contra essa criatura antes do final do seu próximo turno.","Ágil":"Ao realizar o ataque adicional da propriedade Leve, você pode fazê-lo como parte da ação Atacar, em vez de uma Ação Bônus. Esse ataque adicional só pode ser realizado uma vez por turno.","Derrubar":"Se você atingir uma criatura com esta arma, você pode forçar a criatura a realizar uma salvaguarda de Constituição (CD 8 mais o modificador de atributo usado para realizar a jogada de ataque e seu Bônus de Proficiência). Se falhar, a criatura tem a condição Caído.","Drenar":"Se você atingir uma criatura com esta arma, essa criatura tem Desvantagem na próxima jogada de ataque dela antes do início do seu próximo turno.","Empurrar":"Se atingir uma criatura com esta arma, você pode empurrá-la até 3 metros para longe de você se a criatura for Grande ou menor.","Garantido":"Se sua jogada de ataque com esta arma errar uma criatura, você pode causar dano a essa criatura igual ao modificador de atributo que utilizou para realizar a jogada de ataque. Este dano é do mesmo tipo causado pela arma, e só pode ser aumentado se o modificador de atributo for incrementado.","Lentidão":"Se você atingir uma criatura com esta arma e causar dano a ela, você pode reduzir o Deslocamento da criatura atingida em 3 metros até o início do seu próximo turno. Se a criatura for atingida mais de uma vez por armas que tenham essa propriedade, a redução de Deslocamento não excede 3 metros.","Trespassar":"Se atingir uma criatura com uma jogada de ataque corpo a corpo usando esta arma, você pode realizar uma jogada de ataque corpo a corpo com a mesma arma contra uma segunda criatura a até 1,5 metro da primeira que também esteja ao seu alcance. Se acertar, a segunda criatura sofre o dano da arma, mas você não adiciona seu modificador de atributo a esse dano, a menos que esse modificador seja negativo. Você pode realizar esse ataque adicional apenas uma vez por turno."};
