. Exemplos incluem “após 1.000 anos” ou “quando o tarrasque despertar”. A magia também encerra se o alvo sofrer qualquer dano."],["Regeneração",7,"Transmutação",["bardo","clerigo","druida"],"1 minuto","Toque","V, S, M (uma conta de oração)","1 hora","Uma criatura que você toca recupera 4d8 + 15 Pontos de Vida. Pela duração da magia, o alvo recupera 1 Ponto de Vida no início de cada um dos turnos dele, e quaisquer partes do corpo cortadas voltam a crescer após 2 minutos."],["Relâmpago",3,"Evocação",["feiticeiro","mago"],"Ação","Pessoal","V, S, M (um pouco de pelo e um cajado de cristal)","Instantânea","Um relâmpago formando uma Linha de 30 metros de comprimento e 1,5 metro de largura dispara a partir de você em uma direção à sua escolha. Cada criatura na Linha realiza uma salvaguarda de Destreza, sofrendo 8d6 pontos de dano Elétrico se falhar ou metade desse dano em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 para cada círculo de espaço de magia acima de 3."],["Remeter",3,"Adivinhação",["bardo","clerigo","mago"],"Ação","Ilimitado","V, S, M (um fio de cobre)","Instantânea","Você envia uma mensagem curta de 25 palavras ou menos para uma criatura que você já encontrou ou que foi descrita a você por alguém que a tenha conhecido. O alvo ouve a mensagem na mente, reconhece você como remetente se o conhecer e pode responder da mesma forma imediatamente. A magia permite que o alvo compreenda o significado da sua mensagem. Você pode enviar a mensagem através de qualquer distância e até para outros planos de existência, mas se o alvo estiver em um plano diferente do seu, há uma chance de 5% de que a mensagem não chegue. Você sabe se a entrega falha.\n\nAo receber sua mensagem, a criatura pode bloquear sua capacidade de contactá-la novamente com essa magia por 8 horas. Se você tentar enviar outra mensagem durante esse período, descobre que está bloqueado e a magia falha."],["Remover Maldição",3,"Abjuração",["bruxo","clerigo","mago","paladino"],"Ação","Toque","V, S","Instantânea","Ao seu toque, todas as maldições que afetam uma criatura ou objeto se encerram. Se o objeto for um item mágico amaldiçoado, a maldição permanece, mas a magia quebra a Sintonização do dono com o objeto, permitindo que ele seja removido ou descartado."],["Reparar",0,"Transmutação",["bardo","clerigo","druida","feiticeiro","mago"],"1 minuto","Toque","V, S, M (duas pedras-ímã)","Instantânea","Essa magia repara uma única ruptura ou rasgo em um objeto que você tocar, como um elo de corrente quebrado, partes de uma chave partida, uma capa rasgada ou um odre furado. Se a ruptura ou rasgo não ultrapassar 30 centímetros em qualquer dimensão, ela é reparada sem deixar vestígios do dano anterior. Essa magia pode reparar fisicamente um item mágico, mas não pode restaurar a magia de tal objeto."],["Repouso Tranquilo",2,"Necromancia",["clerigo","mago","paladino"],"Ação ou Ritual","Toque","V, S, M (2 Peças de Cobre, que a magia consome)","10 dias","Você toca um cadáver ou outros restos mortais. Pela duração da magia, o alvo é protegido da decomposição e não pode se tornar um Morto-Vivo.\n\nA magia também estende efetivamente o limite de tempo para ressuscitar o alvo dos mortos, uma vez que os dias passados sob a influência desta magia não contam contra o limite de tempo de magias como Reviver os Mortos ."],["Repreensão Diabólica",1,"Evocação",["bruxo"],"Reação, que você realiza ao receber dano de uma criatura à sua vista e a até 18 metros de você","18 metros","V, S","Instantânea","A criatura que lhe causou dano é momentaneamente cercada por chamas verdes. Ela realiza uma salvaguarda de Destreza, sofrendo 2d10 pontos de dano Ígneo se falhar, ou metade desse dano em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d10 para cada círculo de espaço de magia acima de 1."],["Resistência",0,"Abjuração",["clerigo","druida"],"Ação","Toque","V, S","Concentração, até 1 minuto","Você toca uma criatura voluntária e escolhe um tipo de dano: Ácido, Contundente, Cortante, Elétrico, Gélido, Ígneo, Necrótico, Perfurante, Radiante, Trovejante ou Venenoso. Quando a criatura sofre dano do tipo escolhido antes que a magia termine, a criatura reduz o dano total sofrido em 1d4 pontos. Uma criatura pode se beneficiar desta magia apenas uma vez por turno."],["Respirar na Água",3,"Transmutação",["druida","feiticeiro","guardiao","mago"],"Ação ou Ritual","9 metros","V, S, M (um pedaço de junco)","24 horas","Esta magia concede a até dez criaturas voluntárias à sua escolha no alcance da magia a capacidade de respirar debaixo d’água até que a magia termine. As criaturas afetadas também mantêm seu modo normal de respiração."],["Ressurreição",7,"Necromancia",["bardo","clerigo"],"1 hora","Toque","V, S, M (um diamante no valor de 1.000 ou mais PO, que a magia consome)","Instantânea","Com um toque, você revive uma criatura morta há no máximo um século, que não faleceu de velhice nem era um Morto-Vivo.\n\nA criatura retorna à vida com todos os seus Pontos de Vida, e a magia neutraliza quaisquer venenos que a afetavam na hora da morte, fecha feridas letais e restaura partes do corpo ausentes.\n\nVoltar à vida é um processo difícil. O alvo sofre uma penalidade de −4 em Testes de D20. Sempre que o alvo completar um Descanso Longo, a penalidade é reduzida em 1 até se tornar 0.\n\nConjurar essa magia para reviver uma criatura morta há 365 dias ou mais sobrecarrega você. Até completar um Descanso Longo, você não pode conjurar magias novamente e tem Desvantagem nos Testes de D20."],["Ressurreição Verdadeira",9,"Necromancia",["clerigo","druida"],"1 hora","Toque","V, S, M (diamantes no valor de 25.000 ou mais PO, que a magia consome)","Instantânea","Você toca uma criatura morta há no máximo 200 anos e que morreu por qualquer motivo, exceto velhice. A criatura retorna à vida com todos os seus Pontos de Vida. Esta magia fecha todas as feridas, neutraliza qualquer veneno, cura todos os contágios mágicos e elimina quaisquer maldições afetando a criatura quando ela morreu. A magia substitui órgãos e membros danificados ou ausentes. Se a criatura era Morto-Vivo, ela é restaurada à sua forma não Morta-Viva.\n\nA magia pode criar um novo corpo se o original não existir mais; nesse caso, você deve pronunciar o nome da criatura. A criatura então aparece em um espaço desocupado à sua escolha, a até 3 metros de você."],["Restauração Maior",5,"Abjuração",["bardo","clerigo","druida","guardiao","paladino"],"Ação","Toque","V, S, M (poeira de diamante no valor de 100 ou mais PO, que a magia consome)","Instantânea","Você toca uma criatura e magicamente remove um dos seguintes efeitos:\n\n• 1 nível de Exaustão • A condição Enfeitiçado ou Petrificado • Uma maldição, incluindo a Sintonização do alvo com um item mágico amaldiçoado • Qualquer redução em um dos valores de atributo do alvo • Qualquer redução nos Pontos de Vida máximos do alvo"],["Restauração Menor",2,"Abjuração",["bardo","clerigo","druida","guardiao","paladino"],"Ação Bônus","Toque","V, S","Instantânea","Você toca uma criatura e remove uma condição: Cego, Envenenado, Paralisado ou Surdo."],["Retirada Acelerada",1,"Transmutação",["bruxo","feiticeiro","mago"],"Ação Bônus","Pessoal","V, S","Concentração, até 10 minutos","Você executa a ação Correr e, até que a magia termine, pode executar essa ação novamente como uma Ação Bônus."],["Reviver os Mortos",5,"Necromancia",["bardo","clerigo","paladino"],"1 hora","Toque","V, S, M (um diamante no valor de 500 ou mais PO, que a magia consome)","Instantânea","Com um toque, você revive uma criatura morta, se tiver falecido há no máximo 10 dias e não era um Morto-Vivo quando morreu.\n\nA criatura retorna à vida com 1 Ponto de Vida. Esta magia também neutraliza quaisquer venenos que afetavam a criatura no momento da morte.\n\nEsta magia fecha todas as feridas fatais, mas não restaura membros ou partes do corpo faltantes. Se a criatura estiver sem partes do corpo ou órgãos essenciais para sua sobrevivência — como a cabeça, por exemplo — a magia falha automaticamente.\n\nVoltar à vida é um processo difícil. O alvo sofre uma penalidade de −4 em Testes de D20. Sempre que o alvo completar um Descanso Longo, a penalidade é reduzida em 1 até se tornar 0."],["Revivificar",3,"Necromancia",["clerigo","druida","guardiao","paladino"],"Ação","Toque","V, S, M (um diamante no valor de 300 ou mais PO, que a magia consome)","Instantânea","Você toca uma criatura que morreu no último minuto. Essa criatura revive com 1 Ponto de Vida. Esta magia não pode reviver uma criatura que morreu de velhice, nem restaura partes do corpo ausentes."],["Rogar Maldição",3,"Necromancia",["bardo","clerigo","mago"],"Ação","Toque","V, S","Concentração, até 1 minuto","Você toca uma criatura, que deve ser bem-sucedida em uma salvaguarda de Sabedoria ou fica amaldiçoada pela duração da magia. Até que a maldição termine, o alvo sofre um dos seguintes efeitos à sua escolha: • Escolha um atributo. O alvo tem Desvantagem em testes de atributo e salvaguardas realizadas com esse atributo.\n\n• O alvo tem Desvantagem em jogadas de ataque contra você.\n\n• Em combate, o alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria no início de cada um dos turnos dele ou ele é forçado a executar a ação Esquivar neste turno.\n\n• Se você causar dano ao alvo com uma jogada de ataque ou uma magia, o alvo sofre 1d8 pontos de dano Necrótico adicionais.\n\nUsando um Espaço de Magia de Círculo Superior. Se você conjurar esta magia usando um espaço de magia de 4º círculo, você pode manter a Concentração nela por até 10 minutos. Se você usar um espaço de magia de 5º círculo ou superior, a magia não requer Concentração, e a duração se torna 8 horas (espaço de 5º e 6º círculo) ou 24 horas (espaço de 7º ou 8º círculo). Se você usar um espaço de magia de 9º círculo, a magia permanece até ser dissipada."],["Salto",1,"Transmutação",["druida","feiticeiro","guardiao","mago"],"Ação Bônus","Toque","V, S, M (perna traseira de um gafanhoto)","1 minuto","Você toca uma criatura voluntária. Uma vez em cada um dos turnos dela até que a magia encerre, essa criatura pode saltar até 9 metros gastando 3 metros de movimento.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 1."],["Santuário",1,"Abjuração",["clerigo"],"Ação Bônus","9 metros","V, S, M (o caco de um espelho)","1 minuto","Você protege uma criatura no alcance da magia. Até que a magia termine, qualquer criatura que tenha como alvo a criatura protegida com uma jogada de ataque ou uma magia que cause dano deve ser bem-sucedida em uma salvaguarda de Sabedoria, ou deve escolher um novo alvo ou perder o ataque ou a magia. Esta magia não protege contra áreas de efeito. A magia se encerra se a criatura protegida realizar uma jogada de ataque, conjurar uma magia ou causar dano."],["Santuário Particular de Mordenkainen",4,"Abjuração",["mago"],"10 minutos","36 metros","V, S, M (uma folha fina de chumbo)","24 horas","Você torna uma área no alcance da magia magicamente segura. A área é um Cubo que pode ter de 1,5 metro a 30 metros de lado. A magia permanece pela duração. Ao conjurar a magia, você determina o tipo de proteção que a magia oferece, escolhendo qualquer uma das seguintes propriedades:\n\n• O som não pode atravessar a barreira na borda da área protegida.\n\n• A barreira da área protegida aparece escura e enevoada, impedindo a visão (incluindo Visão no Escuro) através dela.\n\n• Sensores criados por magias de Adivinhação não podem aparecer dentro da área protegida nem atravessar a barreira em seu perímetro.\n\n• Criaturas na área não podem ser alvo de magias de Adivinhação.\n\n• Nada pode se teleportar para dentro ou fora da área protegida.\n\n• Viagens planares são bloqueadas dentro da área protegida.\n\nConjurar essa magia no mesmo local todos os dias por 365 dias faz com que a magia dure até ser dissipada.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode aumentar o tamanho do Cubo em 30 metros para cada círculo de espaço de magia acima de 4."],["Saraivada de Espinhos",1,"Invocação",["guardiao"],"Ação Bônus, que você realiza imediatamente após atingir uma criatura com um ataque com arma à Distância","Pessoal","V","Instantânea","Ao atingir uma criatura, essa magia faz surgir uma chuva de espinhos a partir da sua arma à distância ou munição. O alvo e cada criatura em um raio de 1,5 metro devem realizar uma salvaguarda de Destreza, sofrendo 1d10 pontos de dano perfurante se falharem ou metade desse dano em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d10 para cada círculo de espaço de magia acima de 1."],["Semiplano",8,"Invocação",["bruxo","feiticeiro","mago"],"Ação","18 metros","S","1 hora","Você cria uma porta Média de sombras em uma superfície sólida e plana à sua vista e no alcance da magia. Essa porta pode ser aberta e fechada, levando a uma sala vazia de 9 metros em cada dimensão, feita de madeira ou pedra à sua escolha, em semiplano.\n\nQuando a magia termina, a porta desaparece e os objetos dentro do semiplano permanecem nele. Qualquer criatura dentro dele também permanece nele, a menos que escolha passar pela porta enquanto ela desaparece, saindo com a condição Caído e nos espaços desocupados mais próximos do espaço que a porta ocupava anteriormente.\n\nAo conjurar esta magia, você pode criar um novo semiplano ou conectar a porta de sombras a um semiplano que você criou em uma conjuração anterior desta magia. Além disso, se souber a natureza e o conteúdo de um semiplano criado por outra criatura com esta magia, você pode conectar a porta de sombras a esse semiplano."],["Sentido Feral",2,"Adivinhação",["druida","guardiao"],"Ação ou Ritual","Toque","S","Concentração, até 1 hora","Você toca uma Fera voluntária. Pela duração da magia, você pode perceber através dos sentidos da Fera, bem como dos seus próprios. Ao perceber através dos sentidos da Fera, você se beneficia de quaisquer sentidos especiais que ela tenha."],["Servo Invisível",1,"Invocação",["bardo","bruxo","mago"],"Ação ou Ritual","18 metros","V, S, M (um pedaço de barbante e de madeira)","1 hora","Esta magia cria uma força Invisível, sem mente, disforme e Média que executa tarefas simples ao seu comando até que a magia termine. O servo nasce em um espaço desocupado no chão no alcance da magia. Ele tem CA 10, 1 Ponto de Vida e Força 2, e não pode atacar. Se ele é reduzido a 0 Pontos de Vida, a magia encerra. Uma vez em cada um de seus turnos como uma Ação Bônus, você pode comandar mentalmente o servo a se mover até 4,5 metros e interagir com um objeto. O servo pode realizar tarefas simples que um humano poderia fazer, como buscar coisas, limpar, consertar, dobrar roupas, acender fogueiras, servir comida e bebidas. Depois de dar o comando, o servo executa a tarefa da melhor forma possível até que conclua a tarefa e, em seguida, aguarda seu próximo comando.\n\nAo ordenar ao servo que realize uma tarefa que o mova a mais de 18 metros de distância de você, a magia se encerra."],["Sexto Sentido",9,"Adivinhação",["bardo","bruxo","druida","mago"],"1 minuto","Toque","V, S, M (uma pena de beija-flor)","8 horas","Você toca uma criatura voluntária e concede a ela a capacidade de ver o futuro imediato. Pela duração da magia, o alvo tem Vantagem em Testes de D20, enquanto outras criaturas têm Desvantagem em jogadas de ataque contra ele. A magia se encerra se você a conjurar novamente."],["Silêncio",2,"Ilusão",["bardo","clerigo","guardiao"],"Ação ou Ritual","36 metros","V, S","Concentração, até 10 minutos","Pela duração da magia, nenhum som pode ser criado dentro ou passar através de uma esfera com raio de 6 metros centrada em um ponto à sua escolha no alcance da magia. Qualquer criatura ou objeto totalmente dentro da esfera é imune a dano Trovejante, e as criaturas têm a condição Surdo enquanto estiverem totalmente dentro dela. É impossível conjurar uma magia que incluia um componente Verbal neste local."],["Similaridade",5,"Ilusão",["bardo","feiticeiro","mago"],"Ação","9 metros","V, S","8 horas","Você dá uma aparência ilusória a cada criatura à sua escolha à sua vista e no alcance da magia. Um alvo involuntário pode realizar uma salvaguarda de Carisma e, se for bem-sucedido, não é afetado por esta magia. Você pode dar a mesma aparência ou aparências diferentes aos alvos. A magia pode alterar a aparência dos corpos e equipamentos dos alvos, fazendo com que cada criatura pareça até 30 centímetros mais alta ou mais baixa e mais pesada ou mais leve. A nova aparência deve manter os aspectos básicos de membros do corpo do alvo, mas o restante da ilusão fica a seu critério. Os efeitos permanecem pela duração da magia. As mudanças causadas por esta magia falham mediante uma inspeção física. Por exemplo, se você usar a magia para adicionar um chapéu ao traje de uma criatura, objetos passam através do chapéu.\n\nUma criatura que executa a ação Analisar para examinar um alvo pode realizar um teste de Inteligência (Investigação) contra a CD para evitar sua magia. Em caso de sucesso, a criatura percebe que o alvo está disfarçado."],["Simulacro",7,"Ilusão",["mago"],"12 horas","Toque","V, S, M (rubi em pó no valor de 1.500 ou mais PO, que a magia consome)","Até ser dissipada","Você cria uma duplicata ilusória de uma Fera ou Humanoide que esteja a até 3 metros de você durante toda a conjuração da magia. Você encerra a conjuração tocando tanto a criatura quanto uma pilha de gelo ou neve do mesmo tamanho da criatura, e a pilha se transforma na duplicata, que é uma criatura. A duplicata utiliza as estatísticas da criatura original no momento da conjuração, exceto que ela é um Constructo, seus Pontos de Vida máximos são reduzidos pela metade e ela não pode conjurar esta magia.\n\nA duplicata é Amigável a você e às criaturas que você escolher. Ele obedece aos seus comandos e age no seu turno durante o combate e não pode adquirir níveis, nem realizar Descansos Curtos ou Longos.\n\nSe a duplicata sofrer dano, a única forma de restaurar seus Pontos de Vida é repará-la durante um Descanso Longo, no qual você deve gastar componentes no valor de 100 PO por Ponto de Vida restaurado e deve permanecer a até 1,5 metro de você para ser reparada.\n\nA duplicata dura até ser reduzida a 0 Pontos de Vida, momento em que ela retorna a ser neve e derrete. Se você conjurar esta magia novamente, qualquer duplicata criada anteriormente por esta magia é destruída instantaneamente."],["Simular Morte",3,"Necromancia",["bardo","clerigo","druida","mago"],"Ação ou Ritual","Toque","V, S, M (uma pitada de terra de cemitério)","1 hora","Você toca uma criatura voluntária e a coloca em um estado cataléptico que é indistinguível da morte.\n\nPela duração da magia, o alvo parece morto em uma inspeção externa e para magias usadas para determinar a situação do alvo. O alvo está com as condições Cego e Incapacitado, e o Deslocamento dele é 0.\n\nO alvo também tem Resistência a todos os tipos de dano, exceto dano Psíquico, e tem Imunidade à condição Envenenado."],["Sinal de Esperança",3,"Abjuração",["clerigo"],"Ação","9 metros","V, S","Concentração, até 1 minuto","Escolha qualquer número de criaturas no alcance da magia. Pela duração da magia, cada alvo tem Vantagem em salvaguardas de Sabedoria e Salvaguarda contra Morte e recupera o número de Pontos de Vida máximos possíveis de qualquer cura."],["Sonho",5,"Ilusão",["bardo","bruxo","mago"],"1 minuto","Especial","V, S, M (um punhado de areia)","8 horas","Você tem como alvo uma criatura que você conhece no mesmo plano de existência. Você ou uma criatura voluntária que você toca entra em um estado de transe para agir como um mensageiro dos sonhos. Enquanto estiver em transe, o mensageiro está Incapacitado e tem Deslocamento 0.\n\nSe o alvo estiver dormindo, o mensageiro aparece nos sonhos do alvo e pode conversar com ele enquanto ele permanecer dormindo, pela duração da magia. O mensageiro também pode moldar o ambiente do sonho, criando paisagens, objetos e outras imagens. O mensageiro pode emergir do transe a qualquer momento, encerrando a magia. O alvo se lembra do sonho perfeitamente ao acordar.\n\nSe o alvo estiver acordado quando você conjurar a magia, o mensageiro sabe disso e pode encerrar o transe (e a magia) ou esperar que o alvo durma, momento em que o mensageiro entra nos sonhos do alvo.\n\nVocê pode tornar o mensageiro aterrorizante para o alvo. Se você fizer isso, o mensageiro pode entregar uma mensagem de no máximo dez palavras e, em seguida, o alvo realiza uma salvaguarda de Sabedoria. Se falhar, o alvo não recebe nenhum benefício do descanso e sofre 3d6 pontos de dano Psíquico quando acordar."],["Sono",1,"Encantamento",["bardo","feiticeiro","mago"],"Ação","18 metros","V, S, M (uma pitada de areia ou pétalas de rosa)","Concentração, até 1 minuto","Cada criatura à sua escolha em uma Esfera de 1,5 metro de raio centrada em um ponto no alcance da magia deve ser bem-sucedida em uma salvaguarda de Sabedoria ou tem a condição Incapacitado até o final do próximo turno dela, quando deve repetir a salvaguarda. Se o alvo falhar na segunda salvaguarda, ele tem a condição Inconsciente pela duração da magia. A magia encerra em um alvo se ele sofrer dano ou se alguém a até 1,5 metro dele executar uma ação para sacudi-lo, liberando-o do efeito da magia.\n\nCriaturas que não dormem, como elfos, ou que têm Imunidade à condição Exaustão, são automaticamente bem-sucedidas nas salvaguardas contra esta magia."],["Sopro de Dragão",2,"Transmutação",["feiticeiro","mago"],"Ação Bônus","Toque","V, S, M (uma pimenta)","Concentração, até 1 minuto","Você toca uma criatura voluntária e escolhe Ácido, Elétrico, Gélido, Ígneo ou Venenoso. Até que a magia termine, o alvo pode executar uma ação Usar Magia para exalar um Cone de 4,5 metros. Cada criatura nessa área realiza uma salvaguarda de Destreza, sofrendo 3d6 pontos de dano do tipo escolhido se falhar, ou metade desse dano em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 para cada círculo de espaço de magia acima de 2."],["Sugestão",2,"Encantamento",["bardo","bruxo","feiticeiro","mago"],"Ação","9 metros","V, M (uma gota de mel)","Concentração, até 8 horas","Você sugere um curso de ação — descrito em no máximo 25 palavras — para uma criatura à sua vista e no alcance da magia e que possa ouvi-lo e entendê-lo. A sugestão deve parecer razoável e não envolver nada que obviamente cause dano ao alvo ou aos aliados dele. Por exemplo, você poderia dizer: “Pegue a chave do cofre do tesouro do culto e a traga para mim” ou “Pare de lutar, saia desta biblioteca em paz e não volte”. O alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Enfeitiçado pela duração da magia ou até que você ou seus aliados causem dano a ele. O alvo Enfeitiçado executa a sugestão da melhor forma possível. A atividade sugerida pode durar enquanto a magia estiver ativa, mas se puder ser concluída mais rapidamente, a magia se encerra ao finalizá-la."],["Sugestão em Massa",6,"Encantamento",["bardo","feiticeiro","mago"],"Ação","18 metros","V, M (a língua de uma cobra)","24 horas","Você sugere um curso de ação — descrito em não mais de 25 palavras — para até doze criaturas à sua vista e no alcance da magia que possam ouvi-lo e entendê-lo. A sugestão deve parecer acessível e não envolver nada que obviamente cause dano a qualquer um dos alvos ou seus aliados. Por exemplo, você poderia dizer: “Caminhe até a aldeia por essa estrada e auxilie os aldeões a realizar a colheita até o pôr do sol” ou dizer: “Agora não é hora para violência. Larguem as armas e dancem! Parem em uma hora”.\n\nCada alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Enfeitiçado pela duração da magia ou até que você ou seus aliados causem dano ao alvo. Cada alvo Enfeitiçado cumpre a sugestão com o melhor de sua capacidade. A atividade sugerida pode continuar por toda a duração da magia, mas se a atividade sugerida puder ser concluída em um tempo mais curto, a magia encerra para um alvo que a complete.\n\nUsando um Espaço de Magia de Círculo Superior. A duração é maior com um espaço de magia 7º círculo (10 dias), 8º círculo (30 dias) ou 9º círculo (366 dias)."],["Suplício",8,"Encantamento",["bardo","bruxo","druida","mago"],"Ação","45 metros","V, S, M (um chaveiro sem chaves)","Instantânea","Você sobrecarrega a mente de uma criatura à sua vista e no alcance da magia. O alvo realiza uma salvaguarda de Inteligência.\n\nSe falhar, o alvo sofre 10d12 pontos de dano Psíquico e não pode conjurar magias ou executar a ação Usar Magia. Ao final de cada 30 dias, o alvo repete a salvaguarda, encerrando o efeito em caso de sucesso. O efeito também pode ser encerrado pela magia Cura Completa , Desejo ou Restauração Maior .\n\nEm uma salvaguarda bem-sucedida, o alvo recebe apenas metade do dano."],["Sussurros Dissonantes",1,"Encantamento",["bardo"],"Ação","18 metros","V","Instantânea","Uma criatura à sua escolha à sua vista no alcance da magia escuta uma melodia dissonante na mente. O alvo deve realizar uma salvaguarda de Sabedoria. Se falhar, sofre 3d6 pontos de dano Psíquico e deve usar imediatamente a Reação, se disponível, para se mover o mais longe possível de você, usando a rota mais segura. Em caso de sucesso, o alvo sofre apenas metade do dano.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 pontos para cada círculo de espaço de magia acima de 1."],["Símbolo",7,"Abjuração",["bardo","clerigo","druida","mago"],"1 minuto","Toque","V, S, M (um diamante em pó no valor de 1.000 ou mais PO, que a magia consome)","Até ser dissipada ou acionada","Você inscreve um glifo prejudicial em uma superfície (como uma seção do chão ou parede) ou dentro de um objeto que pode ser fechado (como um livro ou baú). O glifo pode cobrir uma área não superior a 3 metros de diâmetro. Se você escolher um objeto, ele deve permanecer no lugar; se for movido a mais de 3 metros de onde você conjurou esta magia, o glifo é quebrado e a magia se encerra sem ser acionada.\n\nO glifo é quase imperceptível e requer um teste bem-sucedido de Sabedoria (Percepção) contra a CD para evitar sua magia para ser notado.\n\nQuando inscreve o glifo, você define seu gatilho e escolhe qual efeito o símbolo possui: Atordoamento, Discórdia, Dor, Medo, Morte ou Sono. Cada um é explicado abaixo.\n\nDefina o Gatilho. Você decide o que aciona o glifo quando conjura a magia. Para glifos inscritos em uma superfície, os gatilhos comuns incluem tocar ou ficar em pé sobre o glifo, remover outro objeto que o cubra, aproximar-se a uma certa distância ou manipular o objeto que o contém. Para glifos inscritos em um objeto, os gatilhos comuns incluem abrir esse objeto ou ver o glifo. Você pode ajustar o gatilho para que apenas criaturas de certos tipos o ativem (por exemplo, o glifo pode ser definido para afetar Aberrações). Você também pode definir condições para criaturas que não acionam o glifo, como aquelas que dizem uma determinada senha.\n\nUma vez acionado, o glifo brilha, preenchendo uma Esfera de 18 metros de raio com Meia-Luz por 10 minutos, após os quais a magia termina. Cada criatura na Esfera quando o glifo é ativado é alvo de seu efeito, assim como uma criatura que entra na Esfera pela primeira vez em um turno ou termina o turno nela. Uma criatura é atingida apenas uma vez por turno.\n\nAtordoamento. Cada alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Atordoado por 1 minuto.\n\nDiscórdia. Cada alvo realiza uma salvaguarda de Sabedoria. Se falhar, um alvo discute com outras criaturas por 1 minuto. Durante esse tempo, é incapaz de se comunicar efetivamente e tem Desvantagem em jogadas de ataque e testes de atributo.\n\nDor. Cada alvo deve ser bem-sucedido em uma salvaguarda de Constituição ou tem a condição Incapacitado por 1 minuto.\n\nMedo. Cada alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Amedrontado por 1 minuto. Enquanto Amedrontado, o alvo deve se mover pelo menos 9 metros para longe do glifo em cada um dos turnos dele, se possível.\n\nMorte. Cada alvo realiza uma salvaguarda de Constituição, sofrendo 10d10 pontos de dano Necrótico se falhar, ou metade desse dano em caso de sucesso.\n\nSono. Cada alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Inconsciente por 10 minutos. Uma criatura desperta se sofrer dano ou se alguém executar uma ação para sacudi-la."],["Talho Mental",0,"Encantamento",["bruxo","feiticeiro","mago"],"Ação","18 metros","V","1 rodada","Você tenta fragmentar temporariamente a mente de uma criatura à sua vista e no alcance da magia. O alvo deve ser bem-sucedido em uma salvaguarda de Inteligência ou sofre 1d6 pontos de dano Psíquico e subtrai 1d4 da próxima salvaguarda que realizar antes do final do seu próximo turno.\n\nAprimoramento de Truque. O dano aumenta em 1d6 quando você atinge os níveis 5 (2d6), 11 (3d6) e 17 (4d6)."],["Taumaturgia",0,"Transmutação",["clerigo"],"Ação","9 metros","V","Até 1 minuto","Você conjura uma pequena maravilha mágica no alcance da magia, criando um dos efeitos abaixo. Se usar esta magia várias vezes, pode ter até três efeitos de 1 minuto ativos simultaneamente.\n\nManipular Fogo. Você faz com que as chamas pisquem, iluminem, escureçam ou mudem de cor por 1 minuto.\n\nMão Invisível. Você faz instantaneamente com que uma porta ou janela destrancada se abra ou se feche.\n\nOlhos Alterados. Você altera a aparência dos seus olhos por 1 minuto.\n\nSom Fantasmagórico. Você cria um som instantâneo que se origina em um ponto à sua escolha no alcance da magia, como um estrondo de trovão, o grito de um corvo ou sussurros sinistros.\n\nVoz Retumbante. Sua voz aumenta até três vezes mais do que o normal por 1 minuto. Pela duração da magia, você tem Vantagem em testes de Carisma (Intimidação).\n\nTremores. Você causa tremores inofensivos no chão por 1 minuto."],["Teia",2,"Invocação",["feiticeiro","mago"],"Ação","18 metros","V, S, M (um pouco de teia de aranha)","Concentração, até 1 hora","Você conjura uma massa de teias pegajosas em um ponto no alcance da magia. As teias enchem um Cubo de 6 metros de lado pela duração da magia, são Terreno Difícil e a área dentro delas é Parcialmente Obscurecida.\n\nSe as teias não estiverem sustentadas entre duas massas sólidas (como paredes ou árvores) ou em camadas no chão, parede ou teto, a teia colapsa sobre si mesma e a magia se encerra no início do seu próximo turno. As teias em camadas sobre uma superfície plana têm uma profundidade de 1,5 metro.\n\nA primeira vez que uma criatura entra nas teias em um turno ou começa o turno nelas, deve ser bem-sucedida em uma salvaguarda de Destreza ou tem a condição Contido enquanto está nas teias ou até se libertar. Uma criatura Contida pelas teias pode executar uma ação para realizar um teste de Força (Atletismo) contra a CD para evitar sua magia. Em caso de sucesso, a criatura não está mais Contida.\n\nAs teias são inflamáveis. Qualquer Cubo de 1,5 metro de lado com teias expostas ao fogo queima em 1 rodada, causando 2d4 pontos de dano Ígneo a qualquer criatura que inicie seu turno no fogo."],["Telecinese",5,"Transmutação",["feiticeiro","mago"],"Ação","18 metros","V, S","Concentração, até 10 minutos","Você adquire a capacidade de mover ou manipular criaturas ou objetos através do pensamento. Ao conjurar a magia e como uma ação Usar Magia em seus turnos posteriores antes que a magia termine, você pode exercer sua vontade sobre uma criatura ou objeto à sua vista e no alcance da magia, causando o efeito apropriado abaixo. Você pode afetar o mesmo alvo rodada após rodada ou escolher um novo a qualquer momento. Se você trocar de alvo, o alvo anterior não é mais afetado pela magia.\n\nCriatura. Você pode tentar mover uma criatura Enorme ou menor. O alvo deve ser bem-sucedido em uma salvaguarda de Força, ou você move o alvo até 9 metros em qualquer direção no alcance da magia. Até o final do seu próximo turno, a criatura tem a condição Contido e, se você a levantar no ar, ela fica suspensa, entra em queda no final do seu próximo turno, a menos que você use essa opção novamente e ela falhe na salvaguarda.\n\nObjeto. Você pode tentar mover um objeto Enorme ou menor. Se o objeto não estiver sendo usado ou carregado, você o move automaticamente até 9 metros em qualquer direção no alcance da magia.\n\nSe o objeto estiver sendo usado ou carregado por uma criatura, essa criatura deve ser bem-sucedida em uma salvaguarda de Força, ou você empurra o objeto para longe e o move até 9 metros em qualquer direção no alcance da magia.\n\nVocê pode exercer um controle preciso sobre objetos com sua pegada telecinética, como manipular uma ferramenta simples, abrir uma porta ou um recipiente, guardar ou retirar um item de um recipiente aberto, ou despejar o conteúdo de um frasco."],["Telepatia",8,"Adivinhação",["mago"],"Ação","Ilimitado","V, S, M (um par de anéis de prata interligados)","24 horas","Você cria um elo telepático entre você e uma criatura voluntária com a qual está familiarizado. A criatura pode estar em qualquer lugar no mesmo plano de existência que você. A magia encerra se você ou o alvo não estiverem mais no mesmo plano.\n\nAté que a magia termine, você e o alvo podem compartilhar instantaneamente palavras, imagens, sons e outras mensagens sensoriais entre si através do elo, e o alvo o reconhece como a criatura com a qual está se comunicando. A magia permite que uma criatura compreenda o significado de suas palavras e quaisquer mensagens sensoriais que você enviar a ela."],["Teleporte",7,"Invocação",["bardo","feiticeiro","mago"],"Ação","3 metros","V","Instantânea","Esta magia transporta instantaneamente você e até oito criaturas voluntárias ou um único objeto à sua vista e no alcance da magia, para um destino à sua escolha. Se você escolher um objeto, ele deve ser Grande ou menor e não pode estar sendo segurado ou carregado por uma criatura involuntária.\n\nO destino que você escolheu deve ser de seu conhecimento e deve estar no mesmo plano de existência que você. Sua familiaridade com o destino determina se você chega lá com sucesso. O Mestre joga 1d100 e consulta a tabela Resultado do Teleporte e as explicações posteriores.\n\nResultado do Teleporte\n\nÁrea Fora No\n\nFamiliaridade Azar Similar do Alvo Alvo Círculo permanente — — — 01–100 Objeto associado — — — 01–100 Muito familiar 01–05 06–13 14–24 25–100 Visto casualmente 01–33 34–43 44–53 54–100 Visto uma vez ou 01–43 44–53 54–73 74–100 descrito Destino falso 01–50 51–100 — —\n\nFamiliaridade. Aqui estão os significados dos termos na coluna Familiaridade da tabela:\n\n• “Círculo permanente” significa um círculo de teleporte permanente cuja sequência de símbolos você conhece. • “Objeto associado” significa que você possui um objeto retirado do destino desejado nos últimos seis meses, como um livro da biblioteca de um mago. • “Muito familiar” é um lugar que você visitou com frequência, um lugar que você estudou cuidadosamente ou um lugar à sua vista ao conjurar a magia. • “Visto casualmente” é um lugar que você já viu mais de uma vez, mas com o qual não está muito familiarizado.\n\n• “Visto uma vez ou descrito” é um lugar que você já viu uma vez, possivelmente usando magia, ou um lugar que você conhece através da descrição de outra pessoa, talvez através de um mapa.\n\n• “Destino falso” é um lugar que não existe. Talvez você tenha tentado visualizar o santuário de um inimigo, mas em vez disso viu uma ilusão, ou está tentando se teleportar para um local que não existe mais.\n\nAzar. A natureza imprevisível da magia resulta em uma jornada difícil. Cada criatura se teleportando (ou o objeto alvo) sofre 3d10 pontos de dano Energético, e o Mestre joga novamente a tabela para ver onde você parou (mais de um azar pode acontecer, causando dano a cada vez).\n\nÁrea Similar. Você e seu grupo (ou o objeto de destino) aparecem em uma área diferente que é visual ou tematicamente semelhante à área de destino. Você aparece no lugar semelhante mais próximo. Se você estiver indo para seu laboratório, por exemplo, pode aparecer no laboratório de outra pessoa na mesma cidade.\n\nFora do Alvo. Você e seu grupo (ou o objeto alvo) aparecem a 2d12 x 1,5 quilômetros da distância do destino em uma direção aleatória. Jogue 1d8 para a direção: 1, leste; 2, sudeste; 3, sul; 4, sudoeste; 5, oeste; 6, noroeste; 7, norte; ou 8, nordeste.\n\nNo Alvo. Você e seu grupo (ou o objeto alvo) aparecem onde você pretendia."],["Tempestade Glacial",4,"Evocação",["druida","feiticeiro","mago"],"Ação","90 metros","V, S, M (uma luva)","Instantânea","Granizo cai em um Cilindro de 6 metros de raio e 12 metros de altura, centrado em um ponto no alcance da magia. Cada criatura no Cilindro realiza uma salvaguarda de Destreza. Se falhar, uma criatura sofre 2d10 pontos de dano Contundente e 4d6 pontos de dano Gélido, ou metade desse dano em caso de sucesso. Pedras de granizo transformam o solo no Cilindro em Terreno Difícil até o final do seu próximo turno.\n\nUsando um Espaço de Magia de Círculo Superior. O dano Contundente aumenta em 1d10 para cada círculo de espaço de magia acima de 4."],["Tempestade Radiante de Jallarzi",5,"Evocação",["bruxo","mago"],"Ação","36 metros","V, S, M (uma pitada de fósforo)","Concentração, até 1 minuto","Você desencadeia uma tempestade de luz intermitente e trovões furiosos em um Cilindro de 3 metros de raio e 12 metros de altura centrado em um ponto à sua vista e no alcance da magia. Enquanto estiverem nesta área, criaturas têm as condições Cego e Surdo, e não podem conjurar magias com um componente Verbal.\n\nQuando a tempestade aparece, cada criatura dentro dela realiza uma salvaguarda de Constituição, sofrendo 2d10 pontos de dano Radiante e 2d10 pontos de dano Trovejante se falhar, ou metade desse dano em caso de sucesso. Uma criatura também realiza essa salvaguarda quando entra na área da magia pela primeira vez em um turno ou termina o turno dela nela. Uma criatura realiza essa salvaguarda apenas uma vez por turno.\n\nUsando um Espaço de Magia de Círculo Superior. O dano Radiante e Trovejante aumentam em 1d10 para cada círculo de espaço de magia acima de 5."],["Tempestade da Vingança",9,"Invocação",["druida"],"Ação","1,5 km","V, S","Concentração, até 1 minuto","Uma nuvem de tempestade agitada se forma, centrada pela duração em um ponto no alcance da magia, se espalhando para um raio de 90 metros. Cada criatura sob a nuvem quando ela aparecer deve ser bem-sucedida em uma salvaguarda de Constituição ou sofre 2d6 pontos de dano Trovejante e tem a condição Surdo pela duração da magia.\n\nNo início de cada um dos seus turnos posteriores, a tempestade produz efeitos diferentes, conforme detalhado abaixo:\n\nTurno 2: Chuva ácida cai. Cada criatura e objeto sob a nuvem sofre 4d6 pontos de dano Ácido.\n\nTurno 3: Você convoca seis relâmpagos da nuvem para atingir seis criaturas ou objetos diferentes abaixo dela. Cada alvo realiza uma salvaguarda de Destreza, sofrendo 10d6 pontos de dano Elétrico se falhar ou metade desse dano em caso de sucesso.\n\nTurno 4: Chuva de pedras de granizo. Cada criatura sob a nuvem sofre 2d6 pontos de dano Contundente.\n\nTurnos 5-10: Rajadas de vento e chuva gelada surgem sob a nuvem. Cada criatura na área sofre 1d6 pontos de dano Gélido. Até que a magia termine, a área é Terreno Difícil e está Totalmente Obscurecida, ataques à distância com armas são impossíveis nela e ventos fortes sopram por toda a área."],["Tempestade de Fogo",7,"Evocação",["clerigo","druida","feiticeiro"],"Ação","45 metros","V, S","Instantânea","Uma tempestade de fogo aparece no alcance da magia. A área da tempestade consiste em até dez cubos de 3 metros, que você organiza como preferir. Cada Cubo deve ser contíguo a pelo menos um outro Cubo. Cada criatura na área realiza uma salvaguarda de Destreza, sofrendo 7d10 pontos de dano Ígneo se falhar, ou metade desse dano em caso de sucesso.\n\nObjetos inflamáveis na área que não estão sendo usados ou carregados entram em combustão."],["Tentáculos Negros de Evard",4,"Invocação",["mago"],"Ação","27 metros","V, S, M (um tentáculo)","Concentração, até 1 minuto","Tentáculos pretos contorcendo-se enchem um quadrado de 6 metros de lados no chão à sua vista e no alcance da magia. Pela duração da magia, esses tentáculos transformam o terreno nessa área em Terreno Difícil. Cada criatura nessa área realiza uma salvaguarda de Força. Se falhar, ela sofre 3d6 pontos de dano Contundente e tem a condição Contido até que a magia termine. Uma criatura também realiza essa salvaguarda se entrar na área ou terminar o turno nela. Uma criatura realiza essa salvaguarda apenas uma vez por turno. Uma criatura Contida pode executar uma ação para realizar um teste de Força (Atletismo) contra a CD para evitar sua magia, encerrando a condição em si mesma em caso de sucesso."],["Terremoto",8,"Transmutação",["clerigo","druida","feiticeiro"],"Ação","150 metros","V, S, M (uma rocha rachada)","Concentração, até 1 minuto","Escolha um ponto no chão à sua vista e no alcance da magia. Pela duração da magia, um tremor intenso rasga o chão em um círculo de 30 metros de raio centrado neste ponto. O terreno é Terreno Difícil.\n\nAo conjurar esta magia e no final de cada um dos seus turnos pela duração da magia, cada criatura no chão na área realiza uma salvaguarda de Destreza. Se falhar, uma criatura tem a condição Caído e a Concentração dela é quebrada.\n\nVocê também pode causar os efeitos abaixo.\n\nEstruturas. O tremor causa 50 pontos de dano Contundente em qualquer estrutura em contato com o chão na área quando você conjura a magia e no final de cada um dos seus turnos até que a magia termine. Se uma estrutura é reduzida a 0 Pontos de Vida, ela desaba. Uma criatura a uma distância de uma estrutura desabando igual à metade da altura da estrutura realiza uma salvaguarda de Destreza. Se falhar, a criatura sofre 12d6 pontos de dano Contundente, tem a condição Caído e é soterrada pelos escombros, exigindo um teste de Força (Atletismo) CD 20 como uma ação para escapar. Em caso de sucesso, a criatura recebe apenas metade do dano.\n\nFissuras. Um total de 1d6 fissuras se abrem na área da magia ao final do turno que você a conjura. Você escolhe os locais das fissuras, que não podem estar sob estruturas. Cada fissura tem 1d10 × 3 metros de profundidade e 3 metros de largura, e se estende de uma borda da área da magia para outra borda. Uma criatura no mesmo espaço que uma fissura deve ser bem-sucedida em uma salvaguarda de Destreza ou cai na fissura. Uma criatura bem-sucedida se move com a borda da fissura à medida que ela se abre."],["Terreno Alucinatório",4,"Ilusão",["bardo","bruxo","druida","mago"],"10 minutos","90 metros","V, S, M (um cogumelo)","24 horas","Você cria um terreno natural em um cubo de 45 metros de comprimento que possui a aparência, o som e o cheiro de outro tipo de terreno natural. Assim, campos abertos ou uma estrada podem ser moldados para se assemelhar a um pântano, colina, fenda ou algum outro terreno difícil ou intransitável. Uma lagoa pode ser formada para parecer um prado verdejante, um precipício como uma encosta suave ou um barranco pedregoso como uma estrada larga e plana. Criaturas, estruturas e equipamentos manufaturados dentro da área não são alterados.\n\nAs características táteis do terreno permanecem inalteradas, portanto, é provável que as criaturas que entram na área percebam a ilusão. Se a diferença não for evidente ao toque, uma criatura que examina a ilusão pode executar a ação Analisar para realizar um teste de Inteligência (Investigação) contra a CD para evitar sua magia, a fim de não acreditar nela. Se uma criatura perceber que o terreno é ilusório, ela vê uma imagem vaga sobreposta ao terreno real."],["Toque Chocante",0,"Evocação",["feiticeiro","mago"],"Ação","Toque","V, S","Instantânea","Raios saltam de você em direção a uma criatura que você tenta tocar. Realize uma jogada de ataque mágico corpo a corpo contra o alvo. Em caso de acerto, o alvo sofre 1d8 pontos de dano Elétrico e não pode realizar Ataques de Oportunidade até o início do próximo turno dele.\n\nAprimoramento de Truque. O dano aumenta em 1d8 quando você atinge os níveis 5 (2d8), 11 (3d8) e 17 (4d8)."],["Toque Necrótico",0,"Necromancia",["bruxo","feiticeiro","mago"],"Ação","Toque","V, S","Instantânea","Canalizando o frio da sepultura, realize um ataque mágico corpo a corpo contra um alvo no alcance da magia. Em caso de acerto, o alvo sofre 1d10 pontos de dano Necrótico e não pode recuperar Pontos de Vida até o final do seu próximo turno.\n\nAprimoramento de Truque. O dano aumenta em 1d10 quando você atinge os níveis 5 (2d10), 11 (3d10) e 17 (4d10)."],["Toque Vampírico",3,"Necromancia",["bruxo","feiticeiro","mago"],"Ação","Pessoal","V, S","Concentração, até 1 minuto","O toque da sua mão envolta em sombras pode sugar a força vital dos outros para curar suas feridas. Realize um ataque mágico corpo a corpo contra uma criatura no alcance da magia. Em caso de acerto, o alvo sofre 3d6 pontos de dano Necrótico e você recupera Pontos de Vida iguais à metade da quantidade do dano Necrótico causado.\n\nAté que a magia termine, você pode realizar o ataque novamente em cada um dos seus turnos como uma ação Usar Magia, atingindo a mesma criatura ou uma diferente.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 para cada círculo de espaço de magia acima de 3."],["Tranca Arcana",2,"Abjuração",["mago"],"Ação","Toque","V, S, M (pó de ouro no valor de 25 ou mais PO, que a magia consome)","Até ser dissipada","Você toca uma porta, janela, portão, contêiner ou escotilha fechada e a tranca magicamente pela duração da magia. Esta fechadura não pode ser destrancada por nenhum meio não mágico. Você e quaisquer criaturas que você designar ao conjurar a magia podem abrir e fechar o objeto apesar da tranca. Você também pode definir uma senha que, quando proferida a até 1,5 metro do objeto, o destranca por 1 minuto."],["Transição Planar",7,"Invocação",["bruxo","clerigo","druida","feiticeiro","mago"],"Ação","Toque","V, S, M (uma haste de metal bifurcada no valor de 250 ou mais PO e sintonizada a um plano de existência)","Instantânea","Você e até oito criaturas voluntárias que dão as mãos em um círculo são transportadas para um plano de existência diferente. Você pode especificar um destino-alvo em termos gerais, como a Cidade de Latão no Plano Elemental do Fogo ou o palácio de Dispater no segundo nível dos Nove Infernos, e você aparece dentro ou perto desse destino, conforme determinado pelo Mestre.\n\nComo alternativa, se você souber a sequência de símbolos de um círculo de teleporte em outro plano de existência, esta magia pode levá-lo a esse círculo. Se o círculo de teleporte for pequeno demais para caber todas as criaturas que você transportou, elas aparecem nos espaços desocupados mais próximos ao círculo."],["Transporte via Plantas",6,"Invocação",["druida"],"Ação","3 metros","V, S","1 minuto","Esta magia cria um elo mágico entre uma planta inanimada Grande ou maior no alcance da magia e outra planta, a qualquer distância, no mesmo plano de existência. Você deve ter visto ou tocado na planta-alvo pelo menos uma vez antes. Pela duração da magia, qualquer criatura pode entrar na planta-alvo e sair da planta-destino usando 1,5 metro de movimento."],["Trovão",0,"Evocação",["bardo","bruxo","druida","feiticeiro","mago"],"Ação","Pessoal","S","Instantânea","Cada criatura em uma Emanação de 1,5 metro originada em você deve ser bem-sucedida em uma salvaguarda de Constituição ou sofre 1d6 pontos de dano Trovejante. O som estrondoso da magia pode ser ouvido a até 30 metros de distância.\n\nAprimoramento de Truque. O dano aumenta em 1d6 quando você atinge os níveis 5 (2d6), 11 (3d6) e 17 (4d6)."],["Tsunami",8,"Invocação",["druida"],"1 minuto","1,5 km","V, S","Concentração, até 6 rodadas","Uma muralha de água surge em um ponto à sua escolha no alcance da magia. Você pode fazer a muralha com até 90 metros de comprimento, 90 metros de altura e 15 metros de espessura. A muralha permanece pela duração da magia.\n\nQuando a muralha aparece, cada criatura na área realiza uma salvaguarda de Força, sofrendo 6d10 pontos de dano Contundente se falhar, ou metade desse dano em caso de sucesso.\n\nNo início de cada um dos seus turnos após o aparecimento da muralha, ela se move 15 metros para longe de você, juntamente com quaisquer criaturas que estejam dentro dela. Qualquer criatura de tamanho Enorme ou menor dentro da muralha, ou cujo espaço a muralha adentre ao se mover, deve ser bem-sucedida em uma salvaguarda de Força ou sofre 5d10 pontos de dano Contundente. Uma criatura pode sofrer esse dano apenas uma vez por rodada. No final de cada turno, a altura da muralha é reduzida em 15 metros, e o dano que a muralha causa nas rodadas subsequentes é reduzido em 1d10. Quando a muralha atinge 0 metros de altura, a magia termina.\n\nUma criatura apanhada pela muralha pode se mover nadando. No entanto, devido à força da onda, a criatura deve ser bem-sucedida em um teste de Força (Atletismo) contra a CD para evitar sua magia para se mover. Se falhar no teste, ela não pode se mover. Uma criatura que sair da muralha cai no chão."],["Turvar",2,"Ilusão",["feiticeiro","mago"],"Ação","Pessoal","V","Concentração, até 1 minuto","Seu corpo fica desfocado. Pela duração da magia, qualquer criatura tem Desvantagem em jogadas de ataque contra você. Um atacante é imune a esse efeito se perceber você com Visão às Cegas ou Visão Verdadeira."],["Ver o Invisível",2,"Adivinhação",["bardo","feiticeiro","mago"],"Ação","Pessoal","V, S, M (uma pitada de talco)","1 hora","Pela duração da magia, você vê criaturas e objetos que têm a condição Invisível como se estivessem visíveis e pode ver o Plano Etéreo. Criaturas e objetos nele tem aparência fantasmagórica."],["Vidência",5,"Adivinhação",["bardo","bruxo","clerigo","druida","mago"],"10 minutos","Pessoal","V, S, M (um foco no valor de 1.000 ou mais PO, como uma bola de cristal, espelho ou fonte cheia de água)","Concentração, até 10 minutos","Você pode ver e ouvir uma criatura que você escolheu e que está no mesmo plano de existência que você. O alvo realiza uma salvaguarda de Sabedoria, que é modificada (veja as tabelas abaixo) por quão bem você conhece o alvo e o tipo de conexão física que você tem com ele. O alvo não sabe contra o que está realizando a salvaguarda, apenas que se sente desconfortável.\n\nSeu Conhecimento do Alvo É... Modificador De segunda mão (ouviu falar do alvo) +5 De primeira mão (conhece o alvo) +0 Amplo (conhece bem o alvo) –5\n\nVocê Possui Algo do Alvo… Modificador Retrato ou outra imagem –2 Roupa ou outra posse –4 Parte do corpo, mecha de cabelo ou –10 pedaço de unha Em caso de sucesso, o alvo não é afetado e você não pode usar esta magia nele novamente por 24 horas. Se falhar, a magia cria um sensor Invisível e intangível a até 3 metros do alvo. Você pode ver e ouvir através do sensor como se estivesse lá. O sensor se move com o alvo, permanecendo a 3 metros dele pela duração da magia. Se algo puder ver o sensor, ele aparece como uma esfera luminosa do tamanho do seu punho.\n\nEm vez de uma criatura, você pode escolher um local que viu. Ao fazer isso, o sensor aparece nesse local e não se move."],["Vigor Arcano",2,"Abjuração",["feiticeiro","mago"],"Ação Bônus","Pessoal","V, S","Instantânea","Você usa sua energia vital para se curar. Jogue um ou dois de seus Dados de Pontos de Vida não gastos e recupera um número de Pontos de Vida igual ao total do teste mais seu modificador de atributo de conjuração. Esses dados são, então, gastos.\n\nUsando um Espaço de Magia de Círculo Superior. O número de Dados de Vida não gastos que você pode jogar aumenta em um para cada círculo de espaço de magia acima de 2."],["Vinha Agarradora",4,"Invocação",["druida","guardiao"],"Ação Bônus","18 metros","V, S","Concentração, até 1 minuto","Você conjura uma vinha que brota de uma superfície em um espaço desocupado à sua vista e no alcance da magia. A vinha permanece pela duração da magia. Realize um ataque mágico corpo a corpo contra uma criatura a até 9 metros da vinha. Em caso de acerto, o alvo sofre 4d8 pontos de dano Contundente e é puxado até 9 metros em direção à vinha; se o alvo for Enorme ou menor, ele tem a condição Imobilizado (CD para escapar é igual à sua CD para evitar sua magia). A vinha pode imobilizar apenas uma criatura de cada vez, e você pode fazer com que a vinha libere uma criatura Imobilizada (nenhuma ação é necessária).\n\nComo uma Ação Bônus em seus turnos posteriores, você pode repetir o ataque contra uma criatura a até 9 metros da vinha.\n\nUsando um Espaço de Magia de Círculo Superior. O número de criaturas que a vinha pode imobilizar aumenta em um para cada círculo de espaço de magia acima de 4."],["Visão da Verdade",6,"Adivinhação",["bardo","bruxo","clerigo","feiticeiro","mago"],"Ação","Toque","V, S, M (cogumelo em pó no valor de 25 ou mais PO, que a magia consome)","1 hora","Você toca uma criatura voluntária que recebe Visão Verdadeira com um alcance de 36 metros pela duração da magia."],["Visão no Escuro",2,"Transmutação",["druida","feiticeiro","guardiao","mago"],"Ação","Toque","V, S, M (uma cenoura seca)","8 horas","Pela duração da magia, uma criatura voluntária que você tocar tem Visão no Escuro com um alcance de 45 metros."],["Vitalidade Vazia",1,"Necromancia",["feiticeiro","mago"],"Ação","Pessoal","V, S, M (uma gota de álcool)","Instantânea","Você obtém 2d4 + 4 Pontos de Vida Temporários.\n\nUsando um Espaço de Magia de Círculo Superior. Você obtém 5 Pontos de Vida Temporários adicionais para cada círculo de espaço de magia acima de 1."],["Voo",3,"Transmutação",["bruxo","feiticeiro","mago"],"Ação","Toque","V, S, M (uma pena)","Concentração, até 10 minutos","Você toca uma criatura voluntária. Pela duração da magia, o alvo ganha um Deslocamento de Voo de 18 metros e pode pairar. Quando a magia termina, o alvo entra em queda se ainda estiver no alto, a menos que possa impedir a queda.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 3."],["Vínculo de Proteção",2,"Abjuração",["clerigo","paladino"],"Ação","Toque","V, S, M (um par de anéis de platina no valor de 50 ou mais PO cada, que você e o alvo devem usar pela duração da magia)","1 hora","Você toca outra criatura voluntária e cria uma conexão mística entre você e o alvo até que a magia termine. Enquanto o alvo estiver a até 18 metros de você, ele obtém um bônus de +1 na CA e nas salvaguardas e tem Resistência a todos os tipos de dano. Além disso, cada vez que ele sofrer dano, você sofre a mesma quantidade de dano.\n\nA magia se encerra se você for reduzido a 0 Pontos de Vida, se você e o alvo ficarem a mais de 18 metros de distância ou se for conjurada novamente em qualquer uma das criaturas conectadas."],["Zombaria Perversa",0,"Encantamento",["bardo"],"Ação","18 metros","V","Instantânea","Você libera uma série de insultos carregados com encantamentos sutis em uma criatura que pode ouvir você e que esteja à sua vista e no alcance da magia. O alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou sofre 1d6 pontos de dano Psíquico e tem Desvantagem na próxima jogada de ataque que realizar antes do final do próximo turno dele.\n\nAprimoramento de Truque. O dano aumenta em 1d6 quando você atinge os níveis 5 (2d6), 11 (3d6) e 17 (4d6)."],["Zona da Verdade",2,"Encantamento",["bardo","clerigo","paladino"],"Ação","18 metros","V, S","10 minutos","Você cria uma zona mágica que protege contra enganação em uma Esfera de 4,5 metros de raio centrada em um ponto no alcance da magia. Até que a magia termine, uma criatura que entra na área da magia pela primeira vez ou começa o turno dela nela realiza uma salvaguarda de Carisma. Se falhar, uma criatura não pode mentir deliberadamente enquanto estiver no raio de efeito. Você sabe se uma criatura é bem-sucedida ou falha nessa salvaguarda.\n\nUma criatura afetada está ciente da magia e pode evitar responder a perguntas às quais responderia normalmente com uma mentira. Tal criatura pode ser evasiva, mas deve ser verdadeira."],["Âncora Planar",5,"Abjuração",["bardo","bruxo","clerigo","druida","mago"],"1 hora","18 metros","V, S, M (uma joia no valor de 1.000 ou mais PO, que a magia consome)","24 horas","Você tenta vincular um Celestial, um Elemental, um Feérico ou um Ínfero ao seu serviço. A criatura deve estar no alcance da magia durante todo o período de conjuração. Normalmente, a criatura é primeiro invocada para o centro da versão invertida da magia Círculo Mágico para prendê-la enquanto esta magia é conjurada. Ao concluir a conjuração, o alvo deve ser bem-sucedido em uma salvaguarda de Carisma ou é obrigado a atendê-lo pela duração da magia. Se a criatura foi invocada ou criada por outra magia, a duração daquela magia é estendida para corresponder à duração desta magia. Uma criatura vinculada deve obedecer aos seus comandos da melhor forma possível. Você pode ordenar que a criatura o acompanhe em uma aventura, proteja um local ou entregue uma mensagem. Se a criatura for Hostil, ela se esforça para distorcer seus comandos para atingir seus próprios objetivos. Se a criatura realizar completamente seus comandos antes que a magia termine, ela viaja até você para relatar esse fato se você estiver no mesmo plano de existência. Se você estiver em um plano diferente, ele retorna ao lugar onde você a vinculou e permanece lá até que a magia termine.\n\nUsando um Espaço de Magia de Círculo Superior. A duração aumenta com um espaço de magia 6º círculo (10 dias), 7º círculo (30 dias), 8º círculo (180 dias) e 9º círculo (366 dias)."]];

const FEATS=[{"n":"Alerta","cat":"Origem","pre":"","d":"Você adquire os seguintes benefícios.\n\nProficiência em Iniciativa. Quando você joga Iniciativa, pode adicionar seu Bônus de Proficiência à jogada.\n\nTroca de Iniciativa. Imediatamente após jogar Iniciativa, você pode trocar sua Iniciativa com a Iniciativa de um aliado voluntário no mesmo combate. Não é possível fazer a troca se você ou o aliado tem a condição Incapacitado."},{"n":"Artifista","cat":"Origem","pre":"","d":"Você adquire os seguintes benefícios.\n\nProficiência com Ferramentas. Você adquire proficiência com três Ferramentas de Artesão diferentes à sua escolha na tabela Fabricação Rápida.\n\nDesconto. Sempre que você compra um item não mágico, recebe um desconto de 20% nele.\n\nFabricação Rápida. Quando completa um Descanso Longo, você pode fabricar uma peça de equipamento da tabela Fabricação Rápida, se tiver as Ferramentas de Artesão associadas a esse item e tenha proficiência com essas ferramentas. O item permanece até que você complete outro Descanso Longo, momento em que o item se desfaz."},{"n":"Atacante Selvagem","cat":"Origem","pre":"","d":"Você treinou para causar ataques particularmente nocivos. Uma vez por turno, quando você atinge um alvo com uma arma, pode jogar os dados de dano da arma duas vezes e usar qualquer uma das jogadas contra o alvo."},{"n":"Curandeiro","cat":"Origem","pre":"","d":"Você adquire os seguintes benefícios.\n\nMédico de Combate. Caso tenha um Kit de Curandeiro, você pode gastar um uso e cuidar de uma criatura a até 1,5 metro de você como uma ação Usar Objeto. Essa criatura pode gastar um dos Dados de Pontos de Vida dela e você joga esse dado. A criatura recupera um número de Pontos de Vida igual à jogada mais o seu Bônus de Proficiência.\n\nCura Garantida. Sempre que jogar um dado para determinar o número de Pontos de Vida que você recupera com uma magia ou com o benefício do talento Médico de Combate, você pode jogar novamente o dado se o resultado for 1, e você deve usar a nova jogada."},{"n":"Habilidoso","cat":"Origem","pre":"","d":"Você adquire proficiência em qualquer combinação de três perícias ou ferramentas à sua escolha.\n\nRepetível. Você pode adquirir este talento mais de uma vez."},{"n":"Iniciado em Magia","cat":"Origem","pre":"","d":"Você adquire os seguintes benefícios.\n\nDois Truques. Você aprende dois truques à sua escolha na lista de magias de Clérigo, Druida ou Mago. Inteligência, Sabedoria ou Carisma é seu atributo de conjuração para as magias deste talento (escolha quando selecionar este talento).\n\nMagia de 1º Círculo. Escolha uma magia de 1º círculo da mesma lista que você selecionou para os truques deste talento. Você tem essa magia sempre preparada. Você pode conjurá-la uma vez sem um espaço de magia, e você restaura a capacidade de conjurá-la dessa maneira quando completa um Descanso Longo. Você também pode conjurar a magia usando qualquer espaço de magia que tiver.\n\nSubstituição de Magia. Sempre que você alcança um novo nível, pode substituir uma das magias que escolheu para este talento por uma magia diferente do mesmo círculo da lista de magias escolhida.\n\nRepetível. Você pode adquirir este talento mais de uma vez, mas deve escolher uma lista de magias diferente a cada vez."},{"n":"Músico","cat":"Origem","pre":"","d":"Você adquire os seguintes benefícios.\n\nTreinamento em Instrumentos. Você adquire proficiência com três Instrumentos Musicais à sua escolha.\n\nCanção Encorajadora. Ao completar um Descanso Curto ou Longo, você pode tocar uma música em um Instrumento Musical com o qual tem proficiência e conceder Inspiração Heroica a aliados que ouvem a música. O número de aliados que você pode afetar desse modo é igual ao seu Bônus de Proficiência."},{"n":"Sortudo","cat":"Origem","pre":"","d":"Você adquire os seguintes benefícios.\n\nPontos de Sorte. Você tem um número de Pontos de Sorte igual ao seu Bônus de Proficiência e pode gastar os pontos nos benefícios abaixo. Você restaura seus Pontos de Sorte gastos quando completa um Descanso Longo.\n\nVantagem. Quando você joga um d20 para um Teste de D20, pode gastar 1 Ponto de Sorte para ter Vantagem na jogada.\n\nDesvantagem. Quando uma criatura jogar um d20 para uma jogada de ataque contra você, você pode gastar 1 Ponto de Sorte para impor Desvantagem nessa jogada."},{"n":"Valentão de Taverna","cat":"Origem","pre":"","d":"Você adquire os seguintes benefícios.\n\nAtaque Desarmado Aprimorado. Quando você atinge com seu Ataque Desarmado e causar dano, pode causar dano Contundente igual a 1d4 pontos mais seu modificador de Força em vez do dano normal de um Ataque Desarmado.\n\nDano Garantido. Sempre que você joga um dado de dano para seu Ataque Desarmado, pode jogar novamente o dado se o resultado for 1, e deve usar a nova jogada.\n\nArmamento Improvisado. Você tem proficiência com armas improvisadas.\n\nEmpurrar. Quando você atinge uma criatura com um Ataque Desarmado como parte da ação Atacar no seu turno, pode causar dano ao alvo e também empurrá-lo 1,5 metro para longe de você. Você pode usar esse benefício apenas uma vez por turno."},{"n":"Vigoroso","cat":"Origem","pre":"","d":"Seus Pontos de Vida máximos aumentam em um valor igual ao dobro do seu nível de personagem quando você obtém este talento. Sempre que você alcança um nível de personagem depois disso, seus Pontos de Vida máximos aumentam em 2 Pontos de Vida adicionais."},{"n":"Adepto Elemental","cat":"Geral","pre":"Nível 4 ou superior, Caracterís- tica Conjuração ou Magia de Pacto","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Inteligência, Sabedoria ou Carisma em 1, até no máximo 20.\n\nDomínio Elemental. Escolha um dos seguintes tipos de dano: Ácido, Elétrico, Gélido, Ígneo ou Trovejante. Magias que você conjura ignoram a Resistência a dano do tipo escolhido. Além disso, ao jogar dano para uma magia que causa dano deste tipo, você pode tratar qualquer 1 em um dado de dano como um 2.\n\nRepetível. Você pode adquirir este talento mais de uma vez, mas deve escolher um tipo de dano diferente a cada vez para Domínio Elemental."},{"n":"Agressor","cat":"Geral","pre":"Nível 4 ou superior, Força ou Destreza 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nCorrida Aprimorada. Quando você executa a ação Correr, seu Deslocamento aumenta em 3 metros para esta ação.\n\nAtaque em Investida. Se você se mover pelo menos 3 metros em linha reta em direção a um alvo imediatamente antes de atingi-lo com uma jogada de ataque corpo a corpo como parte da ação Atacar, escolha um dos seguintes efeitos: obter um bônus de +1d8 na jogada de dano do ataque ou empurrar o alvo até 3 metros se ele não for um tamanho maior que você. Você pode usar esse benefício apenas uma vez em cada um dos seus turnos."},{"n":"Analítico","cat":"Geral","pre":"Nível 4 ou superior, Inteligên- cia ou Sabedoria 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Inteligência ou Sabedoria em 1, até no máximo 20.\n\nObservador Atento. Escolha uma das seguintes perícias: Intuição, Investigação ou Percepção. Se não tiver proficiência na perícia escolhida, você a adquire; se já for proficiente, adquire Especialização.\n\nPesquisa Rápida. Você pode executar a ação Procurar como uma Ação Bônus."},{"n":"Atirador Arcano","cat":"Geral","pre":"Nível 4 ou superior, Caracterís- tica Conjuração ou Magia de Pacto","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Inteligência, Sabedoria ou Carisma em 1, até no máximo 20.\n\nIgnorar Cobertura. Jogadas de ataque com magias ignoram Cobertura Parcial e Cobertura de Três Quartos.\n\nConjuração à Queima-Roupa. Estar a 1,5 metro de um inimigo não impõe Desvantagem em suas jogadas de ataque com magias.\n\nAlcance Aumentado. Ao conjurar uma magia que tem um alcance de pelo menos 3 metros e exija realizar uma jogada de ataque, você pode aumentar o alcance da magia em 18 metros."},{"n":"Atleta","cat":"Geral","pre":"Nível 4 ou superior, Força ou Destreza 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nDeslocamento de Escalada. Você adquire Deslocamento de Escalada igual ao seu Deslocamento.\n\nLevantar. Quando você tem a condição Caído, pode se reerguer com apenas 1,5 metro de movimento.\n\nSaltar. Você pode realizar um Salto em Distância ou Salto em Altura correndo após mover-se apenas 1,5 metro."},{"n":"Ator","cat":"Geral","pre":"Nível 4 ou superior, Carisma 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Carisma em 1, até no máximo 20.\n\nPersonificação. Enquanto está disfarçado como uma pessoa real ou fictícia, você tem Vantagem em testes de Carisma (Atuação ou Enganação) para convencer os outros de que você é essa pessoa.\n\nMimetismo. Você pode imitar os sons de outras criaturas, incluindo a fala. Uma criatura que ouve a imitação deve ser bem-sucedida em um teste de Sabedoria (Intuição) para determinar que o efeito é falso (CD 8 mais seu modificador de Carisma e seu Bônus de Proficiência)."},{"n":"Aumento no Valor de Atributo","cat":"Geral","pre":"Nível 4 ou superior","d":"Aumente um valor de atributo à sua escolha em 2, ou aumente dois valores de atributo à sua escolha em 1. Este talento não pode aumentar um valor de atributo acima de 20.\n\nRepetível. Você pode adquirir este talento mais de uma vez."},{"n":"Chef","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Constituição ou Sabedoria em 1, até no máximo 20.\n\nUtensílios de Cozinheiro. Você adquire proficiência com Utensílios de Cozinheiro se ainda não o tiver.\n\nRefeição Satisfatória. Como parte de um Descanso Curto, você pode cozinhar alimentos especiais se tiver ingredientes e Utensílios de Cozinheiro à mão. Você pode preparar comida suficiente para um número de criaturas igual a 4 mais seu Bônus de Proficiência. No final do Descanso Curto, qualquer criatura que comer a comida e gastar um ou mais Dados de Vida para recuperar Pontos de Vida recupera 1d8 Pontos de Vida adicionais.\n\nGuloseimas Revigorantes. Com 1 hora de trabalho ou quando completar um Descanso Longo, você pode cozinhar um número de guloseimas igual ao seu Bônus de Proficiência se tiver ingredientes e Utensílios de Cozinheiro à mão. Essas guloseimas especiais permanecem por 8 horas após serem feitas. Uma criatura pode executar uma Ação Bônus para comer uma dessas guloseimas e obter um número de Pontos de Vida Temporários igual ao seu Bônus de Proficiência."},{"n":"Combatente Montado","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força, Destreza ou Sabedoria em 1, até no máximo 20.\n\nGolpe Montado. Enquanto estiver montado, você tem Vantagem em jogadas de ataque contra qualquer criatura desmontada a até 1,5 metro de sua montaria que seja pelo menos um tamanho menor que a montaria.\n\nPulo Lateral. Se sua montaria for submetida a um efeito que lhe permita realizar uma salvaguarda de Destreza para sofrer apenas metade do dano, ela não sofre dano em caso de sucesso, e apenas metade do dano se falhar. Para que sua montaria obtenha esse benefício, você deve estar montando-a, e nenhum de vocês pode ter a condição Incapacitado.\n\nRedirecionar Ataque. Enquanto estiver montado, você pode forçar um ataque que atinge sua montaria a atingi-lo se você não tem a condição Incapacitado."},{"n":"Conjurador Bélico","cat":"Geral","pre":"Nível 4 ou superior, Caracterís- tica Conjuração ou Magia de Pacto","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Inteligência, Sabedoria ou Carisma em 1, até no máximo 20.\n\nConcentração. Você tem Vantagem em salvaguardas de Constituição que realiza para manter a Concentração.\n\nMagia Reativa. Quando uma criatura provocar um Ataque de Oportunidade a você ao sair do seu alcance, você pode executar uma Reação para conjurar uma magia contra a criatura, em vez de realizar o Ataque de Oportunidade. A magia deve ter um tempo de conjuração de uma ação e deve ter como alvo apenas aquela criatura.\n\nComponentes Somáticos. Você pode realizar os componentes somáticos de magias mesmo quando estiver com armas ou um Escudo em uma ou ambas as mãos."},{"n":"Conjurador Ritualista","cat":"Geral","pre":"Nível 4 ou superior, Inteligên- cia, Sabedoria ou Carisma 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Inteligência, Sabedoria ou Carisma em 1, até no máximo 20.\n\nMagias Rituais. Escolha um número de magias de 1º círculo igual ao seu Bônus de Proficiência que tem o marcador Ritual. Você tem essas magias sempre preparadas e pode conjurá-las com qualquer espaço de magia que tiver. O atributo de conjuração das magias é o atributo aumentado por este talento. Sempre que seu Bônus de Proficiência aumentar depois disso, você pode adicionar uma magia de 1º círculo com o marcador Ritual às magias sempre preparadas com esta característica.\n\nRitual Rápido. Com este benefício, você pode conjurar uma magia Ritual que tem preparada usando seu tempo de conjuração normal, em vez do tempo prolongado para um Ritual. Realizar isso não requer um espaço de magia. Após conjurar a magia desse modo, você não pode usar esse benefício novamente até completar um Descanso Longo."},{"n":"Duelista Defensivo","cat":"Geral","pre":"Nível 4 ou superior, Destreza 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Destreza em 1, até no máximo 20.\n\nAparar. Se estiver segurando uma arma de Acuidade e outra criatura acertar você com um ataque corpo a corpo, você pode executar uma Reação para adicionar seu Bônus de Proficiência à sua Classe de Armadura, potencialmente fazendo com que o ataque erre. Você obtém este bônus na sua CA contra ataques corpo a corpo até o início do seu próximo turno."},{"n":"Envenenador","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Destreza ou Inteligência em 1, até no máximo 20.\n\nVeneno Potente. Ao realizar uma jogada de dano que causa dano Venenoso, você ignora Resistência a dano Venenoso.\n\nPreparar Veneno. Você adquire proficiência com o Kit de Veneno. Com 1 hora de trabalho usando esse kit e gastando 50 PO em materiais, você pode fabricar um número de doses de veneno igual ao seu Bônus de Proficiência. Como uma Ação Bônus, você pode aplicar uma dose de veneno a uma arma ou peça de munição. Uma vez aplicado, o veneno retém sua potência por 1 minuto ou até você causar dano com o item envenenado, o que for mais curto. Ao sofrer dano do item envenenado, uma criatura deve ser bem-sucedida em uma salvaguarda de Constituição (CD 8 mais o modificador do atributo aumentado por este talento e seu Bônus de Proficiência) ou sofre 2d8 pontos de dano Venenoso e está com a condição Envenenado até o final do seu próximo turno."},{"n":"Esmagador","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Constituição em 1, até no máximo 20.\n\nEmpurrar. Uma vez por turno, quando você atinge uma criatura com um ataque que causa dano Contundente, você pode movê-la 1,5 metro para um espaço desocupado se o alvo não for um tamanho maior que você.\n\nCrítico Melhorado. Ao obter um Acerto Crítico que causa dano Contundente a uma criatura, jogadas de ataque contra essa criatura tem Vantagem até o início do seu próximo turno."},{"n":"Especialista Ambidestro","cat":"Geral","pre":"Nível 4 ou superior, Força ou Destreza 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nCombate com Duas Armas Aprimorado. Quando você executa a ação Atacar no seu turno com uma arma que tenha a propriedade Leve, pode realizar um ataque adicional como uma Ação Bônus no mesmo turno com uma arma diferente, que deve ser uma arma Corpo a Corpo que não possua a propriedade Duas Mãos. Você não pode adicionar o seu modificador de atributo ao dano do ataque adicional, a menos que o modificador seja negativo.\n\nSaque Rápido. Você pode desembainhar ou embainhar duas armas que não possuam a propriedade Duas Mãos quando normalmente poderia desembainhar ou embainhar apenas uma."},{"n":"Especialista em Armaduras Leves","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nTreinamento com Armadura. Você obtém treinamento com Armadura Leve e Escudos."},{"n":"Especialista em Armaduras Médias","cat":"Geral","pre":"Nível 4 ou superior, Treina- mento com Armadura Leve","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nTreinamento com Armadura. Você obtém treinamento com Armadura Média."},{"n":"Especialista em Armaduras Pesadas","cat":"Geral","pre":"Nível 4 ou superior, Treina- mento com Armadura Média","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Constituição ou Força em 1, até no máximo 20.\n\nTreinamento com Armadura. Você adquire treinamento com Armadura Pesada."},{"n":"Especialista em Besta","cat":"Geral","pre":"Nível 4 ou superior, Destreza 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Destreza em 1, até no máximo 20.\n\nIgnorar Recarga. Você ignora a propriedade Recarga da Besta de Mão, Besta Leve e Besta Pesada (todas chamadas de bestas em outras partes deste talento). Se estiver segurando uma dessas bestas, você pode carregar uma peça de munição nela mesmo sem ter uma mão livre.\n\nDisparo à Queima-Roupa. Estar a 1,5 metro de um inimigo não impõe Desvantagem em suas jogadas de ataque com bestas.\n\nCombate com Duas Armas. Ao realizar o ataque adicional da propriedade Leve, você pode adicionar seu modificador de atributo ao dano do ataque adicional se esse ataque for com uma besta que tenha a propriedade Leve e você ainda não estiver adicionando esse modificador ao dano."},{"n":"Especialista em Perícia","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente um valor de atributo à sua escolha em 1, até no máximo 20.\n\nProficiência em Perícia. Você adquire proficiência em uma perícia à sua escolha.\n\nEspecialização. Escolha uma perícia na qual você tenha proficiência, mas não seja Especialização. Você obtém Especialização nessa perícia."},{"n":"Exterminador de Conjuradores","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nQuebrador de Concentração. Quando você causa dano a uma criatura que está se concentrando em uma magia, ela tem Desvantagem na salvaguarda que realiza para manter a Concentração.\n\nResguardo Mental. Se falhar em uma salvaguarda de Inteligência, Sabedoria ou Carisma, em vez disso você escolhe ser bem-sucedido. Após usar esse benefício, você não pode usá-lo novamente até completar um Descanso Curto ou Longo."},{"n":"Imobilizador","cat":"Geral","pre":"Nível 4 ou superior, Força ou Destreza 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nSocar e Imobilizar. Quando você atinge uma criatura com um Ataque Desarmado como parte da ação Atacar no seu turno, pode usar as opções Dano e Imobilizar apenas uma vez por turno.\n\nVantagem no Ataque. Você tem Vantagem em jogadas de ataque contra uma criatura Imobilizada por você.\n\nImobilizador Veloz. Você não precisa gastar movimento adicional para se mover enquanto estiver imobilizando uma criatura Imobilizada, desde que ela seja do seu tamanho ou menor."},{"n":"Líder Inspirador","cat":"Geral","pre":"Nível 4 ou superior, Sabedoria ou Carisma 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Sabedoria ou Carisma em 1, até no máximo 20.\n\nAtuação Encorajadora. Ao completar um Descanso Curto ou Longo, você pode fazer uma atuação encorajadora: um discurso, música ou dança. Ao realizar isso, escolha até seis aliados (você pode se incluir) a até 9 metros de você que presenciaram a atuação. Criaturas escolhidas recebem Pontos de Vida Temporários iguais ao seu nível de personagem mais o modificador do atributo que você aumentou com este talento."},{"n":"Mente Aguçada","cat":"Geral","pre":"Nível 4 ou superior, Inteligên- cia 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Inteligência em 1, até no máximo 20.\n\nConhecimento Vasto. Escolha uma das seguintes perícias: Arcanismo, História, Investigação, Natureza ou Religião. Se não tiver proficiência na perícia escolhida, você a adquire; se já for proficiente, adquire Especialização.\n\nAnálise Rápida. Você pode executar a ação Analisar como uma Ação Bônus."},{"n":"Mestre das Armas","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nPropriedade de Maestria. Seu treinamento com armas permite que você use a propriedade de maestria de um tipo de arma Simples ou Marcial à sua escolha, desde que você tenha proficiência com ela
