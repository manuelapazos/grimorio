tação",["clerigo","druida","guardiao"],"Ação ou Ritual","Toque","V, S","8 horas","Você adentra em um objeto ou superfície rochosa grande o suficiente para caber completamente seu corpo, fundindo a si e seu equipamento com a pedra pela duração. Você deve tocar a pedra para fazer isso. Nada da sua presença permanece visível ou detectável por sentidos não mágicos.\n\nEnquanto estiver fundido com a rocha, você não pode ver o que ocorre fora dela, e quaisquer testes de Sabedoria (Percepção) que você realize para ouvir sons fora dela são realizados com Desvantagem. Você permanece ciente da passagem do tempo e pode conjurar magias em si mesmo enquanto está fundido à pedra. Você pode usar 1,5 metro de movimento para sair da rocha onde entrou, o que encerra a magia. Caso contrário, você não pode se mover.\n\nDanos físicos menores à rocha não o afetam, mas a destruição parcial ou mudança na forma dela (a ponto de você não caber mais nela) o expulsa e causa 6d6 pontos de dano Energético a você. A destruição completa da rocha (ou a transmutação dela em outra substância) o expulsa e causa 50 pontos de dano Energético.\n\nSe expulso, você é movido para o espaço desocupado mais próximo de onde entrou e tem a condição Caído."],["Metamorfose",9,"Transmutação",["druida","mago"],"Ação","Pessoal","V, S, M (uma argola de jade no valor de 1.500 ou mais PO)","Concentração, até 1 hora","Você se multimorfa em outra criatura pela duração da magia ou até executar uma ação Usar Magia para se multimorfa em uma criatura diferente. A nova forma deve ser de uma criatura com um Nível de Desafio igual ou inferior ao seu nível ou ao seu Nível de Desafio. Você deve ter visto esse tipo de criatura antes, e ela não pode ser um Constructo ou um Morto-vivo. Ao conjurar esta magia, você recebe um número de Pontos de Vida Temporários igual aos Pontos de Vida da primeira forma na qual você se transforma. Esses Pontos de Vida Temporários desaparecem, caso ainda restem, quando a magia terminar.\n\nAs suas estatísticas de jogo são substituídas pelo bloco de estatísticas da nova forma, mas você mantém seu tipo de criatura, alinhamento, personalidade, valores de Inteligência, Sabedoria e Carisma, Pontos de Vida, Dados de Vida, proficiências e capacidade de comunicação. Se você possuir a característica Conjuração, também a mantém.\n\nAo se multimorfar, você decide se seu equipamento cai no chão ou se altera em tamanho e forma para se ajustar à nova forma enquanto você a mantém."],["Miragem Arcana",7,"Ilusão",["bardo","druida","mago"],"10 minutos","À sua vista","V, S","10 dias","Você faz com que o terreno em uma área de até 2,5 quilômetros quadrados pareça, soe, cheire e até mesmo seja sentido como algum outro tipo de terreno. Campos abertos ou uma estrada podem ser transformados em um pântano, colina, fenda ou qualquer outro tipo de terreno irregular ou intransitável. Um lago pode ser formado para parecer um prado gramado, um precipício como uma suave encosta ou uma ravina cheia de pedras como uma estrada larga e lisa.\n\nDa mesma forma, você pode alterar a aparência de estruturas ou adicioná-las onde não há nenhuma presente. A magia não disfarça, oculta ou adiciona criaturas.\n\nA ilusão inclui elementos audíveis, visuais, táteis e olfativos, podendo transformar terreno desimpedido em Terreno Difícil (ou vice-versa) ou, de outra forma, dificultar o movimento pela área. Qualquer parte do terreno ilusório (como uma pedra ou um galho) que for removida da área da magia desaparece imediatamente. Criaturas com Visão Verdadeira podem ver através da ilusão e discernir a verdadeira forma do terreno; no entanto, todos os outros elementos da ilusão permanecem, de modo que, embora a criatura esteja ciente da ilusão, ainda pode interagir fisicamente com ela."],["Missão",5,"Encantamento",["bardo","clerigo","druida","mago","paladino"],"1 minuto","18 metros","V","30 dias","Você dá um comando verbal a uma criatura à sua vista no alcance da magia, ordenando que ela realize algum serviço ou não realize uma ação ou um curso de atividade conforme você decidir. O alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Enfeitiçado pela duração da magia. O alvo é bem-sucedido automaticamente se não conseguir entender seu comando.\n\nEnquanto Enfeitiçada, a criatura sofre 5d10 pontos de dano Psíquico se agir de maneira diretamente contrária ao seu comando. Ela não sofre esse dano mais do que uma vez por dia.\n\nVocê pode dar qualquer comando à sua escolha, exceto uma atividade que resultaria em morte certa. Se você der um comando suicida, a magia se encerra. Uma magia Desejo , Remover Maldição ou Restauração Maior encerra esta magia.\n\nUsando um Espaço de Magia de Círculo Superior. Se você usar um espaço de magia de 7º ou 8º círculo, a duração é de 365 dias. Se você usar um espaço de magia de 9º círculo, a magia dura até que seja encerrada por uma das magias mencionadas acima."],["Modificar Memória",5,"Encantamento",["bardo","mago"],"Ação","9 metros","V, S","Concentração, até 1 minuto","Você tenta remodelar as memórias de outra criatura. Uma criatura à sua vista e no alcance da magia realiza uma salvaguarda de Sabedoria. Se você estiver lutando contra a criatura, ela tem Vantagem na salvaguarda. Se falhar na salvaguarda, o alvo tem a condição Enfeitiçado pela duração da magia. Enquanto estiver Enfeitiçado desse modo, o alvo também tem a condição Incapacitado e fica sem perceber o que acontece ao seu redor, embora possa ouvir você. Se sofrer qualquer dano ou for alvo de outra magia, a magia se encerra, e nenhuma memória é modificada.\n\nEnquanto essa magia durar, você pode manipular a memória do alvo sobre um evento que ele tenha vivenciado nas últimas 24 horas e que tenha durado no máximo 10 minutos. Você pode eliminar permanentemente toda a memória do evento, permitir que o alvo recorde o evento com total clareza, alterar os detalhes da memória do evento ou criar uma memória de outro evento. Você deve falar com o alvo para descrever como as memórias dele serão afetadas, e ele deve conseguir entender seu idioma para as memórias modificadas criarem raízes. A mente do alvo preenche qualquer lacuna dos detalhes da sua descrição. Se a magia encerrar antes que você termine de descrever as memórias modificadas, a memória da criatura não é alterada. Caso contrário, as memórias modificadas se consolidam quando a magia termina.\n\nUma memória modificada não afeta necessariamente o comportamento de uma criatura, especialmente se a memória contradiz as inclinações naturais, o alinhamento ou as crenças da criatura. Uma memória modificada ilógica, como uma falsa memória de quanto a criatura gostava de nadar em ácido, é descartada como um pesadelo. O Mestre pode considerar uma memória modificada absurda demais para afetar uma criatura. Uma magia Remover Maldição ou Restauração Maior conjurada sobre o alvo restaura a memória verdadeira da criatura.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode alterar as memórias do alvo em relação a um evento que ocorreu há até 7 dias (espaço de magia de 6º círculo), 30 dias (espaço de magia de 7º círculo), 365 dias (espaço de magia de 8º círculo) ou em qualquer momento do passado da criatura (espaço de magia de 9º círculo)."],["Moldar Rochas",4,"Transmutação",["clerigo","druida","mago"],"Ação","Toque","V, S, M (argila mole)","Instantânea","Você toca um objeto de pedra de tamanho Médio ou menor, ou uma seção de pedra com no máximo 1,5 metro em qualquer dimensão e o molda na forma que desejar. Por exemplo, você pode moldar uma rocha grande em uma arma, estátua ou baú, ou criar uma pequena passagem por uma parede com até 1,5 metro de espessura. Também é possível moldar uma porta de pedra ou seu batente para selar a porta. O objeto criado pode ter até duas dobradiças e uma fechadura, mas detalhes mecânicos mais finos não são possíveis."],["Moléstia",6,"Necromancia",["clerigo"],"Ação","18 metros","V, S","Instantânea","Você libera magia virulenta em uma criatura à sua vista e no alcance da magia. O alvo deve realizar uma salvaguarda de Constituição. Se falhar, sofre 14d6 de dano Necrótico e seus Pontos de Vida máximos são reduzidos em um valor igual ao dano sofrido. Em caso de sucesso, sofre apenas metade do dano. Esta magia não pode reduzir os Pontos de Vida máximos de um alvo abaixo de 1."],["Montaria Fantasmagórica",3,"Ilusão",["mago"],"1 minuto ou Ritual","9 metros","V, S","1 hora","Uma criatura Grande, quase real e semelhante a um cavalo aparece no chão em um espaço desocupado à sua escolha no alcance da magia. Você decide a aparência da criatura e ela é equipada com uma sela, rédea e freio. Qualquer equipamento criado pela magia desaparece em uma nuvem de fumaça se for carregado a mais de 3 metros de distância da montaria.\n\nPela duração da magia, você ou uma criatura à sua escolha pode usar a montaria. A montaria usa o bloco de estatísticas do Cavalo de Montaria (veja também o apêndice B), exceto que ele tem um Deslocamento de 30 metros e pode viajar 20 quilômetros em uma hora. Quando a magia termina, a montaria desaparece gradualmente, dando ao cavaleiro 1 minuto para desmontar. A magia se encerra se a montaria sofrer algum dano."],["Mover Terra",6,"Transmutação",["druida","feiticeiro","mago"],"Ação","36 metros","V, S, M (uma pá em miniatura)","Concentração, até 2 horas","Escolha uma área de terreno no alcance da magia, com até 12 metros de lados. Você pode remodelar terra, areia ou argila na área da maneira que desejar pela duração. Você pode aumentar ou diminuir a elevação da área, criar ou preencher uma trincheira, erguer ou aplanar uma parede, ou formar um pilar. A extensão dessas mudanças não pode exceder metade da maior dimensão da área. Por exemplo, se você afetar um quadrado de 12 metros, pode criar um pilar de até 6 metros de altura, aumentar ou diminuir a elevação do quadrado em até 6 metros, cavar uma trincheira de até 6 metros de profundidade, e assim por diante. Essas mudanças demoram 10 minutos para serem concluídas. Como a transformação do terreno ocorre lentamente, criaturas na área geralmente não ficam presas ou feridas pelo movimento do solo.\n\nAo final de cada 10 minutos que gastar se concentrando na magia, você pode escolher uma nova área de terreno para afetar.\n\nEssa magia não pode manipular pedra natural ou construção de pedra. Rochas e estruturas se ajustam para acomodar o novo terreno. Se a forma que você moldar o terreno tornar uma estrutura instável, ela pode desmoronar.\n\nDa mesma forma, essa magia não afeta diretamente o crescimento de plantas. A terra movida carrega qualquer planta junto com ela."],["Movimentação Livre",4,"Abjuração",["bardo","clerigo","druida","guardiao"],"Ação","Toque","V, S, M (uma alça de couro)","1 hora","Você toca uma criatura voluntária. Pela duração da magia, o movimento do alvo não é afetado por Terreno Difícil, e magias e outros efeitos mágicos não podem reduzir o Deslocamento do alvo nem fazer com que ele tenha as condições Contido ou Paralisado. O alvo também tem um Deslocamento de Natação igual ao Deslocamento de caminhada.\n\nAlém disso, o alvo pode gastar 1,5 metro de movimento para escapar automaticamente de restrições não mágicas, como grilhões ou uma criatura impondo a condição Imobilizado.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 4."],["Muralha Prismática",9,"Abjuração",["bardo","mago"],"Ação","18 metros","V, S","10 minutos","Uma superfície cintilante e multicolorida forma uma parede vertical opaca de até 27 metros de comprimento, 9 metros de altura e 2,5 centímetros de espessura centrada em um ponto no alcance da magia. Como alternativa, você molda a parede em um globo de até 9 metros de diâmetro centrado em um ponto no alcance da magia. A parede permanece pela duração. Se você posicionar a parede em um espaço ocupado por uma criatura, a magia encerra instantaneamente sem efeito. A parede emite Luz Plena por 30 metros e Meia-luz por mais 30 metros. Você e as criaturas que você escolher ao conjurar a magia podem passar e ficar perto da muralha sem sofrer dano. Se outra criatura que possa ver a parede se mover a até 6 metros dela ou começar o turno nela, a criatura deve ser bem-sucedida em uma salvaguarda de Constituição ou tem a condição Cego por 1 minuto.\n\nA parede possui sete camadas, cada uma de uma cor diferente. Uma criatura que atravessa ou entra na parede passa uma camada por vez e deve realizar uma salvaguarda de Destreza ou é afetada pelas propriedades da camada, conforme descrito na tabela Camadas Prismáticas.\n\nA parede tem CA 10 e pode ser destruída uma camada por vez, em ordem do vermelho ao violeta, por meios específicos para cada camada. Se uma camada for destruída, ela desaparece pela duração da magia. Campo Antimagia não tem efeito na parede, e Dissipar Magia pode afetar apenas a camada violeta.\n\nCamadas Prismáticas\n\nOrdem Efeitos 1 Vermelho. Se falhar: 12d6 pontos de dano Ígneo. Em caso de sucesso: metade do dano. Efeitos Adicionais: Ataques à distância não mágicos não podem atravessar esta camada, que é destruída se sofrer ao menos 25 pontos de dano Gélido.\n\n2 Laranja. Se falhar: 12d6 pontos de dano Ácido. Em caso de sucesso: metade do dano. Efeitos Adicionais: Ataques mágicos à distância não podem passar por esta camada, que é destruída por um vento forte (como o criado por Lufada de Vento ).\n\n3 Amarelo. Se falhar: 12d6 pontos de dano Elétrico. Em caso de sucesso: metade do dano. Efeitos Adicionais: A camada é destruída se sofrer ao menos 60 pontos de dano Energético.\n\n4 Verde. Se falhar: 12d6 pontos de dano Venenoso. Em caso de sucesso: metade do dano. Efeitos Adicionais: Uma magia Criar Passagem ou outra magia de círculo igual ou superior, que possa abrir um portal em uma superfície sólida, destrói esta camada.\n\n5 Azul. Se falhar: 12d6 pontos de dano Gélido. Em caso de sucesso: metade do dano. Efeitos Adicionais: A camada é destruída se sofrer ao menos 25 pontos de dano Ígneo.\n\n6 Anil. Se falhar: O alvo tem a condição Contido e realiza uma salvaguarda de Constituição no final de cada um dos turnos dele. Se bem-sucedido três vezes, a condição encerra. Se falhar três vezes, ele tem a condição Petrificado até ser liberado por um efeito como a magia Restauração Maior . Os sucessos e fracassos não precisam ser consecutivos; acompanhe ambos até que o alvo alcance três de um tipo. Efeitos Adicionais: Magias não podem ser conjuradas através desta camada, que é destruída pela Luz Plena conjurada pela magia Luz do Dia .\n\nOrdem Efeitos 7 Violeta. Se falhar: O alvo tem a condição Cego e realiza uma salvaguarda de Sabedoria no início do seu próximo turno. Em caso de sucesso a condição encerra. Se falhar, a condição encerra e a criatura se teleporta para outro plano de existência (à escolha do Mestre). Efeitos Adicionais: Esta camada é destruída por Dissipar Magia ."],["Muralha de Energia",5,"Evocação",["mago"],"Ação","36 metros","V, S, M (um caco de vidro)","Concentração, até 10 minutos","Uma muralha de energia invisível surge em um ponto à sua escolha no alcance da magia. A muralha aparece em qualquer direção que você escolher, como uma barreira horizontal, vertical ou inclinação. Pode flutuar livremente ou repousar sobre uma superfície sólida. Você pode moldá-la em um domo hemisférico ou em um globo com um raio de até 3 metros, ou em uma superfície plana composta por dez painéis de 3 metros de lados. Cada painel deve ser contíguo a outro painel. De qualquer forma, a parede tem 6 milímetros de espessura e permanece pela duração da magia. Ao surgir, se a muralha passar por um espaço ocupado por uma criatura, a criatura é empurrada para um dos lados da muralha (à sua escolha).\n\nNada pode passar fisicamente pela muralha. Ela é imune a todo tipo de dano e não pode ser anulada por Dissipar Magia . Entretanto, a magia Desintegrar a destrói instantaneamente. A muralha também se estende para o Plano Etéreo, e bloqueia viagens etéreas através dela."],["Muralha de Espinhos",6,"Invocação",["druida"],"Uma ação","36 metros","V, S, M (um punhado de espinhos)","Concentração, até 10 minutos","Você cria uma muralha com um emaranhado de espinhos que parecem agulhas. A muralha aparece em uma superfície sólida, à sua vista e no alcance da magia e permanece pela duração. É possível escolher entre uma muralha de até 18 metros de comprimento, 3 metros de altura e 1,5 metro de espessura ou um círculo que tenha até 6 metros de diâmetro, 6 metros de altura e 1,5 metro de espessura. A muralha bloqueia a linha de visão.\n\nQuando a muralha aparece, cada criatura na área dela realiza uma salvaguarda de Destreza, sofrendo 7d8 pontos de dano Perfurante se falhar, ou metade desse dano em caso de sucesso.\n\nUma criatura pode se mover através da parede, embora lenta e dolorosamente. Para cada 1,5 metro que uma criatura atravessa a parede, ela deve gastar 6 metros de movimento. Além disso, a primeira vez que uma criatura entra em um espaço na muralha ou termina o turno dela lá, a criatura realiza uma salvaguarda de Destreza, sofrendo 7d8 pontos de dano Cortante se falhar ou metade desse dano em caso de sucesso. Uma criatura realiza essa salvaguarda apenas uma vez por turno.\n\nUsando um Espaço de Magia de Círculo Superior. Ambos os tipos de dano aumentam em 1d8 para cada círculo de espaço de magia acima de 6."],["Muralha de Fogo",4,"Evocação",["druida","feiticeiro","mago"],"Ação","36 metros","V, S, M (um pedaço de carvão)","Concentração, até 1 minuto","Você cria uma muralha de fogo em uma superfície sólida no alcance da magia. Você pode construir uma parede de até 18 metros de comprimento, 6 metros de altura e 30 centímetros de espessura, ou uma parede circular de até 6 metros de diâmetro, 6 metros de altura e 30 metros de espessura. A parede é opaca e permanece pela duração da magia Quando a muralha aparece, cada criatura na área dela realiza uma salvaguarda de Destreza, sofrendo 5d8 pontos de dano Ígneo se falhar, ou metade desse dano em caso de sucesso.\n\nUm lado da muralha, escolhido por você quando conjura esta magia, causa 5d8 pontos de dano Ígneo a cada criatura que termina o turno nela até de 3 metros desse lado ou dentro da muralha. Uma criatura sofre o mesmo dano quando entra na muralha pela primeira vez em termina o turno dela lá. O outro lado da parede não causa dano.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 pontos para cada círculo de espaço de magia acima de 4."],["Muralha de Gelo",6,"Evocação",["mago"],"Ação","36 metros","V, S, M (um pedaço de quartzo)","Concentração, até 10 minutos","Você cria uma muralha de gelo em uma superfície sólida no alcance da magia. Você pode moldá-la em uma cúpula hemisférica, em um globo com um raio de até 3 metros ou em uma superfície plana composta por dez painéis de 3 metros de lados. Cada painel deve ser contíguo a outro painel. De qualquer forma, a parede tem 30 centímetros de espessura e permanece pela duração da magia.\n\nAo surgir, se a muralha ocupar um espaço de uma criatura, a criatura é empurrada para um dos lados e deve realizar uma salvaguarda de Destreza. Se falhar, sofre 10d6 pontos de dano Gélido ou metade desse dano em caso de sucesso.\n\nA muralha é um objeto que pode ser danificado e, portanto, rompido. Tem CA 12 e 30 Pontos de Vida por painel, e tem Imunidade dano Gélido, Psíquico e Venenoso e Vulnerabilidade a dano Ígneo. Reduzir uma seção de 3 metros da muralha a 0 Pontos de Vida a destrói e deixa para trás uma camada de ar gélido no espaço que a muralha ocupava.\n\nUma criatura que se move através da camada de ar gélido pela primeira vez em um turno realiza uma salvaguarda de Constituição, sofrendo 5d6 pontos de dano Gélido se falhar, ou metade desse dano em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O dano que a muralha causa quando aparece aumenta em 2d6 e o dano ao passar pela camada de ar gélido aumenta em 1d6 para cada círculo de espaço de magia acima de 6."],["Muralha de Pedra",5,"Evocação",["druida","feiticeiro","mago"],"Ação","36 metros","V, S, M (um cubo de granito)","Concentração, até 10 minutos","Uma muralha não-mágica, constituída de pedra maciça, surge em um ponto à sua vista e no alcance da magia. Ela tem 15 centímetros de espessura e é composta de 10 painéis de 3 metros de lados. Cada painel deve ser contíguo ao outro. Se preferir, você pode criar painéis de 3 por 6 metros que têm apenas 7,5 centímetros de espessura.\n\nAo surgir, se a muralha passar por um espaço ocupado por uma criatura, esta última é empurrada para um dos lados da muralha (à sua escolha). Se uma criatura estiver cercada por todos os lados pela muralha (ou pela muralha e outra superfície sólida), essa criatura realiza uma salvaguarda de Destreza. Em caso de sucesso, ela pode usar a Reação dela para mover-se até o máximo do Deslocamento, de modo que não esteja mais cercada pela muralha.\n\nA muralha pode ter qualquer forma que você desejar, apesar de não poder ocupar o mesmo espaço que uma criatura ou objeto. Ela não precisa ser vertical ou se apoiar inteiramente em uma fundação sólida. Entretanto, necessita se fundir e ser solidamente suportada por rochas já existentes. Assim, é possível usar esta magia para criar uma ponte sobre um abismo ou criar uma rampa. Se for criado algo de amplitude superior a 6 metros de comprimento, é necessário dividir pela metade o tamanho de cada painel, para criar suportes. É possível fazer com que a muralha tenha, de forma bruta, ameias, parapeitos etc.\n\nA muralha é um objeto de pedra que pode ser danificado e rompido. Cada painel tem CA 15 e 30 Pontos de Vida para cada 2,5 centímetros de espessura e tem Imunidade dano Gélido, Psíquico e Venenoso. Reduzir um painel a 0 Ponto de Vida o destrói e pode fazer com que painéis conectados entrem em colapso, a critério do Mestre.\n\nSe você mantiver sua Concentração nesta magia por toda a duração, a muralha se torna permanente e não pode ser dissipada. Caso contrário, a muralha desaparece quando a magia termina."],["Muralha de Vento",3,"Evocação",["druida","guardiao"],"Ação","36 metros","V, S, M (um leque e uma pena)","Concentração, até 1 minuto","Uma muralha de vento forte sobe do chão em um ponto à sua escolha no alcance da magia. Você pode realizar uma parede de até 15 metros de comprimento, 4,5 metros de altura e 30 centímetros de espessura. Você pode moldar a parede da maneira que quiser, desde que ela faça um caminho contínuo ao longo do chão. A muralha permanece pela duração da magia. Quando a muralha surge, cada criatura na área dela realiza uma salvaguarda de Força, sofrendo 4d8 pontos de dano Contundente se falhar, ou metade desse dano em caso de sucesso.\n\nO vento forte mantém névoa, fumaça e outros gases afastados. Criaturas ou objetos Pequenos ou menores não podem atravessar a muralha. Materiais soltos e leves que entrem na muralha são lançados para cima. Flechas, virotes e outros projéteis comuns disparados contra alvos atrás da muralha são desviados para cima e erram automaticamente. Pedras arremessadas por Gigantes ou máquinas de cerco, assim como projéteis semelhantes, não são afetados. Criaturas em forma gasosa não conseguem atravessar a muralha."],["Mão de Bigby",5,"Evocação",["feiticeiro","mago"],"Ação","36 metros","V, S, M (uma casca de ovo e uma luva)","Concentração, até 1 minuto","Você cria uma mão Grande de energia mágica cintilante em um espaço desocupado à sua vista e no alcance da magia. A mão permanece pela duração da magia e se move ao seu comando, imitando os movimentos da sua própria mão.\n\nA mão é um objeto que tem CA 20 e Pontos de Vida iguais aos seus Pontos de Vida máximos. Se a mão é reduzida a 0 Pontos de Vida, a magia encerra. A mão não ocupa um espaço.\n\nAo conjurar a magia e como uma Ação Bônus em seus turnos posteriores, você pode mover a mão até 18 metros e causar um dos seguintes efeitos:\n\nMão Esmagadora. A mão tenta imobilizar uma criatura Enorme ou menor a até 1,5 metro dela. O alvo deve ser bem-sucedido em uma salvaguarda de Destreza ou tem a condição Imobilizado, com uma CD para escapar igual à CD para evitar sua magia. Enquanto a mão imobiliza o alvo, você pode executar uma ação Bônus para fazer com que a mão o esmague, causando ao alvo 4d6 pontos de dano Contundente mais seu modificador de atributo de conjuração.\n\nMão Interposta. A mão concede a você Cobertura Parcial contra ataques e outros efeitos originados do espaço da mão ou que passem por ele. Além disso, o espaço da mão conta como Terreno Difícil para seus inimigos.\n\nMão Vigorosa. A mão tenta empurrar uma criatura Enorme ou menor a até 1,5 metro dela. O alvo deve ser bem-sucedido em uma salvaguarda de Força, ou a mão empurra o alvo até 1,5 metro mais 1,5 metro multiplicado pelo valor de seu modificador de atributo de conjuração. A mão se move com o alvo, permanecendo a até 1,5 metro dele.\n\nPunho Cerrado. A mão atinge um alvo a até 1,5 metro dela. Realize um ataque mágico corpo a corpo. Em caso de acerto, o alvo sofre 5d8 pontos de dano Energético.\n\nUsando um Espaço de Magia de Círculo Superior. O dano do Punho Cerrado aumenta em 2d8 e o dano da Mão Esmagadora aumenta em 2d6 para cada círculo de espaço de magia acima de 5."],["Mãos Flamejantes",1,"Evocação",["feiticeiro","mago"],"Ação","Pessoal","V, S","Instantânea","Uma fina camada de chamas parte de você. Cada criatura em um Cone de 4,5 metros realiza uma salvaguarda de Destreza, sofrendo 3d6 pontos de dano Ígneo se falhar, ou metade desse dano em caso de sucesso. Objetos inflamáveis no Cone que não estão sendo usados ou carregados entram em combustão.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 pontos para cada círculo de espaço de magia acima de 1."],["Mãos Mágicas",0,"Invocação",["bardo","bruxo","feiticeiro","mago"],"Ação","9 metros","V, S","1 minuto","Uma mão espectral flutuante aparece em um ponto que você escolher no alcance da magia. A mão permanece pela duração. A mão desaparece se estiver a mais de 9 metros de você ou se você conjurar esta magia novamente.\n\nAo conjurar a magia, você pode usar a mão para manipular um objeto, abrir uma porta ou um recipiente destrancado, guardar ou recolher itens de recipientes abertos, ou despejar o conteúdo de um frasco.\n\nComo uma ação Usar Magia em seus próximos turnos, você pode controlar a mão novamente. Como parte dessa ação, você pode mover a mão até 9 metros. A mão não pode atacar, ativar itens mágicos ou carregar mais de 5 quilos."],["Mísseis Mágicos",1,"Evocação",["feiticeiro","mago"],"Ação","36 metros","V, S","Instantânea","Você cria três dardos brilhantes feitos de pura energia mágica. Cada dardo acerta uma criatura à sua escolha, à sua vista e no alcance da magia. Um dardo causa 1d4 + 1 pontos de dano Energético ao alvo. Os dardos acertam ao mesmo tempo, e você pode direcioná-los para uma mesma criatura ou várias.\n\nUsando um Espaço de Magia de Círculo Superior. A magia cria um dardo adicional para cada círculo de espaço de magia acima de 1."],["Nevasca",3,"Invocação",["druida","feiticeiro","mago"],"Ação","45 metros","V, S, M (um guarda-chuva em miniatura)","Concentração, até 1 minuto","Até que a magia termine, granizo cai em um Cilindro de 12 metros de altura e 6 metros de raio centrado em um ponto à sua escolha no alcance da magia. A área está Totalmente Obscurecida e as chamas expostas na área são apagadas.\n\nO Solo no Cilindro é Terreno Difícil. Quando uma criatura entra no Cilindro pela primeira vez em um turno ou começa o turno dela nele, deve ser bem-sucedida em uma salvaguarda de Destreza ou está Caída e perde a Concentração."],["Nuvem Fétida",3,"Invocação",["bardo","feiticeiro","mago"],"Ação","27 metros","V, S, M (um ovo podre)","Concentração, até 1 minuto","Você cria uma Esfera de 6 metros de raio de gás amarelo nauseante centrada em um ponto no alcance da magia. A nuvem é Totalmente Obscurecida. A nuvem permanece no ar pela duração da magia ou até que um vento forte (como o criado por Lufada de Vento ) a disperse.\n\nCada criatura que começa seu turno na Esfera deve ser bem-sucedida em uma salvaguarda de Constituição ou tem a condição Envenenado até o final do turno atual. Enquanto Envenenada desse modo, a criatura não pode executar uma ação ou uma Ação Bônus."],["Nuvem Incendiária",8,"Invocação",["druida","feiticeiro","mago"],"Ação","45 metros","V, S","Concentração, até 1 minuto","Uma nuvem rodopiante de brasas e fumaça preenche uma Esfera de 6 metros de raio centrada em um ponto no alcance da magia. A área da nuvem é Totalmente Obscurecida. Ela permanece pela duração ou até que um vento forte (como o criado pela Lufada de Vento ) a disperse.\n\nQuando a nuvem aparece, cada criatura dentro dela realiza uma salvaguarda de Destreza e, se falhar, sofre 10d8 pontos de dano Ígneo, ou metade desse dano em caso de sucesso. Uma criatura também deve realizar essa salvaguarda quando a Esfera se mover para seu espaço e quando terminar seu turno nela. Uma criatura realiza essa salvaguarda apenas uma vez por turno. A nuvem se afasta 3 metros de você na direção que você escolher no início de cada um dos seus turnos."],["Nuvem de Adagas",2,"Invocação",["bardo","bruxo","feiticeiro","mago"],"Ação","18 metros","V, S, M (um caco de vidro)","Concentração, até 1 minuto","Você conjura adagas rodopiantes em um Cubo de 1,5 metro de lado centrado em um ponto no alcance da magia. Cada criatura nessa área sofre 4d4 pontos de dano Cortante. Uma criatura também sofre esse dano se entrar no Cubo, terminar o turno nele ou se o Cubo se mover para o espaço dela. Uma criatura sofre esse dano apenas uma vez por turno.\n\nNos seus turnos subsequentes, você pode executar uma ação Usar Magia para teleportar o Cubo até 9 metros.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 2d4 para cada círculo de espaço de magia acima de 2."],["Névoa Mortal",5,"Invocação",["feiticeiro","mago"],"Ação","36 metros","V, S","Concentração, até 10 minutos","Você cria uma Esfera de 6 metros de raio constituída de uma névoa amarelo esverdeada centrada em um ponto no alcance da magia. A névoa permanece pela duração da magia ou até que um vento forte (como o criado pela magia Lufada de Vento) a disperse, encerrando a magia. A área da névoa é Totalmente Obscurecida.\n\nCada criatura na Esfera realiza uma salvaguarda de Constituição, sofrendo 5d8 pontos de dano Venenoso se falhar, ou metade desse dano em caso de sucesso. Uma criatura deve realizar essa salvaguarda quando a Esfera se mover para seu espaço e quando entrar na Esfera ou terminar o turno dela nela. Uma criatura realiza essa salvaguarda apenas uma vez por turno. A Esfera se afasta 3 metros de você no início de cada um dos seus turnos.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 5."],["Névoa Obscurecente",1,"Invocação",["druida","feiticeiro","guardiao","mago"],"Ação","36 metros","V, S","Concentração, até 1 hora","Você cria uma Esfera de névoa de 6 metros de raio centrada em um ponto no alcance da magia. A Esfera é Totalmente Obscurecida. Ela permanece pela duração da magia ou até que um vento forte (como um criado por Lufada de Vento ) a disperse.\n\nUsando um Espaço de Magia de Círculo Superior. O raio da névoa aumenta em 6 metros para cada círculo de espaço de magia acima de 1."],["Olho Arcano",4,"Adivinhação",["mago"],"Ação","9 metros","V, S, M (um pouco de pele de morcego)","Concentração, até 1 hora","Você cria um olho invisível e invulnerável no alcance da magia que fica pairando pela duração. Você recebe mentalmente do olho informações visuais, que pode ver em todas as direções. Ele também tem Visão no Escuro com um alcance de 9 metros.\n\nComo uma Ação Bônus, você pode mover o olho até 9 metros em qualquer direção. Uma barreira sólida bloqueia o movimento do olho, mas o olho pode passar por uma abertura de até 2,5 centímetros de diâmetro."],["Onda Destrutiva",5,"Evocação",["paladino"],"Ação","Pessoal","V","Instantânea","Uma energia destrutiva ondula a partir de você em uma Emanação de 9 metros. Cada criatura à sua escolha na Emanação realiza uma salvaguarda de Constituição. Se falhar, um alvo sofre 5d6 pontos de dano Trovejante e 5d6 pontos de dano Necrótico ou Radiante (à sua escolha) e tem a condição Caído. Em caso de sucesso, um alvo recebe apenas metade do dano."],["Onda Trovejante",1,"Evocação",["bardo","druida","feiticeiro","mago"],"Ação","Pessoal","V, S","Instantânea","Você libera uma onda de energia estrondosa. Cada criatura em um Cubo de 4,5 metros originado em você realiza uma salvaguarda de Constituição. Se falhar, uma criatura sofre 2d8 pontos de dano Trovejante e é empurrada a 3 metros de distância de você. Em caso de sucesso, uma criatura sofre apenas metade do dano. Além disso, objetos soltos que estão totalmente dentro do Cubo são empurrados 3 metros para longe de você, e um estrondo trovejante é audível a até 90 metros.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 1."],["Oração de Cura",2,"Abjuração",["clerigo","paladino"],"10 minutos","9 metros","V","Instantânea","Até cinco criaturas à sua escolha que permanecerem no alcance da magia por toda a conjuração obtêm os benefícios de um Descanso Curto e recuperam 2d8 Pontos de Vida. Uma criatura não pode ser afetada por esta magia novamente até ela completar um Descanso Longo.\n\nUsando um Espaço de Magia de Círculo Superior. A cura aumenta em 1d8 para cada círculo de espaço de magia acima de 2."],["Orbe Cromático",1,"Evocação",["feiticeiro","mago"],"Ação","27 metros","V, S, M (um diamante no valor de 50 ou mais PO)","Instantânea","Você arremessa um orbe de energia em um alvo no alcance da magia. Escolha Ácido, Elétrico, Gélido, Ígneo, Trovejante ou Venenoso para o tipo de orbe que você criar e, em seguida, realize um ataque mágico à distância contra o alvo. Em caso de acerto, o alvo sofre 3d8 pontos de dano do tipo escolhido.\n\nSe você jogar o mesmo número em dois ou mais dos dados d8, o orbe salta para outro alvo à sua escolha dentro de 9 metros do alvo. Realize uma jogada de ataque contra o novo alvo e realize uma nova jogada de dano. A esfera não pode saltar novamente, a menos que você conjure a magia usando um espaço de magia de 2º círculo ou superior.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 1. O orbe pode saltar um número máximo de vezes igual ao círculo do espaço de magia utilizado, e uma criatura pode ser atingida apenas uma vez por cada conjuração desta magia."],["Orientação",0,"Adivinhação",["clerigo","druida"],"Ação","Toque","V, S","Concentração, até 1 minuto","Você toca uma criatura voluntária e escolhe uma perícia. Até que a magia termine, a criatura adiciona 1d4 a qualquer teste de atributo usando a perícia escolhida."],["Padrão Hipnótico",3,"Ilusão",["bardo","bruxo","feiticeiro","mago"],"Ação","36 metros","S, M (uma pitada de confete)","Concentração, até 1 minuto","Você cria um padrão distorcido de cores em um cubo de 9 metros de lado no alcance da magia. O padrão aparece por um momento e desaparece. Cada criatura na área, que pode ver o padrão, deve ser bem-sucedida em uma salvaguarda de Sabedoria ou tem a condição Enfeitiçado pela duração. Enquanto Enfeitiçado, a criatura tem a condição Incapacitado e Deslocamento 0. A magia se encerra para uma criatura afetada se ela sofrer algum dano ou se outra pessoa executar uma ação para sacudi-la, removendo-a de seu estupor."],["Palavra Curativa",1,"Abjuração",["bardo","clerigo","druida"],"Ação Bônus","18 metros","V","Instantânea","Uma criatura à sua escolha, à sua vista e no alcance da magia recupera Pontos de Vida iguais a 2d4 mais seu modificador de atributo de conjuração.\n\nUsando um Espaço de Magia de Círculo Superior. A cura aumenta em 2d4 para cada círculo de espaço de magia acima de 1."],["Palavra Curativa em Massa",3,"Abjuração",["bardo","clerigo"],"Ação Bônus","18 metros","V","Instantânea","Até seis criaturas à sua escolha, à sua vista e no alcance da magia, recuperam Pontos de Vida iguais a 2d4 mais o seu modificador de atributo de conjuração.\n\nUsando um Espaço de Magia de Círculo Superior. A cura aumenta em 1d4 para cada círculo de espaço de magia acima de 3."],["Palavra Sagrada",7,"Evocação",["clerigo"],"Ação Bônus","9 metros","V","Instantânea","Você pronuncia uma palavra imbuída de poder dos Planos Superiores. Cada criatura à sua escolha no alcance da magia realiza uma salvaguarda de Carisma. Se falhar, um alvo com 50 Pontos de Vida ou menos sofre um efeito com base nos Pontos de Vida atuais dele, conforme mostrado na tabela Efeitos de Palavra Sagrada. Independentemente dos Pontos de Vida, um alvo Celestial, Elemental, Feérico ou Ínfero que falhar na salvaguarda é forçado a voltar ao seu plano de origem (se ainda não estiver lá) e não pode retornar ao plano atual por 24 horas por qualquer meio que não seja uma magia Desejo .\n\nEfeitos de Palavra Sagrada\n\nPontos de Vida Efeito 0–20 O alvo morre.\n\n21–30 O alvo está com as condições Atordoado, Cego e Surdo por 1 hora.\n\n31–40 O alvo está com as condições Cego e Surdo por 10 minutos.\n\n41–50 O alvo tem a condição Surdo por 1 minuto."],["Palavra de Poder: Atordoar",8,"Encantamento",["bardo","bruxo","feiticeiro","mago"],"Ação","18 metros","V","Instantânea","Você domina a mente de uma criatura à sua vista e no alcance da magia. Se o alvo tiver 150 Pontos de Vida ou menos, ele tem a condição Atordoado. Caso contrário, o Deslocamento dele é 0 até o início do seu próximo turno. O alvo Atordoado realiza uma salvaguarda de Constituição no final de cada um dos turnos dele, encerrando a condição em caso de sucesso."],["Palavra de Poder: Fortificar",7,"Encantamento",["bardo","clerigo"],"Ação","18 metros","V","Instantânea","Você fortalece até seis criaturas à sua vista e no alcance da magia. A magia concede 120 Pontos de Vida Temporários, que você divide entre os alvos da magia."],["Palavra de Poder: Matar",9,"Encantamento",["bardo","bruxo","feiticeiro","mago"],"Ação","18 metros","V","Instantânea","Você obriga uma criatura à sua vista e no alcance da magia a morrer. Se o alvo tiver 100 Pontos de Vida ou menos, ele morre. Caso contrário, sofre 12d12 pontos de dano Psíquico."],["Palavra de Poder: Salvar",9,"Encantamento",["bardo","clerigo"],"Ação","18 metros","V","Instantânea","Uma onda de energia curativa percorre uma criatura à sua vista e no alcance da magia. O alvo recupera todos os Pontos de Vida. Se a criatura tem a condição Amedrontado, Atordoado, Enfeitiçado, Envenenado ou Paralisado, a condição encerra. Se a criatura tem a condição Caído, ela pode usar sua Reação para se levantar."],["Palavra de Radiância",0,"Evocação",["clerigo"],"Ação","Pessoal","V, M (um símbolo com um raio de sol)","Instantânea","Uma radiância ardente irrompe de você em uma Emanação de 1,5 metro. Cada criatura à sua escolha à sua vista nela deve ser bem-sucedida em uma salvaguarda de Constituição ou sofre 1d6 pontos de dano Radiante.\n\nAprimoramento de Truque. O dano aumenta em 1d6 quando você atinge os níveis 5 (2d6), 11 (3d6) e 17 (4d6)."],["Palavra de Regresso",6,"Invocação",["clerigo"],"Ação","1,5 metro","V","Instantânea","Você e até cinco criaturas voluntárias a até 1,5 metro de você se teleportam instantaneamente para um santuário previamente designado. Você e quaisquer criaturas que se teleportem com você aparecem no espaço desocupado mais próximo do local designado quando você preparou seu santuário (veja abaixo). Se você conjurar esta magia sem primeiro preparar um santuário, a magia não tem efeito.\n\nVocê deve designar um local, como um templo, como um santuário, conjurando esta magia lá."],["Paralisar Monstro",5,"Encantamento",["bardo","bruxo","feiticeiro","mago"],"Ação","27 metros","V, S, M (um pedaço reto de ferro)","Concentração, até 1 minuto","Escolha uma criatura à sua vista e no alcance da magia. O alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Paralisado pela duração da magia. No final de cada um dos turnos do alvo, ele realiza uma nova salvaguarda, encerrando a magia em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 5."],["Paralisar Pessoa",2,"Encantamento",["bardo","bruxo","clerigo","druida","feiticeiro","mago"],"Ação","18 metros","V, S, M (um pedaço reto de ferro)","Concentração, até 1 minuto","Escolha um Humanoide à sua vista e no alcance da magia. O alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Paralisado pela duração da magia. No final de cada um dos turnos dele, o alvo realiza uma nova salvaguarda, encerrando a magia em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher um Humanoide adicional para cada círculo de espaço de magia acima de 2."],["Parar o Tempo",9,"Transmutação",["feiticeiro","mago"],"Ação","Pessoal","V","Instantânea","Você interrompe brevemente o fluxo do tempo para todos, menos para si. O tempo não passa para outras criaturas, enquanto você faz 1d4 +1 turnos consecutivos, durante os quais você pode usar ações e se mover normalmente.\n\nEsta magia encerra se uma das ações que você usar durante este período, ou quaisquer efeitos que você criar durante ela, afetar uma criatura que não seja você ou um objeto que esteja sendo usado ou carregado por alguém que não seja você. Além disso, a magia encerra se você se mover para um lugar a mais de 300 metros do local onde a conjurou."],["Passo Arbóreo",5,"Invocação",["druida","guardiao"],"Ação","Pessoal","V, S","Concentração, até 1 minuto","Você adquire a capacidade de entrar em uma árvore e se mover de dentro dela para dentro de outra árvore do mesmo tipo a até 150 metros. Ambas as árvores devem ser vivas e pelo menos do mesmo tamanho que você. Você deve usar 1,5 metro de movimento para entrar em uma árvore. Você sabe instantaneamente a localização de todas as outras árvores do mesmo tipo a até 150 metros e, como parte do movimento usado para entrar na árvore, pode tanto passar por uma dessas árvores quanto sair da árvore em que você está. Você aparece em um local à sua escolha a até 1,5 metro da árvore-destino, usando outro 1,5 metro de movimento. Se você não tiver mais nenhum movimento, aparece a menos de 1,5 metro da árvore em que entrou. Você pode usar essa habilidade de transporte apenas uma vez em cada um dos seus turnos. Você deve terminar cada turno fora de uma árvore."],["Passo Nebuloso",2,"Invocação",["bruxo","feiticeiro","mago"],"Ação Bônus","Pessoal","V","Instantânea","Brevemente cercado por uma névoa prateada, você se teleporta até 9 metros para um espaço desocupado à sua vista."],["Passo Sem Rastro",2,"Abjuração",["druida","guardiao"],"Ação","Pessoal","V, S, M (cinzas de ramo de visco queimado)","Concentração, até 1 hora","Você irradia uma aura de ocultação em uma Emanação de 9 metros pela duração da magia. Enquanto estiver na aura, você e cada criatura escolhida têm um bônus de +10 em testes de Destreza (Furtividade) e não deixam rastros."],["Passos Largos",1,"Transmutação",["bardo","druida","guardiao","mago"],"Ação","Toque","V, S, M (uma pitada de poeira)","1 hora","Você toca uma criatura. O Deslocamento do alvo aumenta em 3 metros até que a magia termine.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 1."],["Pele-Casca",2,"Transmutação",["druida","guardiao"],"Ação Bônus","Toque","V, S, M (um punhado de casca de árvore)","1 hora","Você toca uma criatura voluntária. Até que a magia termine, a pele do alvo assume uma aparência de casca de árvore, e o alvo tem uma Classe de Armadura de 17 se sua CA for menor que isso."],["Pele-Rocha",4,"Transmutação",["druida","feiticeiro","guardiao","mago"],"Ação","Toque","V, S, M (poeira de diamante no valor de 100 ou mais PO, que a magia consome)","Concentração, até 1 hora","Até que a magia termine, uma criatura voluntária que você toque tem Resistência a dano Contundente, Cortante e Perfurante."],["Pequeno Refúgio de Leomund",3,"Evocação",["bardo","mago"],"1 minuto ou Ritual","Pessoal","V, S, M (uma conta de cristal)","8 horas","Uma Emanação de 3 metros surge ao seu redor e permanece estacionária pela duração. A magia falha quando você a conjura se a Emanação não for grande o suficiente para envolver totalmente todas as criaturas em sua área.\n\nCriaturas e objetos dentro da Emanação quando você conjura a magia podem se mover livremente através dela. Todas as outras criaturas e objetos são impedidos de atravessá-la. Magias de 3º círculo ou inferior não podem ser conjuradas através dela, e os efeitos dessas magias não podem se estender para dentro dela. A atmosfera no interior da Emanação é confortável e seca, independentemente do clima externo. Até que a magia termine, você pode determinar se no interior há Meia-luz ou Escuridão (nenhuma ação é necessária). A Emanação é opaca por fora e de qualquer cor que você escolher, mas é transparente por dentro.\n\nA magia encerra se você sair da Emanação ou se a conjurar novamente."],["Perdição",1,"Encantamento",["bardo","bruxo","clerigo"],"Ação","9 metros","V, S, M (uma gota de sangue)","Concentração, até 1 minuto","Até três criaturas à sua escolha à sua vista e no alcance da magia devem realizar uma salvaguarda de Carisma. Sempre que um alvo que falhar nesta salvaguarda realizar uma jogada de ataque ou uma salvaguarda antes da magia terminar, o alvo deve subtrair 1d4 da jogada de ataque ou salvaguarda.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 1."],["Piscar",3,"Transmutação",["feiticeiro","mago"],"Ação","Pessoal","V, S","1 minuto","Jogue 1d6 no final de cada um dos seus turnos pela duração da magia. Em um resultado de 4−6, você desaparece do seu plano de existência atual e aparece no Plano Etéreo (a magia termina instantaneamente se você já estiver nesse plano). Enquanto estiver no Plano Etéreo, você pode ver o plano que você deixou, que aparece em tons de cinza, mas você não pode ver nada nele a mais de 18 metros de distância. Você só pode afetar e ser afetado por criaturas que estejam no Plano Etéreo, e criaturas no outro plano não podem percebê-lo, a menos que tenham uma habilidade específica que lhes permita perceber coisas no Plano Etéreo.\n\nVocê retorna ao outro plano no início do seu próximo turno e quando a magia termina se você estiver no Plano Etéreo. Você retorna a um espaço desocupado à sua escolha à sua vista e a até 3 metros do espaço que deixou. Se nenhum espaço desocupado estiver disponível dentro desse intervalo, você aparece no espaço desocupado mais próximo."],["Polimorfia",4,"Transmutação",["bardo","druida","feiticeiro","mago"],"Ação","18 metros","V, S, M (um casulo de lagarta)","Concentração, até 1 hora","Você tenta transformar uma criatura à sua vista e no alcance da magia em uma Fera. O alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou se multimorfa em uma Fera pela duração da magia. Essa forma pode ser qualquer Fera com Nível de Desafio igual ou menor que o do alvo (ou igual ao seu nível se não tiver Nível de Desafio). As estatísticas do alvo são substituídas pelas da Fera escolhida, mas o alvo mantém seu alinhamento, personalidade, tipo de criatura, Pontos de Vida e Dados de Pontos de Vida. Veja também o apêndice B para amostras dos blocos de estatísticas das Feras.\n\nO alvo recebe um número de Pontos de Vida Temporários igual aos Pontos de Vida da forma de Fera. A magia se encerra no alvo se ele não tiver Pontos de Vida Temporários restantes. Esses Pontos de Vida Temporários desaparecem, caso ainda restem, quando a magia terminar.\n\nO alvo é limitado às ações que pode realizar pela anatomia de sua nova forma, e não pode falar ou conjurar magias.\n\nO equipamento do alvo se funde com a nova forma. A criatura não pode usar ou se beneficiar de nenhum desses equipamentos."],["Polimorfia Total",9,"Transmutação",["bardo","bruxo","mago"],"Ação","9 metros","V, S, M (uma porção de mercúrio, uma dose de goma arábica e um fiapo de fumaça)","Concentração, até 1 hora","Escolha uma criatura ou objeto não mágico à sua vista e no alcance da magia. A criatura se multimorfa para uma criatura diferente, um objeto não mágico, ou o objeto se multimorfa para uma criatura (o objeto não pode estar sendo usado nem carregado). A transformação permanece pela duração da magia ou até que o alvo morra ou seja destruído, mas se você mantiver a Concentração nesta magia pela duração completa, a magia permanece até ser dissipada.\n\nUma criatura involuntária pode realizar uma salvaguarda de Sabedoria e, se for bem-sucedida, não é afetada por esta magia.\n\nCriatura em Criatura. Se você transformar uma criatura em outro tipo de criatura, a nova forma pode ser qualquer tipo que você escolher que tenha um Nível de Desafio igual ou menor do que o Nível de Desafio ou nível do alvo. As estatísticas de jogo do alvo são substituídas pelo bloco de estatísticas da nova forma, mas ele mantém seus Pontos de Vida, Dados de Pontos de Vida e alinhamento.\n\nO alvo recebe um número de Pontos de Vida Temporários igual aos Pontos de Vida da nova forma. Esses Pontos de Vida Temporários desaparecem, caso ainda restem, quando a magia terminar.\n\nO alvo é limitado às ações que pode realizar pela anatomia de sua nova forma, e não pode falar ou conjurar magias.\n\nO equipamento do alvo se funde com a nova forma. A criatura não pode usar ou se beneficiar de nenhum desses equipamentos.\n\nObjeto em Criatura. Você pode transformar um objeto em qualquer tipo de criatura, desde que o tamanho da criatura não seja maior que o tamanho do objeto e a criatura tenha um Nível de Desafio de 9 ou menor. A criatura é Amigável a você e seus aliados. Em combate, ela age imediatamente após o seu turno e obedece aos seus comandos.\n\nSe a magia durar mais de uma hora, você não controla mais a criatura. Ela pode permanecer Amigável a você, dependendo de como você a tratou.\n\nCriatura em Objeto. Se você transformar uma criatura em um objeto, ela se transforma junto com o que quer que esteja vestindo e carregando nessa forma, desde que o tamanho do objeto não seja maior do que o tamanho da criatura. As estatísticas da criatura se tornam as do objeto, ela não tem memórias do período que passou em forma de objeto e volta ao normal após a magia terminar."],["Porta Dimensional",4,"Invocação",["bardo","bruxo","feiticeiro","mago"],"Ação","150 metros","V","Instantânea","Você se teleporta para um local no alcance da magia. Você chega exatamente ao local desejado. Pode ser um lugar que você pode ver, um que você pode visualizar ou um que você pode descrever indicando distância e direção, como “60 metros para baixo” ou “90 metros para cima em direção ao noroeste em um ângulo de 45 graus”. Você também pode teleportar uma criatura voluntária. A criatura deve estar a até 1,5 metro de você quando você se teleporta, e ela se teleporta para um espaço a até 1,5 metro do seu espaço de destino.\n\nSe você, a outra criatura ou ambas chegarem a um espaço ocupado por uma criatura, ou completamente preenchido por um ou mais objetos, você e qualquer criatura viajando com você sofre 4d6 pontos de dano Energético, e o teleporte falha."],["Portais Arcanos",6,"Invocação",["bruxo","feiticeiro","mago"],"Ação","150 metros","V, S","Concentração, até 10 minutos","Você cria portais de teleporte vinculados. Escolha dois espaços grandes e desocupados no chão à sua vista, um espaço no alcance da magia e o outro a até 3 metros de você. Um portal circular se abre em cada um desses espaços e permanece pela duração da magia.\n\nOs portais são anéis brilhantes bidimensionais cheios de névoa que bloqueiam a visão. Eles pairam a centímetros do chão e são perpendiculares a ele.\n\nUm portal fica aberto apenas de um lado (à sua escolha). Qualquer coisa que entre no lado aberto de um portal sai do lado aberto do outro portal como se os dois fossem adjacentes um ao outro. Como uma Ação Bônus, você pode alterar a face dos lados abertos."],["Portal",9,"Invocação",["bruxo","clerigo","feiticeiro","mago"],"Ação","18 metros","V, S, M (um diamante no valor de 5.000 ou mais PO)","Concentração, até 1 minuto","Você conjura um portal que liga um espaço desocupado à sua vista e no alcance da magia a um local preciso em um plano de existência diferente. O portal é uma abertura circular, que você pode criar com 1,5 a 6 metros de diâmetro. Você pode orientar o portal em qualquer direção que escolher. O portal permanece pela duração da magia e o destino para o qual ele leva é visível através dele.\n\nO portal tem uma frente e um verso em cada plano onde aparece. Se deslocar pelo portal só é possível movendo-se pela frente. Qualquer coisa que o faça é instantaneamente transportada para o outro plano, aparecendo no espaço desocupado mais próximo do portal. Divindades e outros governantes dos planos podem impedir que portais criados por esta magia se abram em sua presença ou em qualquer lugar dentro de seus domínios. Ao conjurar esta magia, você pode proferir o nome de uma criatura específica (não funciona com um pseudônimo, título ou apelido). Se essa criatura estiver em um plano diferente daquele em que você está, o portal se abre ao lado da criatura nomeada e a transporta para o espaço desocupado mais próximo do seu lado do portal. Você não recebe nenhum poder especial sobre a criatura, e ela é livre para agir conforme o Mestre julgar apropriado. Ela pode ir embora, atacar você ou ajudá-lo."],["Praga de Insetos",5,"Invocação",["clerigo","druida","feiticeiro"],"Ação","90 metros","V, S, M (um gafanhoto)","Concentração, até 10 minutos","Um enxame de gafanhotos preenche uma Esfera de 6 metros de raio centrada em um ponto à sua escolha no alcance da magia. A Esfera permanece pela duração, e sua área é Parcialmente Obscurecida e Terreno Difícil. Quando o enxame aparece, cada criatura dentro dele realiza uma salvaguarda de Constituição, sofrendo 4d10 pontos de dano Perfurante se falhar, ou metade desse dano em caso de sucesso. Uma criatura também realiza essa salvaguarda quando entra na área da magia pela primeira vez em um turno ou encerra o turno nela. Uma criatura realiza essa salvaguarda apenas uma vez por turno.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d10 para cada círculo de espaço de magia acima de 5."],["Presença Régia de Yolande",5,"Encantamento",["bardo","mago"],"Ação","Pessoal","V, S, M (uma tiara em miniatura)","Concentração, até 1 minuto","Você se envolve com uma majestade sobrenatural em uma Emanação de 3 metros. Sempre que a Emanação entra no espaço de uma criatura à sua vista, ou quando uma criatura à sua vista entra na Emanação ou termina seu turno nela, você pode forçar essa criatura a realizar uma salvaguarda de Sabedoria. Se falhar, o alvo sofre 4d6 pontos de dano Psíquico e tem a condição Caído, e você pode empurrá-lo até 3 metros para longe de você. Em caso de sucesso, o alvo sofre apenas metade do dano. Uma criatura realiza essa salvaguarda apenas uma vez por turno."],["Presságio",4,"Adivinhação",["clerigo","druida","mago"],"Ação ou Ritual","Pessoal","V, S, M (incenso no valor de 25 ou mais PO, que a magia consome)","Instantânea","Esta magia coloca você em contato com um deus ou com os servos de um deus. Você faz uma pergunta sobre um objetivo, evento ou atividade específica que ocorrerá em até 7 dias. O Mestre oferece uma resposta verdadeira, que pode ser uma frase curta ou uma rima enigmática. A magia não leva em conta circunstâncias que podem alterar a resposta, como a conjuração de outras magias.\n\nSe você conjurar a magia mais de uma vez antes de completar um Descanso Longo, há uma chance cumulativa de 25% para cada conjuração após a primeira de que você não receba resposta."],["Prestidigitação Arcana",0,"Transmutação",["bardo","bruxo","feiticeiro","mago"],"Ação","3 metros","V, S","Até 1 hora","Você cria um efeito mágico no alcance da magia. Escolha o efeito entre as opções abaixo. Se conjurar esta magia várias vezes, você pode ter até três de seus efeitos não instantâneos ativos ao mesmo tempo.\n\nBrincar com Fogo. Você instantaneamente acende ou apaga uma vela, uma tocha ou uma pequena fogueira.\n\nCriação Menor. Você cria uma bugiganga não mágica, sem valor monetário e incapaz de causar dano, ou uma imagem ilusória, sendo que ambas devem caber na sua mão. Ela dura até o final do seu próximo turno.\n\nEfeito Sensorial. Você cria um efeito sensorial instantâneo e inofensivo, como uma chuva de faíscas, um sopro de vento, notas musicais suaves ou um odor estranho.\n\nLimpar ou Sujar. Você limpa ou suja instantaneamente um objeto com menos de 30 centímetros cúbicos.\n\nMarca Mágica. Você faz aparecer uma cor, uma pequena marca ou um símbolo em um objeto ou superfície por 1 hora.\n\nSensação Ideal. Você esfria, aquece ou dá sabor a um material não vivo com menos de 30 centímetros cúbicos por 1 hora."],["Proibição",6,"Abjuração",["clerigo"],"10 minutos ou Ritual","Toque","V, S, M (rubi em pó no valor de 1.000 ou mais PO)","1 dia","Você cria uma proteção contra viagens mágicas que protege até 3.700 metros quadrados de espaço a uma altura de 9 metros acima do chão. Pela duração da magia, as criaturas não podem se teleportar para a área ou usar portais, como aqueles criados pela magia Portal , para entrar na área. A magia bloqueia a área contra viagens planares e, portanto, impede que criaturas acessem a área pelo Plano Astral, Plano Etéreo, Faéria, Sombral ou pela magia Transição Planar .\n\nAlém disso, a magia causa dano aos tipos de criaturas, entre um ou mais, que você escolhe ao conjurá-la: Aberrações, Celestiais, Elementais, Feéricos, Ínferos e Mortos-Vivos. Quando uma criatura de um dos tipos escolhidos entra pela primeira vez na área da magia ou termina seu turno nela, sofre 5d10 pontos de dano Necrótico ou Radiante (à sua escolha ao conjurar esta magia).\n\nVocê pode definir uma senha ao conjurar a magia. Uma criatura que profere a senha ao entrar na área não sofre dano da magia.\n\nA área da magia não pode se sobrepor à área de outra magia Proibição . Se você conjurar Proibição todos os dias por 30 dias no mesmo local, a magia permanece até ser dissipada e os componentes Materiais são consumidos na última conjuração."],["Projetar Imagem",7,"Ilusão",["bardo","mago"],"Ação","800 quilômetros","V, S, M (uma estatueta de si mesmo no valor de 5 ou mais PO)","Concentração, até 1 dia","Você cria uma cópia ilusória de si mesmo que dura enquanto a magia estiver ativa. A cópia pode surgir em qualquer lugar que você já tenha visto e que esteja no alcance da magia, ignorando obstáculos. A ilusão se parece e soa como você, mas é intangível. Se a ilusão sofrer qualquer dano, ela desaparece e a magia se encerra. Você pode ver através dos olhos da ilusão e ouvir através dos ouvidos dela, como se você estivesse no espaço dela. Com uma ação Usar Magia, você pode movê-la até 18 metros e fazer com que ela gesticule, fale e se comporte da maneira que desejar. Ela imita seus maneirismos perfeitamente.\n\nInteração física com a imagem revela sua natureza ilusória, já que objetos podem atravessá-la. Uma criatura que executa a ação Analisar para examinar a imagem pode determinar que se trata de uma ilusão com um teste bem-sucedido de Inteligência (Investigação) contra a CD para evitar sua magia. Se uma criatura perceber a ilusão, ela pode ver através da imagem, e qualquer som que a ilusão emita parece vago para essa criatura."],["Projeção Astral",9,"Necromancia",["bruxo","clerigo","mago"],"1 hora","3 metros","V, S, M (para cada um dos alvos da magia, um zircão no valor de 1.000 ou mais PO e uma barra de prata no valor de 100 ou mais PO, que a magia consome)","Até ser dissipada","Você e até oito criaturas voluntárias no alcance da magia projetam seus corpos astrais no Plano Astral (a magia se encerra instantaneamente se você já estiver nesse plano). O corpo de cada alvo é deixado para trás em um estado de animação suspensa; ele tem a condição Inconsciente, não precisa comer ou respirar e não envelhece.\n\nA forma astral de um alvo se assemelha ao seu corpo em quase todos os aspectos, replicando suas estatísticas de jogo e pertences. A principal diferença é a adição de um cordão prateado que se arrasta entre as omoplatas da forma astral. O cordão desaparece de vista após 30 centímetros. Se o cordão for cortado — algo que só pode acontecer quando um efeito especificamente declarar isto — tanto o corpo quanto a forma astral do alvo morrem.\n\nA forma astral de um alvo pode viajar pelo Plano Astral. No momento em que uma forma astral deixa aquele plano, o corpo e os pertences do alvo viajam ao longo do cordão prateado, fazendo com que o alvo reentre em seu corpo no novo plano.\n\nQualquer dano ou efeito aplicável a uma forma astral não afeta o corpo do alvo e vice-versa. Se o corpo ou a forma astral de um alvo for reduzido a 0 Pontos de Vida, a magia se encerra para esse alvo. A magia se encerra para todos os alvos se você executar uma ação Usar Magia para descartá-la.\n\nQuando a magia termina para um alvo que não está morto, o alvo reaparece em seu corpo e sai do estado de animação suspensa."],["Proteger Fortaleza",6,"Abjuração",["bardo","mago"],"1 hora","Toque","V, S, M (um cetro de prata no valor de 10 ou mais PO)","24 horas","Você cria uma proteção que protege até 225 metros quadrados de espaço. A área protegida pode ter até 6 metros de altura e você a molda como um quadrado de 15 metros de lado, cem quadrados de 1,5 metro de lado que são contíguos ou vinte e cinco quadrados de 3 metros de lado que são contíguos.\n\nAo conjurar esta magia, você pode especificar indivíduos que não são afetados pelos efeitos da magia. Você também pode especificar uma senha que, quando proferida em voz alta a até 1,5 metro da área protegida, torne o orador imune aos efeitos da magia.\n\nA magia cria os efeitos abaixo dentro da área protegida. Dissipar Magia não tem efeito sobre Proteger Fortaleza em si, mas cada um dos seguintes efeitos pode ser dissipado. Se todos os quatro forem dissipados, Proteger Fortaleza se encerra. Se você conjurar a magia todos os dias por 365 dias na mesma área, a magia permanece até que todos os seus efeitos sejam dissipados.\n\nCorredores. A névoa preenche todos os corredores protegidos, tornando a área Totalmente Obscurecida. Além disso, em cada interseção ou passagem ramificada que oferece uma escolha de direção, há uma chance de 50% de que uma criatura diferente de você acredite que está indo na direção oposta à que escolheu.\n\nEscadas. Teias preenchem todas as escadas na área protegida de cima para baixo, como na magia Teia . Esses fios voltam a crescer em 10 minutos se forem destruídos enquanto Proteger Fortaleza durar.\n\nPortas. Todas as portas da área protegida estão magicamente trancadas, como se estivessem seladas pela magia Tranca Arcana . Além disso, você pode cobrir até dez portas com uma ilusão para fazê-las parecer seções simples de parede.\n\nOutro Efeito Mágico. Coloque um dos seguintes efeitos mágicos dentro da área protegida:\n\n• Luzes Dançantes em quatro corredores, com um padrão simples que as luzes repetem enquanto durar Proteger Fortaleza • Boca Encantada em dois locais • Nuvem Fétida em dois locais (os vapores retornam dentro de 10 minutos se dispersos enquanto Proteger Fortaleza durar)\n\n• Lufada de Vento em um corredor ou sala (o vento sopra continuamente enquanto a magia durar) • Sugestão em um quadrado de 1,5 metro de lados; qualquer criatura que entre nesse quadrado recebe a sugestão mentalmente"],["Proteção Contra Energia",3,"Abjuração",["clerigo","druida","feiticeiro","guardiao","mago"],"Ação","Toque","V, S","Concentração, até 1 hora","Pela duração da magia, a criatura voluntária que você tocar tem Resistência a um tipo de dano à sua escolha: Ácido, Elétrico, Gélido, Ígneo ou Trovejante."],["Proteção Contra Lâminas",0,"Abjuração",["bardo","bruxo","feiticeiro","mago"],"Ação","Pessoal","V, S","Concentração, até 1 minuto","Sempre que uma criatura realizar uma jogada de ataque contra você antes que a magia termine, o atacante subtrai 1d4 da jogada de ataque."],["Proteção Contra Veneno",2,"Abjuração",["clerigo","druida","guardiao","paladino"],"Ação","Toque","V, S","1 hora","Você toca uma criatura e encerra nela a condição Envenenado. Pela duração da magia, o alvo tem Vantagem nas salvaguardas para evitar ou encerrar a condição Envenenado e tem Resiste a dano Venenoso."],["Proteção Contra a Morte",4,"Abjuração",["clerigo","paladino"],"Ação","Toque","V, S","8 horas","Você toca uma criatura e concede a ela uma medida de proteção contra a morte. Na primeira vez que o alvo é reduzido a 0 Pontos de Vida antes que a magia termine, em vez disso o alvo fica com 1 Ponto de Vida e a magia termina.\n\nSe a magia ainda estiver ativa quando o alvo for submetido a um efeito que o mate instantaneamente sem causar dano, esse efeito é negado contra o alvo e a magia se encerra."],["Proteção Contra o Bem e o Mal",1,"Abjuração",["bruxo","clerigo","druida","mago","paladino"],"Ação","Toque","V, S, M (um pote de Água Benta no valor de 25 ou mais PO, que a magia consome)","Concentração, até 10 minutos","Até que a magia termine, uma criatura voluntária que você tocar está protegida contra criaturas que são Aberrações, Celestiais, Elementais, Feéricos, Ínferos ou Mortos-Vivos. A proteção concede vários benefícios. Criaturas desses tipos têm Desvantagem em jogadas de ataque contra o alvo. O alvo também não pode ser possuído por essas criaturas nem adquirir as condições de Amedrontado ou Enfeitiçado por elas. Se o alvo já estiver possuído, Amedrontado ou Enfeitiçado por uma dessas criaturas, ele tem Vantagem em qualquer nova salvaguarda contra o efeito relevante."],["Purificar Alimentos e Bebidas",1,"Transmutação",["clerigo","druida","paladino"],"Ação ou Ritual","3 metros","V, S","Instantânea","Você remove veneno e podridão de alimentos e bebidas não mágicos em uma Esfera de 1,5 metro de raio centrada em um ponto no alcance da magia."],["Queda Suave",1,"Transmutação",["bardo","feiticeiro","mago"],"Reação, que você executa quando você ou uma criatura à sua vista a até 18 metros de você entra em queda","18 metros","V, M (uma pequena pena ou pedaço de penugem)","1 minuto","Escolha até cinco criaturas em queda no alcance da magia. A taxa de queda de cada uma diminui para 18 metros por rodada até que a magia termine. Se uma criatura pousar antes do fim da magia, não sofre dano da queda e a magia se encerra para ela."],["Raio Ardente",2,"Evocação",["feiticeiro","mago"],"Ação","36 metros","V, S","Instantânea","Você dispara três raios flamejantes. Você pode dispará-los em um ou vários alvos no alcance da magia. Realize um ataque mágico à distância para cada raio. Em caso de acerto, o alvo sofre 2d6 pontos de dano Ígneo.\n\nUsando um Espaço de Magia de Círculo Superior. Você cria um raio adicional para cada círculo de espaço de magia acima de 2."],["Raio Guia",1,"Evocação",["clerigo"],"Ação","36 metros","V, S","1 rodada","Você lança um raio de luz em direção a uma criatura no alcance da magia. Realize um ataque mágico à distância contra o alvo. Em caso de acerto, ele sofre 4d6 pontos de dano Radiante, e a próxima jogada de ataque realizado contra ele antes do final do seu próximo turno tem Vantagem.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 pontos para cada círculo de espaço de magia acima de 1."],["Raio Lunar",2,"Evocação",["druida"],"Ação","36 metros","V, S, M (uma folha de dama-da-noite)","Concentração, até 1 minuto","Um feixe prateado de luz pálida brilha em um Cilindro com 1,5 metro de raio e 12 metros de altura, centrado em um ponto no alcance da magia. Até que a magia termine, Meia-luz preenche o Cilindro, e você pode executar uma ação Usar Magia nos turnos subsequentes para mover o Cilindro até 18 metros.\n\nQuando o Cilindro surge, cada criatura em seu interior deve realizar uma salvaguarda de Constituição. Em caso de falha, a criatura sofre 2d10 pontos de dano Radiante e, se estiver multimorfada (como resultado da magia Polimorfia , por exemplo), reverte-se à sua forma verdadeira e não pode se multimorfar novamente até sair do Cilindro. Em caso de sucesso, a criatura recebe apenas metade do dano. Uma criatura também realiza essa salvaguarda quando a área da magia se move para o espaço dela, quando ela entra na área da magia ou quando encerra o próprio turno nela. A criatura realiza essa salvaguarda apenas uma vez por turno.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d10 para cada círculo de espaço de magia acima de 2."],["Raio Místico",0,"Evocação",["bruxo"],"Ação","36 metros","V, S","Instantânea","Você emite um feixe de energia crepitante. Realize um ataque mágico à distância contra uma criatura ou objeto no alcance da magia. Em caso de acerto, o alvo sofre 1d10 pontos de dano Energético.\n\nAprimoramento de Truque. A magia cria dois feixes no nível 5, três feixes no nível 11 e quatro feixes no nível 17. Você pode direcionar os feixes para o mesmo alvo ou para alvos diferentes. Realize uma jogada de ataque separada para cada feixe."],["Raio Nauseante",1,"Necromancia",["feiticeiro","mago"],"Ação","18 metros","V, S","Instantânea","Você dispara um raio esverdeado em uma criatura no alcance da magia. Realize um ataque mágico à distância contra o alvo. Em caso de acerto, o alvo sofre 2d8 pontos de dano Venenoso e tem a condição Envenenado até o final do seu próximo turno.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 1."],["Raio Solar",6,"Evocação",["clerigo","druida","feiticeiro","mago"],"Ação","Pessoal","V, S, M (uma lupa)","Concentração, até 1 minuto","Você lança um feixe de luz em uma linha de 1,5 metro de largura e 18 metros de comprimento. Cada criatura na Linha realiza uma salvaguarda de Constituição. Se falhar, uma criatura sofre 6d8 pontos de dano Radiante e tem a condição Cego até o início do seu próximo turno. Em caso de sucesso, ela sofre apenas metade do dano. Até que a magia termine, você pode executar uma ação Usar Magia para criar uma nova Linha de radiância. Pela duração da magia, uma fagulha de radiância brilha acima de você. Ela emite Luz Plena em um raio de 9 metros e Meia-luz por mais 9 metros. Essa luz é a luz do sol."],["Raio de Bruxa",1,"Evocação",["bruxo","feiticeiro","mago"],"Ação","18 metros","V, S, M (um galho atingido por um raio)","Concentração, até 1 minuto","Um feixe de energia crepitante é lançado em direção a uma criatura no alcance da magia, formando um arco sustentado de relâmpago entre você e o alvo. Realize um ataque mágico à distância contra ele. Em caso de acerto, o alvo sofre 2d12 pontos de dano Elétrico. Em cada um dos seus turnos posteriores, você pode executar uma ação Bônus para causar 1d12 pontos de dano Elétrico automaticamente ao alvo, mesmo que o primeiro ataque tenha falhado.\n\nA magia encerra se o alvo estiver fora do alcance da magia ou se tiver Cobertura Total em relação a você.\n\nUsando um Espaço de Magia de Círculo Superior. O dano inicial aumenta em 1d12 para cada círculo de espaço de magia acima de 1."],["Raio de Fogo",0,"Evocação",["feiticeiro","mago"],"Ação","36 metros","V, S","Instantânea","Você arremessa uma partícula de fogo em uma criatura ou objeto no alcance da magia. Realize um ataque mágico à distância contra o alvo. Em caso de acerto, o alvo sofre 1d10 pontos de dano Ígneo.\n\nUm objeto inflamável atingido por esta magia entra em combustão se não estiver sendo usado ou carregado.\n\nAprimoramento de Truque. O dano aumenta em 1d10 quando você atinge os níveis 5 (2d10), 11 (3d10) e 17 (4d10)."],["Raio de Gelo",0,"Evocação",["feiticeiro","mago"],"Ação","18 metros","V, S","Instantânea","Um feixe congelante de luz azul-esbranquiçada parte em direção a uma criatura no alcance da magia. Realize um ataque mágico à distância contra o alvo. Se acertar, a criatura sofre 1d8 pontos de dano Gélido e seu Deslocamento é reduzido em 3 metros até o início do seu próximo turno.\n\nAprimoramento de Truque. O dano aumenta em 1d8 quando você atinge os níveis 5 (2d8), 11 (3d8) e 17 (4d8)."],["Raio do Enfraquecimento",2,"Necromancia",["bruxo","mago"],"Ação","18 metros","V, S","Concentração, até 1 minuto","Um feixe de energia enfraquecedora parte de você em direção a uma criatura no alcance da magia. A criatura deve realizar uma salvaguarda de Constituição. Em caso de sucesso, a criatura tem Desvantagem na próxima jogada de ataque que realizar até o início do seu próximo turno.\n\nSe falhar, a criatura tem Desvantagem em Testes de D20 baseados em Força pela duração da magia. Nesse período, ela também subtrai 1d8 de todas as jogadas de dano que fizer. A criatura repete a salvaguarda no final de cada um dos turnos dela, encerrando a magia sobre si em caso de sucesso."],["Rajada Prismática",7,"Evocação",["bardo","feiticeiro","mago"],"Ação","Pessoal","V, S","Instantânea","Oito raios luminosos partem de você em um Cone de 18 metros. Cada criatura no Cone realiza uma salvaguarda de Destreza. Para cada alvo, jogue 1d8 para determinar qual raio colorido o afeta, consultando a tabela Raios Prismáticos.\n\nRaios Prismáticos\n\n1d8 Raio 1 Vermelho . Se falhar: 12d6 pontos de dano Ígneo. Em caso de sucesso: metade do dano.\n\n2 Laranja. Se falhar: 12d6 pontos de dano Ácido. Em caso de sucesso: metade do dano.\n\n3 Amarelo. Se falhar: 12d6 pontos de dano Elétrico. Em caso de sucesso: metade do dano.\n\n4 Verde. Se falhar: 12d6 pontos de dano Venenoso. Em caso de sucesso: metade do dano.\n\n5 Azul. Se falhar: 12d6 pontos de dano Gélido. Em caso de sucesso: metade do dano.\n\n6 Anil. Se falhar: O alvo tem a condição Contido e realiza uma salvaguarda de Constituição no final de cada um dos turnos dele. Se bem-sucedido três vezes, a condição encerra. Se falhar três vezes, ele tem a condição Petrificado até ser liberado por um efeito como a magia Restauração Maior . Os sucessos e fracassos não precisam ser consecutivos; acompanhe ambos até que o alvo alcance três de um tipo.\n\n7 Violeta. Se falhar: O alvo tem a condição Cego e realiza uma salvaguarda de Sabedoria no início do seu próximo turno. Em uma salvaguarda bem-sucedida, a condição encerra. Se falhar, a condição encerra e a criatura se teleporta para outro plano de existência (à escolha do Mestre).\n\n8 Especial. O alvo é atingido por dois raios. Jogue duas vezes, jogando novamente quaisquer 8."],["Rajada de Veneno",0,"Necromancia",["bruxo","druida","feiticeiro","mago"],"Ação","9 metros","V, S","Instantânea","Você projeta uma névoa tóxica em uma criatura no alcance da magia. Realize um ataque mágico à distância contra o alvo. Em caso de acerto, o alvo sofre 1d12 pontos de dano Venenoso.\n\nAprimoramento de Truque. O dano aumenta em 1d12 quando você atinge os níveis 5 (2d12), 11 (3d12) e 17 (4d12)."],["Receptáculo Arcano",6,"Necromancia",["mago"],"1 minuto","Pessoal","V, S, M (uma gema, cristal ou relicário no valor de 500 ou mais PO)","Até ser dissipada","Seu corpo entra em um estado catatônico enquanto sua alma se desprende dele e adentra o receptáculo que você utilizou como componente Material da magia. Enquanto sua alma habita o receptáculo, você percebe os arredores como se estivesse no espaço ocupado por ele. Você não pode se mover ou usar Reações. A única ação que pode realizar é projetar sua alma a até 30 metros do receptáculo, seja retornando ao seu corpo vivo (e encerrando a magia) ou tentando possuir um corpo Humanoide.\n\nVocê pode tentar possuir qualquer criatura Humanoide a até 30 metros do seu alcance e que esteja à sua vista (criaturas protegidas pela magia Círculo Mágico ou Proteção contra o Bem e o Mal não podem ser possuídas). O alvo deve realizar uma salvaguarda de Carisma. Se falhar, a sua alma projeta-se do receptáculo para dentro do corpo do alvo, expulsando a alma dele, que agora fica aprisionada no receptáculo. Em caso de sucesso, o alvo resiste aos seus esforços para possuí-lo, e você não pode tentar novamente por 24 horas.\n\nUma vez que possua o corpo de uma criatura, você a controla. Seus Pontos de Vida, Dados de Vida, Força, Destreza, Constituição, Deslocamento e sentidos são substituídos pelos da criatura. Por outro lado, você mantém suas estatísticas de jogo.\n\nEnquanto isso, a alma da criatura possuída pode perceber a partir do receptáculo usando seus próprios sentidos, mas ela não pode se mover e está Incapacitada. Enquanto estiver possuindo um corpo, você pode usar uma de suas ações para retornar do corpo do hospedeiro para o receptáculo, desde que este esteja a até 30 metros de distância, devolvendo a alma do hospedeiro ao corpo dela. Se o corpo do hospedeiro morrer enquanto você estiver nele, a criatura morre e você deve realizar uma salvaguarda de Carisma contra a CD do seu próprio atributo de conjuração. Em caso de sucesso, e se o receptáculo estiver a até 30 metros de distância, sua alma retorna a ele. Caso contrário, você morre. Se o receptáculo for destruído ou a magia terminar, sua alma retorna imediatamente ao seu corpo. Se o seu corpo estiver a mais de 30 metros de distância ou se ele estiver morto quando sua alma tentar retornar, você morre. Se a alma de outra criatura estiver no receptáculo quando ele for destruído, ela retorna ao corpo dela se este estiver vivo e a até 30 metros de distância. Caso contrário, a criatura morre.\n\nQuando a magia termina, o receptáculo é destruído."],["Reencarnar",5,"Necromancia",["druida"],"1 hora","Toque","V, S, M (óleos raros no valor de 1.000 ou mais PO, que a magia consome)","Instantânea","Você toca um Humanoide morto ou parte dele. Se a criatura estiver morta há, no máximo, 10 dias, a magia cria um novo corpo para ela e chama a alma para habitar esse corpo. Jogue 1d10 e consulte a tabela abaixo para determinar a espécie do novo corpo ou o Mestre escolhe outra espécie jogável.\n\n1d10 Espécies 1d10 Espécies 1 Aasimar 6 Golias 2 Draconato 7 Pequenino 3 Anão 8 Humano 4 Elfo 9 Orc 5 Gnomo 10 Tiferino A criatura reencarnada faz quaisquer escolhas que a descrição de sua nova espécie oferece e mantém as memórias de sua vida anterior. Ela conserva as capacidades que possuía em sua forma original, mas perde os traços da espécie anterior e adquire os traços da nova espécie."],["Reflexos",2,"Ilusão",["bardo","bruxo","feiticeiro","mago"],"Ação","Pessoal","V, S","1 minuto","Três cópias ilusórias suas aparecem em seu espaço. Até que a magia termine, as cópias se movem com você e imitam suas ações, mudando de posição de forma que seja impossível rastrear qual imagem é a verdadeira. Cada vez que uma criatura atinge você com uma jogada de ataque pela duração da magia, jogue um d6 para cada uma das cópias restantes. Se qualquer um dos d6s resultar em 3 ou mais, uma das cópias é atingida em seu lugar e é destruída. As cópias ignoram todos os outros danos e efeitos. A magia se encerra quando as três cópias são destruídas.\n\nUma criatura não é afetada por esta magia se tem a condição Cego, ou se possuir Visão às Cegas ou Visão Verdadeira."],["Refugiar",7,"Transmutação",["mago"],"Ação","Toque","V, S, M (poeira de uma pedra preciosa no valor de 5.000 ou mais PO, que a magia consome)","Até ser dissipada","Com um toque, você magicamente oculta um objeto ou uma criatura voluntária. Pela duração da magia, o alvo tem a condição Invisível, não pode ser alvo de magias de Adivinhação, detectado por magia ou observado remotamente por meios mágicos.\n\nSe o alvo for uma criatura, ela entra em um estado de animação suspensa, tem a condição Inconsciente, não envelhece e não necessita de alimento, água ou ar. Você pode definir uma condição para que a magia encerre previamente. A condição pode ser qualquer coisa à sua escolha, mas deve ocorrer ou ser visível em um raio de 1,5 quilômetro do alvo
