gia",3,"Abjuração",["bruxo","feiticeiro","mago"],"Reação, que você executa quando vê uma criatura a até 18 metros de você conjurando uma magia com componentes Verbais, Somáticos ou Materiais","18 metros","S","Instantânea","Você tenta interromper uma criatura no processo de conjurar uma magia. A criatura realiza uma salvaguarda de Constituição. Se falhar, a magia se dissipa sem efeito, e a ação, Ação Bônus ou Reação usada para conjurá-la é desperdiçada. Se a magia do alvo foi conjurada com um espaço de magia, o espaço de magia da criatura não é gasto."],["Controlar o Clima",8,"Transmutação",["clerigo","druida","mago"],"10 minutos","Pessoal","V, S, M (um incenso aceso)","Concentração, até 8 horas","Você assume o controle do clima a até 8 quilômetros de você pela duração da magia. Você deve estar ao ar livre para conjurar esta magia, e ela encerra se você for para áreas internas.\n\nAo conjurar a magia, você altera a condição climática atual, determinada pelo Mestre. Você pode alterar a precipitação, a temperatura e o vento. Leva 1d4 x 10 minutos para as novas condições do clima entrarem em vigor. Depois que elas se estabelecerem, você pode alterar as condições novamente. Quando a magia termina, o clima volta gradualmente ao normal.\n\nAo alterar as condições meteorológicas, encontre uma condição atual nas tabelas a seguir e altere o estágio em um, para cima ou para baixo. Ao mudar o vento, você pode alterar a direção dele.\n\nPrecipitação\n\nEstágio Condição 1 Limpo 2 Nuvens leves 3 Nublado ou com neblina 4 Chuva, granizo ou neve 5 Chuva torrencial, tempestade de granizo ou nevasca\n\nTemperatura Vento\n\nEstágio Condição Estágio Condição 1 Calor insuportável 1 Calmo 2 Quente 2 Vento moderado 3 Ameno 3 Vento forte 4 Fresco 4 Vendaval 5 Frio 5 Tempestade 6 Frio extremo"],["Controlar Água",4,"Transmutação",["clerigo","druida","mago"],"Ação","90 metros","V, S, M (uma mistura de água e poeira)","Concentração, até 10 minutos","Até que a magia termine, você controla qualquer água dentro de uma área escolhida em um Cubo de até 30 metros de lado, usando um dos seguintes efeitos. Como uma ação Usar Magia em seus turnos posteriores, você pode repetir o mesmo efeito ou escolher um diferente.\n\nDividir Água. Você divide a água na área e cria uma trincheira. A trincheira se estende pela área da magia, e a água separada forma uma parede de cada lado. A trincheira permanece até que a magia termine ou você escolha um efeito diferente. A água então preenche lentamente a trincheira ao longo da próxima rodada até que o nível normal de água seja restaurado.\n\nInundação. Você faz com que o nível de toda a água parada na área suba em até 6 metros. Se você escolher uma área em um grande corpo d’água, você cria uma onda de 6 metros de altura que viaja de um lado da área para o outro e depois quebra. Quaisquer veículos Enormes ou menores no caminho da onda são carregados com ela para o outro lado. Qualquer veículo Enorme ou menor atingido pela onda tem 25% de chance de emborcar.\n\nO nível da água permanece elevado até que a magia termine ou você escolha um efeito diferente. Se esse efeito produziu uma onda, a onda se repete no início do seu próximo turno enquanto o efeito de inundação permanecer.\n\nRedemoinho. Você faz com que um redemoinho se forme no centro da área, que deve ser pelo menos uma área quadrada de 15 metros de lados e 7,5 metros de profundidade. O redemoinho dura até que você escolha um efeito diferente ou a magia termine. O redemoinho tem 1,5 metro de largura na base, até 15 metros de largura no topo e 7,5 metros de altura. Qualquer criatura na água e a até 7,5 metros do redemoinho é puxada a 3 metros em sua direção. Quando uma criatura entra no redemoinho pela primeira vez em um turno ou termina o turno lá, ela realiza uma salvaguarda de Força. Se falhar, a criatura sofre 2d8 pontos de dano Contundente. Em caso de sucesso, a criatura sofre metade do dano. Uma criatura só pode nadar para longe do redemoinho se primeiro usar uma ação para se afastar e for bem-sucedida em um teste de Força (Atletismo) contra a CD para evitar sua magia.\n\nRedirecionar Fluxo. Você faz com que a água corrente na área se mova na direção que você escolher, mesmo que a água tenha que fluir sobre obstáculos, paredes ou em outras direções improváveis. A água na área se move à medida que você a direciona, mas uma vez que ela se move além da área da magia, ela retoma seu fluxo com base no terreno. A água continua a se mover na direção que você escolheu até que a magia termine ou você escolha um efeito diferente."],["Contágio",5,"Necromancia",["clerigo","druida"],"Ação","Toque","V, S","7 dias","Seu toque inflige um contágio mágico. O alvo deve ser bem-sucedido em uma salvaguarda de Constituição ou sofre 11d8 pontos de dano necrótico e tem a condição Envenenado. Além disso, escolha um atributo ao conjurar a magia. Enquanto estiver envenenado, o alvo tem Desvantagem em salvaguardas realizadas com o atributo escolhido.\n\nO alvo deve repetir a salvaguarda no final de cada um dos turnos até obter três sucessos ou fracassos. Se o alvo obtiver três sucessos, a magia encerra para o alvo. Se obter três fracassos, a magia permanece 7 dias sobre ele.\n\nSempre que o alvo Envenenado receber um efeito que encerre a condição Envenenado, ele deve ser bem-sucedido em uma salvaguarda de Constituição, ou a condição Envenenado não encerra nele."],["Convocar Celestial",5,"Invocação",["clerigo","paladino"],"Ação","27 metros","V, S, M (um relicário no valor de 500 ou mais PO)","Concentração, até 1 hora","Você invoca um Espírito Celestial. Ele se manifesta em uma forma angelical em um espaço desocupado à sua vista e no alcance da magia e usa o bloco de estatísticas do Espírito Celestial . Ao conjurar a magia, escolha Defensor ou Vingador. Sua escolha determina certos detalhes no bloco de estatísticas da criatura. A criatura desaparece ao ser reduzida a 0 Pontos de Vida ou quando a magia termina.\n\nA criatura é uma aliada sua e de seus aliados. Em combate, ela compartilha sua contagem de Iniciativa, mas o turno dela é imediatamente após o seu. Ele obedece aos seus comandos verbais (nenhuma ação é necessária). Se você não emitir nenhum, ela executa a ação Esquivar e usa o movimento dela para evitar o perigo.\n\nUsando um Espaço de Magia de Círculo Su-\n\nperior. Use o círculo do espaço de magia para o círculo da magia no bloco de estatísticas.","Espírito Celestial\nCelestial Grande, Neutro\nCA 11 + o círculo da magia + 2 (apenas Defensor)\nPV 40 + 10 para cada círculo de magia acima de 5\nDeslocamento 9 m, Voo 12 m\nMOD SG MOD SG MOD SG\nFor 16 +3 +3 Des 14 +2 +2 Con 16 +3 +3\nInt 10 +0 +0 Sab 14 +2 +2 Car 16 +3 +3\nResistências Radiante\nImunidades Amedrontado, Enfeitiçado\nSentidos Visão no Escuro 18 m, Percepção Passiva 12\nIdiomas Celestial, compreende os idiomas que você fala\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência)\nAções\nAtaques Múltiplos . O espírito realiza um número de ataques igual à metade do círculo da magia (arredondado para baixo).\nArco Radiante (Apenas Vingador) . Jogada de Ataque à\nDistância: Bônus é igual ao seu modificador de ataque mágico, alcance 180 m. Dano: 2d6 + 2 + o círculo da magia pontos de dano Radiante.\nMaça Radiante (Apenas Defensor) . Jogada de Ataque Corpo a\nCorpo: Bônus é igual ao seu modificador de ataque mágico, alcance 1,5 m. Dano: 1d10 + 3 + o círculo da magia pontos de dano Radiante, e o espírito pode escolher a si mesmo ou outra criatura à vista dele a até 3 metros do alvo. A criatura escolhida obtém 1d10 Pontos de Vida Temporários.\nToque Curativo (1/Dia) . O espírito toca outra criatura. O alvo recupera Pontos de Vida iguais a 2d8 + o círculo da magia."],["Convocar Elemental",4,"Invocação",["druida","guardiao","mago"],"Ação","27 metros","V, S, M (ar, uma pedra, cinzas e água dentro de um frasco incrustado de ouro no valor de 400 ou mais PO)","Concentração, até 1 hora","Você invoca um Espírito Elemental. Ele se manifesta em um espaço desocupado à sua vista e no alcance da magia e usa o bloco de estatísticas do Espírito Ele-\n\nmental . Ao conjurar a magia, escolha um elemento: Água, Ar, Fogo ou Terra. A criatura se assemelha a uma forma bípede envolta no elemento escolhido, o que determina certas características no bloco de estatísticas da criatura. A criatura desaparece ao ser reduzida a 0 Pontos de Vida ou quando a magia termina.\n\nA criatura é uma aliada sua e de seus aliados. Em combate, ela compartilha sua contagem de Iniciativa, mas o turno dela é imediatamente após o seu. Ela obedece aos seus comandos verbais (nenhuma ação é necessária). Se você não emitir nenhum, ela executa a ação Esquivar e usa o movimento dela para evitar o perigo.\n\nUsando um Espaço de Magia de Círculo Superior. Use o círculo do espaço de magia para o círculo da magia no bloco de estatísticas.","Espírito Elemental\nElemental Médio, Neutro\nCA 11 + o círculo da magia\nPV 50 + 10 para cada círculo de magia acima de 4\nDeslocamento 12 m; Escavação 12 m (apenas Terra); Natação\n12 m (apenas Água); Voo 12 m (pairar; apenas Ar)\nMOD SG MOD SG MOD SG\nFor 18 +4 +4 Des 15 +2 +2 Con 17 +3 +3\nInt 4 –3 –3 Sab 10 +0 +0 Car 16 +3 +3\nResistências Ácido (apenas Água), Cortante e Perfurante\n(apenas Terra), Elétrico e Trovejante (apenas Ar)\nImunidades Ígneo (somente Fogo), Venenoso; Envenenado, Exaustão, Paralisado, Petrificado\nSentidos Visão no Escuro 18 m, Percepção Passiva 10\nIdiomas Primordial, compreende os idiomas que você fala\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência)\nTraços\nEstado Amorfo (Apenas Água, Ar e Fogo). O espírito pode se mover por um espaço tão estreito quanto 2,5 centímetros de largura sem contá-lo como Terreno Difícil.\nAções\nAtaques Múltiplos. O espírito realiza um número de ataques de Pancada igual à metade do círculo da magia (arredondado para baixo).\nPancada. Jogada de Ataque Corpo a Corpo: Bônus é igual ao seu modificador de ataque mágico, alcance 1,5 m. Dano: 1d10 +\n4 + o círculo da magia pontos de dano Contundente (apenas\nTerra), Elétrico (apenas Ar), Gélido (apenas Água) ou Ígneo\n(apenas Fogo)."],["Convocar Familiar",1,"Invocação",["mago"],"1 hora ou Ritual","3 metros","V, S, M (incenso queimando no valor de 10 ou mais PO, que a magia consome)","Instantânea","Você adquire o serviço de um familiar, um espírito que assume uma forma animal que você escolhe: Aranha,\n\nCoruja, Corvo, Doninha, Falcão, Gato, Lagarto, Mor-\n\ncego, Polvo, Rato, Sapo ou outra Fera que tenha um Nível de Desafio 0. Aparecendo em um espaço desocupado no alcance da magia, o familiar tem as estatísticas da forma escolhida (veja o apêndice B), embora seja um Celestial, Feérico ou Ínfero (à sua escolha) em vez de uma Fera. Seu familiar age independentemente de você, mas obedece aos seus comandos.\n\nConexão Telepática. Enquanto seu familiar estiver a até 30 metros de você, você pode se comunicar telepaticamente com ele. Além disso, como uma Ação Bônus, você pode ver através dos olhos do familiar e ouvir o que ele ouve até o início do seu próximo turno, obtendo os benefícios de quaisquer sentidos especiais que ele tenha.\n\nPor fim, ao conjurar uma magia com um alcance de toque, seu familiar pode entregar o toque. Seu familiar deve estar a até 30 metros de você, e ele deve executar uma Reação para entregar o toque quando você conjurar a magia.\n\nCombate. O familiar é um aliado seu e de seus aliados. Ele joga a Iniciativa dele e age no turno dele. Um familiar não pode atacar, mas pode realizar outras ações normalmente.\n\nDesaparecimento do Familiar. Quando o familiar é reduzido a 0 Pontos de Vida, ele desaparece. Ele reaparece depois que você conjura esta magia novamente. Como uma ação Usar Magia, você pode descartar temporariamente o familiar para uma mini dimensão. Como alternativa, você pode descartá-lo para sempre. Como uma ação Usar Magia enquanto está temporariamente descartado, você pode fazer com que ele reapareça em um espaço desocupado a até 9 metros de você. Sempre que o familiar é reduzido a 0 Pontos de Vida ou desaparece na mini dimensão, ele deixa para trás no espaço que ocupava qualquer coisa que estivesse vestindo ou carregando.\n\nApenas um Familiar. Você não pode ter mais de um familiar ao mesmo tempo. Ao conjurar esta magia enquanto você tem um familiar, você faz com que ele adote uma nova forma elegível."],["Convocar Feérico",3,"Invocação",["bruxo","druida","guardiao","mago"],"Ação","27 metros","V, S, M (uma flor dourada no valor de 300 ou mais PO)","Concentração, até 1 hora","Você invoca um Espírito Feérico. Ele se manifesta em um espaço desocupado à sua vista e no alcance da magia e usa o bloco de estatísticas do Espírito Feéri-\n\nco . Ao conjurar a magia, escolha um humor: Alegre, Enfurecido ou Malandro. A criatura se assemelha a uma criatura Feérica à sua escolha definida pelo humor escolhido, o que determina certos detalhes no bloco de estatísticas da criatura. A criatura desaparece se reduzida a 0 Pontos de Vida ou quando a magia termina. A criatura é uma aliada sua e de seus aliados. Em combate, ela compartilha sua contagem de Iniciativa, mas o turno dela é imediatamente após o seu. Ela obedece aos seus comandos verbais (nenhuma ação é necessária). Se você não emitir nenhum, ela executa a ação Esquivar e usa o movimento dela para evitar o perigo.\n\nUsando um Espaço de Magia de Círculo Superior. Use o círculo do espaço de magia para o círculo da magia no bloco de estatísticas.","Espírito Feérico\nFeérico Pequeno, Neutro\nCA 12 + o círculo da magia\nPV 30 + 10 para cada círculo de magia acima de 3\nDeslocamento 9 m, Voo 9 m\nMOD SG MOD SG MOD SG\nFor 13 +1 +1 Des 16 +3 +3 Con 14 +2 +2\nInt 14 +2 +2 Sab 11 +0 +0 Car 16 +3 +3\nImunidades Enfeitiçado\nSentidos Visão no Escuro 18 m, Percepção Passiva 10\nIdiomas Silvestre, compreende os idiomas que você fala\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência)\nAções\nAtaques Múltiplos. O espírito realiza um número de ataques com Lâmina Feérica igual à metade do círculo da magia\n(arredondado para baixo).\nLâmina Feérica. Jogada de Ataque Corpo a Corpo: Bônus é igual ao seu modificador de ataque mágico, alcance 1,5 m. Dano:\n2d6 + 3 + o círculo da magia pontos de dano Energético.\nAções Bônus\nPasso Feérico. O espírito se teleporta magicamente até 9 metros para um espaço desocupado à vista dele. Em seguida, ocorre um dos seguintes efeitos, com base no humor escolhido para o espírito:\nAlegre. Salvaguarda de Sabedoria: CD é igual a CD para evitar sua magia, uma criatura à vista do espírito e a até 3 metros dele. Falha: O alvo fica Enfeitiçado por você e pelo espírito por 1 minuto ou até que o alvo sofra qualquer dano.\nEnfurecido. O espírito tem Vantagem na próxima jogada de ataque que realizar antes do final deste turno.\nMalandro. O espírito preenche um Cubo de 3 metros de lado a até 1,5 metro dele com Escuridão mágica, que dura até o final do próximo turno dele."],["Convocar Montaria",2,"Invocação",["paladino"],"Ação","9 metros","V, S","Instantânea","Você convoca um ser sobrenatural que aparece como uma montaria leal em um espaço desocupado à sua escolha no alcance da magia. Essa criatura usa o bloco de estatísticas de Montaria Sobrenatural . Se você já tem uma montaria desta magia, a montaria é substituída pela nova.\n\nMontaria Sobrenatural Celestial Grande, Feérico ou Ínfero (À Sua Escolha), Neutro\n\nCA 10 + 1 por círculo de magia\n\nPV 5 + 10 por círculo de magia (a montaria tem um número de Dados de Vida [d10s] igual ao círculo da magia)\n\nDeslocamento 18 m, Voo 18 m (requer magia de 4º círculo ou superior)\n\nMOD SG MOD SG MOD SG\n\nFor 18 +4 +4 Des 12 +1 +1 Con 14 +2 +2\n\nInt 6 –2 –2 Sab 12 +1 +1 Car 8 –1 –1\n\nSentidos Percepção Passiva 11\n\nIdiomas Telepatia 1,5 km (funciona apenas com você)\n\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência) Traços\n\nVínculo Vital. Ao recuperar Pontos de Vida de uma magia 1º círculo ou superior, a montaria recupera o mesmo número de Pontos de Vida se você estiver a até 1,5 metro dela.\n\nAções\n\nPancada Sobrenatural. Jogada de Ataque Corpo a Corpo: Bônus é igual ao seu modificador de ataque mágico, alcance 1,5 m. Dano: 1d8 mais o círculo da magia de pontos de dano Radiante (Celestial), Psíquico (Feérico) ou Necrótico (Ínfero). Ações Bônus\n\nDerrubar Brilho (Apenas Ínfero; Recarrega após um Descanso\n\nLongo). Salvaguarda de Sabedoria: CD é igual a CD para evitar sua magia, uma criatura a até 18 metros à vista da montaria. Falha: O alvo tem a condição Amedrontado até o final do seu próximo turno.\n\nPasso Feérico (Apenas Feérico; Recarrega após um Descanso\n\nLongo). A montaria se teleporta, junto com seu cavaleiro, para um espaço desocupado à sua escolha a até 18 metros de distância de onde está.\n\nToque Curativo (Apenas Celestial; Recarrega após um Descanso\n\nLongo). Uma criatura a até 1,5 metro da montaria recupera um número de Pontos de Vida igual a 2d8 mais o círculo da magia. A montaria se assemelha a um animal grande e que se pode montar à sua escolha, como um alce, um camelo, um cavalo ou um lobo atroz. Sempre que conjurar a magia, escolha o tipo de criatura da montaria — Celestial, Feérico ou Ínfero — que determina certas características no bloco de estatísticas.\n\nCombate. A montaria é um aliado seu e de seus aliados. Em combate, ela compartilha sua contagem de Iniciativa e funciona como uma montaria controlada enquanto você a monta (conforme definido nas regras sobre combate montado). Se você tem a condição Incapacitado, a montaria age no turno dela imediatamente após o seu, de forma independente, concentrando-se em protegê-lo.\n\nDesaparecimento da Montaria. A montaria desaparece se é reduzida a 0 Pontos de Vida ou se você morrer. Quando desaparece, deixa para trás qualquer coisa que estivesse vestindo ou carregando. Se você conjurar esta magia novamente, você decide se invoca a montaria que desapareceu ou uma diferente.\n\nUsando um Espaço de Magia de Círculo Superior. Use o círculo do espaço de magia para o círculo da magia no bloco de estatísticas."],["Convocar Relâmpagos",3,"Invocação",["druida"],"Ação","36 metros","V, S","Concentração, até 10 minutos","Uma nuvem de tempestade aparece em um ponto no alcance da magia à sua vista acima de você. A nuvem tem a forma de um Cilindro com 3 metros de altura e um raio de 18 metros.\n\nAo conjurar a magia, escolha um ponto à sua vista sob a nuvem. Um relâmpago é disparado da nuvem até aquele ponto. Cada criatura a até 1,5 metro desse ponto realiza uma salvaguarda de Destreza, sofrendo 3d10 pontos de dano Elétrico se falhar ou metade desse dano em caso de sucesso.\n\nAté que a magia termine, você pode executar uma ação Usar Magia para invocar relâmpagos desse modo novamente, escolhendo o mesmo ponto ou um diferente. Se o conjurador estiver ao ar livre durante uma tempestade ao conjurar esta magia, ele passa a controlar a tempestade existente em vez de criar uma nova. Nessas condições, o dano da magia é aumentado em 1d10.\n\nUsando um Espaço de Magia de Círculo Superior. O dano é aumentado em 1d10 pontos para cada círculo de espaço de magia acima de 3."],["Corda Extradimensional",2,"Transmutação",["mago"],"Ação","Toque","V, S, M (um pedaço de corda)","1 hora","Você toca uma corda. Uma extremidade dela paira para cima até que a corda fique perpendicular ao chão ou alcance um teto. Na extremidade superior da corda, um portal Invisível de 1 metro por 1,5 metro se abre para um espaço extradimensional que permanece até que a magia termine. Esse espaço pode ser alcançado escalando a corda, que pode ser puxada para dentro ou para fora dele.\n\nO espaço pode conter até oito criaturas Médias ou menores. Ataques, magias e outros efeitos não podem passar para dentro ou para fora do espaço, mas as criaturas dentro dele podem ver através do portal. Qualquer coisa dentro do espaço cai quando a magia termina."],["Cordão de Flechas",2,"Transmutação",["guardiao"],"Ação","Toque","V, S, M (uma trança ornamental)","8 horas","Toque até quatro flechas ou virotes não mágicas e finque-os no chão em seu espaço. Até que a magia termine, a munição não pode ser retirada fisicamente. Sempre que uma criatura que não seja você entrar em um espaço a até 9 metros da munição pela primeira vez ou terminar o turno dela lá, uma das peças de munição voa para atingi-la. A criatura deve ser bem-sucedida em uma salvaguarda de Destreza ou sofre 2d4 pontos de dano Perfurante. A munição é então destruída. A magia termina quando nenhuma munição permanecer fincada no chão.\n\nAo conjurar esta magia, você pode designar quaisquer criaturas que escolher, e a magia as ignora.\n\nUsando um Espaço de Magia de Círculo Superior. A quantidade de munição que pode ser afetada aumenta em dois para cada círculo de espaço de magia acima de 2."],["Coroa da Loucura",2,"Encantamento",["bardo","bruxo","feiticeiro","mago"],"Ação","36 metros","V, S","Concentração, até 1 minuto","Uma criatura à sua vista e no alcance da magia deve ser bem-sucedida em uma salvaguarda de Sabedoria ou tem a condição Enfeitiçado pela duração da magia. A criatura é bem-sucedida automaticamente se não for Humanoide.\n\nUma coroa espectral aparece na cabeça do alvo Enfeitiçado, e ele deve executar uma ação antes de se mover em cada um de seus turnos para realizar um ataque corpo a corpo contra uma criatura diferente dela própria que você escolher mentalmente. O alvo pode agir normalmente no turno dele se você não escolher nenhuma criatura ou se nenhuma criatura estiver ao alcance dele. O alvo repete a salvaguarda no final de cada um dos turnos dele, encerrando a magia em caso de sucesso.\n\nNos seus turnos subsequentes, você deve executar a ação Usar Magia para manter o controle sobre o alvo, ou a magia encerra."],["Corrente de Relâmpagos",6,"Evocação",["feiticeiro","mago"],"Ação","45 metros","V, S, M (três alfinetes de prata)","Instantânea","Você lança um relâmpago em direção a um alvo à sua vista e no alcance da magia. Três relâmpagos então saltam desse alvo para até três outros alvos à sua escolha, cada um dos quais deve estar a até 9 metros do primeiro alvo. Um alvo pode ser uma criatura ou um objeto, e pode ser alvo de apenas um dos relâmpagos.\n\nCada alvo realiza uma salvaguarda de Destreza, sofrendo 10d8 pontos de dano Elétrico se falhar, ou metade desse dano em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. Um raio adicional salta do primeiro alvo para outro alvo para cada círculo de espaço de magia acima de 6."],["Crescer Espinhos",2,"Transmutação",["druida","guardiao"],"Ação","45 metros","V, S, M (sete espinhos)","Concentração, até 10 minutos","Do solo, em uma Esfera de 6 metros de raio centrada em um ponto no alcance da magia, brotam estacas e espinhos duros. A área se torna Terreno Difícil pela duração da magia. Quando uma criatura se move para dentro ou na área da magia, ela sofre 2d4 pontos de dano Perfurante por cada 1,5 metro que percorre. A transformação do solo é camuflada para parecer natural. Qualquer criatura que não consiga ver a área quando a magia é conjurada deve executar uma ação Procurar e ser bem-sucedida em um teste de Sabedoria (Percepção ou Sobrevivência) contra a CD para evitar sua magia para reconhecer o terreno como perigoso antes de entrar nele."],["Crescimento de Plantas",3,"Transmutação",["bardo","druida","guardiao"],"Ação (Crescimento Excessivo) ou 8 horas (Fertilização)","45 metros","V, S","Instantânea","Esta magia canaliza vitalidade para as plantas. O tempo de conjuração que você usa determina se a magia tem o efeito Crescimento Excessivo ou Fertilização , apresentados a seguir.\n\nCrescimento Excessivo. Escolha um ponto no alcance da magia. Todas as plantas normais em uma Esfera de 30 metros de raio centrada nesse ponto tornam-se espessas e crescem. Uma criatura que se move por essa área deve gastar 4 metros de deslocamento para cada 1 metro que se move. Você pode anular o efeito em uma ou mais áreas de qualquer tamanho dentro da área da magia.\n\nFertilização. Todas as plantas em um raio de 800 metros centradas em um ponto no alcance da magia ficam fertilizadas por 365 dias. As plantas produzem o dobro da quantidade normal de alimento quando colhidas. Elas podem se beneficiar de apenas um Crescimento de Plantas por ano."],["Criar Chamas",0,"Invocação",["druida"],"Ação Bônus","Pessoal","V, S","10 minutos","Uma chama bruxuleante surge em sua mão e permanece lá pela duração da magia. Enquanto estiver lá, a chama não emite calor, não queima nada, e emite Luz Plena em um raio de 6 metros e Meia-luz por mais 6 metros. A magia se encerra se você a conjurar novamente. Até que a magia termine, você pode executar uma ação Usar Magia para arremessar a chama em uma criatura ou objeto a até 18 metros de você. Realize um ataque mágico à distância. Em caso de acerto, o alvo sofre 1d8 pontos de dano Ígneo.\n\nAprimoramento de Truque. O dano aumenta em 1d8 quando você atinge os níveis 5 (2d8), 11 (3d8) e 17 (4d8)."],["Criar Comida e Água",3,"Invocação",["clerigo","paladino"],"Ação","9 metros","V, S","Instantânea","Você cria 20 quilos de comida e 120 litros de água potável no chão ou em recipientes no alcance da magia — ambos úteis para afastar os perigos da desnutrição e desidratação. A comida não é temperada, mas nutritiva e se parece com um alimento à sua escolha, e a água é limpa. A comida estraga após 24 horas se não for consumida."],["Criar Mortos-Vivos",6,"Necromancia",["bruxo","clerigo","mago"],"1 minuto","3 metros","V, S, M (uma pedra de ônix preto de 150 ou mais PO para cada cadáver)","Instantânea","Você pode conjurar esta magia apenas à noite. Escolha até três cadáveres de Humanoides Médios ou Pequenos no alcance da magia. Cada um se torna um Carni-\n\nçal sob seu controle (veja também o Livro dos Monstros para o bloco de estatísticas).\n\nComo uma Ação Bônus em cada um dos seus turnos, você pode comandar mentalmente qualquer criatura que tenha animado com essa magia se a criatura estiver a até 36 metros de você (se você controlar várias criaturas, pode comandar qualquer uma delas ao mesmo tempo, emitindo o mesmo comando para elas). Você decide qual ação a criatura executa e para onde ela se move no próximo turno dela, ou pode emitir um comando geral, como proteger um determinado lugar. Se você não der nenhum comando, a criatura executa a ação Esquivar e move-se apenas para evitar dano. Uma vez dada uma ordem, a criatura continua a seguir a ordem até que a tarefa seja concluída.\n\nA criatura fica sob seu controle por 24 horas, após as quais ela deixa de obedecer a qualquer comando que você tenha dado a ela. Para manter o controle da criatura por mais 24 horas, é necessário conjurar esta magia na criatura antes que o período atual de 24 horas termine. Esse uso da magia reafirma seu controle sobre até três criaturas que você animou com essa magia em vez de animar novas.\n\nUsando um Espaço de Magia de Círculo Superior. Se você usar um espaço de magia de 7º círculo, você pode animar ou reafirmar o controle sobre quatro Carni-\n\nçais . Se você usar um espaço de magia de 8º círculo, você pode animar ou reafirmar o controle sobre dois\n\nCarneçais ou Inumanos ou cinco Carniçais . Se você usar um espaço de magia de 9º círculo, poderá animar ou reafirmar o controle sobre seis Carniçais , três Car-\n\nneçais ou Inumanos , ou duas Múmias . Veja também o Livro dos Monstros para esses blocos de estatísticas."],["Criar Passagem",5,"Transmutação",["mago"],"Ação","9 metros","V, S, M (uma pitada de sementes de gergelim)","1 hora","Uma passagem aparece em um ponto à sua vista em uma superfície de madeira, gesso ou pedra (como uma parede, teto ou piso) no alcance e pela duração da magia. Você escolhe as dimensões da abertura: até 1,5 metro de largura, 2,5 metros de altura e 6 metros de profundidade. A passagem não cria instabilidade em uma estrutura ao seu redor.\n\nQuando a abertura desaparece, qualquer criatura ou objeto ainda na passagem criada pela magia é ejetado com segurança para um espaço desocupado mais próximo da superfície na qual você conjurou a magia."],["Criar ou Destruir Água",1,"Transmutação",["clerigo","druida"],"Ação","9 metros","V, S, M (uma mistura de água e areia)","Instantânea","Você faz uma das seguintes coisas:\n\nCriar Água. Você cria até 40 litros de água limpa no alcance da magia em um recipiente aberto. Como alternativa, a água cai como chuva em um Cubo de 9 metros de lado no alcance da magia, extinguindo chamas expostas na área.\n\nDestruir Água. Você destrói até 40 litros de água em um recipiente aberto no alcance da magia. Como alternativa, você dispersa uma névoa em um Cubo de 9 metros de lado no alcance da magia.\n\nUsando um Espaço de Magia de Círculo Superior. Você cria ou destrói 40 litros adicionais de água, ou o tamanho do Cubo aumenta em 1,5 metro de lado, para cada círculo de espaço de magia acima de 1."],["Criação",5,"Ilusão",["feiticeiro","mago"],"1 minuto","9 metros","V, S, M (um pincel)","Especial","Você puxa mechas de material obscuro do Sombral para criar um objeto no alcance da magia. É um objeto de matéria vegetal (tecido, corda, madeira e algo similar) ou matéria mineral (pedra, cristal, metal e algo similar). O objeto não deve ser maior que um Cubo de 1,5 metro de lado, e deve ter a forma e ser de um material que você já viu.\n\nA duração da magia depende do material do objeto, conforme mostrado na tabela Materiais. Se o objeto for composto por vários materiais, use a duração mais curta. Usar qualquer objeto criado por esta magia como componente Material de outra magia faz com que a outra magia falhe.\n\nMateriais\n\nMateriais Duração Matéria vegetal 24 horas Rocha ou cristal 12 horas Metais preciosos 1 hora Pedras preciosas 10 minutos Adamantina ou mitral 1 minuto\n\nUsando um Espaço de Magia de Círculo Superior. O Cubo aumenta em 1,5 metro de lado para cada círculo de espaço de magia acima de 5."],["Cura Completa",6,"Abjuração",["clerigo","druida"],"Ação","18 metros","V, S","Instantânea","Escolha uma criatura à sua vista e no alcance da magia. Uma energia positiva flui pelo alvo, restaurando 70 Pontos de Vida. Esta magia também remove as condições Cego, Envenenado e Surdo do alvo.\n\nUsando um Espaço de Magia de Círculo Superior. A cura aumenta em 10 para cada círculo de espaço de magia acima de 6."],["Cura Completa em Massa",9,"Abjuração",["clerigo"],"Ação","18 metros","V, S","Instantânea","Uma onda de energia curativa flui de você para as criaturas ao seu redor. Você restaura até 700 Pontos de Vida, divididos à sua escolha entre qualquer número de criaturas à sua vista e no alcance da magia. Criaturas curadas por esta magia também têm as condições Cego, Envenenado e Surdo removidas."],["Curar Ferimentos",1,"Abjuração",["bardo","clerigo","druida","guardiao","paladino"],"Ação","Toque","V, S","Instantânea","Uma criatura que você toca recupera um número de Pontos de Vida igual a 2d8 mais seu modificador de atributo de conjuração.\n\nUsando um Espaço de Magia de Círculo Superior. A cura aumenta em 2d8 para cada círculo de espaço de magia acima de 1."],["Curar Ferimentos em Massa",5,"Abjuração",["bardo","clerigo","druida"],"Ação","18 metros","V, S","Instantânea","Uma onda de energia curativa sai de um ponto à sua vista e no alcance da magia. Escolha até seis criaturas em uma Esfera de 9 metros de raio centrada nesse ponto. Cada alvo recupera Pontos de Vida iguais a 5d8 mais o seu modificador de atributo de conjuração.\n\nUsando um Espaço de Magia de Círculo Superior. A cura aumenta em 1d8 para cada círculo de espaço de magia acima de 5."],["Cárcere de Energia",7,"Evocação",["bardo","bruxo","mago"],"Ação","30 metros","V, S, M (rubi em pó no valor de 1.500 ou mais PO, que a magia consome)","Concentração, até 1 hora","Uma prisão imóvel, invisível e em forma de Cubo composta de força energética surge em torno de uma área à sua escolha no alcance da magia. A prisão pode ser uma jaula ou uma caixa sólida, à sua escolha.\n\nUma prisão na forma de uma jaula pode ter até 6 metros de lado e é formada com barras de 1,5 centímetro de diâmetro com espaços de 1,5 centímetro entre elas. Uma prisão na forma de caixa pode ter até 3 metros de lado, criando uma barreira sólida que impede que qualquer matéria passe por ela e bloqueia quaisquer magias conjuradas para dentro ou para fora da área.\n\nAo conjurar a magia, qualquer criatura que esteja completamente na área da jaula fica presa. Criaturas apenas parcialmente dentro da área, ou aquelas grandes demais para caber dentro dela, são empurradas para longe do centro da área até que estejam completamente fora dela.\n\nUma criatura na jaula não pode deixá-la por meios não mágicos. Se a criatura tentar usar teleporte ou viagem interplanar para sair, ela deve primeiro realizar uma salvaguarda de Carisma. Em caso de sucesso, a criatura pode usar essa magia para sair da jaula. Se falhar, a criatura não sai da jaula e desperdiça a magia ou o efeito. A jaula também se estende para o Plano Etéreo, bloqueando viagens etéreas.\n\nEsta magia não pode ser dissipada por Dissipar Magia ."],["Cão Fiel de Mordenkainen",4,"Invocação",["mago"],"Ação","9 metros","V, S, M (um apito de prata)","8 horas","Você conjura um cão de guarda fantasmagórico em um espaço desocupado à sua vista e no alcance da magia. O cão permanece pela duração magia ou até que vocês dois estejam separados por mais de 90 metros.\n\nNinguém além de você pode ver o cão, e ele é intangível e invulnerável. Quando uma criatura de tamanho Pequeno ou maior se aproxima a 9 metros dele sem antes falar a senha que você especificou ao conjurar essa magia, o cão começa a latir alto. O cão possui Visão Verdadeira com alcance de 9 metros.\n\nNo início de cada um dos seus turnos, o cão tenta morder um inimigo a até 1,5 metro dele. Esse inimigo deve ser bem-sucedido em uma salvaguarda de Destreza ou sofre 4d8 pontos de dano Energético.\n\nNos seus turnos subsequentes, você pode executar uma ação Usar Magia para mover o cão até 9 metros."],["Círculo Mágico",3,"Abjuração",["bruxo","clerigo","mago","paladino"],"1 minuto","3 metros","V, S, M (sal e prata em pó no valor de 100 ou mais PO, que a magia consome)","1 hora","Você cria um Cilindro de energia mágica com 3 metros de raio e 6 metros de altura, centrado em um ponto visível e ao alcance no chão. Runas brilhantes surgem onde o Cilindro toca o chão ou outra superfície.\n\nEscolha um ou mais dos seguintes tipos de criaturas: Celestiais, Elementais, Feéricos, Ínferos ou Mortos-Vivos. O círculo afeta uma criatura do tipo escolhido das seguintes maneiras:\n\nA criatura não pode entrar voluntariamente no Cilindro por meios não mágicos. Se a criatura tentar usar teleporte ou viagem interplanar para fazer isso, ela deve primeiro ser bem-sucedida em uma salvaguarda de Carisma.\n\nA criatura tem Desvantagem nas jogadas de ataque contra alvos dentro do Cilindro.\n\nAlvos dentro do Cilindro não podem ser possuídos ou ter a condição Amedrontado ou Enfeitiçado pela criatura. Ao conjurar essa magia, você pode fazer com que ela funcione na direção inversa, impedindo que uma criatura do tipo especificado saia do Cilindro e protegendo alvos fora dele.\n\nUsando um Espaço de Magia de Círculo Superior. A duração aumenta em 1 hora para cada círculo de espaço de magia acima de 3."],["Círculo da Morte",6,"Necromancia",["bruxo","feiticeiro","mago"],"Ação","45 metros","V, S, M (o pó de uma pérola negra esmagada no valor de 500 ou mais PO)","Instantânea","Uma Esfera de 18 metros de raio de energia negativa parte de um ponto à sua escolha no alcance da magia. Cada criatura nessa área realiza uma salvaguarda de Constituição, sofrendo 8d8 pontos de dano Necrótico se falhar ou metade desse dano em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 2d8 para cada círculo de espaço de magia acima de 6."],["Círculo de Poder",5,"Abjuração",["clerigo","mago","paladino"],"Ação","Pessoal","V","Concentração, até 10 minutos","Uma aura irradia de você em uma Emanação de 9 metros pela duração da magia. Enquanto estiver na aura, você e seus aliados têm Vantagem em salvaguardas contra magias e outros efeitos mágicos. Quando uma criatura afetada realiza uma salvaguarda contra uma magia ou efeito mágico que permite que sofra apenas metade do dano, ela não sofre dano em caso de sucesso."],["Círculo de Teleporte",5,"Invocação",["bardo","bruxo","feiticeiro","mago"],"1 minuto","3 metros","V, M (tintas raras no valor de 50 ou mais PO, que a magia consome)","1 rodada","Ao conjurar a magia, você desenha um círculo de 1,5 metro de raio no chão inscrito com símbolos que ligam sua localização a um círculo de teleporte permanente à sua escolha, cuja sequência de símbolos você conhece e que está no mesmo plano de existência que você. Um portal cintilante se abre dentro do círculo que você desenhou e permanece aberto até o final do seu próximo turno. Qualquer criatura que entre no portal aparece instantaneamente a 1,5 metro do círculo de destino ou no espaço desocupado mais próximo, se esse espaço estiver ocupado.\n\nMuitos dos principais templos, guildas e outros lugares importantes têm círculos de teleporte permanentes. Cada círculo inclui uma sequência de símbolos única — uma sequência de runas dispostas em um determinado padrão. Ao adquirir a capacidade de conjurar essa magia pela primeira vez, você aprende as sequências de símbolos para dois destinos no Plano Material, escolhidos pelo Mestre. Durante suas aventuras, é possível aprender sequências adicionais. Você pode memorizar um novo símbolo após estudá-lo por 1 minuto.\n\nVocê pode criar um círculo de teleporte permanente conjurando essa magia no mesmo local todos os dias por 365 dias."],["Cúpula Antivida",5,"Abjuração",["druida"],"Ação","Pessoal","V, S","Concentração, até 1 hora","Uma aura estende-se de você em uma Emanação de 3 metros pela duração da magia. A aura impede que criaturas que não sejam Constructos e Mortos-Vivos passem ou alcancem através dela. Uma criatura afetada pode conjurar magias ou realizar ataques com armas à Distância ou com Extensão através da barreira.\n\nSe você se mover de modo que uma criatura afetada seja forçada a atravessar a barreira, a magia encerra."],["Danação",1,"Encantamento",["bruxo"],"Ação Bônus","27 metros","V, S, M (o olho petrificado de uma salamandra)","Concentração, até 1 hora","Você coloca uma maldição em uma criatura à sua vista e no alcance da magia. Até que a magia termine, você causa 1d6 pontos de dano Necrótico adicional ao alvo sempre que o acertar com uma jogada de ataque. Além disso, escolha um atributo ao conjurar a magia. O alvo tem Desvantagem nos testes de atributo realizados com o atributo escolhido.\n\nSe o alvo é reduzido a 0 Pontos de Vida antes que esta magia termine, você pode executar uma ação Bônus em um turno posterior para amaldiçoar uma nova criatura.\n\nUsando um Espaço de Magia de Círculo Superior. Sua Concentração pode durar mais com um espaço de magia de 2º círculo (em até 4 horas), 3º–4º círculo (em até 8 horas) ou 5º círculo ou superior (em até 24 horas)."],["Dança Irresistível de Otto",6,"Encantamento",["bardo","mago"],"Ação","9 metros","V","Concentração, até 1 minuto","Uma criatura à sua vista e no alcance da magia deve realizar uma salvaguarda de Sabedoria. Em caso de sucesso, o alvo dança comicamente até o final do próximo turno dele, durante o qual ele deve gastar todo o movimento para dançar no mesmo lugar.\n\nSe falhar, o alvo tem a condição Enfeitiçado pela duração da magia. Enquanto Enfeitiçado, o alvo dança comicamente, deve usar todo o seu movimento para dançar no mesmo lugar e tem Desvantagem em salvaguardas de Destreza e jogadas de ataque, e outras criaturas têm Vantagem em jogadas de ataque contra ele. Em cada um dos turnos do alvo, ele pode executar uma ação para se recompor e repetir a salvaguarda, encerrando a magia em caso de sucesso."],["De Carne para Pedra",6,"Transmutação",["druida","feiticeiro","mago"],"Ação","18 metros","V, S, M (uma pena de cocatriz)","Concentração, até 1 minuto","Você tenta transformar uma criatura à sua vista e no alcance da magia em pedra. O alvo realiza uma salvaguarda de Constituição. Se falhar, ele tem a condição Contido pela duração da magia. Em uma salvaguarda bem-sucedida, o Deslocamento dele é 0 até o início do seu próximo turno. Constructos são bem-sucedidos automaticamente na salvaguarda.\n\nUm alvo Contido realiza outra salvaguarda de Constituição no final de cada um dos turnos dele. Em caso de sucesso por três vezes contra esta magia, ela se encerra. Se falhar por três vezes, ele é transformado em pedra e tem a condição Petrificado pela duração da magia. Os sucessos e fracassos não precisam ser consecutivos; acompanhe ambos até que o alvo alcance três de um tipo.\n\nSe você mantiver sua Concentração nesta magia por toda a duração possível, o alvo tem a condição Petrificado até que a condição seja encerrada por Restauração Maior ou efeito mágico semelhante."],["Dedo da Morte",7,"Necromancia",["bruxo","feiticeiro","mago"],"Ação","18 metros","V, S","Instantânea","Você libera energia negativa através de uma criatura à sua vista e no alcance da magia. O alvo realiza uma salvaguarda de Constituição, sofrendo 7d8 + 30 pontos de dano Necrótico se falhar ou metade desse dano em caso de sucesso.\n\nUm Humanoide morto por esta magia levanta-se no início do seu próximo turno como um Zumbi (veja o apêndice B) que segue suas ordens verbais."],["Defensor da Fé",4,"Invocação",["clerigo"],"Ação","9 metros","V","8 horas","Um defensor espectral Grande aparece e paira pela duração da magia em um espaço desocupado à sua vista e no alcance da magia. O defensor ocupa esse espaço e não pode ser atingido, e aparece em uma forma apropriada para sua divindade ou panteão.\n\nQualquer inimigo que se mova para um espaço a até 3 metros do defensor pela primeira vez em um turno ou inicie o turno lá realiza uma salvaguarda de Destreza, sofrendo 20 pontos de dano Radiante se falhar, ou metade desse dano em caso de sucesso. O defensor desaparece quando causa um total de 60 pontos de dano."],["Desejo",9,"Invocação",["feiticeiro","mago"],"Ação","Pessoal","V","Instantânea","Desejo é a magia mais poderosa que um mortal pode conjurar. Ao simplesmente falar em voz alta, você pode alterar a própria realidade.\n\nO uso básico dessa magia é duplicar qualquer outra magia de 8º círculo ou inferior. Ao usá-la dessa forma, você não precisa atender a nenhum requisito para conjurar essa magia, incluindo Componentes caros. A magia simplesmente surte efeito.\n\nComo alternativa, você pode criar um dos seguintes efeitos à sua escolha:\n\nAprendizado Repentino. Você substitui um dos seus talentos por outro talento para o qual seja elegível. Você perde todos os benefícios do talento antigo e obtém os benefícios do novo. Não é possível substituir um talento que seja pré-requisito para qualquer um dos seus outros talentos ou características.\n\nCriação de Objeto. Você cria um objeto no valor de até 25.000 PO que não seja um item mágico. O objeto pode ter no máximo 90 metros em qualquer dimensão e aparece em um espaço desocupado à sua vista, no chão.\n\nImunidade à Magia. Você concede a até dez criaturas à sua vista imunidade a uma única magia ou outro efeito mágico por 8 horas.\n\nRefazer Jogada. Você desfaz um único evento recente, forçando uma nova jogada de qualquer jogada de dado realizada no último turno (incluindo o seu último turno). A realidade se remodela para acomodar o novo resultado. Por exemplo, uma magia Desejo pode desfazer uma falha na salvaguarda de um aliado ou um Acerto Crítico de um inimigo. Você pode forçar refazer a jogada com Vantagem ou Desvantagem, e escolher se usa o novo resultado ou a jogada original.\n\nReformar a Realidade. Você pode expressar um desejo que não se encaixe nos outros efeitos. Para isso, declare seu desejo ao Mestre da maneira mais clara possível. O Mestre possui total liberdade para decidir o que acontece; quanto maior o desejo, maior a chance de algo dar errado. A magia pode falhar, o efeito desejado pode ser apenas parcialmente alcançado ou você pode enfrentar consequências inesperadas devido à forma como formulou seu desejo. Por exemplo, desejar que um vilão esteja morto pode levá-lo a um futuro em que o vilão já não está vivo, removendo o seu personagem do jogo. Desejar um item mágico Lendário ou um Artefato pode transportá-lo imediatamente ao local do atual proprietário. Se o desejo concedido afetar uma comunidade, região ou o mundo, é provável que você atraia inimigos poderosos. Se o desejo impactar uma divindade, os servos dela podem intervir rapidamente para impedir ou encorajar você a formular o desejo de uma determinada maneira. Se o desejo ameaçar o multiverso, a Cidade de Sigil ou a Senhora da Dor, você terá uma visão dela por um instante; ela balança cabeça e o desejo falha.\n\nResistência. Você concede a até dez criaturas à sua vista Resistência a um tipo de dano à sua escolha. Essa Resistência é permanente.\n\nSaúde Instantânea. Você permite a si mesmo e a até vinte criaturas à sua vista recuperar todos os Pontos de Vida, além de encerrar todos os efeitos sobre elas listados na magia Restauração Maior .\n\nO estresse de conjurar Desejo para produzir qualquer efeito além de duplicar outra magia enfraquece você. Após suportar esse estresse, sempre que conjurar uma magia até completar um Descanso Longo, você sofre 1d10 pontos de dano Necrótico por círculo da magia. Esse dano não pode ser reduzido ou evitado de nenhuma maneira. Além disso, seu valor de Força se torna 3 por 2d4 dias. Para cada um desses dias em que você descanse e realize apenas atividades leves, o tempo de recuperação diminui em 2 dias. Por fim, há 33% de chance de que você nunca mais consiga conjurar Desejo se sofrer esse estresse."],["Desintegrar",6,"Transmutação",["feiticeiro","mago"],"Ação","18 metros","V, S, M (uma pedra-ímã e poeira)","Instantânea","Você dispara um raio verde em um alvo à sua vista e no alcance da magia. O alvo pode ser uma criatura, um objeto não mágico ou uma criação de energia mágica, como a muralha criada por Muralha de Energia .\n\nUma criatura alvo desta magia realiza uma salvaguarda de Destreza. Se falhar, o alvo sofre 10d6 + 40 pontos de dano Energético. Se esse dano reduz o alvo a 0 Pontos de Vida, ele e tudo o que não é mágico que está usando e carregando são desintegrados em pó cinza. O alvo só pode ser revivido por uma magia Desejo ou Ressurreição Verdadeira .\n\nEsta magia desintegra automaticamente um objeto não mágico Grande ou menor, ou uma criação de energia mágica. Se tal alvo for Enorme ou maior, esta magia desintegra uma porção de um Cubo de 3 metros de lado dele.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 3d6 para cada círculo de espaço de magia acima de 6."],["Despedaçar",2,"Evocação",["bardo","feiticeiro","mago"],"Ação","18 metros","V, S, M (uma lasca de mica)","Instantânea","Um barulho alto irrompe de um ponto à sua escolha no alcance da magia. Cada criatura em uma esfera com raio de 3 metros centrada nesse ponto realiza uma a salvaguarda de Constituição, sofrendo 3d8 pontos de dano Trovejante se falhar, ou metade desse dano em caso de sucesso. Um Constructo tem Desvantagem na salvaguarda.\n\nUm objeto não mágico que não esteja sendo usado ou carregado também sofre o dano se estiver na área da magia.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 2."],["Despertar",5,"Transmutação",["bardo","druida"],"8 horas","Toque","V, S, M (uma ágata no valor de 1.000 ou mais PO, que a magia consome)","Instantânea","Você passa o tempo de conjuração traçando caminhos mágicos em uma pedra preciosa e, em seguida, toca o alvo. O alvo deve ser uma criatura do tipo Fera ou Planta com uma Inteligência de 3 ou menos, ou uma planta natural que não seja uma criatura. O alvo obtém um valor de Inteligência de 10 e a capacidade de falar um idioma que você conhece. Se o alvo for uma planta natural, ele se torna uma criatura do tipo Planta e recebe a capacidade de mover seus membros, raízes, videiras, trepadeiras e assim por diante, e obtém sentidos semelhantes aos de um humano. O Mestre escolhe as estatísticas apropriadas para a Planta desperta, como as estatísticas do Arbusto Desperto ou da Árvore\n\nDesperta no Livro dos Monstros .\n\nO alvo desperto tem a condição Enfeitiçado por 30 dias ou até que você ou seus aliados lhe causem dano. Quando essa condição termina, a criatura despertada decide qual atitude tem em relação a você."],["Despistar",5,"Ilusão",["bardo","bruxo","mago"],"Ação","Pessoal","S","Concentração, até 1 hora","Você tem a condição Invisível ao mesmo tempo que uma cópia ilusória sua aparece onde você está. A cópia permanece pela duração da magia, mas a invisibilidade termina imediatamente após você realizar uma jogada de ataque, causar dano ou conjurar uma magia.\n\nCom uma ação Usar Magia, você pode mover a cópia ilusória até duas vezes o seu Deslocamento e fazer com que ela gesticule, fale e se comporte da forma que você desejar. Ela é intangível e invulnerável.\n\nVocê pode ver através dos olhos dela e ouvir pelos ouvidos dela, como se estivesse onde ela está."],["Destruição Atordoante",4,"Encantamento",["paladino"],"Ação Bônus, que você realiza imediatamente após atingir uma criatura com uma arma Corpo a Corpo ou um Ataque Desarmado","Pessoal","V","Instantânea","O alvo sofre 4d6 pontos de dano Psíquico adicionais do ataque e deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Atordoado até o final do seu próximo turno.\n\nUsando um Espaço de Magia de Círculo Superior. O dano adicional aumenta em 1d6 para cada círculo de espaço de magia acima de 4."],["Destruição Banidora",5,"Invocação",["paladino"],"Ação Bônus, que você realiza imediatamente após atingir uma criatura com uma arma Corpo a Corpo ou um Ataque Desarmado","Pessoal","V","Concentração, até 1 minuto","O alvo atingido pela jogada de ataque sofre um adicional de 5d10 pontos de dano Energético do ataque. Se o ataque reduzir o alvo a 50 Pontos de Vida ou menos, o alvo deve ser bem-sucedido em uma salvaguarda de Carisma ou é transportado para um semiplano inofensivo pela duração da magia. Enquanto estiver lá, o alvo tem a condição Incapacitado. Quando a magia termina, o alvo reaparece no espaço que deixou ou no espaço desocupado mais próximo se esse espaço estiver ocupado."],["Destruição Cauterizante",1,"Evocação",["paladino"],"Ação Bônus, que você realiza imediatamente após acertar um alvo com uma arma Corpo a Corpo ou um Ataque Desarmado","Pessoal","V","1 minuto","Ao acertar o alvo, o ataque causa 1d6 pontos de dano Ígneo adicional. No início de cada turno do alvo, até que a magia termine, ele sofre 1d6 pontos de dano Ígneo e, então, realiza uma salvaguarda de Constituição. Se falhar, a magia continua; se for bem-sucedido, a magia se encerra.\n\nUsando um Espaço de Magia de Círculo Superior. Todo dano aumenta em 1d6 para cada círculo de espaço de magia acima de 1."],["Destruição Cegante",3,"Evocação",["paladino"],"Ação Bônus, que você realiza imediatamente após atingir uma criatura com uma arma Corpo a Corpo ou um Ataque Desarmado","Pessoal","V","1 minuto","O alvo atingido pelo ataque sofre 3d8 pontos de dano Radiante adicionais e tem a condição Cego até que a magia termine. No final de cada um dos turnos dele, o alvo Cego realiza uma salvaguarda de Constituição, encerrando a magia em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O dano adicional aumenta em 1d8 para cada círculo de espaço de magia acima de 3."],["Destruição Colérica",1,"Necromancia",["paladino"],"Ação Bônus, que você realiza imediatamente após atingir uma criatura com uma arma Corpo a Corpo ou um Ataque Desarmado","Pessoal","V","1 minuto","O alvo sofre 1d6 pontos de dano Necrótico adicionais do ataque e deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Amedrontado até que a magia termine. No final de cada um dos turnos dele, o alvo Amedrontado repete a salvaguarda, encerrando a magia em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 pontos para cada círculo de espaço de magia acima de 1."],["Destruição Divina",1,"Evocação",["paladino"],"Ação Bônus, que você realiza imediatamente após acertar um alvo com uma arma Corpo a Corpo ou um Ataque Desarmado","Pessoal","V","Instantânea","O alvo sofre 2d8 pontos de dano Radiante adicionais do ataque. O dano aumenta em 1d8 se o alvo for um Ínfero ou um Morto-vivo.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 1."],["Destruição Estrondosa",1,"Evocação",["paladino"],"Ação Bônus, que você realiza imediatamente após acertar um alvo com uma arma Corpo a Corpo ou um Ataque Desarmado","Pessoal","V","Instantânea","Seu ataque soa como um trovão audível a até 90 metros de você, e o alvo sofre 2d6 pontos de dano Trovejante adicionais do ataque. Além disso, se o alvo for uma criatura, ele deve ser bem-sucedido em uma salvaguarda de Força ou é empurrado 3 metros para longe de você e tem a condição Caído.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 pontos para cada círculo de espaço de magia acima de 1."],["Destruição Radiante",2,"Transmutação",["paladino"],"Ação Bônus, que você realiza imediatamente após atingir uma criatura com uma arma Corpo a Corpo ou um Ataque Desarmado","Pessoal","V","Concentração, até 1 minuto","O alvo atingido pelo ataque sofre um adicional de 2d6 pontos de dano Radiante. Até que a magia termine, o alvo emite Luz Plena em um raio de 1,5 metro, e jogadas de ataque contra ele têm Vantagem e ele não pode se beneficiar da condição Invisível.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 para cada círculo de espaço de magia acima de 2."],["Detectar Magia",1,"Adivinhação",["bardo","bruxo","clerigo","druida","feiticeiro","guardiao","mago","paladino"],"Ação ou Ritual","Pessoal","V, S","Concentração, até 10 minutos","Pela duração da magia, você sente a presença de efeitos mágicos a até 9 metros de você. Se você sentir tais efeitos, pode executar a ação Usar Magia para ver uma aura fraca ao redor de qualquer criatura ou objeto visível na área que contém a magia, e se um efeito foi criado por uma magia, você descobre a escola dessa magia.\n\nA magia é bloqueada por 30 centímetros de pedra, terra ou madeira, 2,5 centímetros de metal ou uma folha fina de chumbo."],["Detectar Pensamentos",2,"Adivinhação",["bardo","feiticeiro","mago"],"Ação","Pessoal","V, S, M (1 Peça de Cobre)","Concentração, até 1 minuto","Você ativa um dos efeitos abaixo. Até que a magia termine, você pode ativar qualquer um dos efeitos como uma ação Usar Magia em seus turnos posteriores.\n\nSentir Pensamentos. Você sente a presença de pensamentos a até 9 metros de você que pertencem a criaturas que conhecem idiomas ou são telepáticas. Você não lê os pensamentos, mas sabe o que uma criatura presente está pensando.\n\nA magia é bloqueada por 30 centímetros de pedra, terra ou madeira, 2,5 centímetros de metal ou uma folha fina de chumbo.\n\nLer Pensamentos. Escolha uma criatura à sua vista a até 9 metros de você ou uma criatura a até 9 metros de você que você tenha detectado com a opção Sentir Pensamentos. Você agora descobre o que mais se destaca no pensamento do alvo. Se o alvo não souber nenhum idioma e não for telepático, você não descobre nada. Como uma ação Usar Magia em seu próximo turno, você pode tentar sondar mais profundamente a mente do alvo. Se você investigar mais profundamente, o alvo realiza uma salvaguarda de Sabedoria. Se falhar, você descobre o raciocínio, as emoções e algo que paira na mente dele (como preocupação, amor ou ódio). Em caso de sucesso, a magia encerra. De qualquer forma, o alvo sabe que você está sondando a mente dele e, até que você desvie sua atenção da mente do alvo, o alvo pode executar uma ação no turno dele para realizar um teste de Inteligência (Arcanismo) contra a CD para evitar sua magia, encerrando a magia em caso de sucesso."],["Detectar Veneno e Doença",1,"Adivinhação",["clerigo","druida","guardiao","paladino"],"Ação ou Ritual","Pessoal","V, S, M (uma folha de teixo)","Concentração, até 10 minutos","Pela duração da magia, você sente a localização de venenos, criaturas venenosas ou peçonhentas e contágios mágicos a até 9 metros de você. Você sente o tipo de veneno, criatura ou contágio em cada caso.\n\nA magia é bloqueada por 30 centímetros de pedra, terra ou madeira, 2,5 centímetros de metal ou uma folha fina de chumbo."],["Detectar o Bem e o Mal",1,"Adivinhação",["clerigo","paladino"],"Ação","Pessoal","V, S","Concentração, até 10 minutos","Pela duração da magia, você sente a localização de qualquer Aberração, Celestial, Elemental, Feérico, Ínfero ou Morto-Vivo a até 9 metros de você. Você também sente se a magia Consagrar está ativa lá e, em caso afirmativo, onde.\n\nA magia é bloqueada por 30 centímetros de pedra, terra ou madeira, 2,5 centímetros de metal ou uma folha fina de chumbo."],["Disco Flutuante de Tenser",1,"Invocação",["mago"],"Ação ou Ritual","9 metros","V, S, M (uma gota de mercúrio)","1 hora","Esta magia cria um disco circular horizontal formado de energia com 1 metro de diâmetro e 2,5 centímetros de altura, que flutua a 1 metro do chão em um espaço desocupado à sua escolha, à sua vista e no alcance da magia. O disco permanece pela duração da magia e pode carregar até 225 quilos. Se mais peso for colocado sobre ele, a magia se encerra e tudo no disco cai no chão. O disco fica imóvel enquanto você estiver a até 6 metros dele. Se você se mover a mais de 6 metros de distância dele, o disco segue você, permanecendo a até 6 metros de distância. Ele pode atravessar terrenos irregulares, subir ou descer escadas, declives e afins, mas não pode atravessar uma mudança de elevação de 3 metros ou mais. Por exemplo, o disco não pode se mover através de um fosso de 3 metros de profundidade, nem poderia deixar tal fosso se fosse criado no fundo dele.\n\nSe você se mover a mais de 30 metros do disco (normalmente porque ele não pode se mover em torno de um obstáculo para segui-lo), a magia encerra."],["Disfarçar-se",1,"Ilusão",["bardo","feiticeiro","mago"],"Ação","Pessoal","V, S","1 hora","Você faz com que você mesmo — incluindo suas roupas, armaduras, armas e outros pertences — pareça diferente até que a magia termine. Você pode parecer 30 centímetros mais baixo ou mais alto e pode parecer mais pesado ou mais leve. Você deve adotar uma forma que tenha a mesma disposição básica de membros que você. Caso contrário, a extensão da ilusão depende de você. As mudanças causadas por esta magia falham em uma inspeção física. Por exemplo, se você usar esta magia para adicionar um chapéu ao seu traje, objetos passarão através do chapéu, e qualquer um que o tocar não sentirá nada.\n\nPara descobrir se você está disfarçado, uma criatura deve executar a ação Analisar para inspecionar sua aparência e ser bem-sucedido em um teste de Inteligência (Investigação) contra a CD para evitar sua magia."],["Dissipar Magia",3,"Abjuração",["bardo","bruxo","clerigo","druida","feiticeiro","guardiao","mago","paladino"],"Ação","36 metros","V, S","Instantânea","Escolha uma criatura, objeto ou efeito mágico no alcance da magia. Qualquer magia ativa de 3º círculo ou inferior no alvo é encerrada. Para cada magia ativa de 4º círculo ou superior no alvo, realize um teste de atributo usando seu atributo de conjuração (CD 10 mais o círculo da magia alvo). Se falhar, a magia continua; se for bem-sucedido, a magia se encerra.\n\nUsando um Espaço de Magia de Círculo Superior. Você encerra automaticamente uma magia no alvo se o círculo da magia for igual ou inferior ao círculo do espaço de magia que você usa."],["Dissipar o Bem e o Mal",5,"Abjuração",["clerigo","paladino"],"Ação","Pessoal","V, S, M (prata e ferro em pó)","Concentração, até 1 minuto","Pela duração da magia, Celestiais, Elementais, Feéricos, Ínferos e Mortos-Vivos têm Desvantagem em jogadas de ataque contra você. Você pode encerrar a magia mais cedo usando uma das seguintes funções especiais.\n\nExorcizar. Como uma ação Usar Magia, você tem como alvo uma criatura a sua vista a até 1,5 metro de você e que seja um dos tipos de criatura acima. O alvo deve ser bem-sucedido em uma salvaguarda de Carisma ou é enviado de volta ao seu plano de origem, se ainda não estiver lá. Se não estiverem em seu plano de origem, Feéricos são enviados para Faéria e Mortos-Vivos são enviadas para o Sombral.\n\nQuebrar Encantamento. Como uma ação Usar Magia, toque uma criatura que esteja possuída ou sob os efeitos de Amedrontado ou Enfeitiçado por uma ou mais das criaturas mencionadas. O alvo deixa de estar possuído, Amedrontado ou Enfeitiçado por elas."],["Dominar Fera",4,"Encantamento",["druida","feiticeiro","guardiao"],"Ação","18 metros","V, S","Concentração, até 1 minuto","Uma Fera à sua vista e no alcance da magia deve ser bem-sucedida em uma salvaguarda de Sabedoria ou tem a condição Enfeitiçado pela duração da magia. O alvo tem Vantagem na salvaguarda se você ou seus aliados estiverem lutando contra ele. Sempre que o alvo sofre dano, ele repete a salvaguarda, encerrando a magia em caso de sucesso.\n\nVocê tem um vínculo telepático com o alvo Enfeitiçado enquanto vocês dois estão no mesmo plano de existência. No seu turno, você pode usar este vínculo para emitir comandos para o alvo (nenhuma ação é necessária), como “Ataque essa criatura”, “Mova-se para lá” ou “Busque aquele objeto”. O alvo faz o possível para obedecer no turno dele. Se ele concluir um pedido e não receber mais instruções de você, ele age e se move como quiser, concentrando-se em se proteger.\n\nVocê pode ordenar o alvo a executar uma Reação, mas deve executar sua própria Reação para tanto.\n\nUsando um Espaço de Magia de Círculo Superior. Sua Concentração pode durar mais com um espaço de magia de 5º círculo (em até 10 minutos), 6º círculo (em até 1 hora) ou 7º círculo ou superior (em até 8 horas)."],["Dominar Monstro",8,"Encantamento",["bardo","bruxo","feiticeiro","mago"],"Ação","18 metros","V, S","Concentração, até 1 hora","Uma criatura à sua vista e no alcance da magia deve ser bem-sucedida em uma salvaguarda de Sabedoria ou tem a condição Enfeitiçado pela duração da magia. O alvo tem Vantagem na salvaguarda se você ou seus aliados estiverem lutando contra ele. Sempre que o alvo sofre dano, ele repete a salvaguarda, encerrando magia em caso de sucesso.\n\nVocê tem um vínculo telepático com o alvo Enfeitiçado enquanto vocês dois estão no mesmo plano de existência. No seu turno, você pode usar este vínculo para emitir comandos para o alvo (nenhuma ação é necessária), como “Ataque essa criatura”, “Mova-se para lá” ou “Busque aquele objeto”. O alvo faz o possível para obedecer no turno dele. Se ele concluir um pedido e não receber mais instruções de você, ele age e se move como quiser, concentrando-se em se proteger.\n\nVocê pode ordenar o alvo a executar uma Reação, mas deve executar sua própria Reação para tanto.\n\nUsando um Espaço de Magia de Círculo Superior. Sua Concentração pode durar mais com um espaço de magia de 9º círculo (em até 8 horas)."],["Dominar Pessoa",5,"Encantamento",["bardo","feiticeiro","mago"],"Ação","18 metros","V, S","Concentração, até 1 minuto","Um humanoide à sua vista e no alcance da magia deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Enfeitiçado pela duração da magia. O alvo tem Vantagem na salvaguarda se você ou seus aliados estiverem lutando contra ele. Sempre que o alvo sofre dano, ele repete a salvaguarda, encerrando magia em caso de sucesso.\n\nVocê tem um vínculo telepático com o alvo Enfeitiçado enquanto vocês dois estão no mesmo plano de existência. No seu turno, você pode usar este vínculo para emitir comandos para o alvo (nenhuma ação é necessária), como “Ataque essa criatura”, “Mova-se para lá” ou “Busque aquele objeto”. O alvo faz o possível para obedecer no turno dele. Se ele concluir um pedido e não receber mais instruções de você, ele age e se move como quiser, concentrando-se em se proteger.\n\nVocê pode ordenar o alvo a executar uma Reação, mas deve executar sua própria Reação para tanto.\n\nUsando um Espaço de Magia de Círculo Superior. Sua Concentração pode durar mais com um espaço de magia de 6º círculo (até 10 minutos), 7º círculo (até 1 hora) ou 8º círculo ou superior (até 8 horas)."],["Duelo Compelido",1,"Encantamento",["paladino"],"Ação Bônus","9 metros","V","Concentração, até 1 minuto","Você tenta obrigar uma criatura a um duelo. Uma criatura à sua vista e no alcance da magia realiza uma salvaguarda de Sabedoria. Se falhar, o alvo tem Desvantagem nas jogadas de ataque contra criaturas que não sejam você, e não pode se mover voluntariamente a para um espaço a mais de 9 metros de você.\n\nA magia encerra se você realizar uma jogada de ataque contra uma criatura que não seja o alvo, se você conjurar uma magia em um inimigo que não seja o alvo, se um aliado seu causar dano ao alvo ou se você terminar seu turno a mais de 9 metros de distância do alvo."],["Elementalismo",0,"Transmutação",["druida","feiticeiro","mago"],"Ação","9 metros","V, S","Instantânea","Você exerce controle sobre os elementos, criando um dos seguintes efeitos no alcance da magia.\n\nConvocar Água. Você cria um jato de névoa fria que umedece levemente criaturas e objetos em um Cubo de 1,5 metro de lado. Como alternativa, você cria 1 xícara de água limpa em um recipiente aberto ou em uma superfície, e a água evapora em 1 minuto.\n\nConvocar Brisa. Você cria uma brisa forte o suficiente para ondular um tecido, mexer poeira, farfalhar folhas e fechar portas e persianas abertas, tudo em um Cubo de 1,5 metro de lado. Portas e persianas que estiverem sendo mantidas abertas por alguém ou alguma força não são afetadas.\n\nConvocar Fogo. Você cria uma fina nuvem de brasas inofensivas e fumaça colorida e perfumada em um a Cubo de 1,5 metro de lados. Você escolhe a cor e o perfume, e as brasas podem acender velas, tochas ou lâmpadas nessa área. O cheiro da fumaça permanece por 1 minuto.\n\nConvocar Terra. Você cria uma fina camada de poeira ou areia que cobre superfícies em uma área quadrada de 1,5 metro de lado, ou faz com que uma única palavra apareça em sua caligrafia em um pedaço de terra ou areia.\n\nEsculpir Elemento. Você faz com que terra, areia, fogo, fumaça, névoa ou água que caiba em um Cubo de 30 centímetros de lado assuma uma forma rudimentar (como a de uma criatura) por 1 hora."],["Emaranhar",1,"Invocação",["druida","guardiao"],"Ação","27 metros","V, S","Concentração, até 1 minuto","Plantas agarradoras brotam do chão em um quadrado de 6 metros de lado no alcance da magia. Pela duração da magia, essas plantas transformam o terreno em Terreno Difícil. Elas desaparecem quando a magia termina. Cada criatura (exceto você) na área quando você conjura a magia deve ser bem-sucedida em uma salvaguarda de Força ou tem a condição Contido até que a magia termine. Uma criatura Contida pode executar uma ação para realizar um teste de Força (Atletismo) contra a CD para evitar sua magia. Em caso de sucesso, ela se liberta das plantas agarradoras e não está mais Contida por elas."],["Encarnação Fantasmagórica",9,"Ilusão",["bruxo","mago"],"Ação","36 metros","V, S","Concentração, até 1 minuto","Você tenta criar terrores ilusórios na mente dos outros. Cada criatura à sua escolha em uma Esfera de 9 metros de raio centrada em um ponto no alcance da magia realiza uma salvaguarda de Sabedoria. Se falhar, um alvo sofre 10d10 pontos de dano Psíquico e tem a condição Amedrontado pela duração da magia. Em caso de sucesso, um alvo recebe apenas metade do dano.\n\nUm alvo Amedrontado realiza uma salvaguarda de Sabedoria no final de cada um dos turnos dele. Se falhar, sofre 5d10 pontos de dano Psíquico. Em caso de sucesso, a magia se encerra naquele alvo."],["Encontrar Armadilhas",2,"Adivinhação",["clerigo","druida","guardiao"],"Ação","36 metros","V, S","Instantânea","Você sente qualquer armadilha à sua vista e no alcance da magia. Uma armadilha, para o propósito desta magia, inclui qualquer objeto ou mecanismo que tenha sido criado para causar dano ou outro perigo. Assim, a magia sentiria a magia Alarme ou Glifo de Proteção ou uma armadilha mecânica, mas não revelaria uma fraqueza natural no chão, um teto instável ou um sumidouro escondido.\n\nEsta magia revela que uma armadilha está presente, mas não sua localização. Você aprende a natureza geral do perigo representado por uma armadilha que sente."],["Encontrar o Caminho",6,"Adivinhação",["bardo","clerigo","druida"],"1 minuto","Pessoal","V, S, M (um conjunto de ferramentas de adivinhação — como cartas ou runas — no valor de 100 ou mais PO)","Concentração, até 1 dia","Você sente magicamente a rota física mais direta para um local que você nomeia. Você deve estar familiarizado com o local, e a magia falha se você declarar um destino em outro plano de existência, um destino em movimento (como uma fortaleza móvel) ou um destino inespecífico (como “o covil de um dragão verde”). Enquanto durar a magia, desde que você esteja no mesmo plano de existência do destino, você sabe a que distância ele está e em que direção se encontra. Sempre que se depara com uma escolha de caminhos ao longo do trajeto, você sabe qual é o caminho mais direto."],["Enfeitiçar Monstro",4,"Encantamento",["bardo","bruxo","druida","feiticeiro","mago"],"Ação","9 metros","V, S","1 hora","Uma criatura à sua vista e no alcance da magia realiza uma salvaguarda de Sabedoria. Ela tem Vantagem se você ou seus aliados estiverem lutando contra ela. Se falhar, o alvo tem a condição Enfeitiçado até que a magia termine ou até que você ou seus aliados causem dano a ele. A criatura Enfeitiçada é Amigável a você. Quando a magia termina, o alvo sabe que foi Enfeitiçado por você.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 4."],["Enfeitiçar Pessoa",1,"Encantamento",["bardo","bruxo","druida","feiticeiro","mago"],"Ação","9 metros","V, S","1 hora","Um Humanoide à sua vista e no alcance da magia realiza uma salvaguarda de Sabedoria. Ele tem Vantagem se você ou seus aliados estiverem lutando contra ele. Se falhar, o alvo tem a condição Enfeitiçado até que a magia termine ou até que você ou seus aliados causem dano a ele. A criatura Enfeitiçada é Amigável a você. Quando a magia termina, o alvo sabe que foi Enfeitiçado por você.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 1."],["Escalada de Aranha",2,"Transmutação",["bruxo","feiticeiro","mago"],"Ação","Toque","V, S, M (uma gota de betume e uma aranha)","Concentração, até 1 hora","Até que a magia termine, uma criatura voluntária que você tocar adquire a capacidade de se mover por superfícies verticais e ao longo de tetos, deixando as mãos livres. O alvo também adquire um Deslocamento de Escalada igual ao Deslocamento dele.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 2."],["Escrita Ilusória",1,"Ilusão",["bardo","bruxo","mago"],"1 minuto ou Ritual","Toque","S, M (tinta no valor de 10 ou mais PO, que a magia consome)","10 dias","Você escreve em pergaminho, papel ou outro material apropriado e o imbuí com uma ilusão que permanece pela duração. Para você e quaisquer criaturas que escolher ao conjurar a magia, a escrita parece normal, como se estivesse escrita por sua mão, e transmite o significado de sua intenção no momento em que o texto foi redigido. Para os demais, as palavras aparecem como se estivessem em um alfabeto desconhecido ou mágico, tornando-se ininteligíveis. Se preferir, a ilusão pode alterar o significado, a caligrafia e o idioma do texto, embora você deva conhecer o idioma.\n\nSe a magia for dissipada, o texto original e a ilusão desaparecem.\n\nUma criatura que possui Visão Verdadeira pode ler a mensagem oculta."],["Escudo Arcano",1,"Abjuração",["feiticeiro","mago"],"Reação, que você executa quando é atingido por uma jogada de ataque ou é alvo da magia Mísseis Mágicos","Pessoal","V, S","1 rodada","Uma barreira imperceptível de energia mágica o protege. Até o início do seu próximo turno, você recebe um bônus de +5 na CA, incluindo contra o ataque que ativou a magia, e não sofre dano de Mísseis Mágicos ."],["Escudo Ardente",4,"Evocação",["druida","feiticeiro","mago"],"Ação","Pessoal","V, S, M (um pouco de fósforo ou um vaga-lume)","10 minutos","Chamas finas envolvem seu corpo pela duração da magia, emitindo Luz Plena em um raio de 3 metros e Meia-luz por mais 3 metros.\n\nAs chamas fornecem um escudo quente ou frio, como você escolher. O escudo quente concede a você Resistência a dano Gélido, e o escudo frio concede a você Resistência a dano Ígneo.\n\nAlém disso, sempre que uma criatura a até 1,5 metro de você o atinge com uma jogada de ataque corpo a corpo, o escudo irrompe em chamas. O atacante sofre 2d8 pontos de dano Ígneo de um escudo quente ou 2d8 pontos de dano Gélido de um escudo frio."],["Escudo da Fé",1,"Abjuração",["clerigo","paladino"],"Ação Bônus","18 metros","V, S, M (um pergaminho de oração)","Concentração, até 10 minutos","Um campo cintilante envolve uma criatura à sua escolha no alcance da magia, concedendo um bônus de +2 na CA pela duração da magia."],["Escuridão",2,"Evocação",["bruxo","feiticeiro","mago"],"Ação","18 metros","V, M (pelo de morcego e um pedaço de carvão)","Concentração, até 10 minutos","Pela duração da magia, uma Escuridão mágica se espalha a partir de um ponto no alcance da magia e preenche uma Esfera de 4,5 metros de raio. Visão no escuro não pode ver através dela, e luz não mágica não pode iluminá-la.\n\nComo alternativa, você conjura a magia em um objeto que não esteja sendo usado ou carregado, fazendo com que a Escuridão preencha uma Emanação de 4,5 metros originada desse objeto. Cobrir esse objeto com algo opaco, como uma tigela ou elmo, bloqueia a Escuridão. Se qualquer área desta magia se sobrepuser a uma área de Luz Plena ou Meia-luz criada por uma magia de 2º círculo ou inferior, essa outra magia é dissipada."],["Esfera Congelante de Otiluke",6,"Evocação",["feiticeiro","mago"],"Ação","90 metros","V, S, M (uma esfera de cristal em miniatura)","Instantânea","Um globo gelado se estende de você até um ponto à sua escolha no alcance da magia, onde explode em uma Esfera de 18 metros de raio. Cada criatura nessa área realiza uma salvaguarda de Constituição, sofrendo 10d6 pontos de dano Gélido se falhar ou metade desse dano em caso de sucesso.\n\nSe o globo atingir um corpo d’água, ele congela a água a uma profundidade de 15 centímetros sobre uma área de 9 metros quadrados. Esse gelo dura 1 minuto. Criaturas que estavam nadando na superfície da água congelada estão presas no gelo e têm a condição Contido. Uma criatura presa pode executar uma ação para realizar um teste de Força (Atletismo) contra a CD para evitar sua magia para se libertar.\n\nVocê pode escolher não disparar o globo após completar a conjuração da magia. Se você fizer isso, um globo do tamanho de uma bala de funda, gelado ao toque, aparece em sua mão. A qualquer momento, você ou uma criatura a quem você dá o globo pode arremessá-lo (até um alcance de 12 metros) ou arremessá-lo com uma funda (até o alcance normal da funda). Ele se estilhaça com o impacto, com o mesmo efeito que uma conjuração normal da magia. Você também pode baixar o globo sem quebrá-lo. Após 1 minuto, se o globo ainda não se estilhaçou, ele explode.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 para cada círculo de espaço de magia acima de 6."],["Esfera Flamejante",2,"Invocação",["druida","feiticeiro","mago"],"Ação","18 metros","V, S, M (uma bola de cera)","Concentração, até 1 minuto","Você cria uma esfera de fogo de 1,5 metro de diâmetro em um espaço desocupado no chão no alcance e pela duração da magia. Qualquer criatura que termine o turno a até 1,5 metro da esfera realiza uma salvaguarda de Destreza, sofrendo 2d6 pontos de dano Ígneo se falhar, ou metade desse dano em caso de sucesso. Como uma Ação Bônus, você pode mover a esfera até 9 metros, rolando-a pelo chão. Se você mover a esfera para o espaço de uma criatura, essa criatura realiza a salvaguarda contra a esfera, e a esfera para de se mover durante o turno.\n\nAo mover a esfera, você pode direcioná-la sobre barreiras de até 1,5 metro de altura e saltar sobre poços de até 3 metros de largura. Objetos inflamáveis que não estão sendo usados ou carregados entram em combustão se tocados pela esfera, e ela emite Luz Plena em um raio de 6 metros e Meia-luz por mais 6 metros.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 para cada círculo de espaço de magia acima de 2."],["Esfera Resiliente de Otiluke",4,"Abjuração",["mago"],"Ação","9 metros","V, S, M (uma esfera de vidro)","Concentração, até 1 minuto","Uma Esfera cintilante envolve uma criatura ou objeto Grande ou menor no alcance da magia. Uma criatura involuntária deve ser bem-sucedida em uma salvaguarda de Destreza ou é envolta pela duração da magia. Nada — nem objetos físicos, energia ou outros efeitos de magia — pode atravessar a barreira, para dentro ou para fora, embora uma criatura na Esfera possa respirar lá. A Esfera é imune a todos os tipos de dano, e uma criatura ou objeto dentro dela não pode ser danificado por ataques ou efeitos provenientes de fora, nem uma criatura dentro da Esfera pode causar dano a qualquer coisa fora dela.\n\nA Esfera não tem peso e é grande o suficiente para conter a criatura ou objeto em seu interior. Uma criatura envolta pode executar uma ação para empurrar-se contra as paredes da Esfera e, assim, rolar a Esfera a até metade do Deslocamento da criatura. Da mesma forma, o globo pode ser pego e movido por outras criaturas. Uma magia Desintegrar que tenha o globo como alvo o destrói sem prejudicar nada em seu interior."],["Esfera Vitriólica",4,"Evocação",["feiticeiro","mago"],"Ação","45 metros","V, S, M (uma gota de bile)","Instantânea","Você aponta para um local no alcance da magia, e uma bola de ácido brilhante de 30 centímetros de diâmetro se espalha lá e explode em uma Esfera de 6 metros de raio. Cada criatura nessa área realiza uma salvaguarda de Destreza. Se falhar, uma criatura sofre 10d4 pontos de dano Ácido e outros 5d4 pontos de dano Ácido no final do próximo turno dela. Em caso de sucesso, uma criatura recebe apenas metade do dano inicial.\n\nUsando um Espaço de Magia de Círculo Superior. O dano inicial aumenta em 2d4 para cada círculo de espaço de magia acima de 4."],["Espada de Mordenkainen",7,"Evocação",["bardo","mago"],"Ação","27 metros","V, S, M (uma espada em miniatura no valor de 250 ou mais PO)","Concentração, até 1 minuto","Você cria uma espada espectral que fica suspensa no alcance da magia. Ela permanece pela duração da magia. Quando a espada aparece, você realiza um ataque mágico corpo a corpo contra um alvo a até 1,5 metro da espada. Em um acerto, o alvo sofre um dano Energético igual a 4d12 mais o seu modificador de atributo de conjuração.\n\nNos turnos seguintes, você pode executar uma Ação Bônus para mover a espada até 9 metros para um ponto à sua vista e repetir o ataque contra o mesmo alvo ou um diferente."],["Espinho Mental",2,"Adivinhação",["bruxo","feiticeiro","mago"],"Ação","36 metros","S","Concentração, até 1 hora","Você crava um espinho de energia psíquica na mente de uma criatura à sua vista e no alcance da magia. O alvo realiza uma salvaguarda de Sabedoria, sofrendo 3d8 pontos de dano Psíquico se falhar ou metade desse dano em caso de sucesso. Se falhar na salvaguarda, você também sempre sabe a localização do alvo até que a magia termine, mas apenas enquanto ambos estiverem no mesmo plano de existência. Enquanto você tiver essa informação, o alvo não pode se escon
