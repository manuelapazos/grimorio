. Sempre que completar um Descanso Longo, você pode trocar o tipo de arma por outro elegível."},{"n":"Mestre em Armaduras Médias","cat":"Geral","pre":"Nível 4 ou superior, Treina- mento com Armadura Média","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nPortador Ágil. Enquanto estiver usando armadura Média, você pode adicionar 3, em vez de 2, à sua CA se tiver um valor de Destreza 16 ou superior."},{"n":"Mestre em Armaduras Pesadas","cat":"Geral","pre":"Nível 4 ou superior, Treina- mento com Armadura Pesada","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Constituição em 1, até no máximo 20.\n\nRedução de Dano. Quando você é atingido por um ataque enquanto está vestido com uma armadura Pesada, qualquer dano Contundente, Cortante e Perfurante causado a você por esse ataque é reduzido em uma quantidade de pontos igual ao seu Bônus de Proficiência."},{"n":"Mestre em Armas de Haste","cat":"Geral","pre":"Nível 4 ou superior, Força ou Destreza 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nGolpe de Haste. Como uma ação, imediatamente após atacar com um Cajado, Lança ou uma arma que tenha a propriedade Extensão e Pesado, você pode executar uma Ação Bônus para realizar um ataque corpo a corpo com a extremidade oposta da arma. A arma causa dano Contundente, e o dado de dano da arma para este ataque é um d4.\n\nGolpe Reativo. Ao empunhar um Cajado, Lança ou uma arma que tenha as propriedades Extensão e Pesado, você pode executar uma Reação para realizar um ataque corpo a corpo com essa arma contra uma criatura que entra no seu alcance."},{"n":"Mestre em Armas Grandes","cat":"Geral","pre":"Nível 4 ou superior, Força 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força em 1, até no máximo 20.\n\nMaestria em Armas Pesadas. Quando você atinge uma criatura com uma arma que tem a propriedade Pesada como parte da ação Atacar no seu turno, você pode causar dano adicional ao alvo com a arma. O dano adicional é igual ao seu Bônus de Proficiência.\n\nCortar. Imediatamente após obter um Acerto Crítico ou reduzir uma criatura a 0 Pontos de Vida com uma arma Corpo a Corpo, você pode realizar um ataque com a mesma arma como uma Ação Bônus."},{"n":"Mestre em Escudos","cat":"Geral","pre":"Nível 4 ou superior, Treina- mento com Escudo","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força em 1, até no máximo 20.\n\nGolpe de Escudo. Ao atacar uma criatura a até 1,5 metro de você como parte da ação Atacar e atingir com uma arma Corpo a Corpo, você pode atacar imediatamente o alvo com seu Escudo se ele estiver equipado, forçando o alvo a realizar uma salvaguarda de Força (CD 8 mais seu modificador de Força e seu Bônus de Proficiência). Se falhar, você empurra o alvo a 1,5 metro de você ou impõe a ele a condição Caído (à sua escolha). Você pode usar esse benefício apenas uma vez em cada um dos seus turnos.\n\nInterpor Escudo. Se você for submetido a um efeito que lhe permita realizar uma salvaguarda de Destreza para sofrer apenas metade do dano, pode usar uma Reação para não sofrer dano se você for bem-sucedido na salvaguarda e estiver segurando um Escudo."},{"n":"Mestre-Atirador","cat":"Geral","pre":"Nível 4 ou superior, Destreza 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Destreza em 1, até no máximo 20.\n\nIgnorar Cobertura. Seus ataques à distância com armas ignoram Cobertura Parcial e Cobertura de Três Quartos.\n\nDisparo à Queima-Roupa. Estar a 1,5 metro de um inimigo não impõe Desvantagem em suas jogadas de ataque com armas à Distância.\n\nTiro Longo. Atacar com alcance máximo não impõe Desvantagem em suas jogadas de ataque com armas à Distância."},{"n":"Perfurador","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nPunção. Uma vez por turno, quando você atinge uma criatura com um ataque que causa dano Perfurante, pode jogar novamente um dos dados de dano do ataque, e você deve usar a nova jogada.\n\nCrítico Melhorado. Ao obter um Acerto Crítico que causa dano Perfurante a uma criatura, você pode jogar um dado de dano adicional ao determinar o dano Perfurante adicional que o alvo sofre."},{"n":"Resiliente","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Escolha um atributo no qual você não tenha proficiência em salvaguarda. Aumente o valor de atributo escolhido em 1, até no máximo 20.\n\nProficiência em Salvaguarda. Você adquire proficiência em salvaguardas com o atributo escolhido."},{"n":"Resistente","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Constituição em 1, até no máximo 20.\n\nDesafie a Morte. Você tem Vantagem em Salvaguardas Contra Morte.\n\nRecuperação Rápida. Como uma Ação Bônus, você pode gastar um de seus Dados de Pontos de Vida, jogar o dado e recuperar um número de Pontos de Vida igual ao resultado."},{"n":"Sentinela","cat":"Geral","pre":"Nível 4 ou superior, Força ou Destreza 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nDiligente. Imediatamente após uma criatura em até 1,5 metro de você executar a ação Desengajar ou atingir um alvo diferente de você com um ataque, você pode realizar um Ataque de Oportunidade contra essa criatura.\n\nDeter. Ao atingir uma criatura com um Ataque de Oportunidade, o Deslocamento da criatura se torna 0 pelo resto do turno atual."},{"n":"Sorrateiro","cat":"Geral","pre":"Nível 4 ou superior, Destreza 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Destreza em 1, até no máximo 20.\n\nVisão às Cegas. Você tem Visão às Cegas com um alcance de 3 metros.\n\nNévoa de Guerra. Você explora as distrações da batalha e tem Vantagem em qualquer teste de Destreza (Furtividade) que realiza como parte da ação Esconder durante o combate.\n\nAtirador. Se você realizar uma jogada de ataque enquanto estiver escondido e errar a jogada, realizar a jogada de ataque não revela sua localização."},{"n":"Talhador","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nDebilitar. Uma vez por turno, quando você atinge uma criatura com um ataque que causa dano Cortante, você pode reduzir o Deslocamento dessa criatura em 3 metros até o início do seu próximo turno.\n\nCrítico Melhorado. Ao obter um Acerto Crítico que causa dano Cortante a uma criatura, ela tem Desvantagem nas jogadas de ataque até o início do seu próximo turno."},{"n":"Telecinético","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Inteligência, Sabedoria ou Carisma em 1, até no máximo 20.\n\nTelecinese Menor. Você aprende a magia Mãos Mágicas . Você pode conjurá-la sem componentes Verbais ou Somáticos, pode usar a mão espectral Invisível e o alcance dela e a distância que ela pode estar de você aumentam em 9 metros ao conjurá-la. O atributo de conjuração da magia é o atributo aumentado por este talento.\n\nEmpurrão Telecinético. Como uma Ação Bônus, você pode empurrar telecinéticamente uma criatura à sua vista a até 9 metros de você. Ao realizar isso, o alvo deve ser bem-sucedido em uma salvaguarda de Força (CD 8 mais o modificador de atributo do aumento por este talento e seu Bônus de Proficiência) ou é movido 1,5 metro na sua direção ou para longe de você."},{"n":"Telepático","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Inteligência, Sabedoria ou Carisma em 1, até no máximo 20.\n\nEnunciado Telepático. Você pode falar telepaticamente com qualquer criatura à sua vista a até 18 metros de você. Seus enunciados telepáticos estão em um idioma que você conhece, e a criatura só o entende se souber esse idioma. Sua comunicação não dá à criatura a capacidade de responder a você telepaticamente.\n\nDetectar Pensamentos. Você tem a magia Detectar Pensamentos sempre preparada. Você pode conjurá-la sem um espaço de magia ou componentes de magia, não podendo conjurá-la dessa forma novamente antes de completar um Descanso Longo. Além disso, pode conjurá-la gastando o espaço de magia que você tem do círculo apropriado. Seu atributo de conjuração para a magia é o atributo aumentado por este talento."},{"n":"Tocado Pelas Sombras","cat":"Geral","pre":"Nível 4 ou superior","d":"Sua exposição à magia do Sombral lhe concede os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Inteligência, Sabedoria ou Carisma em 1, até no máximo 20.\n\nMagia Sombria. Escolha uma magia de 1º círculo da escola de magia Ilusão ou Necromancia. Você tem essa magia e Invisibilidade sempre preparadas, podendo conjurá-las sem gastar espaço de magia. Após usar uma delas desse modo, você não pode conjurá-la assim novamente até completar um Descanso Longo. Também é possível conjurar estas magias utilizando espaços de magia de círculos apropriados. O atributo de conjuração das magias é o aprimorado por este talento."},{"n":"Tocado Por Fadas","cat":"Geral","pre":"Nível 4 ou superior","d":"Sua exposição à magia Feérica lhe concede os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Inteligência, Sabedoria ou Carisma em 1, até no máximo 20.\n\nMagia Feérica. Escolha uma magia de 1º círculo da escola de magia Adivinhação ou Encantamento. Você tem sempre essa magia e Passo Nebuloso preparadas, podendo conjurá-las sem gastar espaço de magia. Após usar uma delas desse modo, você não pode conjurá-la assim novamente até completar um Descanso Longo. Também é possível conjurar essas magias utilizando espaços de magia de círculos apropriados. O atributo de conjuração das magias é o aprimorado por este talento."},{"n":"Treinamento com Armas Marciais","cat":"Geral","pre":"Nível 4 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 20.\n\nProficiência com Armas. Você adquire proficiência com armas Marciais."},{"n":"Velocista","cat":"Geral","pre":"Nível 4 ou superior, Destreza ou Constituição 13 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Destreza ou Constituição em 1, até no máximo 20.\n\nAumento de Deslocamento. Seu Deslocamento aumenta em 3 metros.\n\nCorrer em Terreno Difícil. Ao executar a ação Correr no seu turno, Terreno Difícil não custa movimento adicional pelo resto deste turno.\n\nMovimentação Ágil. Ataques de Oportunidade têm Desvantagem contra você."},{"n":"Arquearia","cat":"Estilo de Luta","pre":"Característica de Estilo de Luta","d":"Você recebe um bônus de +2 nas jogadas de ataque com armas à Distância."},{"n":"Combate com Armas de Arremesso","cat":"Estilo de Luta","pre":"Característica de Estilo de Luta","d":"Quando você atinge com uma jogada de ataque à distância usando uma arma com a propriedade Arremesso, você obtém um bônus de +2 na jogada de dano."},{"n":"Combate com Armas Grandes","cat":"Estilo de Luta","pre":"Característica de Estilo de Luta","d":"Quando você joga dano para um ataque que realiza com uma arma Corpo a Corpo que está empunhando com as duas mãos, pode tratar qualquer 1 ou 2 em um dado de dano como um 3. A arma deve ter a propriedade Duas Mãos ou Versátil para obter este benefício."},{"n":"Combate com Duas Armas","cat":"Estilo de Luta","pre":"Característica de Estilo de Luta","d":"Quando você realiza um ataque adicional como resultado de usar uma arma com a propriedade Leve, você pode adicionar seu modificador de atributo ao dano desse ataque, se já não estiver adicionando-o ao dano."},{"n":"Combate Desarmado","cat":"Estilo de Luta","pre":"Característica de Estilo de Luta","d":"Quando você atinge com seu Ataque Desarmado e causa dano, pode causar dano Contundente igual a 1d6 mais seu modificador de Força em vez do dano normal de um Ataque Desarmado. Se você não estiver segurando nenhuma arma ou Escudo quando realizar a jogada de ataque, o d6 se torna um d8.\n\nNo início de cada um dos seus turnos, você pode causar 1d4 pontos de dano Contundente a uma criatura Imobilizada por você."},{"n":"Defensivo","cat":"Estilo de Luta","pre":"Característica de Estilo de Luta","d":"Enquanto estiver usando armadura Leve, Média ou Pesada, você recebe um bônus de +1 na Classe de Armadura."},{"n":"Duelismo","cat":"Estilo de Luta","pre":"Característica de Estilo de Luta","d":"Quando você segura uma arma Corpo a Corpo em uma mão e nenhuma outra arma, você recebe um bônus de +2 nas jogadas de dano desta arma."},{"n":"Interceptação","cat":"Estilo de Luta","pre":"Característica de Estilo de Luta","d":"Quando uma criatura à sua vista atinge outra criatura a até 1,5 metro de você com uma jogada de ataque, você pode executar uma Reação para reduzir o dano causado ao alvo em 1d10 mais seu Bônus de Proficiência. Você deve estar segurando um Escudo ou uma arma Simples ou Marcial para executar esta Reação."},{"n":"Luta às Cegas","cat":"Estilo de Luta","pre":"Característica de Estilo de Luta","d":"Você tem Visão às Cegas com um alcance de 3 metros."},{"n":"Protetivo","cat":"Estilo de Luta","pre":"Característica de Estilo de Luta","d":"Quando uma criatura à sua vista ataca um alvo que não é você e que está a até 1,5 metro de distância, você pode executar uma Reação para interpor seu Escudo, se o estiver segurando. Isso impõe Desvantagem na jogada de ataque que acionou a reação e em todas as jogadas contra o alvo até o início do seu próximo turno, enquanto você estiver a até 1,5 metro do alvo."},{"n":"Dádiva da Fortitude","cat":"Dádiva Épica","pre":"Nível 19 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente um valor de atributo à sua escolha em 1, até no máximo 30.\n\nSaúde Fortalecida. Seus Pontos de Vida máximos aumentam em 40. Além disso, sempre que você recuperar Pontos de Vida, pode recuperar Pontos de Vida adicionais iguais ao seu modificador de Constituição. Após recuperar esses Pontos de Vida adicionais, você não pode fazer isso novamente até o início do seu próximo turno."},{"n":"Dádiva da Proeza em Combate","cat":"Dádiva Épica","pre":"Nível 19 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente um valor de atributo à sua escolha em 1, até no máximo 30.\n\nPontaria Inigualável. Quando você erra uma jogada de ataque, em vez disso você acerta. Após usar este benefício, você não pode utilizá-lo novamente até o início do seu próximo turno."},{"n":"Dádiva da Proficiência em Perícia","cat":"Dádiva Épica","pre":"Nível 19 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente um valor de atributo à sua escolha em 1, até no máximo 30.\n\nAssecla Completo. Você adquire proficiência em todas as perícias.\n\nEspecialização. Escolha uma perícia na qual você tenha proficiência, mas não tenha Especialização. Você obtém Especialização nessa perícia."},{"n":"Dádiva da Recordação de Magia","cat":"Dádiva Épica","pre":"Nível 19 ou superior, Característica de Conjuração","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Inteligência, Sabedoria ou Carisma em 1, até no máximo 30.\n\nConjuração Livre. Sempre que você conjurar uma magia com um espaço de magia de 1º a 4º círculo, jogue 1d4. Se o resultado que você tirar for o mesmo que o círculo do espaço, o espaço não é gasto."},{"n":"Dádiva da Recuperação","cat":"Dádiva Épica","pre":"Nível 19 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente um valor de atributo à sua escolha em 1, até no máximo 30.\n\nAté a Morte. Quando você for reduzido a 0 Pontos de Vida, pode escolher ficar com 1 Ponto de Vida e recuperar um número de Pontos de Vida igual à metade dos seus Pontos de Vida máximos. Após usar esse benefício, você não pode usá-lo novamente até completar um Descanso Longo.\n\nRecuperar Vitalidade. Você tem uma reserva de dez d10s. Como uma Ação Bônus, você pode gastar dados da reserva, jogá-los e recuperar um número de Pontos de Vida igual ao total do resultado. Você restaura todos os dados gastos quando você completa um Descanso Longo."},{"n":"Dádiva da Resistência à Energia","cat":"Dádiva Épica","pre":"Nível 19 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente um valor de atributo à sua escolha em 1, até no máximo 30.\n\nResistências à Energia. Você obtém Resistência a dois dos seguintes tipos de dano à sua escolha: Ácido, Elétrico, Gélido, Ígneo, Necrótico, Psíquico, Radiante, Trovejante ou Venenoso. Sempre que completar um Descanso Longo, você pode mudar suas escolhas.\n\nRedirecionamento de Energia. Ao sofrer dano de um dos tipos escolhidos para o benefício Resistências à Energia, você pode executar uma Reação para direcionar o dano do mesmo tipo para outra criatura à sua vista a até 18 metros de você que não esteja sob Cobertura Total. Se você fizer isso, essa criatura deve ser bem-sucedida em uma salvaguarda de Destreza (CD 8 mais seu modificador de Constituição e seu Bônus de Proficiência) ou sofre dano igual a 2d12 mais seu modificador de Constituição."},{"n":"Dádiva da Velocidade","cat":"Dádiva Épica","pre":"Nível 19 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente um valor de atributo à sua escolha em 1, até no máximo 30.\n\nArtista de Fuga. Como uma Ação Bônus, você pode executar a ação Desengajar, que também encerra a condição Imobilizado em você.\n\nAgilidade. Seu Deslocamento aumenta em 9 metros."},{"n":"Dádiva da Viagem Dimensional","cat":"Dádiva Épica","pre":"Nível 19 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente um valor de atributo à sua escolha em 1, até no máximo 30.\n\nPassos Fugazes. Imediatamente após executar a ação Atacar ou Usar Magia, você pode se teleportar até 9 metros para um espaço desocupado à sua vista."},{"n":"Dádiva da Visão Verdadeira","cat":"Dádiva Épica","pre":"Nível 19 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente um valor de atributo à sua escolha em 1, até no máximo 30.\n\nVisão Verdadeira. Você tem Visão Verdadeira com um alcance de 18 metros."},{"n":"Dádiva do Ataque Irresistível","cat":"Dádiva Épica","pre":"Nível 19 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente seu valor de Força ou Destreza em 1, até no máximo 30.\n\nSuperar Defesas. O dano Contundente, Cortante e Perfurante que você causa sempre ignora Resistência.\n\nGolpe Devastador. Quando você tira 20 no d20 para uma jogada de ataque, pode causar dano adicional ao alvo igual ao valor do atributo aumentado por este talento. O tipo de dano adicional é o mesmo do ataque."},{"n":"Dádiva do Destino","cat":"Dádiva Épica","pre":"Nível 19 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente um valor de atributo à sua escolha em 1, até no máximo 30.\n\nAprimorar Destino. Quando você ou outra criatura a até 18 metros de você for bem-sucedida ou falhar em um Teste D20, você pode jogar 2d4 e aplicar os resultados como bônus ou penalidade na jogada de d20. Após usar este benefício, você não pode utilizá-lo novamente até jogar Iniciativa ou completar um Descanso Curto ou Longo."},{"n":"Dádiva do Espírito da Noite","cat":"Dádiva Épica","pre":"Nível 19 ou superior","d":"Você adquire os seguintes benefícios.\n\nAumento no Valor de Atributo. Aumente um valor de atributo à sua escolha em 1, até no máximo 30.\n\nFundir-se com Sombras. Enquanto estiver em Meia-luz ou Escuridão, você pode se conceder a condição Invisível como uma Ação Bônus. A condição encerra imediatamente após você executar uma ação, uma Ação Bônus ou uma Reação.\n\nForma Sombria. Enquanto estiver em Meia-luz ou Escuridão, você tem Resistência a todos os danos, exceto Psíquico e Radiante."}];
const FEAT_BY=Object.fromEntries(FEATS.map(f=>[f.n,f]));
/* [classe, subclasse, nível, nome, descrição] */
const CLASS_FEATS=[["barbaro","",1,"Fúria","Você pode se imbuir com um poder primitivo chamado Fúria, uma força que lhe concede força e resiliência extraordinárias. Você pode entrar em Fúria como uma Ação Bônus, desde que não esteja vestindo armadura Pesada.\n\nVocê pode entrar em Fúria o número de vezes indicado na coluna Fúrias da tabela Características de Bárbaro para seu nível de Bárbaro. Você recupera um uso gasto ao completar um Descanso Curto, e restaura todos os usos gastos ao completar um Descanso Longo. Enquanto ativa, sua Fúria segue as regras abaixo.\n\nResistência a Dano. Você tem Resistência a dano Contundente, Cortante e Perfurante.\n\nDano da Fúria. Quando você realiza um ataque com Força — seja com uma arma ou um Ataque Desarmado — e causar dano ao alvo, você recebe um bônus no dano, que aumenta conforme você adquire níveis como Bárbaro, conforme mostrado na coluna Dano da Fúria da tabela Características de Bárbaro.\n\nVantagem com Força. Você tem Vantagem em testes de Força e salvaguardas de Força.\n\nSem Concentração ou Magias. Você não pode manter a Concentração e não pode conjurar magias.\n\nDuração. A Fúria dura até o final do seu próximo turno, e encerra se você vestir armadura Pesada ou ter a condição Incapacitado. Se sua Fúria ainda estiver ativa no próximo turno, você pode estendê-la por mais um turno ao realizar uma das seguintes ações:\n\n• Realizar uma jogada de ataque contra um inimigo. • Forçar um inimigo a realizar uma salvaguarda. • Executar uma Ação Bônus para estender sua Fúria. Cada vez que a Fúria é estendida, ela permanece até o final do seu próximo turno. Você pode manter uma Fúria por até 10 minutos."],["barbaro","",1,"Defesa sem Armadura","Enquanto você não estiver vestindo nenhuma armadura, sua Classe de Armadura base é igual a 10 mais seus modificadores de Destreza e Constituição. Você pode usar um Escudo e ainda receber este benefício."],["barbaro","",1,"Maestria em Arma","Seu treinamento com armas permite que você utilize as propriedades de maestria com dois tipos de armas Corpo a Corpo Simples ou Marciais à sua escolha, como Machados Grandes e Machadinhas. Sempre que completar um Descanso Longo, você pode praticar movimentos com armas e alterar uma dessas escolhas de armas.\n\nAo alcançar certos níveis de Bárbaro, você adquire a habilidade de usar as propriedades de maestria de mais tipos de armas, conforme mostrado na coluna Maestria em Armas da tabela Características de Bárbaro."],["barbaro","",2,"Ataque Imprudente","Você pode descartar toda preocupação com a defesa para atacar com ferocidade intensificada. Ao realizar sua primeira jogada de ataque no seu turno, você pode decidir atacar de forma imprudente. Fazer isso lhe concede Vantagem em jogadas de ataque usando Força até o início do seu próximo turno, mas jogadas de ataque contra você também têm Vantagem durante esse tempo."],["barbaro","",2,"Sentido de Perigo","Você adquire uma sensibilidade extraordinária de quando as coisas não estão como deveriam, o que lhe dá um benefício ao desviar de perigos. Você tem Vantagem em salvaguardas de Destreza, a menos que tenha a condição Incapacitado."],["barbaro","",3,"Conhecimento Primordial","Você adquire proficiência em outra perícia à sua escolha da lista de perícias disponíveis para Bárbaros no nível 1.\n\nAlém disso, enquanto sua Fúria estiver ativa, você pode canalizar poder primitivo ao tentar realizar certas tarefas. Sempre que realizar um teste de atributo usando uma das seguintes perícias, pode realizá-lo como um teste de Força, mesmo que normalmente utilize outro atributo: Acrobacia, Furtividade, Intimidação, Percepção ou Sobrevivência. Quando você usa essa habilidade, sua Força representa o poder primitivo fluindo em você, refinando sua agilidade, postura e sentidos."],["barbaro","",3,"Subclasse de Bárbaro","Você adquire uma subclasse de Bárbaro à sua escolha. As subclasses Trilha da Árvore do Mundo, Trilha do Berserker, Trilha do Coração Selvagem e Trilha do Fanático estão detalhadas após a descrição desta classe. Uma subclasse é uma especialização que lhe concede características em determinados níveis de Bárbaro. Durante toda sua jornada, você adquire cada característica da sua subclasse que corresponda ao seu nível de Bárbaro ou inferior."],["barbaro","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. Você adquire essa característica novamente nos níveis 8, 12 e 16 de Bárbaro."],["barbaro","",5,"Ataque Extra","Você pode atacar duas vezes, em vez de uma, sempre que executar a ação Atacar no seu turno."],["barbaro","",5,"Movimento Rápido","Seu Deslocamento aumenta em 3 metros enquanto você não estiver usando Armadura Pesada."],["barbaro","",7,"Bote Instintivo","Como parte da Ação Bônus que você realiza para entrar em Fúria, você pode se mover até metade do seu Deslocamento."],["barbaro","",7,"Instintos Primitivos","Seus instintos estão tão apurados que você tem Vantagem nas jogadas de Iniciativa."],["barbaro","",9,"Golpe Brutal","Se você usar Ataque Imprudente, pode renunciar à Vantagem em uma jogada de ataque com Força à sua escolha no seu turno. A jogada de ataque escolhida não deve ter Desvantagem. Se a jogada de ataque atingir o alvo, este sofre 1d10 pontos de dano adicional do mesmo tipo causado pela arma ou Ataque Desarmado, e você pode causar um efeito de Golpe Brutal à sua escolha.\n\nVocê tem as seguintes opções de efeito.\n\nGolpe Debilitador. O Deslocamento do alvo é reduzido em 4,5 metros até o início do seu próximo turno. Um alvo pode ser afetado por apenas um Golpe Debilitador de cada vez — o mais recente.\n\nGolpe Poderoso. O alvo é empurrado 4,5 metros diretamente para longe de você. Em seguida, você pode se mover até metade do seu Deslocamento diretamente em direção ao alvo sem provocar Ataques de Oportunidade."],["barbaro","",11,"Fúria Implacável","Sua Fúria pode mantê-lo lutando, apesar de ferimentos graves. Se você atingir 0 Pontos de Vida enquanto sua Fúria estiver ativa e não morrer imediatamente, você pode realizar uma salvaguarda de Constituição CD 10. Em caso de sucesso, seus Pontos de Vida mudam para um número igual a duas vezes seu nível de Bárbaro. A cada vez que usar essa característica após a primeira, a CD aumenta em 5. Ao completar um Descanso Curto ou Longo, a CD volta para 10."],["barbaro","",13,"Golpe Brutal Fortalecido","Você aperfeiçoou novas formas de atacar com ferocidade. Os seguintes efeitos agora estão entre suas opções de Golpe Brutal.\n\nGolpe Atordoante. O alvo tem Desvantagem na próxima salvaguarda que realizar e não pode realizar Ataques de Oportunidade até o início do seu próximo turno.\n\nGolpe Destruidor. Antes do início do seu próximo turno, a próxima jogada de ataque realizada por outra criatura contra o alvo recebe um bônus de +5. Uma jogada de ataque só pode receber um bônus de Golpe Destruidor por vez."],["barbaro","",15,"Fúria Persistente","Ao jogar Iniciativa, você pode recuperar todos os usos gastos de Fúria. Após recuperar a Fúria deste modo, você não pode fazê-lo novamente até completar um Descanso Longo.\n\nAlém disso, sua Fúria é tão feroz que agora dura 10 minutos sem a necessidade de estender a duração de rodada em rodada. Sua Fúria encerra se você estiver com a condição Inconsciente (não apenas Incapacitado) ou vestir armadura Pesada."],["barbaro","",17,"Golpe Brutal Fortalecido","O dano adicional de seu Golpe Brutal aumenta para 2d10 pontos. Além disso, você pode usar dois efeitos diferentes de Golpe Brutal sempre que utilizar esta característica."],["barbaro","",18,"Força Indomável","Se o total de seu teste de Força ou de sua salvaguarda de Força for menor que seu valor de Força, você pode usar esse valor no lugar do resultado total."],["barbaro","",19,"Dádiva Épica","Você adquire um talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. A Dádiva do Ataque Irresistível é recomendada."],["barbaro","",20,"Campeão Primitivo","Você incorpora o poder primitivo. Seus valores de Força e Constituição aumentam em 4, até um máximo de 25."],["barbaro","Trilha da Árvore do Mundo",3,"Vitalidade da Árvore","Sua Fúria se conecta à força vital da Árvore do Mundo. Você adquire os seguintes benefícios.\n\nForça Revigorante. No início de cada um dos seus turnos enquanto sua Fúria estiver ativa, você pode escolher outra criatura a até 3 metros de você para receber Pontos de Vida Temporários. Para determinar a quantidade de Pontos de Vida Temporários, jogue um número de d6s igual ao seu bônus de Dano da Fúria e some os valores. Se qualquer um desses Pontos de Vida Temporários ainda estiverem ativos quando sua Fúria terminar, eles desaparecem.\n\nSurto de Vitalidade. Ao ativar sua Fúria, você recebe um número de Pontos de Vida Temporários igual ao seu nível de Bárbaro."],["barbaro","Trilha da Árvore do Mundo",6,"Ramos da Árvore","Sempre que uma criatura que você pode ver começar o turno a até 9 metros de você enquanto sua Fúria estiver ativa, você pode executar uma Reação para convocar ramos espectrais da Árvore do Mundo ao redor dela. O alvo deve ser bem-sucedido em uma salvaguarda de Força (CD 8 mais seu modificador de Força e seu Bônus de Proficiência) ou é teleportado para um espaço desocupado à sua vista a até 1,5 metro de você ou no espaço desocupado mais próximo à sua vista. Depois que o alvo se teleportar, você pode reduzir o Deslocamento dele a 0 até o final do turno atual."],["barbaro","Trilha da Árvore do Mundo",10,"Raízes Devastadoras","Durante o seu turno, seu alcance é 3 metros maior com qualquer arma corpo a corpo que tenha a propriedade Pesada ou Versátil, à medida que as raízes da Árvore do Mundo se estendem a partir de você. Quando você atinge com tal arma no seu turno, pode ativar a propriedade de maestria Derrubar ou Empurrar, além de outra propriedade de maestria que você estiver utilizando com a arma."],["barbaro","Trilha da Árvore do Mundo",14,"Percorrer a Árvore","Ao ativar sua Fúria e, como uma Ação Bônus enquanto ela estiver ativa, você pode se teleportar a até 18 metros para um espaço desocupado à sua vista.\n\nAlém disso, uma vez por Fúria, você pode aumentar o alcance desse teleporte para 45 metros. Ao fazer isso, você também pode levar até seis criaturas voluntárias que estejam a até 3 metros de você. Cada criatura se teleporta para um espaço desocupado à sua escolha a até 3 metros do seu destino."],["barbaro","Trilha do Berserker",3,"Frenesi","Se você usar Ataque Imprudente enquanto sua Fúria estiver ativa, você causa dano adicional ao primeiro alvo atingido no seu turno com um ataque baseado em Força. Para determinar o dano adicional, jogue um número de d6s igual ao seu bônus de Dano da Fúria e some os resultados. O dano tem o mesmo tipo da arma ou do Ataque Desarmado utilizado para o ataque."],["barbaro","Trilha do Berserker",6,"Fúria Irracional","Você tem Imunidade às condições Amedrontado e Enfeitiçado enquanto sua Fúria estiver ativa. Se você estiver sob efeito de uma dessas condições ao entrar em Fúria, a condição encerra."],["barbaro","Trilha do Berserker",10,"Retaliação","Quando você sofrer dano de uma criatura que esteja a até 1,5 metro de você, pode executar uma Reação para realizar um ataque corpo a corpo contra essa criatura, usando uma arma ou um Ataque Desarmado."],["barbaro","Trilha do Berserker",14,"Presença Intimidante","Como uma Ação Bônus, você pode causar terror em outros com sua presença ameaçadora e poder primitivo. Quando fizer isso, cada criatura à sua escolha em uma Emanação de 9 metros originada de você deve realizar uma salvaguarda de Sabedoria (CD 8 + seu modificador de Força + seu Bônus de Proficiência). Se falhar, a criatura tem a condição Amedrontado por 1 minuto. No final de cada turno da criatura Amedrontada, ela repete a salvaguarda, e encerra o efeito em caso de sucesso.\n\nUma vez que você usa essa característica, não pode usá-la novamente até completar um Descanso Longo, menos que gaste um uso de sua Fúria (nenhuma ação necessária) para restaurar o uso.\n\na é"],["barbaro","Trilha do Coração Selvagem",3,"Arauto da Fauna","Você pode conjurar as magias Falar com Animais e Sentido Feral , mas apenas como Rituais. Sabedoria é seu atributo de conjuração para elas."],["barbaro","Trilha do Coração Selvagem",3,"Fúria dos Selvagens","Sua Fúria se conecta ao poder primitivo dos animais. Sempre que você ativar sua Fúria, adquire uma das seguintes opções à sua escolha.\n\nÁguia . Ao ativar sua Fúria, você pode executar as ações Correr e Desengajar como parte dessa Ação Bônus. Enquanto sua Fúria estiver ativa, você pode executar uma Ação Bônus para realizar ambas as ações.\n\nLobo. Enquanto sua Fúria estiver ativa, seus aliados têm Vantagem em jogadas de ataque contra qualquer inimigo seu a até 1,5 metro de você.\n\nUrso. Enquanto em Fúria, você tem Resistência a todos os tipos de dano, exceto Energético, Necrótico, Psíquico e Radiante."],["barbaro","Trilha do Coração Selvagem",6,"Aspecto dos Selvagens","Você recebe uma das seguintes opções à sua escolha. Sempre que completar um Descanso Longo, você pode alterar sua escolha.\n\nCoruja. Você tem Visão no Escuro com um alcance de 18 metros. Se você já tem Visão no Escuro, seu alcance aumenta em 18 metros.\n\nPantera. Você tem um Deslocamento de Escalada igual ao seu Deslocamento.\n\nSalmão. Você tem um Deslocamento de Natação igual ao seu Deslocamento."],["barbaro","Trilha do Coração Selvagem",10,"Arauto da Natureza","Você pode conjurar a magia Comunhão com a Natureza , mas apenas como um Ritual. Sabedoria é seu atributo de conjuração para isso."],["barbaro","Trilha do Coração Selvagem",14,"Poder dos Selvagens","Sempre que você ativar sua Fúria, recebe uma das seguintes opções à sua escolha.\n\nCarneiro. Enquanto sua Fúria estiver ativa, você pode impor a condição Caído em uma criatura Grande ou menor quando você a atinge com um ataque corpo a corpo.\n\nFalcão. Enquanto sua Fúria estiver ativa, você tem um Deslocamento de Voo igual ao seu Deslocamento se não estiver usando nenhuma armadura.\n\nLeão. Enquanto sua Fúria estiver ativa, qualquer um de seus inimigos a até 1,5 metro de você tem Desvantagem em jogadas de ataque contra alvos que não sejam você ou outro Bárbaro que tenha essa opção ativa."],["barbaro","Trilha do Fanático",3,"Campeão dos Deuses","Uma entidade divina assegura que você possa continuar lutando. Você tem uma reserva de quatro d12s que pode gastar para se curar. Como uma Ação Bônus, você pode gastar dados da reserva, jogá-los e recuperar uma quantidade de Pontos de Vida igual ao total do resultado.\n\nSua reserva restaura todos os dados gastos quando você completa um Descanso Longo.\n\nO número máximo de dados na reserva aumenta em um quando você atinge os níveis de Bárbaro 6 (5 dados), 12 (6 dados) e 17 (7 dados)."],["barbaro","Trilha do Fanático",3,"Fúria Divina","Você pode canalizar poder divino em seus golpes. Em cada um dos seus turnos, enquanto sua Fúria estiver ativa, a primeira criatura que você atingir com uma arma ou com um Ataque Desarmado sofre dano adicional igual a 1d6 pontos mais metade do seu nível de Bárbaro (arredondado para baixo). O dano adicional é do tipo Necrótico ou Radiante, à sua escolha, cada vez que causar dano."],["barbaro","Trilha do Fanático",6,"Concentração Fanática","Uma vez por Fúria ativa, se você falhar em uma salvaguarda, pode jogá-la novamente com um bônus igual ao seu bônus de Dano da Fúria, e deve usar o novo resultado."],["barbaro","Trilha do Fanático",10,"Presença Zelosa","Como uma Ação Bônus, você libera um grito de batalha infundido com energia divina. Até dez outras criaturas à sua escolha a até 18 metros de você obtêm Vantagem em jogadas de ataque e salvaguardas até o início do seu próximo turno.\n\nUma vez que você usa essa característica, não pode usá-la novamente até completar um Descanso Longo, menos que gaste um uso de sua Fúria (nenhuma ação necessária) para restaurar o uso."],["barbaro","Trilha do Fanático",14,"Fúria dos Deuses","Quando você ativa sua Fúria, pode assumir a forma de um combatente divino. Essa forma dura 1 minuto ou até você atingir 0 Pontos de Vida. Uma vez que você use essa característica, não pode fazê-lo novamente até completar um Descanso Longo.\n\nEnquanto estiver nesta forma, você adquire os benefícios a seguir.\n\nResistência. Você tem Resistência a dano Necrótico, Psíquico e Radiante.\n\nRevivificação. Quando uma criatura a até 9 metros de você atingir 0 Pontos de Vida, você pode executar uma Reação para gastar um uso da sua Fúria e, em vez disso, mudar os Pontos de Vida do alvo para um número igual ao seu nível de Bárbaro.\n\nVoo. Você tem um Deslocamento de Voo igual ao seu Deslocamento e pode pairar.\n\na é Um Inspirador Performista de Música, Dança e Magia nvocando magia através de música, dança e versos, os Bardos são peritos em inspirar os outros, aliviar ferimentos, desanimar inimigos e criar ilusões. Eles acreditam que o multiverso foi trazido à existência por meio de palavras pronunciadas e que resquícios das Palavras de Criação ainda ressoam e brilham em todos os planos de existência. A magia dos Bardos tenta canalizar essas palavras, que transcendem qualquer idioma.\n\nQualquer coisa pode inspirar uma nova canção ou história, o que faz com que os Bardos sejam fascinados por quase tudo. Eles se tornam mestres em muitas coisas, incluindo tocar música, realizar magia e fazer brincadeiras.\n\nA vida de um Bardo é passada viajando, coletando conhecimento, contando histórias e vivendo da gratidão dos ouvintes, como qualquer outro artista. No entanto, a profundidade de conhecimento e o domínio da magia distinguem os Bardos dos demais."],["bardo","",1,"Inspiração de Bardo","Você pode inspirar outros sobrenaturalmente por meio de palavras, música ou dança. Essa inspiração é representada pelo seu dado de Inspiração de Bardo, que é um d6.\n\nUsando Inspiração de Bardo. Como uma Ação Bônus, você pode inspirar outra criatura a até 18 metros de você que possa vê-lo ou ouvi-lo. Essa criatura recebe um de seus dados de Inspiração de Bardo. Uma criatura pode ter apenas um dado de Inspiração de Bardo de cada vez.\n\nUma vez, dentro da próxima uma hora, após a criatura falhar em um Teste de D20, ela pode jogar o dado de Inspiração de Bardo e adicionar o resultado ao D20, transformando potencialmente a falha em sucesso. O dado de Inspiração de Bardo é gasto quando for jogado.\n\nQuantidade de Usos. Você pode conceder um dado de Inspiração de Bardo um número de vezes igual ao seu modificador de Carisma (mínimo de uma vez), e você restaura todos os usos gastos ao completar um Descanso Longo.\n\nEm Níveis Superiores. Seu dado de Inspiração de Bardo muda quando você atinge certos níveis de Bardo, conforme mostrado na coluna Dados de Inspiração da tabela Características de Bardo. O dado se torna um d8 no nível 5, um d10 no nível 10 e um d12 no nível 15."],["bardo","",1,"Conjuração","Você aprendeu a conjurar magias através de suas artes bárdicas. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você utiliza essas regras com as magias de Bardo, explicadas na lista de magias de Bardo mais adiante na descrição da classe.\n\nTruques. Você conhece dois truques à sua escolha da lista de magias de Bardo. Luzes Dançantes e Zombaria Perversa são recomendadas.\n\nSempre que você alcança um nível de Bardo, pode substituir um dos seus truques por outro truque à sua escolha da lista de magias de Bardo.\n\nAo atingir os níveis 4 e 10, você aprende mais um truque à sua escolha da lista de magias de Bardo, conforme mostrado na coluna Truques da tabela Características de Bardo.\n\nEspaços de Magia. A tabela Características de Bardo mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos quando completa um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com esta característica. Para começar, escolha quatro magias de 1º círculo da lista de magias de Bardo. Enfeitiçar Pessoa , Leque Cromático , Palavra Curativa e Sussurros Dissonantes são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você alcança níveis de Bardo, conforme mostrado na coluna Magias Preparadas da tabela Características de Bardo. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Bardo até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Bardo de nível 3, sua lista de magias preparadas pode incluir seis magias de 1º ou 2º círculo em qualquer combinação.\n\nSe outra característica de Bardo lhe der magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas essas magias, de outra forma, contam como magias de Bardo para você.\n\nMudando Suas Magias Preparadas. Sempre que você obtém um nível de Bardo, pode substituir uma magia em sua lista por outra magia de Bardo para a qual você tem espaços de magia.\n\nAtributo de Conjuração. Carisma é seu atributo de conjuração para suas magias de Bardo.\n\nFoco de Conjuração. Você pode usar um Instrumento Musical como Foco de Conjuração para suas magias de Bardo."],["bardo","",2,"Especialista","Você obtém Especialização (veja o glossário de regras) em duas de suas perícias, à sua escolha, nas quais já seja proficiente. Atuação e Persuasão são recomendadas se você tiver proficiência nelas.\n\nNo nível 9 de Bardo, você obtém Especialização em mais duas perícias nas quais já seja proficiente à sua escolha."],["bardo","",2,"Pau pra Toda Obra","Você pode adicionar metade do seu Bônus de Proficiência (arredondado para baixo) a qualquer teste de atributo que realizar que use uma perícia à qual não possua proficiência e que não use seu Bônus de Proficiência.\n\nPor exemplo, se você realizar um teste de Força (Atletismo) e não tiver proficiência em Atletismo, pode adicionar metade do seu Bônus de Proficiência ao teste."],["bardo","",3,"Subclasse de Bardo","Você adquire uma subclasse de Bardo à sua escolha. As subclasses Colégio da Bravura, Colégio da Dança, Colégio do Conhecimento e Colégio do Glamour estão detalhadas após a descrição desta classe. Uma subclasse é uma especialização que lhe concede características em determinados níveis de Bardo. Durante toda sua jornada, você adquire cada característica de sua subclasse que corresponda ao seu nível de Bardo ou inferior."],["bardo","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. Você adquire essa característica novamente nos níveis 8, 12 e 16 de Bardo."],["bardo","",5,"Fonte de Inspiração","Você agora restaura todos os seus usos gastos de Inspiração de Bardo quando completa um Descanso Curto ou Longo.\n\nAlém disso, você pode gastar um espaço de magia (nenhuma ação necessária) para recuperar um uso gasto de Inspiração de Bardo."],["bardo","",7,"Contra-Encantamento","Você pode usar notas musicais ou palavras de poder para interromper efeitos que influenciam a mente. Se você ou uma criatura a até 9 metros de você falhar em uma salvaguarda contra um efeito que aplica as condições Amedrontado ou Enfeitiçado, você pode executar uma Reação para jogar novamente a salvaguarda, e a nova jogada tem Vantagem."],["bardo","",10,"Segredos Mágicos","Você aprendeu segredos de várias tradições mágicas. Sempre que você alcançar um nível de Bardo (incluindo este nível) e o número de Magias Preparadas na tabela Características de Bardo aumentar, você pode escolher qualquer uma das novas magias preparadas da lista de magias de Bardo, Clérigo, Druida e Mago, e as magias escolhidas contam como magias de Bardo para você (veja a seção de cada classe para a respectiva lista de magias). Além disso, sempre que você substituir uma magia preparada para esta classe, pode trocá-la por uma magia dessas listas."],["bardo","",18,"Inspiração Superior","Quando você jogar Iniciativa, recupera usos gastos de Inspiração de Bardo até ter dois, se tiver menos do que isso."],["bardo","",19,"Dádiva Épica","Você adquire um talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. A Dádiva da Recordação de Magia é recomendada."],["bardo","",20,"Palavras de Criação","Você dominou duas das Palavras de Criação: as palavras de vida e morte. Portanto, você sempre tem as magias Palavra de Poder: Matar e Palavra de Poder: Salvar preparadas. Quando você conjura qualquer uma dessas magias, pode escolher uma segunda criatura que está a até 3 metros do primeiro alvo."],["bardo","Colégio da Bravura",3,"Inspiração em Combate","Você pode usar sua astúcia para virar o rumo da batalha. Uma criatura que possui um dado de Inspiração de Bardo seu pode utilizá-lo para um dos seguintes efeitos.\n\nDefensivo. Quando a criatura é atingida por uma jogada de ataque, pode executar a própria Reação para jogar o dado da Inspiração de Bardo e adicionar o resultado jogado à própria CA contra aquele ataque, potencialmente fazendo com que o ataque erre.\n\nOfensivo. Imediatamente após a criatura atingir um alvo com uma jogada de ataque, ela pode jogar o dado da Inspiração de Bardo e adicionar o resultado jogado ao dano do ataque contra o alvo."],["bardo","Colégio da Bravura",3,"Treinamento Marcial","Você adquire proficiência com armas Marciais, armaduras Médias e treinamento com Escudos.\n\nAlém disso, você pode usar uma arma Simples ou Marcial como Foco de Conjuração para conjurar magias da sua lista de magias de Bardo."],["bardo","Colégio da Bravura",6,"Ataque Extra","Você pode atacar duas vezes, em vez de uma, sempre que executar a ação Atacar no seu turno.\n\nAlém disso, você pode conjurar um de seus truques que tenha um tempo de conjuração de uma ação no lugar de um desses ataques."],["bardo","Colégio da Bravura",14,"Magia de Batalha","Após conjurar uma magia que tenha um tempo de conjuração de uma ação, você pode realizar um ataque com uma arma como uma Ação Bônus."],["bardo","Colégio da Dança",3,"Ginga Fascinante","Enquanto você não estiver vestindo armadura ou empunhando um Escudo, adquire os seguintes benefícios.\n\nDança Virtuosa. Você tem Vantagem em qualquer teste de Carisma (Atuação) que envolva você dançando.\n\nDano de Bardo. Você pode usar Destreza em vez de Força para as jogadas de ataque de seus Ataques Desarmados. Quando você causar dano com um Ataque Desarmado, pode causar dano Contundente igual ao resultado do dado da sua Inspiração de Bardo mais seu modificador de Destreza, em vez do dano normal do ataque. Esse uso não gasta o dado.\n\nDefesa sem Armadura. Sua Classe de Armadura base é igual a 10 mais seus modificadores de Destreza e Carisma.\n\nGolpes Ágeis. Quando você gastar um uso da sua Inspiração de Bardo como parte de uma ação, Ação Bônus ou Reação, pode realizar um Ataque Desarmado como parte dessa ação, Ação Bônus ou Reação."],["bardo","Colégio da Dança",6,"Gingado Coordenado","Ao jogar Iniciativa, você pode gastar um uso da sua Inspiração de Bardo se não estiver com a condição Incapacitado. Ao realizar isso, jogue o dado da sua Inspiração de Bardo; você e cada aliado a até 9 metros de você que puder ver ou ouvir você adquire um bônus na Iniciativa igual ao número jogado."],["bardo","Colégio da Dança",6,"Movimento Inspirador","Quando um inimigo à sua vista encerra o turno dele a até 1,5 metro de você, você pode executar uma Reação e gastar um uso da sua Inspiração de Bardo para se mover até metade do seu Deslocamento. Em seguida, um aliado à sua escolha a até 9 metros de você também pode se mover até metade do Deslocamento dele usando a própria Reação.\n\nNenhum movimento dessa característica provoca Ataques de Oportunidade."],["bardo","Colégio da Dança",14,"Evasão Liderada","Se você for alvo de um efeito que permita uma salvaguarda de Destreza para receber apenas metade do dano, você não recebe dano algum se for bem-sucedido e apenas metade se falhar. Se criaturas até 1,5 metro de você também realizarem a salvaguarda, você pode compartilhar esse benefício com elas.\n\nVocê não pode usar esta característica se estiver com a condição Incapacitado."],["bardo","Colégio do Conhecimento",3,"Palavras de Interrupção","Você aprende a usar sua sagacidade para distrair, confundir e diminuir sobrenaturalmente a confiança e a competência dos outros. Quando uma criatura à sua vista a até 18 metros de você realizar uma jogada de dano, ou for bem-sucedida em um teste de atributo ou jogada de ataque, você pode executar uma Reação para gastar um uso da sua Inspiração de Bardo. Jogue o dado de Inspiração de Bardo e subtraia o número jogado do resultado da criatura, reduzindo o dano ou transformando potencialmente o sucesso em fracasso."],["bardo","Colégio do Conhecimento",3,"Proficiências Bônus","Você adquire proficiência em três perícias à sua escolha."],["bardo","Colégio do Conhecimento",6,"Descobertas Mágicas","Você aprende duas magias à sua escolha. Essas magias podem vir da lista de magias de Clérigo, Druida ou Mago, ou uma combinação dessas listas (veja a seção da classe para a respectiva lista de magias). A magia escolhida deve ser um truque ou uma magia para a qual você tenha espaços de magia disponíveis, conforme mostrado na tabela Características de Bardo.\n\nVocê sempre tem as magias escolhidas preparadas e, sempre que adquirir um novo nível de Bardo, pode substituir uma das magias por outra que atenda a esses requisitos."],["bardo","Colégio do Conhecimento",14,"Perícia Inigualável","Quando você realizar um teste de atributo ou uma jogada de ataque e falhar, pode gastar um uso da Inspiração de Bardo; jogue o dado da Inspiração de Bardo e adicione o resultado jogado ao d20, transformando potencialmente a falha em sucesso. Se falhar, o uso da Inspiração de Bardo não é gasto."],["bardo","Colégio do Glamour",3,"Magia Fascinante","Você sempre está com as magias Enfeitiçar Pessoa e Reflexos preparadas.\n\nAlém disso, imediatamente após você conjurar uma magia de Encantamento ou Ilusão usando um espaço de magia, pode fazer com que uma criatura à sua vista a até 18 metros de você realize uma salvaguarda de Sabedoria contra a CD para evitar sua magia. Se falhar, o alvo tem a condição Amedrontado ou Enfeitiçado (à sua escolha) por 1 minuto. O alvo repete a salvaguarda no final de cada um dos próprios turnos, e encerra o efeito em caso de sucesso.\n\nDepois de usar este benefício, você não pode utilizá-lo novamente até completar um Descanso Longo. Você também pode restaurar um uso gastando uma Inspiração de Bardo (nenhuma ação é necessária)."],["bardo","Colégio do Glamour",3,"Manto de Inspiração","Você pode canalizar magia feérica em uma canção ou dança, revigorando os outros. Como um Ação Bônus, você pode usar uma das suas Inspirações de Bardo, jogando um dado de Inspiração de Bardo. Escolha um número de criaturas a até 18 metros de você igual ao seu modificador de Carisma (no mínimo uma criatura). Cada uma dessas criaturas recebe um número de Pontos de Vida Temporários igual a duas vezes o número jogado no dado de Inspiração de Bardo e, então, cada uma pode executar uma Reação para se mover até o máximo do Deslocamento sem provocar Ataques de Oportunidade."],["bardo","Colégio do Glamour",6,"Manto de Majestade","Você tem sempre a magia Comando preparada.\n\nComo uma Ação Bônus, você pode conjurar Comando sem gastar um espaço de magia e assumir uma aparência sobrenatural por 1 minuto ou até que sua Concentração se quebre. Durante esse tempo, você pode conjurar Comando como uma Ação Bônus sem gastar um espaço de magia.\n\nQualquer criatura que está com a condição Enfeitiçado por você falha automaticamente em uma salvaguarda contra o Comando que você conjurar com esta característica.\n\nApós usar esta característica, você não pode utilizá-la novamente até completar um Descanso Longo. Você também pode restaurar seu uso gastando um espaço de magia de 3º círculo ou superior (nenhuma ação é necessária)."],["bardo","Colégio do Glamour",14,"Majestade Inquebrável","Como uma Ação Bônus, você pode assumir uma presença majestosamente mágica por 1 minuto ou até que tenha a condição Incapacitado. Por essa duração, sempre que qualquer criatura o atinge com uma jogada de ataque pela primeira vez em um turno, o atacante deve ser bem-sucedido em uma salvaguarda de Carisma contra a CD para evitar sua magia, ou o ataque falha, pois a criatura retrai diante de sua majestade.\n\nUma vez que você assume essa presença majestosa, não pode fazê-lo novamente até completar um Descanso Curto ou Longo.\n\nUm Ocultista Fortalecido com Pactos Sobrenaturais ruxos buscam conhecimento oculto no multiverso, frequentemente começando sua jornada em tomos de sabedoria proibida, realizando invocações para atrair seres extra planares ou explorando locais de poder ligados a essas entidades. Logo, cada Bruxo é atraído para realizar um pacto com um patrono poderoso. Com base no conhecimento de anjos, demônios, diabos e entidades do Reino Distante, eles coletam segredos arcanos para aumentar seu próprio poder.\n\nOs Bruxos veem seus patronos como recursos para alcançar magia. Enquanto alguns os respeitam ou amam, outros servem relutantemente ou até tentam prejudicá-los, mesmo usando o poder concedido. Após o pacto, a busca por conhecimento e poder torna-se insaciável; a maioria dedica-se a aventuras em busca de mais poder e sabedoria.\n\nApós a realização de um pacto, a busca incessante de um Bruxo por conhecimento e poder não pode ser satisfeita apenas com estudo. A maioria dos Bruxos dedica seus dias a procurar maior poder e conhecimento, geralmente por meio de aventuras."],["bruxo","",1,"Invocações Místicas","Você descobriu Invocações Místicas, fragmentos de conhecimento proibido que lhe conferem uma habilidade mágica permanente ou outros ensinamentos. Você recebe uma invocação à sua escolha, como Pacto do Tomo. As invocações são descritas na seção “Opções de Invocações Místicas” mais adiante na descrição desta classe.\n\nPré-requisitos. Se uma invocação tiver um pré-requisito, você deve atendê-lo para aprender essa invocação. Por exemplo, se uma invocação exigir que você seja um Bruxo de nível 5 ou superior, você pode selecionar a invocação quando alcançar o nível 5 de Bruxo.\n\nSubstituindo e Recebendo outras Invocações. Ao alcançar um nível de Bruxo, você pode substituir uma de suas invocações por outra para a qual se qualifica. Você não pode substituir uma invocação se ela for um pré-requisito para outra invocação que você tenha. Ao alcançar certos níveis de Bruxo, você adquire mais invocações à sua escolha, conforme mostrado na coluna Invocações da tabela Características de Bruxo. Você não pode escolher a mesma invocação mais de uma vez, a menos que a descrição da invocação indique o contrário."],["bruxo","",1,"Magia de Pacto","Por meio de uma cerimônia oculta, você realizou um pacto com uma entidade misteriosa para obter poderes mágicos. Essa voz nas sombras é enigmática, mas a dádiva concedida por ela é clara: a habilidade de conjurar magias. Veja o capítulo 7 para as regras de conjuração. As informações a seguir explicam como aplicar essas regras às magias de Bruxo, que estão listadas mais adiante na descrição da classe.\n\nTruques. Você conhece dois truques de Bruxo à sua escolha. Prestidigitação Arcana e Raio Místico são recomendados. Ao alcançar um nível de Bruxo, você pode substituir um dos seus truques dessa característica por outro truque de Bruxo à sua escolha. Ao atingir os níveis 4 e 10 de Bruxo, você aprende mais um truque de Bruxo à sua escolha, conforme detalhado na coluna Truques da tabela Características de Bruxo.\n\nEspaços de Magia. A tabela Características de Bruxo mostra quantos espaços de magia você tem para conjurar suas magias de Bruxo de 1º a 5º círculo. A tabela também mostra o círculo desses espaços, todos do mesmo círculo. Você restaura todos os espaços de Magia de Pacto gastos ao completar um Descanso Curto ou Longo.\n\nPor exemplo, quando você é um Bruxo de nível 5, você tem dois espaços de magia de 3º círculo. Para conjurar a magia Raio de Bruxa de 1º círculo, você deve gastar um desses espaços e conjurá-la como uma magia de 3º círculo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com essa característica. Para começar, escolha duas magias de Bruxo de 1º círculo. Danação e Enfeitiçar Pessoa são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você alcança níveis de Bruxo, conforme mostrado na coluna Magias Preparadas da tabela Características de Bruxo. Quando esse número aumentar, escolha magias adicionais de Bruxo até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo não superior mostrado na coluna círculo do Espaço da tabela para o seu nível. Quando você atinge o nível 6, por exemplo, você aprende uma nova magia de Bruxo, que pode ser de 1º a 3º círculo.\n\nSe outra característica de Bruxo lhe concede magias sempre preparadas, elas não contam para o número de magias que você pode preparar com essa característica, mas ainda são consideradas magias de Bruxo para você.\n\nMudando Suas Magias Preparadas. Sempre que você ganha um nível de Bruxo, pode substituir uma magia da sua lista por outra magia de Bruxo de um nível elegível.\n\nAtributo de Conjuração. Carisma é o atributo de conjuração para suas magias de Bruxo.\n\nFoco de Conjuração. Você pode usar um Foco Arcano como um Foco de Conjuração para suas magias de Bruxo."],["bruxo","",2,"Astúcia Mágica","Ao final de um rito esotérico que você pode realizar por 1 minuto, você recupera os espaços de magia das Magias de Pacto gastos em um número igual à metade da sua quantidade máxima (arredondado para cima). Você pode usar esta característica novamente após completar um Descanso Longo."],["bruxo","",3,"Subclasse de Bruxo","Você adquire uma subclasse de Bruxo à sua escolha. As subclasses Patrono Arquifada, Patrono Celestial, Patrono Grande Antigo e Patrono Ínfero estão detalhadas após a descrição desta classe. Uma subclasse é uma especialidade que concede a você características em determinados níveis de Bruxo. Durante toda sua jornada, você adquire cada uma das características de sua subclasse de seu nível de Bruxo ou menor."],["bruxo","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. Você adquire essa característica novamente nos níveis 8, 12 e 16 de Bruxo."],["bruxo","",9,"Contatar Patrono","No passado, você entrava em contato com seu patrono por meio de intermediários. Agora, você pode se comunicar diretamente com ele. Você sempre tem a magia Contato Extraplanar preparada. Com esta característica, você pode conjurar a magia sem gastar um espaço de magia para entrar em contato com seu patrono, e você é bem-sucedido automaticamente na salvaguarda da magia. Você pode conjurar a magia com esta característica novamente após completar um Descanso Longo."],["bruxo","",11,"Arcana Mística","Seu patrono lhe concede um segredo mágico chamado arcanum. Escolha uma magia de Bruxo de 6º círculo com este arcanum.\n\nVocê pode conjurar sua magia arcanum uma vez sem gastar um espaço de magia, e novamente desta forma após completar um Descanso Longo Conforme mostrado na tabela Características de Bruxo, você recebe outra magia de Bruxo à sua escolha que pode ser conjurada deste modo ao atingir os níveis de Bruxo 13 (magia de 7º círculo), 15 (magia de 8º círculo) e 17 (magia de 9º círculo). Você restaura todos os usos da sua Arcana Mística ao completar um Descanso Longo.\n\nAo alcançar um nível de Bruxo, você pode substituir uma de suas magias de arcanum por outra magia de Bruxo do mesmo círculo."],["bruxo","",19,"Dádiva Épica","Você adquire o talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual se qualifica. O talento Dádiva do Destino é recomendado."],["bruxo","",20,"Mestre Místico","Ao usar sua característica Astúcia Mágica, você restaura todos os seus espaços de magia gastos das suas Magias de Pacto."],["bruxo","Patrono Arquifada",3,"Magias de Pacto da Arquifada","A magia do seu patrono assegura que você sempre tenha algumas magias disponíveis; ao atingir um nível de Bruxo indicado na tabela Magias da Arquifada, você sempre tem essas magias preparadas."],["bruxo","Patrono Arquifada",3,"Passos Feéricos","Seu patrono lhe confere a habilidade de transitar entre os planos. Você pode conjurar Passo Nebuloso sem gastar um espaço de magia um número de vezes igual ao seu modificador de Carisma (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo.\n\nAlém disso, ao conjurar essa magia, você pode escolher um dos seguintes efeitos adicionais.\n\nPasso Provocante. Criaturas a até 1,5 metro do espaço que você deixou devem ser bem-sucedidas em uma salvaguarda de Sabedoria contra a CD para evitar sua magia ou têm Desvantagem em jogadas de ataque contra criaturas diferentes de você até o início do seu próximo turno.\n\nPasso Revigorante. Imediatamente após você se teleportar, você ou uma criatura à sua vista a até 3 metros de você, adquire 1d10 Pontos de Vida Temporários."],["bruxo","Patrono Arquifada",6,"Fuga em Névoa","Você pode conjurar Passo Nebuloso como uma Reação ao sofrer dano.\n\nAlém disso, os seguintes efeitos agora estão entre suas opções de Passos Feéricos.\n\nPasso Desvanecedor. Você tem a condição Invisível até o início do seu próximo turno ou até imediatamente após realizar uma jogada de ataque, causar dano ou conjurar uma magia.\n\nPasso Terrível. Criaturas a até 1,5 metro do espaço que você deixou ou do espaço em que você aparece (à sua escolha) devem ser bem-sucedidas em uma salvaguarda de Sabedoria contra a CD para evitar sua magia ou sofrem 2d10 pontos de dano Psíquico."],["bruxo","Patrono Arquifada",10,"Defesas Sedutoras","Seu patrono ensina como proteger sua mente e corpo. Você é imune à condição Enfeitiçado.\n\nAlém disso, imediatamente após uma criatura à sua vista acertar você com uma jogada de ataque, você pode executar uma Reação para reduzir o dano sofrido pela metade (arredondado para baixo) e pode forçar quem o atacou a realizar uma salvaguarda de Sabedoria contra a CD para evitar sua magia. Se falhar, o atacante sofre dano Psíquico igual ao dano que você sofreu. Após executar esta Reação, você não pode usá-la novamente até completar um Descanso Longo, a menos que gaste um espaço de Magia de Pacto (nenhuma ação é necessária) para restaurar seu uso."],["bruxo","Patrono Arquifada",14,"Magia Sedutora","Seu patrono concede a você a capacidade de tecer sua magia com teleporte. Imediatamente após conjurar uma magia de Encantamento ou Ilusão usando uma ação e um espaço de magia, você pode conjurar Passo Nebuloso como parte da mesma ação e sem gastar um espaço de magia."],["bruxo","Patrono Celestial",3,"Luz Medicinal","Você adquire a habilidade de canalizar energia celestial para curar feridas. Você tem uma reserva de d6s que podem ser gastos nessa cura. O número de dados na reserva é igual a 1 mais seu nível de Bruxo.\n\nComo uma Ação Bônus, você pode curar a si ou uma criatura à sua vista a até 18 metros de você, gastando dados da reserva. O número máximo de dados que você pode gastar de uma só vez é igual ao seu modificador de Carisma (mínimo de um dado). Jogue os dados que deseja e restaure um número de Pontos de Vida igual ao resultado. Sua reserva recupera todos os dados gastos ao completar um Descanso Longo."],["bruxo","Patrono Celestial",3,"Magia de Pacto do Celestial","A magia do seu patrono assegura que você sempre tenha algumas magias disponíveis; ao atingir um nível de Bruxo indicado na tabela Magias do Celestial, você sempre tem essas magias preparadas."],["bruxo","Patrono Celestial",6,"Alma Radiante","Seu vínculo com seu patrono permite que você sirva como condutor de energia radiante. Você tem Resistência a Dano Radiante. Uma vez por turno, quando conjurar uma magia que cause dano Ígneo ou Radiante, você pode adicionar seu modificador de Carisma ao dano dessa magia contra um dos alvos da magia."],["bruxo","Patrono Celestial",10,"Resiliência Celestial","Você recebe Pontos de Vida Temporários sempre que usar sua característica Astúcia Mágica ou completar um Descanso Curto ou Longo. Esses Pontos de Vida Temporários são iguais ao seu nível de Bruxo mais seu modificador de Carisma. Além disso, escolha até cinco criaturas à sua vista quando receber os pontos. Cada uma dessas criaturas recebe Pontos de Vida Temporários iguais à metade do seu nível de Bruxo mais seu modificador de Carisma."],["bruxo","Patrono Celestial",14,"Vingança Calcinante","Quando você ou um aliado a até 18 metros de você estiver prestes a realizar uma Salvaguarda Contra Morte, você pode liberar energia radiante para salvar a criatura. A criatura restaura Pontos de Vida iguais à metade de seus Pontos de Vida máximos e pode encerrar a condição Caído em si. Cada criatura à sua escolha que esteja a até 9 metros da criatura sofre dano Radiante igual a 2d8 mais seu modificador de Carisma e cada uma tem a condição Cego até o final do turno atual. Você pode usar esta característica novamente após completar um Descanso Longo."],["bruxo","Patrono O Grande Antigo",3,"Magias de Pacto do Grande Antigo","A magia do seu patrono assegura que você sempre tenha algumas magias disponíveis; ao atingir um nível de Bruxo indicado na tabela Magias do Grande Antigo, você sempre tem essas magias preparadas."],["bruxo","Patrono O Grande Antigo",3,"Magias Psíquicas","Ao conjurar uma magia de Bruxo que cause dano, você pode mudar seu tipo de dano para Psíquico. Além disso, você pode conjurar uma magia de Bruxo que seja Encantamento ou Ilusão sem componentes Verbais ou Somáticos."],["bruxo","Patrono O Grande Antigo",3,"Mente Desperta","Você pode estabelecer uma conexão telepática com outra criatura. Como uma Ação Bônus, escolha uma criatura à sua vista a até 9 metros de você. Vocês podem se comunicar telepaticamente a uma distância máxima de 1,5 quilômetros vezes o seu modificador de Carisma (mínimo de 1,5 quilômetro). Para que a comunicação funcione, ambos devem usar mentalmente um idioma comum.\n\nA conexão telepática dura um número de minutos igual ao seu nível de Bruxo. Ela encerra mais cedo se você usar esta característica para se conectar com uma criatura diferente."],["bruxo","Patrono O Grande Antigo",6,"Combatente Clarividente","Ao formar uma ligação telepática com uma criatura usando Mente Desperta, você pode forçar essa criatura a realizar uma salvaguarda de Sabedoria contra a CD para evitar sua magia. Se falhar, a criatura tem Desvantagem em jogadas de ataque contra você e você tem Vantagem em jogadas de ataque contra essa criatura pela duração da ligação.\n\nVocê pode usar esta característica novamente após completar um Descanso Curto ou Longo ou gastar um espaço de magia de Pacto (nenhuma ação é necessária) para restaurar seu uso."],["bruxo","Patrono O Grande Antigo",10,"Danação Mística","Seu patrono alienígena lhe concede uma maldição poderosa. Você sempre tem a magia Danação preparada. Ao conjurar Danação e escolher um atributo, o alvo também tem Desvantagem nas salvaguardas do atributo escolhido pela duração da magia."],["bruxo","Patrono O Grande Antigo",10,"Escudo Mental","Seus pensamentos não podem ser lidos por telepatia ou outros meios, a menos que você permita. Você também tem Resistência a Dano Psíquico e sempre que uma criatura causar Dano Psíquico a você, essa criatura sofre a mesma quantidade de dano que você."],["bruxo","Patrono O Grande Antigo",14,"Criar Servo","Ao conjurar Invocar Aberração , você pode modificá-la para não exigir Concentração. Ao fazer isso, a duração da magia se torna 1 minuto para essa conjuração e, quando invocada, a Aberração tem um número de Pontos de Vida Temporários igual ao seu nível de Bruxo mais seu modificador de Carisma.\n\nAlém disso, na primeira vez de cada turno que a Aberração atinge uma criatura sob o efeito da sua Danação , a Aberração causa um dano Psíquico adicional ao alvo igual ao dano bônus dessa magia."],["bruxo","Patrono Ínfero",3,"Bênção do Tenebroso","Ao reduzir um inimigo a 0 Pontos de Vida, você adquire Pontos de Vida Temporários iguais ao seu modificador de Carisma mais seu nível de Bruxo (mínimo de 1 Ponto de Vida Temporário). Você também recebe esse benefício se outra pessoa reduzir um inimigo a até 3 metros de você a 0 Pontos de Vida."],["bruxo","Patrono Ínfero",3,"Magias de Pacto do Ínfero","A magia do seu patrono assegura que você sempre tenha algumas magias disponíveis; ao atingir um nível de Bruxo indicado na tabela Magias do Ínfero, você sempre tem essas magias preparadas."],["bruxo","Patrono Ínfero",6,"A Sorte do Próprio Tenebroso","Você pode chamar seu patrono Ínfero para alterar o destino a seu favor. Ao realizar um teste de atributo ou uma salvaguarda, você pode usar essa característica para adicionar 1d10 à sua jogada. Você pode fazer isso após ver a jogada, mas antes que qualquer um dos efeitos da jogada ocorra.\n\nVocê pode usar essa característica um número de vezes igual ao seu modificador de Carisma (mínimo de uma vez), no máximo uma vez por jogada, e restaura todos os usos gastos ao completar um Descanso Longo."],["bruxo","Patrono Ínfero",10,"Resistência Ínfera","Ao completar um Descanso Curto ou Longo, escolha um tipo de dano, exceto Energético. Você tem Resistência a esse tipo de dano até escolher um tipo de dano diferente com esta característica."],["bruxo","Patrono Ínfero",14,"Lançar no Inferno","Uma vez por turno, ao atingir uma criatura com uma jogada de ataque, você pode tentar transportar instantaneamente o alvo para os Planos Inferiores. O alvo deve ser bem-sucedido em uma salvaguarda de Carisma contra a CD para evitar sua magia, ou ele desaparece e atravessa uma paisagem de pesadelo. O alvo sofre 8d10 pontos de dano Psíquico se não for um Ínfero e t em a condição Incapacitado até o final do seu próximo turno, quando retorna ao espaço que ocupava anteriormente ou ao espaço desocupado mais próximo. Você pode usar esta característica novamente após completar um Descanso Longo, a menos que gaste um espaço de Magia de Pacto (nenhuma ação é necessária) para restaurar seu uso.\n\nUm Sacerdote Milagroso de Poder Divino lérigos canalizam o poder dos reinos dos deuses para realizar milagres. Abençoados por uma divindade, panteão ou outra entidade imortal, os Clérigos acessam a magia divina dos Planos Externos — onde habitam os deuses — e a utilizam para fortalecer os necessitados e enfrentar inimigos.\n\nComo seu poder é um presente divino, os Clérigos geralmente se associam a templos dedicados à divindade ou à força imortal que desbloqueou sua magia. Canalizar magia divina não depende de um treinamento específico, mas os Clérigos podem aprender orações e ritos que os auxiliam a acessar o poder dos Planos Externos.\n\nNem todos os membros de um templo ou santuário são Clérigos. Alguns sacerdotes levam uma vida simples de serviço no templo, dedicando-se à devoção por meio de orações e rituais, sem magia. Muitos mortais alegam falar pelos deuses, mas poucos podem invocar o poder dessas divindades da maneira que um Clérigo faz."],["clerigo","",1,"Conjuração","Você aprendeu a conjurar magias por meio de oração e meditação. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras com as magias de Clérigo, explicadas na lista de magias de Clérigo mais adiante na descrição da classe.\n\nTruques. Você conhece três truques à sua escolha da lista de magias de Clérigo. Chama Sagrada , Orientação e Taumaturgia são recomendados.\n\nSempre que você alcança um nível de Clérigo, pode substituir um dos seus truques por outro truque à sua escolha da lista de magias de Clérigo.\n\nQuando alcançar os níveis 4 e 10 de Clérigo, você aprende mais um truque à sua escolha da lista de magias de Clérigo, conforme mostrado na coluna Truques da tabela Características de Clérigo.\n\nEspaços de Magia. A tabela Características de Clérigo mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você recupera todos os espaços gastos quando completa um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de nível 1º circulo ou superior que estão disponíveis para você conjurar com essa característica. Para começar, escolha quatro magias de 1º círculo da lista de magias de Clérigo. Bênção , Curar Ferimentos , Escudo da Fé e Raio Guia são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você alcança níveis de Clérigo, conforme mostrado na coluna Magias Preparadas da tabela Características de Clérigo. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Clérigo até que o número de magias em sua lista seja o mesmo do número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Cléri go de nível 3, sua lista de magias preparadas pode incluir seis magias de 1º ou 2º círculo em qualquer combinação.\n\nSe outra característica de Clérigo lhe der magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas que contam como magias de Clérigo para você.\n\nMudando Suas Magias Preparadas. Sempre que completar um Descanso Longo, você pode definir sua lista de magias preparadas, substituindo qualquer uma das magias por outras magias de Clérigo para as quais você tem espaços de magia.\n\nAtributo de Conjuração. Sabedoria é seu atributo de conjuração para suas magias de Clérigo.\n\nFoco de Conjuração. Você pode usar um Símbolo Sagrado como um Foco de Conjuração para suas magias de Clérigo."],["clerigo","",1,"Ordem Divina","Você se dedicou a um dos seguintes papéis sagrados à sua escolha.\n\nProtetor. Treinado para a batalha, você adquire proficiência com armas Marciais e treinamento com Armadura Pesada.\n\nTaumaturgo. Você conhece um truque adicional da lista de magias de Clérigo. Além disso, sua conexão mística com o divino lhe dá um bônus em seus testes de Inteligência (Arcanismo ou Religião). O bônus é igual ao seu modificador de Sabedoria (mínimo de +1)."],["clerigo","",2,"Canalizar Divindade","Você pode canalizar energia divina diretamente dos Planos Externos para alimentar efeitos mágicos. Você começa com dois desses efeitos: Centelha Divina e Expulsar Mortos-Vivos, cada um descrito a seguir. Cada vez que você usar o Canalizar Divindade desta classe, escolha qual efeito de Canalizar Divindade deseja realizar. Você obtém opções adicionais de efeitos em níveis mais altos de Clérigo.\n\nVocê pode usar o Canalizar Divindade desta classe duas vezes. Você recupera um uso gasto ao completar um Descanso Curto e todos os usos gastos ao completar um Descanso Longo. Você adquire usos adicionais ao atingir certos níveis de Clérigo, conforme mostrado na coluna Canalizar Divindade da tabela Características de Clérigo.\n\nSe um efeito de Canalizar Divindade exigir uma salvaguarda, a CD é igual a CD para evitar magia da característica Conjuração desta classe.\n\nCentelha Divina. Como uma ação Usar Magia, você expõe seu Símbolo Sagrado para outra criatura à sua vista a até 9 metros e canaliza energia divina nela. Jogue 1d8 e adicione seu modificador de Sabedoria. Você pode restaurar Pontos de Vida da criatura igual ao resultado total ou forçar a criatura a realizar uma salvaguarda de Constituição. Se falhar, a criatura sofre dano Necrótico ou Radiante (à sua escolha) igual ao total. Em caso de sucesso, a criatura recebe metade do dano (arredondado para baixo).\n\nVocê joga um d8 adicional quando atinge os níveis de 7 (2d8), 13 (3d8) e 18 (4d8) de Clérigo.\n\nExpulsar Mortos-Vivos . Como uma ação Usar Magia, você mostra seu Símbolo Sagrado e repreende criaturas Mortas-Vivas. Cada Morto-Vivo à sua escolha a até 9 metros de você deve realizar uma salvaguarda de Sabedoria. Se a criatura falhar, ela está com as condições Amedrontado e Incapacitado por 1 minuto. Pela duração da canalização, ela tenta se mover o mais longe possível de você nos turnos dela. Este efeito se encerra na criatura se ela sofrer algum dano, se você está com a condição Incapacitado ou se você morrer."],["clerigo","",3,"Subclasse de Clérigo","Você adquire uma subclasse de Clérigo à sua escolha. Uma subclasse é uma especialização que lhe concede características em determinados níveis de Clérigo. As subclasses Domínio da Guerra, Domínio da Luz, Domínio da Trapaça e Domínio da Vida estão detalhadas após a descrição desta classe. Para o resto de sua jornada, você recebe cada uma das características de sua subclasse que são de seu nível de Clérigo ou menor."],["clerigo","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. Você adquire essa característica novamente nos níveis 8, 12 e 16 de Clérigo."],["clerigo","",5,"Fulminar Mortos-Vivos","Ao usar Expulsar Mortos-Vivos, você pode jogar uma quantidade de d8s igual ao seu modificador de Sabedoria (mínimo de 1d8) e somar os resultados jogados. Cada Morto-Vivo que falhar na salvaguarda sofre dano Radiante igual ao resultado da soma dos dados jogados. Esse dano não encerra o efeito de Expulsar Mortos-Vivos."],["clerigo","",7,"Golpes Abençoados","Você se infunde de poder divino em combate. Você adquire uma das seguintes opções à sua escolha (se
