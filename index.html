<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimório · Campanhas de D&D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+SC:wght@400;500&family=Grenze+Gotisch:wght@500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --stone:#241f29; --stone2:#2e2834; --stone3:#3a3241; --seam:#4d4354;
  --text:#ece2cc; --muted:#b1a38a; --faint:#857862;
  --vel:#ecdfc2; --vel2:#dfcfaa; --vel3:#cdb88c; --ink:#2b1c12; --ink2:#5d4631; --ink3:#8a7053;
  --crim:#9b2323; --crim2:#c0392b; --crimInk:#7e1616; --gold:#c9a24e; --gold2:#e2c277; --green:#4f7a3a;
  --shadow:0 18px 40px rgba(8,4,10,.45); --field:rgba(0,0,0,.18); --dangerT:#f4c9c0;
  --r-sm:4px; --r:8px; --r-lg:14px;
  --fd:"Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
  --fb:"Alegreya", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --fsc:"Alegreya SC", "Alegreya", Georgia, serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --stone:#cbbb98; --stone2:#d8caa9; --stone3:#e4d8bb; --seam:#b09b73;
    --text:#2b1c12; --muted:#5f4a35; --faint:#86705a; --shadow:0 14px 30px rgba(60,40,20,.25);
    --vel:#f4ead3; --vel2:#e9dcbd; --gold:#a57d2c; --gold2:#7d5a12; --field:rgba(255,255,255,.5); --dangerT:#7e1616; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --stone:#cbbb98; --stone2:#d8caa9; --stone3:#e4d8bb; --seam:#b09b73;
  --text:#2b1c12; --muted:#5f4a35; --faint:#86705a; --shadow:0 14px 30px rgba(60,40,20,.25);
  --vel:#f4ead3; --vel2:#e9dcbd; --gold:#a57d2c; --gold2:#7d5a12; --field:rgba(255,255,255,.5); --dangerT:#7e1616; color-scheme:light;
}
:root[data-theme="dark"]{ color-scheme:dark; }
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--stone);color:var(--text);font-family:var(--fb);font-size:17px;line-height:1.5;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,162,78,.10), transparent 70%),
    repeating-linear-gradient(90deg, transparent 0 119px, rgba(0,0,0,.08) 119px 120px),
    repeating-linear-gradient(0deg, transparent 0 59px, rgba(0,0,0,.08) 59px 60px);
  background-attachment:fixed}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);font-weight:500;letter-spacing:.01em;line-height:1.1;margin:0}
h1{font-size:clamp(2.2rem,5vw,3.4rem)} h2{font-size:1.9rem} h3{font-size:1.35rem}
.sc{font-family:var(--fsc);letter-spacing:.02em}
.muted{color:var(--muted)} .small{font-size:.88rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto} .hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---- botões ---- */
.btn{border:1px solid var(--seam);background:var(--stone3);color:var(--text);padding:.5rem 1rem;border-radius:var(--r-sm);cursor:pointer;
  font-family:var(--fsc);font-size:1rem;display:inline-flex;align-items:center;gap:.45rem;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:linear-gradient(180deg,var(--crim2),var(--crim));border-color:#5a1010;color:#fbeede;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{filter:brightness(1.08);border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:#7a5e22;color:#2b1c12}
.btn.ghost{background:transparent}
.btn.danger{color:var(--dangerT);border-color:#6b2020;background:rgba(155,35,35,.18)}
.btn.sm{padding:.25rem .6rem;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{border:none;background:none;cursor:pointer;padding:.3rem;border-radius:var(--r-sm);color:inherit;display:inline-grid;place-items:center}
.icon-btn:hover{background:rgba(201,162,78,.15)}
svg.i{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---- campos ---- */
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.9rem}
.field label{font-family:var(--fsc);color:var(--muted);font-size:.95rem}
.inp{background:var(--field);border:1px solid var(--seam);border-radius:var(--r-sm);padding:.55rem .7rem;width:100%}
.inp:focus{border-color:var(--gold);outline:none}
select.inp{appearance:auto}
.err-msg{color:#f08c7c;min-height:1.3em;font-size:.95rem}

/* ---- tela de entrada ---- */
.boot{min-height:100vh;display:grid;place-items:center;text-align:center;gap:1rem}
.login{min-height:100vh;display:grid;place-items:center;padding:1.5rem}
.tome{width:min(440px,100%);background:var(--vel);color:var(--ink);border-radius:var(--r);padding:2.4rem 2rem 2rem;position:relative;box-shadow:var(--shadow);
  background-image:radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 60%),radial-gradient(ellipse at 80% 90%, rgba(120,80,30,.14), transparent 60%)}
.tome::before{content:"";position:absolute;inset:10px;border:1px solid var(--vel3);outline:1px solid var(--vel3);outline-offset:3px;border-radius:4px;pointer-events:none}
.tome h1{text-align:center;color:var(--crimInk);font-size:3.2rem}
.tome .sub{text-align:center;color:var(--ink2);margin:.2rem 0 1.6rem;font-style:italic}
.tome .inp{background:rgba(255,255,255,.45);border-color:var(--vel3);color:var(--ink)}
.tome .field label{color:var(--ink2)}
.tome .err-msg{color:var(--crimInk)}
.seg{display:flex;border:1px solid var(--vel3);border-radius:var(--r-sm);overflow:hidden;margin-bottom:1.3rem}
.seg button{flex:1;border:none;background:transparent;padding:.5rem;cursor:pointer;font-family:var(--fsc);color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--vel)}
.mode-note{margin-top:1rem;font-size:.85rem;color:var(--ink3);text-align:center}

/* ---- casca ---- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:1rem;padding:.6rem clamp(.8rem,3vw,2rem);
  background:color-mix(in srgb,var(--stone) 88%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--seam)}
.brand{font-family:var(--fd);font-size:1.7rem;color:var(--gold2);display:flex;align-items:center;gap:.5rem;cursor:pointer;background:none;border:none;padding:0}
.brand svg{width:28px;height:28px}
.who{font-family:var(--fsc);color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:1.5rem clamp(.8rem,3vw,2rem) 6rem}

/* ---- boas-vindas ---- */
.hero{display:grid;grid-template-columns:1fr auto;gap:1.5rem;align-items:end;margin:1rem 0 2rem}
.hero p{margin:.4rem 0 0;color:var(--muted);max-width:52ch}
.hero .actions{display:flex;gap:.7rem;flex-wrap:wrap}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.tabs{display:flex;gap:.2rem;border-bottom:1px solid var(--seam);margin-bottom:1.3rem;overflow-x:auto}
.tabs button{border:none;background:none;padding:.6rem 1rem;cursor:pointer;font-family:var(--fsc);font-size:1.08rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--gold2);border-bottom-color:var(--gold)}
.tabs .count{font-family:var(--fb);font-size:.8rem;background:var(--stone3);padding:.05rem .45rem;border-radius:99px;margin-left:.3rem}
.camps{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.4rem}
.camp{background:var(--stone2);border:1px solid var(--seam);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.camp .cover{aspect-ratio:16/9;background:var(--stone3);position:relative;cursor:pointer;border:none;padding:0;width:100%;display:block}
.cover-img{width:100%;height:100%;object-fit:cover;display:block}
.cover-empty{width:100%;height:100%;display:grid;place-items:center;color:var(--faint);
  background:repeating-linear-gradient(45deg,rgba(0,0,0,.06) 0 12px,transparent 12px 24px),linear-gradient(160deg,var(--stone3),var(--stone2))}
.cover-empty svg{width:48px;height:48px;opacity:.6}
.camp .body{padding:1rem 1.1rem 1.1rem;display:flex;flex-direction:column;gap:.5rem;flex:1}
.camp h3{font-size:1.6rem}
.camp .meta{color:var(--muted);font-size:.92rem}
.camp .foot{margin-top:auto;display:flex;gap:.4rem;flex-wrap:wrap;padding-top:.5rem}
.code-chip{font-family:var(--fsc);letter-spacing:.18em;background:rgba(201,162,78,.14);color:var(--gold2);padding:.1rem .5rem;border-radius:var(--r-sm)}
.empty{border:1px dashed var(--seam);border-radius:var(--r);padding:2.5rem 1.5rem;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:.4rem}

/* ---- campanha ---- */
.camp-head{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:1.5rem;align-items:center;margin-bottom:1.4rem}
.camp-head .cover{aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;border:1px solid var(--seam);background:var(--stone3)}
.camp-head h1{color:var(--text)}
@media (max-width:720px){.camp-head{grid-template-columns:1fr}}
.ribbons{display:flex;gap:.5rem;margin-bottom:1.3rem;flex-wrap:wrap}
.ribbon{border:1px solid var(--seam);background:var(--stone2);padding:.6rem 1.2rem .6rem 1rem;cursor:pointer;font-family:var(--fd);font-size:1.3rem;color:var(--muted);
  clip-path:polygon(0 0,100% 0,calc(100% - 12px) 50%,100% 100%,0 100%);padding-right:2rem}
.ribbon[aria-selected="true"]{background:var(--crim);color:#fbeede;border-color:#5a1010}
.gm-layout{display:grid;grid-template-columns:210px 1fr;gap:1.6rem}
.side{display:flex;flex-direction:column;gap:.2rem;position:sticky;top:5rem;align-self:start}
.side button{text-align:left;border:none;background:none;padding:.55rem .8rem;border-radius:var(--r-sm);cursor:pointer;font-family:var(--fsc);font-size:1.05rem;color:var(--muted);border-left:2px solid transparent}
.side button[aria-selected="true"]{color:var(--gold2);border-left-color:var(--gold);background:rgba(201,162,78,.08)}
@media (max-width:820px){.gm-layout{grid-template-columns:1fr}.side{flex-direction:row;overflow-x:auto;position:static}.side button{border-left:none;border-bottom:2px solid transparent;white-space:nowrap}.side button[aria-selected="true"]{border-bottom-color:var(--gold)}}
.panel{background:var(--stone2);border:1px solid var(--seam);border-radius:var(--r);padding:1.2rem 1.3rem;margin-bottom:1.2rem}
.panel h2{margin-bottom:.8rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.big-code{font-family:var(--fd);font-size:3rem;letter-spacing:.2em;color:var(--gold2);line-height:1}
.list{display:flex;flex-direction:column;border:1px solid var(--seam);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:1rem;padding:.8rem 1rem;background:var(--stone2);border-bottom:1px solid var(--seam);flex-wrap:wrap}
.li:last-child{border-bottom:none}
.li .nm{font-family:var(--fd);font-size:1.35rem;background:none;border:none;padding:0;cursor:pointer;color:var(--text);text-align:left}
.li .nm:hover{color:var(--gold2)}
.li .sub{color:var(--muted);font-size:.92rem}
.pill{font-family:var(--fsc);font-size:.85rem;padding:.05rem .55rem;border-radius:99px;background:var(--stone3);color:var(--muted)}
.pill.gold{background:rgba(201,162,78,.18);color:var(--gold2)}
.pill.crim{background:rgba(192,57,43,.2);color:#f0a597}

/* ---- dados ---- */
.dice-row{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0 1rem}
.die{width:62px;height:66px;border:1px solid var(--seam);background:var(--stone3);border-radius:var(--r-sm);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted)}
.die svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.5}
.die span{font-family:var(--fsc);font-size:.85rem}
.die[aria-pressed="true"]{border-color:var(--gold);color:var(--gold2);background:rgba(201,162,78,.12)}
.roller-line{display:flex;align-items:end;gap:.6rem;flex-wrap:wrap}
.roller-line .field{margin:0}
.expr-preview{font-family:var(--fd);font-size:2rem;color:var(--gold2);min-width:5ch}
.check{display:inline-flex;gap:.4rem;align-items:center;cursor:pointer;font-family:var(--fsc);color:var(--muted)}
.check input{accent-color:var(--crim2);width:1rem;height:1rem}

/* resultado */
.tray{position:fixed;inset:0;z-index:80;display:grid;place-items:center;pointer-events:none}
.tray-card{pointer-events:auto;background:var(--vel);color:var(--ink);border-radius:var(--r-lg);padding:1.5rem 2rem;min-width:260px;max-width:min(92vw,420px);text-align:center;box-shadow:var(--shadow);cursor:pointer;
  animation:trayIn .25s ease-out}
.tray-card .lbl{font-family:var(--fsc);color:var(--ink2)}
.tray-card .tot{font-family:var(--fd);font-size:5rem;line-height:1;color:var(--ink);margin:.2rem 0}
.tray-card.nat20 .tot{color:#8a6412;text-shadow:0 0 18px rgba(226,194,119,.9)}
.tray-card.nat1 .tot{color:var(--crimInk)}
.tray-card .det{color:var(--ink2);font-size:.95rem}
.tray-card .flag{font-family:var(--fd);font-size:1.4rem}
.d20spin{width:96px;height:96px;margin:0 auto;color:var(--crimInk)}
.d20spin svg{width:100%;height:100%;stroke:currentColor;fill:rgba(155,35,35,.08);stroke-width:1.4;animation:spin .7s cubic-bezier(.2,.8,.3,1)}
@keyframes spin{from{transform:rotate(-540deg) scale(.5)}to{transform:rotate(0) scale(1)}}
@keyframes trayIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.d20spin svg,.tray-card{animation:none}}
.drop{text-decoration:line-through;opacity:.5}
.crit{color:#8a6412;font-weight:700} .fumb{color:var(--crimInk);font-weight:700}

/* balão de rolagens */
.bubble{position:fixed;right:max(1rem,env(safe-area-inset-right,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:60}
.bubble-min{width:64px;height:64px;border-radius:14px 14px 4px 14px;background:var(--crim);border:1px solid #5a1010;color:#fbeede;cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow);position:relative}
.bubble-min svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:1.4}
.bubble-min .badge{position:absolute;top:-6px;left:-6px;background:var(--gold2);color:#2b1c12;border-radius:99px;font-size:.8rem;padding:0 .4rem;font-family:var(--fsc);min-width:1.4rem;text-align:center}
.bubble-box{width:min(360px,calc(100vw - 2rem));height:min(460px,70vh);background:var(--vel);color:var(--ink);border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--vel3)}
.bubble-box header{display:flex;align-items:center;padding:.6rem .8rem;background:var(--ink);color:var(--vel)}
.bubble-box header h3{font-size:1.3rem;flex:1}
.bubble-box .log{flex:1;overflow-y:auto;padding:.5rem .8rem}
.entry{padding:.5rem 0;border-bottom:1px dotted var(--vel3)}
.entry:last-child{border-bottom:none}
.entry .top{display:flex;gap:.5rem;align-items:baseline}
.entry .by{font-family:var(--fsc);color:var(--ink2);font-size:.9rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .t{font-size:.78rem;color:var(--ink3)}
.entry .lb{font-style:italic;font-size:.95rem}
.entry .res{display:flex;align-items:baseline;gap:.6rem}
.entry .tot{font-family:var(--fd);font-size:1.8rem;line-height:1.1}
.entry .det{font-size:.85rem;color:var(--ink2);overflow-wrap:anywhere}
.entry.secret{background:rgba(155,35,35,.07);margin:0 -.8rem;padding:.5rem .8rem}
.bubble-box .quick{display:flex;gap:.3rem;padding:.5rem .6rem;border-top:1px solid var(--vel3);background:var(--vel2)}
.bubble-box .quick input{flex:1;min-width:0;border:1px solid var(--vel3);background:rgba(255,255,255,.5);border-radius:var(--r-sm);padding:.35rem .5rem;color:var(--ink)}
.bubble-box .quick button{border:none;background:var(--crim);color:#fbeede;border-radius:var(--r-sm);padding:.35rem .7rem;cursor:pointer;font-family:var(--fsc)}

/* ---- ficha (velino) ---- */
.sheet-wrap{max-width:1180px;margin:0 auto;padding:1rem clamp(.5rem,2vw,1.5rem) 7rem}
.sheet{background:var(--vel);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:clamp(1rem,3vw,2rem);position:relative;
  background-image:radial-gradient(ellipse at 15% 10%, rgba(255,255,255,.35), transparent 55%),radial-gradient(ellipse at 90% 100%, rgba(120,80,30,.12), transparent 60%)}
.sheet ::selection{background:rgba(155,35,35,.25)}
.sheet .muted{color:var(--ink3)}
.sheet .btn{background:rgba(255,255,255,.4);border-color:var(--vel3);color:var(--ink)}
.sheet .btn:hover{border-color:var(--crim)}
.sheet .btn.primary{background:linear-gradient(180deg,var(--crim2),var(--crim));color:#fbeede;border-color:#5a1010}
.sheet .btn.danger{color:var(--crimInk);background:rgba(155,35,35,.08);border-color:rgba(155,35,35,.4)}
.sheet .icon-btn:hover{background:rgba(155,35,35,.1)}
.sheet .tabs{border-bottom-color:var(--vel3)}
.sheet .tabs button{color:var(--ink3)}
.sheet .tabs button[aria-selected="true"]{color:var(--crimInk);border-bottom-color:var(--crim)}
.sheet .pill{background:rgba(0,0,0,.07);color:var(--ink2)}
.sheet .check{color:var(--ink2)}
.sheet .field label{color:var(--ink3)}
.sheet .inp{background:rgba(255,255,255,.4);border-color:var(--vel3);color:var(--ink)}
.ink{border:none;border-bottom:1px dotted var(--ink3);background:transparent;color:var(--ink);padding:.1rem .15rem;width:100%;border-radius:0}
.ink:focus{outline:none;border-bottom:1px solid var(--crim);background:rgba(255,255,255,.35)}
.ink:disabled{border-bottom-color:transparent}
textarea.ink{border:1px solid var(--vel3);border-radius:var(--r-sm);min-height:7rem;resize:vertical;padding:.5rem;line-height:1.55;background:rgba(255,255,255,.2)}
.ink.num{text-align:center;-moz-appearance:textfield}
.ink.num::-webkit-inner-spin-button,.ink.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sh-head{display:grid;grid-template-columns:1fr auto;gap:1rem 2rem;align-items:start;border-bottom:2px solid var(--ink);padding-bottom:1rem;margin-bottom:1rem}
.sh-name{font-family:var(--fd);font-size:clamp(2rem,4.5vw,3rem);line-height:1.05;border-bottom-style:solid;border-bottom-color:transparent}
.sh-name:hover:not(:disabled){border-bottom-color:var(--vel3)}
.sh-ids{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.3rem 1rem;margin-top:.6rem}
.lab{font-family:var(--fsc);font-size:.82rem;color:var(--ink3);display:block}
.lvl{display:flex;align-items:center;gap:1rem}
.lvl-seal{width:86px;height:86px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--crim2),var(--crim) 60%,#5a1010);color:#fbeede;display:grid;place-items:center;text-align:center;box-shadow:inset 0 0 0 3px rgba(0,0,0,.2),0 2px 0 rgba(0,0,0,.2)}
.lvl-seal b{font-family:var(--fd);font-size:2.5rem;font-weight:500;line-height:.9;display:block}
.lvl-seal small{font-family:var(--fsc);font-size:.75rem;opacity:.9}
.xpbar{width:170px}
.xpbar .bar{height:8px;background:rgba(0,0,0,.1);border-radius:99px;overflow:hidden;margin:.25rem 0}
.xpbar .bar i{display:block;height:100%;background:var(--gold)}

function slotsFor(clsKey, lvl){
  const c = CLASSES[clsKey]; const out = {};
  for(let i=1;i<=9;i++) out[i]=0;
  if(!c||!c.caster) return out;
  if(c.caster==='pact'){
    const n = lvl>=17?4:lvl>=11?3:lvl>=2?2:1;
    const sl = lvl>=9?5:Math.ceil(lvl/2);
    out[sl]=n; return out;
  }
  const row = (c.caster==='full'?FULL_SLOTS:HALF_SLOTS)[lvl-1]||[];
  row.forEach((n,i)=>out[i+1]=n); return out;
}

const SPELL_DATA=[["Acalmar Emoções",2,"Encantamento",["bardo","clerigo"],"Ação","18 metros","V, S","Concentração, até 1 minuto","Cada Humanoide em uma Esfera de 6 metros de raio centrada em um ponto à sua escolha no alcance da magia deve ser bem-sucedido em uma salvaguarda de Carisma ou é afetado por um dos seguintes efeitos (escolha um para cada criatura):\n\nA criatura tem Imunidade às condições Amedrontado e Enfeitiçado até que a magia termine. Se a criatura já estiver Amedrontada ou Enfeitiçada, essas condições são suprimidas pela duração da magia.\n\nA criatura se torna Indiferente às criaturas à sua escolha em relação às quais é Hostil. Essa indiferença encerra se o alvo sofrer dano ou testemunhar os aliados dela sofrendo dano. Quando a magia termina, atitude da criatura volta ao normal."],["Acudir os Moribundos",0,"Necromancia",["clerigo","druida"],"Ação","4,5 metros","V, S","Instantânea","Escolha uma criatura no alcance da magia que tenha 0 Pontos de Vida e não esteja morta. A criatura fica Estável.\n\nAprimoramento de Truque. O alcance da magia dobra quando você atinge os níveis 5 (9 metros), 11 (18 metros) e 17 (36 metros)."],["Alarme",1,"Abjuração",["guardiao","mago"],"1 minuto ou Ritual","9 metros","V, S, M (um sino e um fio de prata)","8 horas","Você define um alarme contra intrusão. Escolha uma porta, uma janela ou uma área no alcance da magia que não seja maior do que um Cubo de 6 metros de lados. Até que a magia termine, um alarme o avisa sempre que uma criatura tocar ou entrar na área protegida. Ao conjurar a magia, você pode designar criaturas que não disparam o alarme. Você também escolhe se o alarme audível ou mental:\n\nAlarme Mental. Você é alertado por um bipe mental se estiver a menos de 1,5 quilômetro da área protegida. Este bipe o acorda se você estiver dormindo.\n\nAlarme Sonoro. O alarme produz o som de uma sineta por 10 segundos a até 18 metros da área protegida."],["Aliado Extraplanar",6,"Invocação",["clerigo"],"10 minutos","18 metros","V, S","Instantânea","Você implora pela ajuda de uma entidade sobrenatural. Você deve conhecer o ser: um deus, um príncipe demônio ou algum outro ser de poder cósmico. Essa entidade envia um Celestial, um Elemental ou um Ínfero leal a ela para ajudá-lo, fazendo com que a criatura apareça em um espaço desocupado no alcance da magia. Se você souber o nome de uma criatura específica, você pode proferir esse nome quando conjurar a magia para solicitar essa criatura, embora você possa obter uma criatura diferente de qualquer modo (à escolha do Mestre). Quando a criatura aparece, ela não é obrigada a comportar-se de uma maneira específica. Você pode pedir que ela realize um serviço em troca de pagamento, mas a ela não é obrigada a fazê-lo. A tarefa solicitada pode variar de simples (nos levar voando através do abismo ou nos ajudar a lutar em uma batalha) a complexa (espionar nossos inimigos ou nos proteger durante nossa incursão na masmorra). Você deve ser capaz de se comunicar com a criatura para negociar pelos serviços dela.\n\nO pagamento pode assumir várias formas. Um Celestial pode exigir uma doação considerável de ouro ou itens mágicos para um templo aliado, enquanto um Ínfero pode exigir um sacrifício vivo ou um presente na forma de um tesouro. Algumas criaturas podem trocar o serviço por uma missão realizada por você.\n\nUma tarefa que pode ser medida em minutos requer um pagamento no valor de 100 PO por minuto. Uma tarefa medida em horas requer 1.000 PO por hora. Já uma tarefa medida em dias (até 10 dias) requer 10.000 PO por dia. O Mestre pode ajustar esses pagamentos com base nas circunstâncias em que você conjurou a magia. Se a tarefa estiver alinhada com os interesses da criatura, o pagamento pode ser reduzido pela metade ou até mesmo dispensado. Tarefas não perigosas normalmente exigem apenas metade do pagamento sugerido, enquanto tarefas especialmente perigosas podem demandar um pagamento maior. Criaturas raramente aceitam tarefas que parecem suicidas.\n\nDepois que a criatura conclui a tarefa, ou quando a duração combinada do serviço acaba, a criatura retorna ao seu plano de origem após se reportar a você, se possível. Se você não conseguir chegar a um acordo sobre um preço pelo serviço da criatura, a criatura retorna imediatamente ao seu plano de origem."],["Aljava Veloz",5,"Transmutação",["guardiao"],"Ação Bônus","Pessoal","V, S, M (uma Aljava no valor de 1 ou mais PO)","Concentração, até 1 minuto","Ao conjurar a magia e como uma Ação Bônus até que ela termine, você pode realizar dois ataques com uma arma que dispara Flechas ou Virotes, como um Arco Longo ou uma Besta Leve. A magia gera magicamente a munição necessária para cada ataque. Cada Flecha ou Virote criado pela magia causa dano equivalente ao de munição não mágica do seu tipo e se desintegra imediatamente após atingir ou errar o alvo."],["Alterar-se",2,"Transmutação",["feiticeiro","mago"],"Ação","Pessoal","V, S","Concentração, até 1 hora","Você altera sua forma física. Escolha uma das seguintes opções. Seus efeitos permanecem pela duração da magia, durante a qual você pode executar uma ação Usar Magia para substituir a opção escolhida por uma diferente.\n\nAdaptação Aquática. Você cria guelras e membranas entre os dedos. Você pode respirar debaixo d’água e recebe um Deslocamento de Natação igual ao seu Deslocamento.\n\nArmas Naturais. Você cria garras (Cortante), presas (Perfurante), chifres (Perfurante) ou cascos (Contundente). Ao usar seu Ataque Desarmado para causar dano com essa nova forma, ele causa 1d6 pontos de dano do tipo entre parênteses em vez de causar o dano normal para seu Ataque Desarmado, e você usa seu modificador de atributo de conjuração para as jogadas de ataque e dano em vez de usar Força.\n\nMudar Aparência. Você altera sua aparência. Você decide sua aparência, incluindo altura, peso, traços faciais, som da voz, comprimento e cor do cabelo, entre outras características distintivas. Você pode parecer um membro de outra espécie, embora nenhuma de suas estatísticas mude. Você não pode parecer como uma criatura de um tamanho diferente, e sua forma básica permanece a mesma; se você é bípede, não pode usar essa magia para se tornar quadrúpede, por exemplo. Pela duração da magia, você pode executar uma ação Usar Magia para mudar sua aparência dessa maneira novamente."],["Amigos",0,"Encantamento",["bardo","bruxo","feiticeiro","mago"],"Ação","3 metros","S, M (um pouco de maquiagem)","Concentração, até 1 minuto","Você emana magicamente um sentimento de amizade em relação a uma criatura à sua vista e no alcance da magia. O alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Enfeitiçado pela duração da magia. O alvo é bem-sucedido automaticamente se não for um Humanoide, se você estiver lutando contra ele ou se tiver conjurado esta magia nele nas últimas 24 horas.\n\nA magia encerra se o alvo sofrer dano ou se você realizar uma jogada de ataque, causar dano ou forçar alguém a realizar uma salvaguarda. Quando a magia termina, o alvo sabe que foi Enfeitiçado por você."],["Amizade Animal",1,"Encantamento",["bardo","druida","guardiao"],"Ação","9 metros","V, S, M (um bocado de comida)","24 horas","Escolha como alvo uma Fera à sua vista e no alcance da magia. O alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Enfeitiçado pela duração da magia. Se você ou um de seus aliados causar dano ao alvo, a magia encerra.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 1."],["Animar Mortos",3,"Necromancia",["clerigo","mago"],"1 minuto","3 metros","V, S, M (uma gota de sangue, um pedaço de carne e uma pitada de pó de osso)","Instantânea","Escolha uma pilha de ossos ou um cadáver de um Humanoide Médio ou Pequeno no alcance da magia. O alvo se torna um Morto-vivo: um Esqueleto se tiver escolhido ossos ou um Zumbi se tiver escolhido um cadáver (veja o apêndice B para os blocos de estatística). Em cada um dos seus turnos, você pode executar uma Ação Bônus para comandar mentalmente qualquer criatura que tenha animado com essa magia se a criatura estiver a até 18 metros de você (se você controlar várias criaturas, pode comandar qualquer uma delas ao mesmo tempo, emitindo o mesmo comando para cada uma). Você decide qual ação a criatura realiza e para onde ela se move no próximo turno dela, ou pode emitir um comando geral, como proteger uma câmara ou um corredor. Se você não der nenhum comando, a criatura executa a ação Esquivar e move-se apenas para evitar dano. Uma vez dada uma ordem, a criatura continua a segui-la até que a tarefa seja concluída.\n\nA criatura fica sob seu controle por 24 horas, após as quais ela deixa de obedecer a qualquer comando que você tenha dado a ela. Para manter o controle da criatura por mais 24 horas, é necessário conjurar essa magia na criatura novamente antes que o período atual de 24 horas termine. Esse uso da magia reafirma seu controle sobre até quatro criaturas que você animou com essa magia em vez de animar uma nova criatura.\n\nUsando um Espaço de Magia de Círculo Superior. Você anima ou reafirma o controle sobre duas criaturas Mortas-vivas adicionais para cada círculo de espaço de magia acima de 3. Cada uma das criaturas deve vir de um cadáver ou pilha de ossos diferente."],["Animar Objetos",5,"Transmutação",["bardo","feiticeiro","mago"],"Ação","36 metros","V, S","Concentração, até 1 minuto","Objetos são animados ao seu comando. Escolha uma série de objetos não mágicos no alcance da magia que não estejam sendo usados ou carregados, não estejam fixados a uma superfície e não sejam Colossais. O número máximo de objetos é igual ao seu modificador de atributo de conjuração. Para este número, um tamanho Médio ou menor conta como um objeto, um alvo Grande conta como dois e um alvo Enorme conta como três.\n\nCada alvo se anima, faz brotar pernas e se torna um Constructo que usa o bloco de estatísticas do Objeto\n\nAnimado ; esta criatura está sob seu controle até que a magia termine ou até que ela seja reduzida a 0 Pontos de Vida. Cada criatura que você anima com esta magia é uma aliada sua e de seus aliados. Em combate, ela compartilha a contagem de Iniciativa com você e tem o turno dela imediatamente após o seu.\n\nAté que a magia encerre, você pode executar uma Ação Bônus para comandar mentalmente qualquer criatura que tenha animado com essa magia se a criatura estiver a até 150 metros de você (se você controlar várias criaturas, pode comandar quaisquer delas ao mesmo tempo, emitindo o mesmo comando para cada uma). Se você não der nenhum comando, a criatura executa a ação Esquivar e se move apenas para evitar danos. Quando a criatura é reduzida a 0 Pontos de Vida, ela reverte para sua forma de objeto, e qualquer dano restante é transferido para essa forma.\n\nUsando um Espaço de Magia de Círculo Superior. O dano de Pancada da criatura aumenta em 1d4 (Médio ou menor), 1d6 (Grande) ou 1d12 (Enorme) para cada círculo de espaço de magia acima de 5.\n\nObjetos Animados Construto Grande ou Menor, Sem Alinhamento\n\nCA 15\n\nPV 10 (Médio ou menor), 20 (Grande), 40 (Enorme)\n\nDeslocamento 9 m MOD SG MOD SG MOD SG\n\nFor 16 +3 +3 Des 10 +0 +0 Con 10 +0 +0\n\nInt 3 –4 –4 Sab 3 –4 –4 Car 1 –5 –5\n\nImunidades Psíquico, Venenoso; Amedrontado, Enfeitiçado, Envenenado, Exaustão, Paralisado\n\nSentidos Visão às Cegas 9 m, Percepção Passiva 6\n\nIdiomas Compreende os idiomas que você conhece\n\nND Nenhum (XP 0; BP é igual ao seu Bônus de Proficiência) Ações\n\nPancada. Jogada de Ataque Corpo a Corpo: Bônus igual ao seu modificador de ataque mágico, alcance 1,5 m. Dano: Energético igual a 1d4 + 3 (Médio ou menor), 2d6 + 3 + seu modificador de atributo de conjuração (Grande) ou 2d12 + 3 + seu modificador de atributo de conjuração (Enorme)."],["Antipatia/Simpatia",8,"Encantamento",["bardo","druida","mago"],"1 hora","18 metros","V, S, M (uma mistura de vinagre e mel)","10 dias","Ao conjurar a magia, decida se ela cria antipatia ou simpatia, e escolha como alvo uma criatura ou objeto que seja Enorme ou menor. Em seguida, especifique um tipo de criatura, como dragões vermelhos, goblins ou vampiros. Uma criatura do tipo escolhido realiza uma salvaguarda de Sabedoria quando estiver a até 36 metros do alvo. Sua escolha entre antipatia ou simpatia determina o que acontece com uma criatura ao falhar nessa salvaguarda:\n\nAntipatia: A criatura tem a condição Amedrontado. A criatura Amedrontada deve usar o movimento nos turnos dela para se afastar o máximo possível do alvo, movendo-se pela rota mais segura.\n\nSimpatia: A criatura tem a condição Enfeitiçado. A criatura Enfeitiçada deve usar o movimento nos turnos dela para chegar o mais próximo possível do alvo, movendo-se pela rota mais segura. Se a criatura estiver a até 1,5 metro do alvo, a criatura não pode se afastar voluntariamente. Se o alvo causar dano à criatura Enfeitiçada, essa criatura deve realizar uma salvaguarda de Sabedoria para encerrar o efeito, conforme descrito abaixo.\n\nEncerrando o Efeito. Se a criatura Amedrontada ou Enfeitiçada terminar o turno a mais de 36 metros de distância do alvo, a criatura realiza uma salvaguarda de Sabedoria. Em caso de sucesso, a criatura não é mais afetada pelo alvo e fica imune a ele por 1 minuto, após o qual pode ser afetada novamente."],["Aprimorar Atributo",2,"Transmutação",["bardo","clerigo","druida","feiticeiro","guardiao","mago"],"Ação","Toque","V, S, M (pelo ou uma pena)","Concentração, até 1 hora","Você toca uma criatura e escolhe Força, Destreza, Inteligência, Sabedoria ou Carisma. Pela duração da magia, o alvo tem Vantagem nos testes de atributo usando o atributo escolhido.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 2. Você pode escolher um atributo diferente para cada alvo."],["Aprisionamento",9,"Abjuração",["bruxo","mago"],"1 minuto","9 metros","V, S, M (uma estatueta do alvo no valor de 5.000 ou mais PO)","Até ser dissipada","Você cria uma restrição mágica para conter uma criatura à sua vista e no alcance da magia. O alvo deve realizar uma salvaguarda de Sabedoria. Em caso de sucesso, o alvo não é afetado e fica imune a esta magia pelas próximas 24 horas. Se falhar, o alvo é aprisionado. Enquanto estiver aprisionado, o alvo não precisa respirar, comer ou beber e não envelhece. Magias de Adivinhação não podem localizar ou perceber o alvo, e ele não pode se teleportar.\n\nAté que a magia termine, o alvo também é afetado por um dos seguintes efeitos à sua escolha:\n\nAcorrentar. Correntes firmemente enraizadas ao chão prendem o alvo no lugar. O alvo tem a condição Contido e não pode ser movido de forma alguma.\n\nContenção Reduzida. O alvo encolhe para 2,5 cm de altura e fica preso dentro de uma pedra preciosa indestrutível ou um objeto semelhante. A luz pode passar pela pedra preciosa (permitindo que o alvo veja o que há fora e outras criaturas de fora possam vê-lo), mas nada mais pode passar por qualquer meio.\n\nEnterrar. O alvo é enterrado sob a terra em um globo oco de força mágica que é grande o suficiente para contê-lo. Nada pode passar para dentro ou para fora do globo.\n\nPrisão Cercada. O alvo está preso em um semiplano e está protegido contra teleporte e viagens planares. O semiplano pode ser um labirinto, uma gaiola, uma torre ou algo semelhante à sua escolha.\n\nTorpor. O alvo está Inconsciente e não pode ser despertado.\n\nEncerrando a Magia. Ao conjurar a magia, você define uma situação que a encerrará. Essa situação pode ser tão simples ou elaborada quanto você desejar, mas o Mestre deve concordar que existe uma grande probabilidade de isso ocorrer na próxima década. A situação deve ser uma ação observável, como alguém fazendo uma oferenda específica no templo do seu deus, salvando seu verdadeiro amor ou derrotando um monstro específico.\n\nDissipar Magia só pode encerrar a magia se for conjurada com um espaço de magia de 9º círculo, tendo como alvo a prisão ou o componente usado para criá-la."],["Arca Secreta de Leomund",4,"Invocação",["mago"],"Ação","Toque","V, S, M (um baú de 1 m por 60 cm por 60 cm, construído com materiais raros no valor de 5.000 ou mais PO, e uma réplica minúscula do baú fabricada com os mesmos materiais no valor de 50 ou mais PO)","Até ser dissipada","Você esconde um baú e todo o seu conteúdo no Plano Etéreo. Você deve tocar no baú e na réplica em miniatura que servem como componentes Materiais para a magia. O baú pode armazenar até 340 litros de material não vivo (1 m por 60 cm por 60 cm).\n\nEnquanto o baú permanecer no Plano Etéreo, você pode executar uma ação Usar Magia e tocar na réplica para recuperar o baú. Ele aparece em um espaço desocupado no chão a até 1,5 metro de você. Você pode enviar o baú de volta ao Plano Etéreo como uma ação Usar Magia para tocar o baú e a réplica.\n\nApós 60 dias, há uma chance cumulativa de 5% no final de cada dia de que a magia encerre. A magia também se encerra se você conjurá-la novamente ou se a réplica Minúscula for destruída. Se a magia encerrar e o baú maior estiver no Plano Etéreo, o baú permanece lá para você ou outra pessoa encontrar."],["Arma Elemental",3,"Transmutação",["druida","guardiao","paladino"],"Ação","Toque","V, S","Concentração, até 1 hora","Uma arma não-mágica que você toca se torna uma arma mágica. Escolha um dos seguintes tipos de dano: Ácido, Elétrico, Gélido, Ígneo ou Trovejante. Pela duração da magia, a arma tem um bônus de +1 para jogadas de ataque e causa 1d4 pontos de dano adicional do tipo escolhido quando atinge.\n\nUsando um Espaço de Magia de Círculo Superior. Se você usar um espaço de magia de 5º ou 6º círculo, o bônus nas jogadas de ataque aumenta para +2, e o dano adicional aumenta para 2d4. Se você usar um espaço de magia de 7º círculo ou superior, o bônus aumenta para +3 e o dano adicional aumenta para 3d4."],["Arma Espiritual",2,"Evocação",["clerigo"],"Ação Bônus","18 metros","V, S","Concentração, até 1 minuto","Você cria uma energia espectral flutuante que se assemelha a uma arma à sua escolha e permanece pela duração da magia.\n\nA energia aparece no alcance da magia em um espaço à sua escolha, e você pode realizar imediatamente um ataque mágico corpo a corpo contra uma criatura a até 1,5 metro dela. Em caso de acerto, o alvo sofre 1d8 pontos de dano Energético mais o seu modificador de atributo de conjuração.\n\nComo uma Ação Bônus em seus turnos posteriores, você pode mover a energia até 6 metros e repetir o ataque contra uma criatura a até 1,5 metro dela.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 2."],["Arma Mágica",2,"Transmutação",["feiticeiro","guardiao","mago","paladino"],"Ação Bônus","Toque","V, S","1 hora","Você toca uma arma não-mágica. Até que a magia encerre, essa arma se torna uma arma mágica com bônus de +1 para jogadas de ataque e dano. A magia encerra se você a conjurar novamente.\n\nUsando um Espaço de Magia de Círculo Superior. O bônus aumenta para +2 com um espaço de magia de 3º–5º círculo. O bônus aumenta para +3 com um espaço de magia de 6º círculo ou superior."],["Armadura Arcana",1,"Abjuração",["feiticeiro","mago"],"Ação","Toque","V, S, M (um pedaço de couro curtido)","8 horas","Você toca uma criatura voluntária que não está usando armadura. Até que a magia termine, a CA base do alvo se torna 13 mais o modificador de Destreza dele. A magia se encerra se o alvo vestir uma armadura."],["Armadura de Agathys",1,"Abjuração",["bruxo"],"Ação Bônus","Pessoal","V, S, M (um caco de vidro azul)","1 hora","Um frio mágico protetor envolve você. Você recebe 5 Pontos de Vida Temporários. Se uma criatura acertar você com uma jogada de ataque corpo a corpo antes que a magia termine, a criatura sofre 5 pontos de dano Gélido. A magia encerra se você não tiver Pontos de Vida Temporários.\n\nUsando um Espaço de Magia de Círculo Superior. Os Pontos de Vida Temporários e o dano Gélido aumentam em 5 para cada círculo de espaço de magia acima de 1."],["Arrombar",2,"Transmutação",["bardo","feiticeiro","mago"],"Ação","18 metros","V","Instantânea","Escolha um objeto à sua vista e no alcance da magia. O objeto pode ser uma porta, uma caixa, um baú, um conjunto de grilhões, um cadeado ou outro objeto que contenha um meio mundano ou mágico que impeça o acesso. Um alvo mantido fechado por uma fechadura mundana ou que está preso ou barrado fica destrancado, desemperrado ou desobstruído. Se o objeto tiver várias fechaduras, apenas uma delas é destrancada.\n\nSe o alvo for mantido fechado por Tranca Arcana , essa magia é suprimida por 10 minutos, durante os quais o alvo pode ser aberto e fechado.\n\nAo conjurar a magia, um estrondo, audível a até 90 metros de distância, emana do alvo."],["Arte Druídica",0,"Transmutação",["druida"],"Ação","9 metros","V, S","Instantânea","Sussurrando para os espíritos da natureza, você cria um dos seguintes efeitos no alcance da magia.\n\nBrincar com Fogo. Você acende ou apaga uma vela, uma tocha ou uma fogueira.\n\nEfeito Sensorial. Você cria um efeito sensorial inofensivo, como folhas caindo, fadas dançantes espectrais, uma brisa suave, o som de um animal ou o leve odor de gambá. O efeito deve caber em um Cubo de 1,5 metro de lados.\n\nFlorescimento. Você instantaneamente faz uma flor desabrochar, uma vagem se abrir ou um botão de folha se abrir.\n\nSensor Climático. Você cria um efeito sensorial minúsculo e inofensivo que prevê qual será o clima no local onde você está pelas próximas 24 horas. O efeito pode se manifestar como uma esfera dourada para céu claro, uma nuvem para chuva, flocos de neve caindo para neve e assim por diante. Esse efeito persiste por 1 rodada."],["Assassino Fantasmagórico",4,"Ilusão",["bardo","mago"],"Ação","36 metros","V, S","Concentração, até 1 minuto","Você entra nos pesadelos de uma criatura à sua vista e no alcance da magia e cria uma ilusão dos medos mais profundos dela, visíveis apenas para essa criatura. O alvo realiza uma salvaguarda de Sabedoria. Se falhar, o alvo sofre 4d10 pontos de dano Psíquico e tem Desvantagem em testes de atributo e jogadas de ataque pela duração da magia. Em caso de sucesso, o alvo sofre metade do dano e a magia encerra.\n\nPela duração da magia, o alvo realiza uma salvaguarda de Sabedoria no final de cada um dos turnos dele. Se falhar, sofre dano Psíquico novamente. Em caso de sucesso, a magia encerra.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d10 para cada círculo de espaço de magia acima de 4."],["Augúrio",2,"Adivinhação",["clerigo","druida","mago"],"1 minuto ou Ritual","Pessoal","V, S, M (varetas, ossos, cartas ou símbolos semelhantes especialmente marcados no valor de 25 ou mais PO)","Instantânea","Você recebe um presságio de uma entidade sobrenatural a respeito dos resultados de um curso de ação que você planeja realizar nos próximos 30 minutos. O Mestre escolhe o presságio da tabela Presságios.\n\nPresságios\n\nPresságios Para Resultados Que Serão… Prosperidade Bons Infortúnio Maus Prosperidade e Infortúnio Bons e ruins Nada Nem bons, nem ruins A magia não leva em conta circunstâncias, como outras magias, que podem alterar os resultados.\n\nSe você conjurar a magia mais de uma vez antes de terminar um Descanso Longo, há uma chance cumulativa de 25% para cada conjuração após a primeira de que você não receba resposta."],["Aumentar/Reduzir",2,"Transmutação",["bardo","druida","feiticeiro","mago"],"Ação","9 metros","V, S, M (uma pitada de ferro em pó)","Concentração, até 1 minuto","Pela duração da magia, você amplia ou reduz uma criatura, ou objeto, à sua vista e no alcance da magia (veja o efeito escolhido abaixo). Um objeto à vista não deve ser usado nem transportado. Se o alvo for uma criatura involuntária, ele pode realizar uma salvaguarda de Constituição. Em caso de sucesso, a magia não surte efeito.\n\nTudo o que uma criatura estiver usando e carregando muda de tamanho com ela. Qualquer item que cair retorna ao tamanho normal de uma só vez. Uma arma ou munição arremessada retorna ao tamanho normal imediatamente após atingir ou errar um alvo.\n\nAumentar. O tamanho do alvo aumenta em uma categoria — de Médio para Grande, por exemplo. O alvo também tem Vantagem em testes de Força e salvaguardas de Força. Os ataques do alvo com suas armas ampliadas ou Ataques Desarmados causam 1d4 pontos de dano adicionais em caso de acerto.\n\nReduzir. O tamanho do alvo diminui em uma categoria — de Médio para Pequeno, por exemplo. O alvo também tem Desvantagem em testes de Força e salvaguardas de Força. Os ataques do alvo com suas armas reduzidas ou Ataques Desarmados causam 1d4 pontos de dano a menos em caso de acerto (isso não pode reduzir o dano abaixo de 1)."],["Aura Mágica de Nystul",2,"Ilusão",["mago"],"Ação","Toque","V, S, M (um pequeno quadrado de seda)","24 horas","Com um toque, você coloca uma ilusão em uma criatura voluntária ou em um objeto que não esteja sendo usado ou carregado. Uma criatura adquire o efeito Máscara descrito abaixo, e um objeto adquire o efeito Falsa Aura descrito abaixo. O efeito permanece pela duração da magia. Se você conjurar a magia na mesma criatura ou objeto todos os dias por 30 dias, a ilusão dura até ser dissipada.\n\nFalsa Aura (Objeto). Você muda a forma como o alvo aparece para magias e efeitos mágicos que detectam auras mágicas, como Detectar Magia . Você pode realizar um objeto não mágico parecer mágico, realizar um item mágico parecer não mágico ou alterar a aura do objeto para parecer pertencer a uma escola de magia que você escolher.\n\nMáscara (Criatura). Escolha um tipo de criatura diferente do tipo real do alvo. Magias e outros efeitos mágicos tratam o alvo como se fosse uma criatura do tipo escolhido."],["Aura Sagrada",8,"Abjuração",["clerigo"],"Ação","Pessoal","V, S, M (um relicário no valor de 1.000 ou mais PO)","Concentração, até 1 minuto","Pela duração, você emite uma aura em uma Emanação de 9 metros. Enquanto estão dentro da aura, criaturas à sua escolha têm Vantagem em todas as salvaguardas, enquanto as outras têm Desvantagem nas jogadas de ataque contra elas. Além disso, se um Ínfero ou um Morto-Vivo atinge uma criatura afetada em uma jogada de ataque corpo a corpo, o atacante deve ser bem-sucedido em uma salvaguarda de Constituição ou fica Cego até o final do próximo turno dele."],["Aura de Pureza",4,"Abjuração",["clerigo","paladino"],"Ação","Pessoal","V","Concentração, até 10 minutos","Uma aura irradia de você em uma Emanação de 9 metros pela duração da magia. Enquanto estiver na aura, você e seus aliados têm Resistência a dano Venenoso e Vantagem nas salvaguardas para evitar ou encerrar efeitos que incluem a condição Amedrontado, Atordoado, Cego, Enfeitiçado, Envenenado, Paralisado ou Surdo."],["Aura de Vida",4,"Abjuração",["clerigo","paladino"],"Ação","Pessoal","V","Concentração, até 10 minutos","Uma aura irradia de você em uma Emanação de 9 metros pela duração da magia. Enquanto estiver na aura, você e seus aliados têm Resistência a Dano Necrótico, e seus Pontos de Vida máximos não podem ser reduzidos. Se um aliado com 0 Pontos de Vida começar o turno na aura, esse aliado recupera 1 Ponto de Vida."],["Aura de Vitalidade",3,"Abjuração",["clerigo","druida","paladino"],"Ação","Pessoal","V","Concentração, até 1 minuto","Uma aura irradia de você em uma Emanação de 9 metros pela duração da magia. Quando você cria a aura e no início de cada um dos seus turnos enquanto ela persiste, você pode restaurar 2d6 Pontos de Vida em uma criatura dentro dela."],["Auxílio",2,"Abjuração",["bardo","clerigo","druida","guardiao","paladino"],"Ação","9 metros","V, S, M (uma tira de pano branco)","8 horas","Escolha até três criaturas no alcance da magia. Os Pontos de Vida máximos e os Pontos de Vida atuais de cada alvo aumentam em 5 pela duração da magia.\n\nUsando um Espaço de Magia de Círculo Superior. Os Pontos de Vida de cada alvo aumentam em 5 para cada círculo de espaço de magia acima de 2."],["Badalar Fúnebre",0,"Necromancia",["bruxo","clerigo","mago"],"Ação","18 metros","V, S","Instantânea","Você aponta para uma criatura à sua vista e no alcance da magia, então um único toque de um badalar doloroso é audível a até 3 metros do alvo. O alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou sofre 1d8 pontos de dano Necrótico. Caso o alvo tenha perdido algum de seus Pontos de Vida, em vez de 1d8, ele sofre 1d12 pontos de dano Necrótico.\n\nAprimoramento de Truque. O dano aumenta em um dado quando você atinge os níveis 5 (2d8 ou 2d12), 11 (3d8 ou 3d12) e 17 (4d8 ou 4d12)."],["Banimento",4,"Abjuração",["bruxo","clerigo","feiticeiro","mago","paladino"],"Ação","9 metros","V, S, M (um pentagrama)","Concentração, até 1 minuto","Uma criatura à sua vista e no alcance da magia deve ser bem-sucedida em uma salvaguarda de Carisma ou é transportada para um semiplano inofensivo pela duração da magia. Enquanto estiver lá, o alvo tem a condição Incapacitado. Quando a magia encerra, o alvo reaparece no espaço que deixou ou no espaço desocupado mais próximo, se o primeiro espaço estiver ocupado.\n\nSe o alvo for uma Aberração, Celestial, Elemental, Feérico ou Ínfero, o alvo não retorna se a magia durar 1 minuto. Em vez disso, o alvo é transportado para um local aleatório em um plano (à escolha do Mestre) associado ao tipo da criatura.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 4."],["Banquete de Heróis",6,"Invocação",["bardo","clerigo","druida"],"10 minutos","Pessoal","V, S, M (uma tigela incrustada de pedras preciosas no valor de 1.000 ou mais PO, que a magia consome)","Instantânea","Você conjura um banquete que aparece em uma superfície em um Cubo desocupado de 3 metros de lado próximo a você. O banquete leva 1 hora para ser consumido e desaparece no final dessa duração, e os efeitos benéficos não aparecem até que essa hora passe. Até doze criaturas podem participar do banquete.\n\nUma criatura que partilha do banquete recebe vários benefícios, que duram 24 horas. A criatura tem Resistência a dano Venenoso e Imunidade às condições Amedrontado e Envenenado. Seus Pontos de Vida máximos também aumentam em 2d10 e recebe o mesmo valor de Pontos de Vida."],["Barreira de Lâminas",6,"Evocação",["clerigo"],"Ação","27 metros","V, S","Concentração, até 10 minutos","Você cria uma barreira de lâminas rodopiantes formadas de energia mágica. A barreira aparece no alcance da magia e permanece pela duração. Você cria uma barreira reta de até 30 metros de comprimento, 6 metros de altura e 1,5 metro de espessura, ou uma barreira circular de até 18 metros de diâmetro, 6 metros de altura e 1,5 metro de espessura. A barreira oferece Cobertura de Três Quartos e seu espaço é considerado Terreno Difícil.\n\nQualquer criatura no espaço da barreira realiza uma salvaguarda de Destreza, sofrendo 6d10 pontos de dano Energético se falhar, ou metade desse dano em caso de sucesso. Uma criatura também realiza essa salvaguarda se entrar no espaço da barreira ou terminar seu turno lá. Uma criatura realiza essa salvaguarda apenas uma vez por turno."],["Boca Encantada",2,"Ilusão",["bardo","mago"],"1 minuto ou Ritual","9 metros","V, S, M (poeira de jade no valor de 10 ou mais PO, que a magia consome)","Até ser dissipada","Você implanta uma mensagem em um objeto que esteja no alcance da magia. Essa mensagem é revelada quando uma circunstância de disparo ocorrer. Escolha um objeto à sua vista e que não esteja sendo usado ou carregado por outra criatura. Fale, então, a mensagem, que deve possuir 25 palavras ou menos, embora ela possa ser emitida ao longo de um período de até 10 minutos. Por fim, determine a circunstância de disparo para magia revelar a mensagem.\n\nQuando tal circunstância ocorrer, uma boca encantada aparece no objeto e recita a mensagem com a sua voz e no mesmo volume que você falou. Se o objeto escolhido tiver uma boca ou algo que se assemelhe (por exemplo, a boca de uma estátua), a boca encantada se sobrepõe para parecer que as palavras saem da boca do próprio objeto. Ao conjurar a magia, você determina se ela se encerra após entregar a mensagem ou se permanece para repetir o conteúdo sempre que a circunstância de disparo ocorrer.\n\nA circunstância de disparo pode ser tão abrangente ou específica quanto você quiser, mas deve ser baseada em condições visuais ou auditivas que ocorram a até 9 metros do objeto. Por exemplo, você pode instruir a boca a falar sempre que uma criatura se aproxime a até 9 metros do objeto, ou quando um sino de prata soar a até 9 metros de distância do objeto."],["Bola de Fogo",3,"Evocação",["feiticeiro","mago"],"Ação","45 metros","V, S, M (uma bola de guano de morcego e enxofre)","Instantânea","Uma faixa brilhante emerge de você até um ponto à sua escolha no alcance da magia e, em seguida, desabrocha com um estrondo baixo em uma explosão de fogo. Cada criatura em uma Esfera de 6 metros de raio centrada nesse ponto realiza uma salvaguarda de Destreza, sofrendo 8d6 pontos de dano Ígneo se falhar, ou metade desse dano em caso de sucesso.\n\nObjetos inflamáveis na área que não estão sendo usados ou carregados entram em combustão.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 para cada círculo de espaço de magia acima de 3."],["Bola de Fogo Adiável",7,"Evocação",["feiticeiro","mago"],"Ação","45 metros","V, S, M (uma bola de guano de morcego e enxofre)","Concentração, até 1 minuto","Um feixe de luz amarela dispara de você, depois se condensa em um ponto escolhido no alcance da magia como um grânulo brilhante pela duração da magia. Quando a magia termina, o grânulo explode, e cada criatura em uma Esfera de 6 metros de raio centrada nesse ponto realiza uma salvaguarda de Destreza. Se falhar, uma criatura sofre dano Ígneo igual ao dano total acumulado, ou metade desse dano em caso de sucesso.\n\nO dano base da magia é 12d6, e o dano aumenta em 1d6 sempre que seu turno termina e a magia não se encerra. Se uma criatura tocar o grânulo brilhante antes da magia terminar, ela realiza uma salvaguarda de Destreza. Se falhar, a magia se encerra, fazendo com que o grânulo exploda. Em caso de sucesso, a criatura pode arremessar o grânulo até 12 metros. Se o arremesso atingir o espaço de uma criatura ou colidir com um objeto sólido, a magia se encerra e o grânulo explode. Quando o grânulo explode, objetos inflamáveis na explosão que não estão sendo usados ou carregados entram em combustão.\n\nUsando um Espaço de Magia de Círculo Superior. O dano base aumenta em 1d6 pontos para cada círculo de espaço de magia acima de 7."],["Bolha Ácida",0,"Evocação",["feiticeiro","mago"],"Ação","18 metros","V, S","Instantânea","Você cria uma bolha ácida em um ponto no alcance da magia, onde ela explode em uma Esfera de 1,5 metro de raio. Cada criatura nessa Esfera deve ser bem-sucedida em uma salvaguarda de Destreza ou sofre 1d6 pontos de dano Ácido.\n\nAprimoramento de Truque. O dano aumenta em 1d6 quando você atinge os níveis 5 (2d6), 11 (3d6) e 17 (4d6)."],["Bom Fruto",1,"Invocação",["druida","guardiao"],"Ação","Pessoal","V, S, M (um ramo de visco)","24 horas","Dez frutos aparecem em sua mão e são infundidos magicamente pela duração da magia. Uma criatura pode executar uma Ação Bônus para comer um fruto. Comer um fruto restaura 1 Ponto de Vida e fornece alimento suficiente para sustentar uma criatura por um dia. Frutos não comidos desaparecem quando a magia termina."],["Bordão Místico",0,"Transmutação",["druida"],"Ação Bônus","Pessoal","V, S, M (um ramo de visco)","1 minuto","Um Cajado ou Clava que você está segurando é imbuído com o poder da natureza. Pela duração da magia, você pode usar seu atributo de conjuração em vez de Força para as jogadas de ataque e dano de ataques corpo a corpo com essa arma, e o dado de dano da arma se torna um d8. Se o ataque causar dano, ele pode ser de dano Energético ou do tipo de dano normal da arma (à sua escolha).\n\nA magia encerra se você a conjurar novamente ou se soltar a arma.\n\nAprimoramento de Truque. O dado de dano muda quando você atinge os níveis 5 (1d10), 11 (1d12) e 17 (2d6)."],["Braços de Hadar",1,"Invocação",["bruxo"],"Ação","Pessoal","V, S","Instantânea","Clamando por Hadar, você faz com que tentáculos irrompam em você. Cada criatura em uma Emanação de 3 metros originada em você realiza uma salvaguarda de Força. Se falhar, um alvo sofre 2d6 pontos de dano Necrótico e não pode executar Reações até o início do próximo turno dele. Em caso de sucesso, um alvo sofre apenas metade do dano.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d6 pontos para cada círculo de espaço de magia acima de 1."],["Bênção",1,"Encantamento",["clerigo","paladino"],"Ação","9 metros","V, S, M (um Símbolo Sagrado no valor de 5 ou mais PO)","Concentração, até 1 minuto","Você abençoa até três criaturas no alcance da magia. Sempre que um alvo realiza uma jogada de ataque ou uma salvaguarda antes que a magia termine, o alvo adiciona 1d4 à jogada de ataque ou salvaguarda.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 1."],["Caldeirão Borbulhante de Tasha",6,"Invocação",["bruxo","mago"],"Ação","1,5 metro","V, S, M (uma colher de mexer caldeirão dourada no valor de 500 ou mais PO)","10 minutos","Você conjura um caldeirão com pés de garra cheio de líquido borbulhante. O caldeirão aparece em um espaço desocupado no chão a até 1,5 metro de você e permanece pela duração da magia. O caldeirão não pode ser movido e desaparece quando a magia termina, junto com o líquido borbulhante dentro dele.\n\nO líquido no caldeirão copia as propriedades de uma poção Comum ou Incomum à sua escolha (como uma Poção de Cura ). Como uma Ação Bônus, você ou um aliado pode alcançar o caldeirão e retirar dele uma poção desse tipo. A poção está contida em um frasco que desaparece quando a poção é consumida. O caldeirão pode produzir um número dessas poções igual ao seu modificador de atributo de conjuração (mínimo 1). Quando a última dessas poções é retirada do caldeirão, o caldeirão desaparece e a magia termina.\n\nPoções obtidas do caldeirão que não são consumidas desaparecem quando você conjura esta magia novamente."],["Caminhar Sobre as Águas",3,"Transmutação",["clerigo","druida","feiticeiro","guardiao"],"Ação ou Ritual","9 metros","V, S, M (um pedaço de cortiça)","1 hora","Esta magia concede a capacidade de se mover através de qualquer superfície líquida — como ácido, água, areia movediça, lama, lava ou neve — como se fosse um solo sólido inofensivo (criaturas que cruzam a lava derretida ainda podem sofrer dano devido ao calor). Até dez criaturas voluntárias à sua escolha no alcance da magia recebem essa habilidade pela duração da magia. Um alvo afetado deve executar uma Ação Bônus para passar da superfície do líquido para dentro dele e vice-versa, mas, se o alvo cair no líquido, ele atravessa a superfície e entra no líquido abaixo."],["Caminhar no Vento",6,"Transmutação",["druida"],"1 minuto","9 metros","V, S, M (uma vela)","8 horas","Você e até dez criaturas voluntárias à sua escolha no alcance da magia assumem formas gasosas pela duração da magia, aparecendo como fiapos de nuvem. Enquanto estiver nesta forma de nuvem, um alvo tem um Deslocamento de Voo de 90 metros e pode pairar; tem Imunidade à condição Caído; e tem Resistência a dano Contundente, Cortante e Perfurante. As únicas ações que um alvo pode executar nesta forma são a ação Correr ou Usar Magia para começar a reverter à sua forma normal. Reverter leva 1 minuto, durante o qual o alvo tem a condição Atordoado. Até que a magia termine, o alvo pode voltar à forma de nuvem, o que também requer uma ação Usar Magia seguida de uma transformação de 1 minuto.\n\nSe um alvo estiver em forma de nuvem e voando quando o efeito terminar, ele desce 18 metros por rodada por 1 minuto até pousar, o que faz com segurança. Se não conseguir pousar após 1 minuto, ele cai pela distância restante."],["Campo Antimagia",8,"Abjuração",["clerigo","mago"],"Ação","Pessoal","V, S, M (raspas de ferro)","Concentração, até 1 hora","Uma aura de antimagia envolve você em uma Emanação de 3 metros. Ninguém pode conjurar magias, executar a ação Usar Magia ou criar outros efeitos mágicos dentro da aura, e esses efeitos não podem ter como alvo ou afetar qualquer coisa dentro dela. As propriedades mágicas dos itens mágicos não funcionam dentro da aura ou em qualquer coisa dentro dela. Áreas de efeito criadas por magias ou outros efeitos mágicos não podem se estender para dentro da aura, e ninguém pode se teleportar para dentro ou para fora dela ou usar viagens planares para lá. Os portais se fecham temporariamente enquanto estão na aura. Magias em andamento, exceto aquelas conjuradas por um Artefato ou por uma divindade, são suprimidas na área. Enquanto um efeito é suprimido, ele não funciona, mas o tempo que ele gasta suprimido conta para sua duração Dissipar Magia não tem efeito sobre a aura, e as auras criadas por diferentes magias de Campo Antimagia não se anulam."],["Cativar",2,"Encantamento",["bardo","bruxo"],"Ação","18 metros","V, S","Concentração, até 1 minuto","Você tece uma sequência de palavras perturbadoras, fazendo com que criaturas à sua escolha à sua vista e no alcance da magia realizem uma salvaguarda de Sabedoria. Qualquer criatura contra a qual você ou seus companheiros estejam lutando é automaticamente bem-sucedida nesta salvaguarda. Se falhar, um alvo tem uma penalidade de −10 nos testes de Sabedoria (Per cepção) e Percepção Passiva até que a magia termine."],["Cegueira/Surdez",2,"Transmutação",["bardo","clerigo","feiticeiro","mago"],"Ação","36 metros","V","1 minuto","Uma criatura à sua vista e no alcance da magia deve ser bem-sucedida em uma salvaguarda de Constituição, ou ela tem a condição Cego ou Surdo (à sua escolha) pela duração da magia. O alvo repete a salvaguarda no final de cada um dos turnos dele, encerrando a magia em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 2."],["Celeridade",3,"Transmutação",["feiticeiro","mago"],"Ação","9 metros","V, S, M (uma lasca de raiz de alcaçuz)","Concentração, até 1 minuto","Escolha uma criatura voluntária à sua vista e no alcance da magia. Até que a magia termine, o deslocamento do alvo é dobrado, e ele recebe um bônus de +2 na Classe de Armadura, tem Vantagem em salvaguardas de Destreza e recebe uma ação adicional em cada um de seus turnos. Essa ação pode ser utilizada apenas para executar a ação Atacar (apenas um ataque), Correr, Desengajar, Esconder ou Usar Objeto.\n\nQuando a magia termina, o alvo fica Incapacitado e tem Deslocamento 0 até o final do próximo turno dele, quando uma onda de letargia passa por ele."],["Chama Contínua",2,"Evocação",["clerigo","druida","mago"],"Ação","Toque","V, S, M (rubi em pó no valor de 50 ou mais PO, que a magia consome)","Até ser dissipada","Uma chama brota de um objeto que você toca. O efeito conjura Luz Plena em um raio de 6 metros e Meia-luz por mais 6 metros. Ela se parece uma chama comum, mas não cria calor e não consome combustível. A chama pode ser coberta ou escondida, mas não abafada ou extinta."],["Chama Sagrada",0,"Evocação",["clerigo"],"Ação","18 metros","V, S","Instantânea","Um brilho semelhante a uma chama desce sobre uma criatura à sua vista e no alcance da magia. O alvo deve ser bem-sucedido em uma salvaguarda de Destreza ou sofre 1d8 pontos de dano Radiante. O alvo não recebe nenhum benefício de Cobertura Parcial ou Cobertura de Três Quartos para esta salvaguarda.\n\nAprimoramento de Truque. O dano aumenta em 1d8 quando você atinge os níveis 5 (2d8), 11 (3d8) e 17 (4d8)."],["Chicote de Espinhos",0,"Transmutação",["druida"],"Ação","9 metros","V, S, M (o caule de uma planta espinhosa)","Instantânea","Você cria um chicote semelhante a uma videira coberto de espinhos que ataca ao seu comando em direção a uma criatura no alcance da magia. Realize um ataque mágico corpo a corpo contra o alvo. Em caso de acerto, o alvo sofre 1d6 pontos de dano Perfurante e, se for Grande ou menor, você pode puxá-lo até 3 metros mais perto de você.\n\nAprimoramento de Truque. O dano aumenta em 1d6 quando você atinge os níveis 5 (2d6), 11 (3d6) e 17 (4d6)."],["Chuva de Meteoros",9,"Evocação",["feiticeiro","mago"],"Ação","1,5 km","V, S","Instantânea","Orbes flamejantes caem do céu em quatro pontos distintos à sua vista e no alcance da magia. Cada criatura em uma Esfera de 12 metros de raio centrada em cada um desses pontos realiza uma salvaguarda de Destreza. Uma criatura sofre 20d6 pontos de dano Ígneo e 20d6 pontos de dano Contundente se falhar, ou metade desse dano em caso de sucesso. Uma criatura na área de mais de uma esfera de fogo é afetada apenas uma vez. Um objeto não mágico que não esteja sendo usado ou carregado também sofre o dano se estiver na área da magia, e começa a queimar se for inflamável."],["Clarividência",3,"Adivinhação",["bardo","clerigo","feiticeiro","mago"],"10 minutos","1,5 km","V, S, M (um foco no valor de 100 ou mais PO, seja um chifre adornado com joias e usado para escutar, ou um olho de vidro usado para enxergar)","Concentração, até 10 minutos","Você cria um sensor Invisível no alcance da magia em um local que lhe seja familiar (um lugar que você já viu ou visitou antes) ou em um local óbvio que não lhe seja familiar (como atrás de uma porta, em uma esquina ou em um bosque). O sensor não pode ser atacado e permanece no lugar pela duração da magia.\n\nAo conjurar a magia, escolha ver ou ouvir. Você pode usar o sentido escolhido através do sensor como se estivesse em seu espaço. Como uma Ação Bônus, você pode alternar entre ver e ouvir.\n\nUma criatura que veja o sensor (como uma criatura que se beneficia de Ver o Invisível ou Visão Verdadeira) enxerga uma esfera luminosa do tamanho do seu punho."],["Clone",8,"Necromancia",["mago"],"1 hora","Toque","V, S, M (um diamante no valor de 1.000 ou mais PO, que a magia consome, e um recipiente vedável no valor de 2.000 ou mais PO que seja grande o suficiente para conter a criatura sendo clonada)","Instantânea","Você toca uma criatura ou pelo menos 2,5 centímetros cúbicos da carne dela. Uma duplicata inerte dessa criatura se forma dentro do recipiente usado na conjuração da magia e termina de crescer após 120 dias; você escolhe se o clone finalizado tem a mesma idade da criatura ou é mais nova. O clone permanece inerte e dura indefinidamente enquanto o recipiente o contém permanecer intacto.\n\nSe a criatura original morrer após o clone terminar de se formar, a alma da criatura é transferida para o clone se a alma estiver livre e disposta a retornar. O clone é fisicamente idêntico ao original e tem a mesma personalidade, memórias e habilidades, mas nenhum dos equipamentos do original. Os restos originais da criatura, se houver, tornam-se inertes e não podem ser revividos, uma vez que a alma da criatura está em outro lugar."],["Coluna de Chamas",5,"Evocação",["clerigo"],"Ação","18 metros","V, S, M (uma pitada de enxofre)","Instantânea","Uma coluna vertical de fogo brilhante emerge de cima para baixo. Cada criatura em um Cilindro de 3 metros de raio e 12 metros de altura, centrada em um ponto no alcance da magia, realiza uma salvaguarda de Destreza, sofrendo 5d6 pontos de dano Ígneo e 5d6 pontos de dano Radiante se falhar, ou metade desse dano em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O dano Ígneo e o dano Radiante aumentam em 1d6 para cada círculo de espaço de magia acima de 5."],["Comando",1,"Encantamento",["bardo","clerigo","paladino"],"Ação","18 metros","V","Instantânea","Você profere uma palavra única de comando para uma criatura à sua vista e no alcance da magia. O alvo deve ser bem-sucedido em uma salvaguarda de Sabedoria ou segue o comando no próximo turno dele. Escolha o comando a partir destas opções:\n\nAbaixar. O alvo tem a condição Caído e, em seguida, termina o turno.\n\nAproximar. O alvo se move em sua direção pela rota mais curta e direta, terminando o turno dele se ele se mover a até 1,5 metro de você.\n\nFugir. O alvo usa o próprio turno se afastando de você pelos meios mais rápidos disponíveis.\n\nLargar. O alvo solta o que estiver segurando e, em seguida, termina o turno.\n\nParar. No turno do alvo, ele não se move e não executa nenhuma ação ou Ação Bônus.\n\nUsando um Espaço de Magia de Círculo Superior. Você pode escolher uma criatura adicional para cada círculo de espaço de magia acima de 1."],["Compreender Idiomas",1,"Adivinhação",["bardo","bruxo","feiticeiro","mago"],"Ação ou Ritual","Pessoal","V, S, M (uma pitada de fuligem e sal)","1 hora","Pela duração da magia, você entende o significado literal de qualquer idioma que ouça ou veja escrito. Você também entende qualquer escrita que veja, mas deve estar tocando a superfície na qual as palavras estão escritas. Leva cerca de 1 minuto para ler uma página de texto. Esta magia não decodifica símbolos ou mensagens secretas."],["Compulsão",4,"Encantamento",["bardo"],"Ação","9 metros","V, S","Concentração, até 1 minuto","Cada criatura à sua escolha à sua vista e no alcance da magia deve ser bem-sucedida em uma salvaguarda de Sabedoria ou tem a condição Enfeitiçado até que a magia termine.\n\nPela duração da magia, você pode executar uma Ação Bônus para designar uma direção que seja horizontal para você. Cada alvo Enfeitiçado deve usar o máximo possível do movimento dele para se mover nessa direção no turno dele, seguindo o caminho mais seguro. Após se mover desse modo, um alvo repete a salvaguarda, encerrando a magia em caso de sucesso."],["Comunhão",5,"Adivinhação",["clerigo"],"1 minuto ou Ritual","Pessoal","V, S, M (incenso)","1 minuto","Você entra em contato com uma divindade ou um representante divino e realiza até três perguntas que podem ser respondidas com sim ou não. Você deve realizar suas perguntas antes que a magia termine. Você recebe uma resposta correta para cada pergunta. Os seres divinos não são necessariamente oniscientes, então você pode receber “indeterminado” como resposta se uma pergunta pertencer a informações que estão além do conhecimento da divindade. Em um caso em que uma resposta de uma palavra possa ser enganosa ou contrária aos interesses da divindade, o Mestre pode oferecer uma frase curta como resposta.\n\nSe você conjurar a magia mais de uma vez antes de terminar um Descanso Longo, há uma chance cumulativa de 25% para cada conjuração após a primeira de que você não receba resposta."],["Comunhão com a Natureza",5,"Adivinhação",["druida","guardiao"],"1 minuto ou Ritual","Pessoal","V, S","Instantânea","Você comunga com os espíritos da natureza adquirindo conhecimento da área circundante. Ao ar livre, a magia lhe dá conhecimento da área a até 5 quilômetros de você. Em cavernas e outros ambientes subterrâneos naturais, o raio é limitado a 90 metros. A magia não funciona onde a natureza foi substituída por construções, como em castelos e povoados.\n\nEscolha três dos seguintes fatos; você aprende esses fatos no que se refere à área da magia:\n\n• Localização de povoados • Localização de portais para outros planos de existência • Localização de uma criatura de Nível de Desafio 10 ou maior (à escolha do Mestre) que seja Celestial, Elemental, Feérico, Ínfero ou Morto-vivo • O tipo mais predominante de planta, mineral ou Fera (você escolhe sobre qual aprender)\n\n• Localização de corpos d’água Por exemplo, você pode determinar a localização de um monstro poderoso na área, os locais dos corpos d’água e os locais de quaisquer povoados."],["Cone de Frio",5,"Evocação",["druida","feiticeiro","mago"],"Ação","Pessoal","V, S, M (um pequeno cone de cristal ou vidro)","Instantânea","Você libera uma rajada de ar frio. Cada criatura em um Cone de 18 metros originado em você realiza uma salvaguarda de Constituição, sofrendo 8d8 pontos de dano Gélido se falhar, ou metade desse dano em caso de sucesso. Uma criatura morta por esta magia se torna uma estátua congelada até descongelar.\n\nUsando um Espaço de Magia de Círculo Superior. O dano aumenta em 1d8 para cada círculo de espaço de magia acima de 5."],["Confusão",4,"Encantamento",["bardo","druida","feiticeiro","mago"],"Ação","27 metros","V, S, M (três cascas de nozes)","Concentração, até 1 minuto","Cada criatura em uma Esfera de 3 metros de raio centrada em um ponto à sua escolha no alcance da magia deve ser bem-sucedida em uma salvaguarda de Sabedoria, ou esse alvo não pode executar Ações Bônus ou Reações, e deve jogar 1d10 no início de cada um dos turnos dele para determinar o comportamento nesse turno, consultando a tabela abaixo.\n\n1d10 Comportamento para o Turno 1 O alvo não executa uma ação e usa todo o deslocamento para se mover. Jogue 1d4 para a direção: 1, norte; 2, leste; 3, sul; ou 4, oeste.\n\n2-6 O alvo não se move ou executa ações.\n\n7-8 O alvo não se move e executa a ação Atacar para realizar um ataque corpo a corpo contra uma criatura aleatória ao alcance. Se nenhuma estiver ao alcance, o alvo não executa nenhuma ação.\n\n9-10 O alvo escolhe o comportamento dele.\n\nAo final de cada um dos turnos dele, um alvo afetado repete a salvaguarda, encerrando a magia em caso de sucesso.\n\nUsando um Espaço de Magia de Círculo Superior. O raio da Esfera aumenta em 1,5 metro para cada círculo de espaço de magia acima de 4."],["Consagrar",5,"Abjuração",["clerigo"],"24 horas","Toque","V, S, M (incenso no valor de 1.000 ou mais PO, que a magia consome)","Até ser dissipada","Você toca um ponto e infunde uma área ao seu redor com poder sagrado ou profano. A área pode ter um raio de até 18 metros, e a magia falha se o raio incluir uma área já sob o efeito de Consagrar . A área afetada tem os seguintes efeitos.\n\nVigília Consagrada. Escolha um tipo de criatura: Aberração, Celestial, Elemental, Feérico, Ínfero ou Morto-Vivo. Criaturas do tipo escolhido não podem entrar voluntariamente na área, e qualquer criatura que esteja possuída por elas, ou tem a condição Amedrontado ou Enfeitiçado por essas criaturas, não será considerada possuída, nem terá as condições Amedrontado ou Enfeitiçado enquanto enquanto estiver na área.\n\nEfeito Adicional. Você vincula um efeito adicional à área da lista abaixo:\n\nCoragem. Criaturas de qualquer tipo que você escolher não recebem a condição Amedrontado enquanto estiverem na área.\n\nDescanso Pacífico. Cadáveres enterrados na área não podem ser transformados em Mortos-vivos.\n\nEscuridão. Escuridão preenche a área. A luz normal, bem como a luz mágica criada por magias de um círculo inferior a esta magia, não pode iluminar a área.\n\nIdiomas. Criaturas de qualquer tipo que você escolher podem se comunicar com qualquer outra criatura na área, mesmo que não compartilhem um idioma em comum.\n\nInterferência Extradimensional. Criaturas de qualquer tipo que você escolher não podem entrar ou sair da área usando teleporte ou viagem interplanar.\n\nLuz do Dia. Luz Plena preenche a área. Escuridão mágica criada por magias de um círculo inferior a esta magia não pode extinguir a luz.\n\nMedo. Criaturas de qualquer tipo que você escolher tem a condição Amedrontado enquanto estiverem na área.\n\nResistência. Criaturas de qualquer tipo que você escolher têm Resistência a um tipo de dano à sua escolha enquanto estiverem na área.\n\nSilêncio. Nenhum som pode emanar de dentro da área e nenhum som pode adentrá-la.\n\nVulnerabilidade. Criaturas de qualquer tipo que você escolher têm Vulnerabilidade a um tipo de dano à sua escolha enquanto estiverem na área."],["Contato Extraplanar",5,"Adivinhação",["bruxo","mago"],"1 minuto ou Ritual","Pessoal","V","1 minuto","Você entra em contato mentalmente com um semideus, com o espírito de um sábio morto há muito tempo ou com alguma outra entidade conhecedora de outro plano. Entrar em contato com essa inteligência sobrenatural pode fragmentar sua mente. Ao conjurar essa magia, realize uma salvaguarda de Inteligência CD 15.\n\nEm caso de sucesso, você pode realizar até cinco perguntas à entidade. Você deve realizar suas perguntas antes que a magia termine. O Mestre responde a cada pergunta com uma palavra, como “sim”, “não”, “talvez”, “nunca”, “irrelevante” ou “indeterminado” (se a entidade não souber a resposta à pergunta). Se a resposta com uma palavra for enganosa, o Mestre pode, em vez disso, oferecer uma frase curta como resposta. Se falhar, você sofre 6d6 pontos de dano Psíquico e tem a condição Incapacitado até completar um Descanso Longo. Uma magia Restauração Maior conjurada em você encerra esse efeito."],["Contingência",6,"Abjuração",["mago"],"10 minutos","Pessoal","V, S, M (uma estatueta de si mesmo incrustada de pedras preciosas no valor de 1.500 ou mais PO)","10 dias","Escolha uma magia de 5º círculo ou inferior que você possa conjurar, que tenha um tempo de conjuração de uma ação e que possa ter você como alvo. Você conjura essa magia — chamada de magia contingente — como parte da conjuração de Contingência , gastando espaços de magia para ambas, mas a magia contingente não entra em efeito. Em vez disso, ela é ativada quando ocorre um determinado gatilho. Você descreve esse gatilho quando conjura as duas magias. Por exemplo, uma Contingência conjurada com Respirar na Água pode estipular que Respirar na Água é ativada quando você é envolvido por água ou um líquido semelhante.\n\nA magia contingente ativa-se imediatamente após o gatilho ocorrer pela primeira vez, quer você queira ou não, e então a Contingência termina.\n\nA magia contingente tem efeito apenas em você, mesmo que normalmente possa ter como alvo outros. Você pode usar apenas uma magia Contingência por vez. Se você conjurar esta magia novamente, o efeito de outra magia Contingência em você encerra. Além disso, a Contingência encerra em você se o componente material da magia não estiver em sua pessoa."],["Contrama
