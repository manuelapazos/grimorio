 você já tiver qualquer uma dessas opções de uma subclasse de Clérigo em um livro antigo de D&D, use apenas a opção escolhida para esta característica).\n\nConjuração Poderosa. Adicione seu modificador de Sabedoria ao dano causado com qualquer truque de Clérigo.\n\nGolpe Divino. Uma vez em cada um dos seus turnos, quando você atinge uma criatura com uma jogada de ataque usando uma arma, você pode causar ao alvo 1d8 pontos de dano Necrótico ou Radiante (à sua escolha) adicionais."],["clerigo","",10,"Intervenção Divina","Você pode convocar sua divindade ou panteão para intervir em seu nome. Como uma ação Usar Magia, escolha qualquer magia de Clérigo de 5º círculo ou inferior que não exija uma Reação para ser conjurada. Como parte da mesma ação, você conjura essa magia sem gastar espaço de magia ou precisar de componentes Materiais. Você não pode usar essa característica novamente até completar um Descanso Longo."],["clerigo","",14,"Golpes Abençoados Aprimorados","A opção que você escolheu para Golpes Abençoados fica mais poderosa.\n\nConjuração Poderosa. Quando conjurar um truque de Clérigo e causar dano a uma criatura com ele, você pode conferir vitalidade a si ou a outra criatura a até 18 metros de você, concedendo um número de Pontos de Vida Temporários igual ao dobro do seu modificador de Sabedoria.\n\nGolpe Divino. O dano adicional de seu Golpe Divino aumenta para 2d8."],["clerigo","",19,"Dádiva Épica","Você adquire o talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual se qualifica. Dádiva do Destino é recomendada."],["clerigo","",20,"Intervenção Divina Maior","Você pode convocar uma intervenção divina ainda mais poderosa. Quando usar sua característica Intervenção Divina, você pode escolher Desejo como opção de magia. Se fizer isso, não pode usar Intervenção Divina novamente até completar 2d4 Descansos Longos."],["clerigo","Domínio da Guerra",3,"Magias de Domínio da Guerra","Sua conexão com este domínio divino garante que você sempre tenha certas magias preparadas. Ao atingir um nível de Clérigo especificado na tabela Magias de Domínio da Guerra, você sempre tem as magias listadas preparadas."],["clerigo","Domínio da Guerra",3,"Ataque Direcionado","Quando você ou uma criatura a até 9 metros de você erra uma jogada de ataque, você pode gastar um uso de seu Canalizar Divindade e dar a essa jogada um bônus de +10, potencialmente fazendo-o acertar. Você usa sua Reação para conceder esse bônus a uma jogada de ataque a outra criatura."],["clerigo","Domínio da Guerra",3,"Sacerdote da Guerra","Como uma Ação Bônus, você pode realizar um ataque com uma arma ou um Ataque Desarmado. Você pode usar essa Ação Bônus um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez). Você restaura todos os usos gastos ao completar um Descanso Curto ou Longo."],["clerigo","Domínio da Guerra",6,"Bênção do Deus da Guerra","Você pode gastar um uso de seu Canalizar Divindade para conjurar Arma Espiritual ou Escudo da Fé em vez de gastar um espaço de magia. Uma magia conjurada dessa maneira não requer Concentração. Em vez disso, a magia permanece por 1 minuto, mas encerra se você conjurá-la novamente, ter a condição Incapacitado ou morrer."],["clerigo","Domínio da Guerra",17,"Avatar da Guerra","Você adquire Resistência a dano Contundente, Cortante e Perfurante."],["clerigo","Domínio da Luz",3,"Brilho do Amanhecer","Como uma ação Usar Magia, você ergue seu Símbolo Sagrado e gasta o uso de seu Canalizar Divindade para emitir um feixe de luz em uma Emanação de 9 metros originada em você. Qualquer Escuridão mágica, como a criada pela magia Escuridão , nessa área é dissipada. Além disso, cada criatura à sua escolha nessa área deve realizar uma salvaguarda de Constituição, sofrendo dano Radiante igual a 2d10 mais seu nível de Clérigo se falhar ou metade desse dano em caso de sucesso."],["clerigo","Domínio da Luz",3,"Labareda Protetora","Quando uma criatura à sua vista a até 9 metros de você realiza uma jogada de ataque, você pode executar uma Reação para impor Desvantagem na jogada de ataque, fazendo com que a luz brilhe antes de acertar ou errar.\n\nVocê pode usar essa característica um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo."],["clerigo","Domínio da Luz",3,"Magias de Domínio da Luz","Sua conexão com este domínio divino garante que você sempre tenha certas magias preparadas. Ao atingir um nível de Clérigo especificado na tabela Magias de Domínio da Luz, você sempre tem as magias listadas preparadas."],["clerigo","Domínio da Luz",6,"Labareda Protetora Aprimorada","Você restaura todos os usos gastos da sua Labareda Protetora ao completar um Descanso Curto ou Longo.\n\nAlém disso, sempre que usar Labareda Protetora, você pode conceder ao alvo do ataque desencadeado um número de Pontos de Vida Temporários igual a 2d6 mais seu modificador de Sabedoria."],["clerigo","Domínio da Luz",17,"Coroa de Luz","Como uma ação Usar Magia, você emite uma aura de luz solar que dura 1 minuto ou até que você a encerre (nenhuma ação é necessária). Você emite Luz Plena em um raio de 18 metros e Meia-luz por mais 9 metros. Seus inimigos na Luz Plena têm Desvantagem em salvaguardas contra seu Brilho do Amanhecer e qualquer magia que cause dano Ígneo ou Radiante. Você pode usar esta característica um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo."],["clerigo","Domínio da Trapaça",3,"Magias de Domínio da Trapaça","Sua conexão com este domínio divino garante que você sempre tenha certas magias preparadas. Ao atingir um nível de Clérigo especificado na tabela Magias de Domínio da Trapaça, você sempre tem as magias listadas preparadas."],["clerigo","Domínio da Trapaça",3,"Bênção do Trapaceiro","Com uma ação Usar Magia, você pode escolher a si ou a uma criatura voluntária a até 9 metros de você para ter Vantagem em testes de Destreza (Furtividade). Essa bênção permanece até você completar um Des canso Longo ou usar esta característica novamente."],["clerigo","Domínio da Trapaça",3,"Invocar Duplicidade","Como uma Ação Bônus, você pode gastar um uso de seu Canalizar Divindade para criar uma ilusão visual perfeita de si em um espaço desocupado à sua vista a até 9 metros de si. A ilusão é intangível e não ocupa seu espaço. Ela permanece por 1 minuto e acaba se você tiver a condição Incapacitado ou a encerrar (nenhuma ação é necessária). A ilusão é animada e imita suas expressões e gestos. Enquanto ela persistir, você adquire os seguintes benefícios.\n\nConjurar Magias. Você pode conjurar magias como se estivesse no espaço da ilusão, mas deve usar seus próprios sentidos.\n\nDistração. Quando você e sua ilusão estão a até 1,5 metro de uma criatura que pode ver a ilusão, você tem Vantagem em jogadas de ataque contra essa criatura, considerando quão perturbadora a ilusão é para o alvo.\n\nMover. Como uma Ação Bônus, você pode mover a ilusão até 9 metros para um espaço desocupado que esteja a até 36 metros de você."],["clerigo","Domínio da Trapaça",6,"Transposição do Trapaceiro","Ao executar a Ação Bônus para criar ou mover a ilusão de seu Invocar Duplicidade, você pode se teleportar, trocando de lugar com a ilusão."],["clerigo","Domínio da Trapaça",17,"Duplicidade Aprimorada","A ilusão de seu Invocar Duplicidade ficou mais poderosa das seguintes maneiras.\n\nDistração Compartilhada. Quando você e seus aliados realizam jogadas de ataque contra uma criatura a até 1,5 metro da ilusão, as jogadas de ataque têm Vantagem.\n\nIlusão de Cura. Quando a ilusão termina, você ou uma criatura à sua escolha a até 1,5 metro dela recupera um número de Pontos de Vida igual ao seu nível de Clérigo."],["clerigo","Domínio da Vida",3,"Magias de Domínio da Vida","Sua conexão com este domínio divino garante que você sempre tenha certas magias preparadas. Ao atingir um nível de Clérigo especificado na tabela Magias de Domínio da Vida, você sempre tem as magias listadas preparadas."],["clerigo","Domínio da Vida",3,"Discípulo da Vida","Ao conjurar uma magia com um espaço de magia que restaura Pontos de Vida em uma criatura, essa cria tura recupera Pontos de Vida adicionais no turno da conjuração. Os Pontos de Vida adicionais são iguais a 2 mais o nível do espaço de magia."],["clerigo","Domínio da Vida",3,"Preservar a Vida","Com uma ação Usar Magia, você exibe seu Símbolo Sagrado e usa seu Canalizar Divindade para evocar uma energia de cura que pode restaurar um número de Pontos de Vida igual a cinco vezes seu nível de Clérigo. Escolha criaturas Sangrando a até 9 metros de você (que pode incluir você) e divida esses Pontos de Vida entre elas. Esta característica pode restaurar uma criatura a não mais que a metade dos Pontos de Vida máximo dela."],["clerigo","Domínio da Vida",6,"Curandeiro Abençoado","Magias de cura que você conjurar nos outros também o curam. Imediatamente após conjurar uma magia com um espaço de magia que restaure Pontos de Vida em uma criatura que não seja você, você recupera Pontos de Vida iguais a 2 mais o círculo do espaço de magia."],["clerigo","Domínio da Vida",17,"Cura Suprema","Ao usar uma magia ou Canalizar Divindade para restaurar Pontos de Vida em uma criatura, não jogue os dados normalmente; em vez disso, utilize o maior resultado de cada dado. Por exemplo, ao restaurar 2d6 Pontos de Vida, você restaura 12.\n\nUm Sacerdote da Natureza de Poder Primal ruidas pertencem a ordens antigas que invocam as forças da natureza. Utilizando a magia dos animais, plantas e dos quatro elementos, os Druidas curam, multimorfam-se em animais e controlam a destruição elemental.\n\nReverenciando a natureza acima de tudo, Druidas obtêm sua magia da natureza, de uma divindade da natureza ou de ambos, e tipicamente se unem a outros Druidas para realizar ritos que marcam a passagem das estações e outros ciclos naturais.\n\nDruidas se preocupam com o delicado equilíbrio ecológico que sustenta a vida animal e vegetal e com a necessidade de as pessoas viverem em harmonia com a natureza. Muitas vezes, os Druidas protegem locais sagrados ou vigiam regiões de natureza intocada, mas quando um grande perigo surge, eles assumem um papel mais ativo como aventureiros que combatem a ameaça."],["druida","",1,"Conjuração","Você aprendeu a conjurar magias através do estudo das forças místicas da natureza. Veja o capítulo 7 para as regras de conjuração. As informações abaixo detalham como você usa essas regras com magias de Druida, que aparecem na lista de magias de Druida mais adiante na descrição da classe.\n\nTruques. Você conhece dois truques à sua escolha da lista de magias de Druida. Arte Druídica e Criar Chamas são recomendadas.\n\nSempre que você alcança um nível de Druida, pode substituir um de seus truques por outro truque à sua escolha da lista de magias de Druida.\n\nAo atingir os níveis 4 e 10 de Druida, você aprende mais um truque à sua escolha da lista de magias de Druida, conforme mostrado na coluna Truques da tabela Características de Druida.\n\nEspaços de Magia. A tabela Características de Druida mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com esta característica. Para começar, escolha quatro magias de 1º círculo da lista de magias de Druida. Amizade Animal , Curar Ferimentos , Fogo das Fadas e Onda Trovejante são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você alcança níveis de Druida, conforme mostrado na coluna Magias Preparadas da tabela Características de Druida. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Druida até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Druida de nível 3, sua lista de magias preparadas pode incluir seis magias de 1º ou 2º círculo em qualquer combinação.\n\nSe outra característica de Druida lhe der magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas essas magias, de outra forma, contam como magias de Druida para você.\n\nMudando Suas Magias Preparadas. Sempre que completar um Descanso Longo, você pode mudar sua lista de magias preparadas, substituindo qualquer uma das magias por outras magias de Druida para as quais você tem espaços de magia.\n\nAtributo de Conjuração. Sabedoria é seu atributo de conjuração para suas magias de Druida.\n\nFoco de Conjuração. Você pode usar um Foco Druídico como um Foco de Conjuração para suas magias de Druida."],["druida","",1,"Idioma Druídico","Você domina Druídico, o idioma secreto dos Druidas. Ao aprender esse idioma antigo, você também adquiriu a habilidade mágica de se comunicar com animais; você sempre tem a magia Falar com Animais preparada. Você pode usar Druídico para deixar mensagens ocultas. Você e outros que conhecem Druídico identificam automaticamente tal mensagem. Outros podem perceber a presença da mensagem com um teste de Inteligência (Investigação) CD 15, mas não podem decifrá-la sem magia."],["druida","",1,"Ordem Primal","Você se dedicou a uma das seguintes funções sagradas à sua escolha.\n\nProtetor. Treinado para a batalha, você adquire proficiência com armas Marciais e treinamento com armadura Média.\n\nXamã. Você conhece um truque adicional da lista de magias de Druida. Além disso, sua conexão mística com a natureza lhe concede um bônus em seus testes de Inteligência (Arcanismo ou Natureza). O bônus é igual ao seu modificador de Sabedoria (bônus mínimo de +1)."],["druida","",2,"Companheiro Selvagem","Você pode invocar um espírito da natureza que assume a forma de um animal para auxiliá-lo. Como uma ação Usar Magia, você pode gastar um espaço de magia ou um uso de Forma Selvagem para conjurar a magia Convocar Familiar sem componentes Materiais.\n\nAo conjurar a magia deste modo, o familiar é uma criatura Feérica e desaparece ao completar um Descanso Longo."],["druida","",2,"Forma Selvagem","O poder da natureza permite que você assuma a forma de um animal. Como uma Ação Bônus, você multimorfa para uma forma Animal que você aprendeu com esta característica (veja “Formas Conhecidas”, abaixo). Você fica nessa forma por um número de horas igual à metade do seu nível de Druida, até usar Forma Selvagem novamente, ter a condição Incapacitado ou morrer. Você também pode sair da forma antes como uma Ação Bônus.\n\nQuantidade de Usos. Você pode usar Forma Selvagem duas vezes. Você recupera um uso gasto ao completar um Descanso Curto e restaura todos os usos gastos ao completar um Descanso Longo.\n\nVocê adquire usos adicionais ao atingir determinados níveis de Druida, conforme mostrado na coluna Forma Selvagem da tabela Características de Druida.\n\nFormas Conhecidas. Você conhece quatro formas Animais com esta característica, escolhidas entre os blocos de estatísticas de Fera com um Nível de Desafio máximo de 1/4 e que não possuem um Deslocamento de Voo (veja o apêndice B para opções de bloco de estatísticas). Aranha , Cavalo de Montaria , Lobo e\n\nRato são recomendadas. Sempre que completar um Descanso Longo, você pode substituir uma de suas formas conhecidas por outra forma permitida.\n\nAo atingir certos níveis de Druida, o número de formas conhecidas e o Nível de Desafio máximo dessas formas aumenta, conforme mostrado na tabela Formas de Feras. Além disso, a partir do nível 8, você pode adotar uma forma com Deslocamento de Voo.\n\nAo escolher formas conhecidas, você pode procurar no Livro dos Monstros ou em outro lugar por Feras elegíveis se o Mestre permitir.\n\nRegras Enquanto Multimorfado. Enquanto estiver em uma forma, você mantém sua personalidade, memórias e capacidade de falar, e as seguintes regras se aplicam:\n\nPontos de Vida Temporários. Ao assumir uma Forma Selvagem, você adquire um número de Pontos de Vida Temporários igual ao seu nível de Druida.\n\nEstatísticas de Jogo. Suas estatísticas de jogo são substituídas pelo bloco de estatísticas da Fera, mas você mantém seu tipo de criatura, Pontos de Vida, Dados de Vida, valores de Inteligência, Sabedoria e Carisma, características de classe, idiomas e talentos. Você também mantém suas proficiências em perícia e salvaguarda e usa seu Bônus de Proficiência para elas, além de adquirir as proficiências da criatura. Se uma perícia ou modificador de salvaguarda no bloco de estatísticas da Fera for maior que o seu, use o do bloco de estatísticas.\n\nSem Conjuração. Você não pode conjurar magias, mas a multimorfia não quebra sua Concentração ou interfere em uma magia que você já conjurou.\n\nObjetos. Sua capacidade de manipular objetos é determinada pelos membros da forma, e não pelos seus. Além disso, você escolhe se seu equipamento cai em seu espaço, se funde em sua nova forma ou se é usado por ela. O equipamento vestido funciona normalmente, mas o Mestre decide se é compatível para a nova forma usar um equipamento com base no tamanho e forma da criatura. Seu equipamento não muda de tamanho ou forma para corresponder à nova forma, e qualquer equipamento que a nova forma não possa usar deve cair no chão ou se fundir com a forma. O equipamento que se funde com a forma não tem efeito enquanto você estiver nessa forma."],["druida","",3,"Subclasse de Druida","Você adquire uma subclasse de Druida à sua escolha. As subclasses Círculo da Lua, Círculo da Terra, Círculo das Estrelas e Círculo do Mar são detalhadas a seguir neste capítulo. Uma subclasse é uma especialidade que lhe concede características em determinados níveis de Druida. Durante toda sua carreira, você recebe cada uma das características de sua subclasse que são de seu nível de Druida ou inferior."],["druida","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. Você adquire essa característica novamente nos níveis 8, 12 e 16 de Druida."],["druida","",5,"Ressurgimento Selvagem","Uma vez em cada um de seus turnos, se você não tiver mais usos de Forma Selvagem, pode recuperar um uso gastando um espaço de magia (nenhuma ação é necessária).\n\nAlém disso, você pode gastar um uso de Forma Selvagem (nenhuma ação é necessária) para recuperar um espaço de magia de 1º círculo, mas não pode fazê-lo novamente até completar um Descanso Longo."],["druida","",7,"Fúria Elemental","O poder dos elementos flui através de você. Você recebe uma das seguintes opções à sua escolha.\n\nAtaque Primal. Uma vez em cada um dos seus turnos, ao atingir uma criatura com uma jogada de ataque usando uma arma ou um ataque da forma Animal em Forma Selvagem, pode causar 1d8 pontos de dano Elétrico, Gélido, Ígneo ou Trovejante (à sua escolha quando você atinge) adicional ao alvo.\n\nConjuração Poderosa. Adicione seu modificador de Sabedoria ao dano causado com qualquer truque de Druida."],["druida","",15,"Fúria Elemental Aprimorada","A opção que você escolheu para Fúria Elemental fica mais poderosa, conforme detalhado abaixo.\n\nAtaque Primal. O dano adicional de seu Ataque Primal aumenta para 2d8.\n\nConjuração Poderosa. Ao conjurar um truque de Druida com um alcance de 3 metros ou mais, o alcance da magia aumenta para 90 metros."],["druida","",18,"Magias Bestiais","Ao usar Forma Selvagem, você pode conjurar magias na forma Animal, exceto magias que tenham um componente Material com um custo especificado ou que consuma seu componente Material."],["druida","",19,"Dádiva Épica","Você adquire o talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual se qualifica. Dádiva da Viagem Dimensional é recomendada."],["druida","",20,"Arquidruida","A vitalidade da natureza floresce constantemente dentro de você, concedendo-lhe os seguintes benefícios.\n\nForma Selvagem Eterna. Sempre que você joga Iniciativa e não tem mais usos de Forma Selvagem, você recupera um uso gasto dela.\n\nNatureza Xamânica. Você pode converter usos de Forma Selvagem em um espaço de magia (nenhuma ação é necessária). Escolha um número de seus usos não gastos de Forma Selvagem e transforme-os em um único espaço de magia, com cada uso contribuindo com espaços de magia de 2º círculo. Por exemplo, se você transformar dois usos de Forma Selvagem, você produz um espaço de magia de 4º círculo. Após usar este benefício, você não pode fazê-lo novamente até completar um Descanso Longo.\n\nLongevidade. A magia primitiva que você utiliza permite que você envelheça mais lentamente: para cada dez anos que passam, seu corpo envelhece apenas um."],["druida","Círculo da Lua",3,"Formas Animais dos Círculos Druídicos","Você pode canalizar a magia lunar ao assumir uma Forma Selvagem, obtendo os seguintes benefícios.\n\nNível de Desafio. O Nível de Desafio máximo para a forma é igual ao seu nível de Druida dividido por 3 (arredondado para baixo).\n\nClasse de Armadura. Até sair da forma, sua CA passa a ser 13 + seu modificador de Sabedoria, se esse valor for maior que a CA da Fera.\n\nPontos de Vida Temporários. Você adquire um número de Pontos de Vida Temporários igual a três vezes o seu nível de Druida."],["druida","Círculo da Lua",3,"Magias do Círculo da Lua","Ao atingir um nível de Druida detalhado na tabela Magias do Círculo da Lua, você tem a as magias da lista sempre preparadas.\n\nAlém disso, você pode conjurar as magias dessa característica enquanto estiver em uma Forma Selvagem."],["druida","Círculo da Lua",6,"Formas Animais dos Círculos Druídicos Aprimorada","Enquanto estiver em uma Forma Selvagem, você adquire os seguintes benefícios.\n\nRadiância Lunar. Cada um de seus ataques na Forma Selvagem pode causar seu tipo de dano normal ou dano Radiante. Você escolhe cada vez que acerta com esses ataques.\n\nVigor Aumentado. Você pode adicionar seu modificador de Sabedoria às suas salvaguardas de Constituição."],["druida","Círculo da Lua",10,"Passo Lunar","Você se transporta magicamente, reaparecendo em meio a uma explosão de luar. Como uma Ação Bônus, você se teleporta até 9 metros para um espaço desocupado à sua vista e tem Vantagem na próxima jogada de ataque que realizar antes do final deste turno.\n\nVocê pode usar essa característica um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo. Você também pode recuperar usos gastando um espaço de magia de 2º círculo ou superior para cada uso que deseja recuperar (nenhuma ação é necessária)."],["druida","Círculo da Lua",14,"Forma Lunar","O poder da lua permeia você, concedendo os seguintes benefícios.\n\nRadiância Lunar Aprimorada. Uma vez por turno, você pode causar 2d10 pontos de dano Radiante adicional a um alvo que você acerta com o ataque da Forma Selvagem.\n\nLuar Compartilhado. Sempre que usar Passo Lunar, você também pode teleportar uma criatura voluntária. Essa criatura deve estar a até 3 metros de você, e você a teleporta para um espaço desocupado à sua vista a até 3 metros do seu destino."],["druida","Círculo da Terra",3,"Auxílio da Terra","Como uma ação Usar Magia, você pode gastar um uso de sua Forma Selvagem e escolher um ponto a até 18 metros de você. Flores que concedem vitalidade e espinhos drenadores de vida surgem momentaneamente em uma Esfera de 3 metros de raio, centrada nesse ponto. Cada criatura à sua escolha na Esfera deve realizar uma salvaguarda de Constituição contra a CD para evitar sua magia, sofrendo 2d6 pontos de dano Necrótico se falhar ou metade desse dano em caso de sucesso. Uma criatura à sua escolha na área restaura 2d6 Pontos de Vida.\n\nO dano e cura aumentam em 1d6 quando você atinge o nível 10 (3d6) e 14 (4d6) de Druida."],["druida","Círculo da Terra",3,"Magias do Círculo da Terra","Sempre que completar um Descanso Longo, escolha um tipo de terreno: árido, polar, temperado ou tropical. Consulte a tabela abaixo correspondente ao tipo escolhido; você tem a lista de magias preparadas de seu nível de Druida e inferior."],["druida","Círculo da Terra",6,"Recuperação Natural","Você pode conjurar uma das magias de 1º círculo ou superior que preparou de sua característica Magias de Círculo Druídico sem gastar um espaço de magia, e deve completar um Descanso Longo antes de fazê-lo novamente.\n\nAlém disso, ao completar um Descanso Curto, pode escolher recuperar espaços de magia gastos. A somatória dos círculos desses espaços deve ser menor ou igual à metade do seu nível como Druida (arredondado para cima), e nenhum deles pode ser de 6º círculo ou superior. Por exemplo, se você for um Druida de nível 6, pode recuperar até três círculos de espaços de magia. Você pode recuperar um espaço de magia de 3º círculo, ou um de 2º círculo e um de 1º círculo, ou três de 1º círculo. Após recuperar espaços de magia com esta característica, você não pode fazê-lo novamente até completar um Descanso Longo."],["druida","Círculo da Terra",10,"Proteção Natural","Você é imune à condição Envenenado e tem Resistência a um tipo de dano associado à sua escolha atual de terreno na característica Magias de Círculo Druídico, conforme mostrado na tabela Proteção Natural."],["druida","Círculo da Terra",14,"Santuário Natural","Como uma ação Usar Magia, você pode gastar um uso de sua Forma Selvagem e produzir árvores e vinhas espectrais que aparecem em um Cubo de 4,5 metros de lados no chão a até 36 metros de você. Elas permanecem por 1 minuto ou até você morrer, ou ter a condição Incapacitado. Você e seus aliados têm Cobertura Parcial enquanto estiverem nessa área, e seus aliados adquirem a Resistência atual da sua Proteção Natural enquanto estão lá.\n\nComo uma Ação Bônus, você pode mover o Cubo até 18 metros para o chão a até 36 metros de você."],["druida","Círculo das Estrelas",3,"Forma Estrelada","Como uma Ação Bônus, você pode gastar um uso de sua característica Forma Selvagem para assumir uma forma estrelada em vez de multimorfar.\n\nEnquanto em sua forma estrelada, você mantém suas estatísticas de jogo, mas seu corpo se torna luminoso, com articulações que brilham como estrelas e linhas brilhantes conectando-as, como em um mapa estelar. Essa forma emite Luz Plena em um raio de 3 metros e Meia-luz por mais 3 metros. A forma dura 10 minutos e encerra se você a dispensar (nenhuma ação é necessária), ter a condição Incapacitado ou se você usar essa característica novamente.\n\nSempre que você assumir sua forma estrelada, escolha qual das constelações a seguir brilha em seu corpo; sua escolha concede certos benefícios enquanto estiver na forma.\n\nArqueiro. Uma constelação de um arqueiro aparece em você. Ao ativar e nos turnos subsequentes como uma Ação Bônus, você pode realizar um ataque mágico à distância, disparando uma flecha luminosa que atinge uma criatura a até 18 metros. Em caso de acerto, o ataque causa 1d8 pontos de dano Radiante + seu modificador de Sabedoria.\n\nDragão. Uma constelação de um dragão sábio aparece em você. Quando realizar um teste de Inteligência ou Sabedoria, ou uma salvaguarda de Constituição para manter a Concentração, você trata um resultado 9 ou menor no d20 como um 10.\n\nTaça. Uma constelação de um cálice vivificante aparece em você. Sempre que você conjurar uma magia, usando um espaço de que restaure Pontos de Vida em uma criatura, você ou outra criatura a até 9 metros de você pode restaurar Pontos de Vida iguais a 1d8 + seu modificador de Sabedoria."],["druida","Círculo das Estrelas",3,"Mapa Estelar","Você cria um mapa estelar como parte de seus estudos celestiais. Ele é um objeto Minúsculo, e você pode usá-lo como Foco de Conjuração para suas magias de Druida. Você determina sua forma jogando na tabela Mapa Estelar ou escolhendo uma.\n\nEnquanto estiver segurando o mapa, você tem as magias Orientação e Raio Guia preparadas, e pode conjurar Raio Guia sem gastar um espaço de magia. Você pode conjurá-la dessa forma um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez), e restaura todos os usos gastos ao completar um Descanso Longo.\n\nSe você perder o mapa, pode realizar uma cerimônia de 1 hora para criar magicamente um substituto. Essa cerimônia pode ser realizada durante um Descanso Curto ou Longo e destrói o mapa anterior."],["druida","Círculo das Estrelas",6,"Presságio Cósmico","Sempre que você completar um Descanso Longo, pode consultar seu Mapa Estelar em busca de presságios e jogar um dado. Até completar o próximo Descanso Longo, você tem acesso a uma Reação especial com base no número que obteve:\n\nProsperidade (par) . Sempre que uma criatura à sua vista a até 9 metros de você realizar um Teste de D20, você pode executar uma Reação para jogar 1d6 e adicionar o resultado jogado ao total.\n\nInfortúnio (ímpar). Sempre que uma criatura à sua vista a até 9 metros de você realizar um Teste de D20, você pode executar uma Reação para jogar 1d6 e subtrair o resultado jogado do total.\n\nVocê pode usar essa Reação um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo."],["druida","Círculo das Estrelas",10,"Constelações Cintilantes","As constelações da sua Forma Estrelada melhoram. O 1d8 do Arqueiro e da Taça torna-se 2d8, e enquanto o Dragão estiver ativo, você adquire um Deslocamento de Voo de 6 metros e pode pairar.\n\nAlém disso, no início de cada um dos seus turnos enquanto estiver na sua Forma Estrelada, você pode alterar qual constelação brilha em seu corpo."],["druida","Círculo das Estrelas",14,"Repleto de Estrelas","Enquanto estiver em sua Forma Estrelada, você se torna parcialmente incorpóreo e tem Resistência a dano Contundente, Cortante e Perfurante."],["druida","Círculo do Mar",3,"Ira do Mar","Como uma Ação Bônus, você pode gastar um uso da sua Forma Selvagem para manifestar uma Emanação de 1,5 metro, que toma a forma de respingos de água do oceano ao seu redor por 10 minutos. Ela se encerra caso você a disperse (nenhuma ação é necessária), manifeste-a novamente ou tenha a condição Incapacitado. Ao manifestar a Emanação e como uma Ação Bônus em seus turnos subsequentes, você pode escolher outra criatura à sua vista na Emanação. O alvo deve ser bem-sucedido em uma salvaguarda de Constituição contra a sua CD para evitar magia ou sofre dano Gélido e, se a criatura for Grande ou menor, é empurrada até 4,5 metros para longe de você. Para determinar esse dano, jogue um número de d6s igual ao seu modificador de Sabedoria (mínimo de um dado)."],["druida","Círculo do Mar",3,"Magias do Círculo do Mar","Ao atingir um nível de Druida detalhado na tabela Magias do Círculo do Mar, você tem a as magias da lista sempre preparadas."],["druida","Círculo do Mar",6,"Afinidade Aquática","O tamanho da Emanação criada pela sua Ira do Mar aumenta para 3 metros.\n\nAlém disso, você adquire um Deslocamento de Natação igual ao seu Deslocamento."],["druida","Círculo do Mar",10,"Filho da Tempestade","Sua Ira do Mar confere dois benefícios adicionais enquanto estiver ativa, conforme detalhado abaixo.\n\nVoo. Você adquire um Deslocamento de Voo igual ao seu Deslocamento.\n\nResistência. Você tem Resistência a dano Elétrico, Gélido e Trovejante."],["druida","Círculo do Mar",14,"Manifestação Oceânica","Em vez de manifestar a Emanação da Ira do Mar ao seu redor, você pode manifestá-la ao redor de uma criatura voluntária a até 18 metros de você. Essa criatura adquire todos os benefícios da Emanação, usando sua CD para evitar magia e seu modificador de Sabedoria.\n\nAlém disso, você pode manifestar a Emanação ao redor de si mesmo e da outra criatura ao gastar dois usos da sua Forma Selvagem, em vez de um, ao manifestá-la. Um Magista Deslumbrante Repleto de Magia Inata s Feiticeiros possuem uma magia inata, que é intrínseca a eles. Alguns não conseguem identificar a fonte de seu poder, enquanto outros a conectam a eventos peculiares em sua história pessoal ou familiar, como a bênção de um dragão ou dríade ao nascer, ou um relâmpago que cai em um dia claro. A origem pode ainda ser um presente de uma divindade, a exposição a magias de outros planos de existência ou uma compreensão do funcionamento da realidade. Independentemente da origem, isso resulta em uma marca permanente no Feiticeiro, uma magia turbulenta que pode ser transmitida por gerações. Feiticeiros não aprendem magia; a essência dessa força faz parte deles. Sua habilidade principal é aprender a canalizar essa magia inata, possibilitando descobertas novas e surpreendentes sobre o seu poder. À medida que dominam essa magia, os feiticeiros se conectam mais à sua origem, desenvolvendo habilidades únicas que refletem essa fonte.\n\nFeiticeiros são raros. Algumas linhagens familiares geram apenas um Feiticeiro por geração, enquanto, geralmente, esse dom aparece de forma inesperada. Aqueles que possuem esse poder logo percebem que não conseguem ficar ociosos. A magia de um Feiticeiro anseia por ser utilizada."],["feiticeiro","",1,"Conjuração","Através da sua magia inata, você pode conjurar magias. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras com magias de Feiticeiro, que aparecem na lista de magias de Feiticeiro mais adiante na descrição da classe.\n\nTruques. Você conhece quatro truques de Feiticeiro à sua escolha. Explosão Elemental , Luz, Prestidigitação Arcana e Toque Chocante são recomendados. Ao alcançar um nível de Feiticeiro, você pode substituir um dos seus truques dessa característica por outro truque de Feiticeiro à sua escolha.\n\nAo atingir os níveis 4 e 10 de Feiticeiro, você aprende mais um truque de Feiticeiro à sua escolha, conforme detalhado na coluna Truques da tabela Características de Feiticeiro.\n\nEspaços de Magia. A tabela Características de Feiticeiro mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com essa característica. Para começar, escolha duas magias de Feiticeiro de 1º círculo. Detectar Magia e Mãos Flamejantes são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você atinge níveis de Feiticeiro, conforme mostrado na coluna Magias Preparadas da tabela Características de Feiticeiro. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Feiticeiro até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Feiticeiro de nível 3, sua lista de magias preparadas pode incluir seis magias de Feiticeiro de 1º ou 2º círculo em qualquer combinação.\n\nSe outra característica de Feiticeiro lhe concede magias sempre preparadas, elas não contam para o número de magias que você pode preparar com essa característica, mas ainda são consideradas magias de Feiticeiro para você.\n\nMudando Suas Magias Preparadas. Sempre que você obtém um nível de Feiticeiro, pode substituir uma magia em sua lista por outra magia de Feiticeiro para a qual você tem espaços de magia.\n\nAtributo de Conjuração. Carisma é seu atributo de conjuração para suas magias de Feiticeiro.\n\nFoco de Conjuração. Você pode usar um Foco Arcano como um Foco de Conjuração para suas magias de Feiticeiro."],["feiticeiro","",1,"Feitiçaria Inata","Um evento em seu passado deixou uma marca permanente em você, lhe infundindo magia latente. Como uma Ação Bônus, você pode liberar essa magia por 1 minuto, durante o qual você adquire os seguintes benefícios:\n\nA CD para evitar suas magias de Feiticeiro aumenta em 1.\n\nVocê tem Vantagem nas jogadas de ataque das magias de Feiticeiro que conjurar.\n\nVocê pode usar essa característica duas vezes e restaura todos os usos gastos ao completar um Descanso Longo."],["feiticeiro","",2,"Fonte de Magia","Você pode aproveitar a fonte de magia dentro de si. Essa fonte é representada por Pontos de Feitiçaria, que permitem que você crie uma variedade de efeitos mágicos.\n\nVocê tem 2 Pontos de Feitiçaria e adquire mais à medida que atinge níveis mais altos, conforme detalhado na coluna Pontos de Feitiçaria da tabela Características de Feiticeiro. Você não pode ter mais Pontos de Feitiçaria do que o número mostrado na tabela para o seu nível e restaura todos os Pontos de Feitiçaria gastos ao completar um Descanso Longo.\n\nVocê pode usar seus Pontos de Feitiçaria para abastecer as opções abaixo, juntamente com outras características, como Metamagia, que usam esses pontos.\n\nConvertendo Espaços de Magia em Pontos de Feitiça-\n\nria. Você pode gastar um espaço de magia para receber um número de Pontos de Feitiçaria igual ao círculo do espaço (nenhuma ação é necessária).\n\nCriando Espaços de Magia. Como uma Ação Bônus, você pode transformar Pontos de Feitiçaria não gastos em um espaço de magia. A tabela Criando Espaços de Magia mostra o custo de criar um espaço de magia de um determinado círculo e lista o nível mínimo de Feiticeiro que você deve ter para criar um espaço. Você pode criar um espaço de magia não superior ao 5º círculo.\n\nQualquer espaço de magia que você criar com essa característica desaparece ao completar um Descanso Longo."],["feiticeiro","",2,"Metamagia","Sua magia flui de dentro para fora, permitindo que você ajuste suas magias conforme necessário. Você adquire duas opções de Metamagia à sua escolha em “Opções de Metamagia”, que são apresentadas mais adiante na descrição desta classe. Essas opções podem ser usadas para modificar temporariamente as magias que conjura, consumindo a quantidade correspondente de Pontos de Feitiçaria.\n\nVocê pode usar apenas uma opção de Metamagia em uma magia ao conjurá-la, a menos que indicado de outra forma em uma dessas opções.\n\nAo atingir um nível de Feiticeiro, você pode substituir uma de suas opções de Metamagia por uma que não conhece. Você adquire mais duas opções no nível 10 de Feiticeiro e mais duas opções no nível 17 de Feiticeiro."],["feiticeiro","",3,"Subclasse de Feiticeiro","Você adquire uma subclasse de Feiticeiro à sua escolha. As subclasses Feitiçaria Aberrante, Feitiçaria Dracônica, Feitiçaria Mecânica, Feitiçaria Selvagem estão detalhadas após a descrição desta classe. Uma subclasse é uma especialidade que concede a você características em determinados níveis de Feiticeiro. Durante toda sua jornada, você adquire cada uma das características de sua subclasse de seu nível de Feiticeiro ou menor."],["feiticeiro","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. Você adquire essa característica novamente nos níveis 8, 12 e 16 de Feiticeiro."],["feiticeiro","",5,"Restauração Feiticeira","Ao completar um Descanso Curto, você pode recuperar os Pontos de Feitiçaria gastos, mas não mais do que um número igual à metade do seu nível de Feiticeiro (arredondado para baixo). Você só pode usar esta característica novamente após completar um Descanso Longo."],["feiticeiro","",7,"Feitiçaria Encarnada","Quando não houver mais usos de Feitiçaria Inata, você pode usá-la se gastar 2 Pontos de Feitiçaria ao executar a Ação Bônus para ativá-la.\n\nAlém disso, enquanto sua característica Feitiçaria Inata estiver ativa, você pode usar até duas de suas opções de Metamagia em cada magia conjurada."],["feiticeiro","",19,"Dádiva Épica","Você adquire o talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual se qualifica. Dádiva da Viagem Dimensional é recomendada."],["feiticeiro","",20,"Apoteose Arcana","Enquanto sua característica Feitiçaria Inata estiver ativa, você pode usar uma opção de Metamagia em cada um de seus turnos sem gastar Pontos de Feitiçaria com ela."],["feiticeiro","Feitiçaria Aberrante",3,"Fala Telepática","Você pode estabelecer comunicação telepática com outras criaturas. Como uma Ação Bônus, escolha uma criatura que esteja à sua vista e a até 9 metros de você. Você e a criatura escolhida podem se comunicar telepaticamente um com o outro enquanto vocês dois estão a um número de quilômetros um do outro igual 1,5 vezes o seu modificador de Carisma (mínimo de 1,5 quilômetro). Para se entender reciprocamente, cada um deve usar mentalmente um idioma que o outro conheça.\n\nA conexão telepática dura um número de minutos igual ao seu nível de Feiticeiro. Ele encerra mais cedo se você usar essa habilidade para se conectar com uma criatura diferente."],["feiticeiro","Feitiçaria Aberrante",3,"Magias Psiônicas","Ao atingir um nível de Feiticeiro detalhado na tabela Magias Psiônicas, você tem as magias listadas sempre preparadas."],["feiticeiro","Feitiçaria Aberrante",6,"Defesas Psíquicas","Você tem Resistência a dano Psíquico e Vantagem em salvaguardas para evitar ou encerrar as condições Amedrontado ou Enfeitiçado."],["feiticeiro","Feitiçaria Aberrante",6,"Feitiçaria Psiônica","Ao conjurar qualquer magia de 1º círculo ou superior com sua característica Magias Psiônicas, você pode conjurá-la gastando um espaço de magia normal ou gastando um número de Pontos de Feitiçaria igual ao círculo da magia. Se você conjurar a magia usando Pontos de Feitiçaria, ela não requer componentes Verbais ou Somáticos e não requer componentes Materiais, a menos que sejam consumidos pela magia ou tenham um custo detalhado nela."],["feiticeiro","Feitiçaria Aberrante",14,"Revelação em Carne","Você pode revelar a verdade oculta dentro de você. Como uma Ação Bônus, você pode gastar 1 Ponto de Feitiçaria ou mais para alterar magicamente seu corpo por 10 minutos. Para cada Ponto de Feitiçaria gasto, você adquire um dos seguintes benefícios à sua escolha, cujos efeitos duram até que a alteração termine.\n\nAdaptação Aquática. Você adquire Deslocamento de Natação igual ao dobro do seu Deslocamento e pode respirar debaixo d’água. Guelras crescem do seu pescoço ou se alargam atrás das orelhas e seus dedos ficam palmados ou você desenvolve cílios contorcidos.\n\nMovimento Vermiforme. Seu corpo, com qualquer equipamento que você esteja usando ou carregando, se torna viscoso e flexível. Você pode se mover por qualquer espaço tão estreito quanto 2,5 centímetros e pode gastar 1,5 metro de movimento para escapar de restrições não mágicas ou da condição Imobilizado.\n\nVer o Invisível. Você pode ver qualquer criatura Invisível a até 18 metros de você que não esteja atrás de Cobertura Total. Seus olhos também se tornam negros ou se transformam em filamentos sensoriais contorcidos.\n\nVoo Reluzente. Você adquire um Deslocamento de Voo igual ao seu Deslocamento e pode pairar. Durante o voo, sua pele brilha com muco ou luz sobrenatural."],["feiticeiro","Feitiçaria Aberrante",18,"Implosão de Distorção","Você pode liberar uma anomalia de deformação espacial. Como uma ação Usar Magia, você se teleporta para um espaço desocupado à sua vista a até 36 metros de distância de si. Imediatamente após desaparecer, cada criatura a até 9 metros do espaço abandonado deve realizar uma salvaguarda de Força contra a CD para evitar sua magia. Se falhar, a criatura sofre 3d10 pontos de dano Energético e é puxada para o espaço que você deixou, terminando no espaço desocupado mais próximo. Em caso de sucesso, a criatura sofre apenas metade do dano.\n\nVocê pode usar esta característica novamente após completar um Descanso Longo ou gastando 5 Pontos de Feitiçaria (nenhuma ação é necessária)."],["feiticeiro","Feitiçaria Dracônica",3,"Magias Dracônicas","Ao atingir um nível de Feiticeiro detalhado na tabela Magias Dracônicas, você tem as magias listadas sempre preparadas."],["feiticeiro","Feitiçaria Dracônica",3,"Resiliência Dracônica","A magia em seu corpo manifesta traços físicos da bênção dracônica. Seus Pontos de Vida máximos aumentam em 3, e aumentam em 1 sempre que você atinge outro nível de Feiticeiro.\n\nPartes da sua pele são cobertas por finas escamas reluzentes, semelhantes às de um dragão. Enquanto não estiver vestindo armadura, sua Classe de Armadura base é igual a 10 mais seus modificadores de Destreza e Carisma."],["feiticeiro","Feitiçaria Dracônica",6,"Afinidade Elemental","Sua magia dracônica tem relação com um tipo de dano associado a dragões. Escolha um desses tipos: Ácido, Elétrico, Gélido, Ígneo ou Venenoso.\n\nVocê tem Resistência a esse tipo de dano e ao conjurar uma magia que cause dano do tipo associado com a sua ancestralidade dracônica, pode adicionar seu modificador de Carisma a uma jogada de dano dessa magia."],["feiticeiro","Feitiçaria Dracônica",14,"Asas de Dragão","Como uma Ação Bônus, você pode fazer com que asas dracônicas apareçam em suas costas. As asas duram 1 hora ou até você encerrar este efeito (nenhuma ação é necessária). Pela duração, você tem um Deslocamento de Voo de 18 metros.\n\nVocê pode usar esta característica novamente após completar um Descanso Longo ou gastando 3 Pontos de Feitiçaria (nenhuma ação é necessária) para restaurar seu uso."],["feiticeiro","Feitiçaria Dracônica",18,"Companheiro Dracônico","Você pode conjurar Invocar Dragão sem um componente Material. Além disso, pode conjurá-la uma vez sem gastar um espaço de magia, recuperando a capacidade de conjurá-la deste modo ao completar um Descanso Longo.\n\nAo começar a conjurar a magia, você pode modificá-la para não exigir Concentração e a duração da magia se torna 1 minuto para esta conjuração."],["feiticeiro","Feitiçaria Mecânica",3,"Magias Mecânicas","Ao atingir um nível de Feiticeiro detalhado na tabela Magias Mecânicas, você tem as magias listadas sempre preparadas.\n\nAlém disso, consulte a tabela Manifestações da Ordem e escolha ou determine aleatoriamente a maneira como sua conexão com a ordem se manifesta enquanto você conjura suas magias de Feiticeiro."],["feiticeiro","Feitiçaria Mecânica",3,"Restaurar Equilíbrio","Sua conexão com o plano de ordem absoluta permite equalizar momentos caóticos. Quando uma criatura à sua vista a até 18 metros de você estiver prestes a jogar um d20 com Vantagem ou Desvantagem, você pode executar uma Reação para evitar que o teste seja afetado por Vantagem e Desvantagem.\n\nVocê pode usar essa característica um número de vezes igual ao seu modificador de Carisma (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo."],["feiticeiro","Feitiçaria Mecânica",6,"Bastião da Lei","Você pode acessar a grande equação da existência para imbuir uma criatura com um escudo cintilante de ordem. Como uma ação Usar Magia, você pode gastar de 1 a 5 Pontos de Feitiçaria para criar uma proteção mágica ao seu redor ou de outra criatura à sua vista a até 9 metros de você. A proteção é representada por um número de d8s igual ao número de Pontos de Feitiçaria gastos para criá-la. Quando a criatura protegida sofre dano, ela pode gastar um número desses dados, jogá-los e reduzir o dano sofrido pelo resultado desses dados. A proteção dura até você completar um Descanso Longo ou até usar esta característica novamente."],["feiticeiro","Feitiçaria Mecânica",14,"Transe da Ordem","Você adquire a capacidade de alinhar sua consciência com os infinitos cálculos de Mecânos. Como uma Ação Bônus, você pode entrar neste estado por 1 minuto. Pela duração, as jogadas de ataque contra você não podem se beneficiar de Vantagem e sempre que você realizar um Teste de D20, você pode tratar um resultado de 9 ou menor no d20 como um 10.\n\nVocê pode usar esta característica novamente após completar um Descanso Longo ou gastando 5 Pontos de Feitiçaria (nenhuma ação é necessária) para restaurar seu uso."],["feiticeiro","Feitiçaria Mecânica",18,"Cavalgada Mecânica","Você invoca momentaneamente espíritos de ordem para eliminar a desordem ao seu redor. Como uma ação Usar Magia, você convoca os espíritos em um Cubo de 9 metros de lado originado em você. Os espíritos se parecem com modrons ou outros Construtos à sua escolha. Os espíritos são intangíveis e invulneráveis e criam os efeitos a seguir no Cubo antes de desaparecerem. Você pode executar esta ação novamente após completar um Descanso Longo ou gastando 7 Pontos de Feitiçaria (nenhuma ação é necessária) para restaurar seu uso.\n\nCura. Os espíritos restauram até 100 Pontos de Vida, divididos conforme você escolher entre qualquer número de criaturas à sua escolha no Cubo.\n\nDissipar. Cada magia de 6º círculo ou inferior encerra em criaturas e objetos à sua escolha no Cubo.\n\nReparar. Quaisquer objetos danificados inteiramente no Cubo são reparados instantaneamente."],["feiticeiro","Feitiçaria Selvagem",3,"Marés do Caos","Você pode manipular o caos para garantir Vantagem em um Teste de D20 à sua escolha antes de jogá-lo. Após utilizar esta característica, você deve conjurar uma magia de Feiticeiro com um espaço de magia ou concluir um Descanso Longo para recuperá-la.\n\nAlém disso, ao conjurar uma magia de Feiticeiro utilizando um espaço de magia antes de concluir um Descanso Longo, ocorre automaticamente um Surto de Magia Selvagem, e sua capacidade de usar esta característica é recarregada."],["feiticeiro","Feitiçaria Selvagem",3,"Surto de Magia Selvagem","Sua conjuração pode desencadear surtos de magia incontrolável. Uma vez por turno, você pode jogar 1d20 imediatamente após conjurar uma magia de Feiticeiro com um espaço de magia. Se o resultado for 20, jogue na tabela Surto de Magia Selvagem para criar um efeito mágico.\n\nSe o efeito mágico for uma magia, ele é selvagem demais para ser afetado por sua Metamagia."],["feiticeiro","Feitiçaria Selvagem",6,"Distorcer a Sorte","Você consegue distorcer o destino usando sua magia selvagem. Imediatamente após outra criatura à sua vista jogar o d20 para um Teste de D20, você pode executar uma Reação e gastar 1 Ponto de Feitiçaria para jogar 1d4 e aplicar o resultado jogado como bônus ou penalidade (à sua escolha) no teste de d20."],["feiticeiro","Feitiçaria Selvagem",14,"Caos Controlado","Você adquire um pequeno controle sobre seus surtos de magia selvagem. Ao jogar na tabela Surto de Magia Selvagem, você pode jogar duas vezes e usar qualquer um dos resultados."],["feiticeiro","Feitiçaria Selvagem",18,"Surto Controlado","Imediatamente após conjurar uma magia Feiticeiro com um espaço de magia, você pode criar um efeito à sua escolha da tabela Surto de Magia Selvagem em vez de jogar na tabela. Você pode escolher qualquer efeito na tabela, exceto a linha final e se o efeito escolhido envolver uma jogada, você deve realizá-la.\n\nVocê pode usar esta característica novamente após completar um Descanso Longo.\n\nUm Combatente Errante Imbuído de Magia Primitiva onge das cidades movimentadas, os Guar diões exercem sua vigilância interminável nos ermos, entre árvores de florestas sem trilhas e amplas planícies. Os guardiões, assim como os predadores, aprendem a rastrear sua presa, movendo-se furtivamente pelas florestas e escondendo-se em arbustos e escombros.\n\nGraças à sua conexão com a natureza, os Guardiões podem conjurar magias que utilizam os poderes primordiais da terra. Suas aptidões e magias são aprimoradas por um foco mortal para proteger o mundo da devastação causada por monstros e tiranos."],["guardiao","",1,"Conjuração","Você aprendeu a canalizar a essência mágica da natureza para conjurar magias. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras com as magias de Guardião, explicadas na lista de magias de Guardião mais adiante na descrição da classe.\n\nEspaços de Magia. A tabela Características de Guardião mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com esta característica. Para começar, escolha duas magias de Guardião de 1º círculo. Curar Ferimentos e Golpe Constritor são recomendadas.\n\n- O número de magias em sua lista aumenta à medida que você atinge níveis de Guardião, conforme mostrado na coluna Magias Preparadas da tabela Características de Guardião. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Guardião até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Guardião de nível 5, sua lista de magias preparadas pode incluir seis magias de Guardião de 1º ou 2º círculo em qualquer combinação.\n\nSe outra característica de Guardião lhe der magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas essas magias, de outra forma, contam como magias de Guardião para você.\n\nMudando Suas Magias Preparadas. Sempre que completar um Descanso Longo, você pode substituir uma magia em sua lista por outra magia de Guardião para a qual você tem espaços de magia.\n\nAtributo de Conjuração. Sabedoria é seu atributo de conjuração para suas magias de Guardião.\n\nFoco de Conjuração. Você pode usar um Foco Druídico como um Foco de Conjuração para suas magias de Guardião."],["guardiao","",1,"Inimigo Favorito","Você sempre tem a magia Marca do Predador preparada. Você pode conjurá-la duas vezes sem gastar um espaço de magia, e você restaura todos os usos gastos desta característica ao completar um Descanso Longo. O número de vezes que você pode conjurar a magia sem um espaço de magia aumenta ao atingir certos níveis de Guardião, conforme mostrado na coluna Inimigo Favorito da tabela Características de Guardião."],["guardiao","",1,"Maestria em Arma","Seu treinamento com armas permite que você use as propriedades de maestria de dois tipos de armas à sua escolha com as quais você tem proficiência, como Arcos Longos e Espadas Curtas.\n\nSempre que completar um Descanso Longo, você pode alterar os tipos de armas que escolheu. Por exemplo, você pode mudar para usar as propriedades de maestria de Cimitarras e Espadas Longas."],["guardiao","",2,"Estilo de Luta","Você adquire um talento Estilo de Luta à sua escolha (veja também o capítulo 5). Em vez de escolher um desses talentos, você pode escolher a opção abaixo.\n\nCombatente Druídico. Você aprende dois truques de Druida à sua escolha. Fagulha Estelar e Orientação são recomendados. Os truques escolhidos contam como magias de Guardião para você, e Sabedoria é seu atributo de conjuração para eles. Sempre que você atingir um nível de Guardião, pode substituir um desses truques por outro truque de Druida."],["guardiao","",2,"Explorador Hábil","Graças às suas viagens, você adquire os seguintes benefícios.\n\nEspecialista. Escolha uma perícia na qual você tenha proficiência, mas não seja Especialista. Você obtém Especialização nessa perícia.\n\nIdiomas. Você conhece dois idiomas à sua escolha da tabela de idiomas no capítulo 2."],["guardiao","",3,"Subclasse de Guardião","Você adquire uma subclasse de Guardião à sua escolha. As subclasses Andarilho Feérico, Caçador, Senhor das Feras e Vigilante das Sombras estão detalhadas após a descrição desta classe. Uma subclasse é uma especialidade que concede a você características em determinados níveis de Guardião. Durante toda sua jornada, você adquire cada uma das características de sua subclasse de seu nível de Guardião ou menor."],["guardiao","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. Você adquire essa característica novamente nos níveis 8, 12 e 16 de Guardião."],["guardiao","",5,"Ataque Extra","Você pode atacar duas vezes, em vez de uma, sempre que executar a ação Atacar no seu turno."],["guardiao","",6,"Errante","Seu Deslocamento aumenta em 3 metros enquanto você não estiver usando Armadura Pesada. Você também tem um Deslocamento de Escalada e um Deslocamento de Natação igual ao seu Deslocamento."],["guardiao","",9,"Especialista","Escolha duas perícias nas quais você tem proficiência, mas não seja Especialista. Você obtém Especialização nessas perícias."],["guardiao","",10,"Incansável","As forças primordiais agora ajudam a impulsioná-lo em suas jornadas, concedendo-lhe os seguintes benefícios.\n\nPontos de Vida Temporários. Como uma ação Usar Magia, você pode conceder a si um número de Pontos de Vida Temporários igual a 1d8 mais seu modificador de Sabedoria (mínimo de 1). Você pode usar essa ação um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo.\n\nRedução de Exaustão. Sempre que completar um Descanso Curto, seu nível de Exaustão, se houver, reduz em 1."],["guardiao","",13,"Predador Implacável","Sofrer dano não quebra sua Concentração da Marca do Predador ."],["guardiao","",14,"Véu da Natureza","Você invoca espíritos da natureza para se esconder magicamente. Como uma Ação Bônus, você pode conceder a si a condição Invisível até o final do seu próximo turno.\n\nVocê pode usar essa característica um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo."],["guardiao","",17,"Caçador Preciso","Você tem Vantagem em jogadas de ataque contra a criatura marcada pela sua Marca do Predador ."],["guardiao","",18,"Sentidos Selvagens","Sua conexão com as forças da natureza lhe concede Visão às Cegas com um alcance de 9 metros."],["guardiao","",19,"Dádiva Épica","Você adquire o talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual se qualifica. Dádiva da Viagem Dimensional é recomendada."],["guardiao","",20,"Matador de Inimigos Favoritos","O dado de dano da sua Marca do Predador é um d10 em vez de um d6."],["guardiao","Andarilho Feérico",3,"Glamour Transcendental","Sempre que você realiza um teste de Carisma, recebe um bônus no teste igual ao seu modificador de Sabedoria (mínimo de +1).\n\nVocê também adquire proficiência em uma dessas perícias à sua escolha: Atuação, Enganação ou Persuasão."],["guardiao","Andarilho Feérico",3,"Golpes Terríveis","Você pode potencializar seus golpes com arma com a magia traumatizante tirada dos cantos sombrios de Faéria. Uma vez por turno, ao atingir uma criatura com uma arma, você pode causar 1d4 pontos de dano Psíquico adicional ao alvo. O dano adicional aumenta para 1d6 quando você atinge o nível 11 de Guardião."],["guardiao","Andarilho Feérico",3,"Magias do Andarilho Feérico","Ao atingir um nível de Guardião detalhado na tabela Magias do Andarilho Feérico, você tem a lista de magias sempre preparadas.\n\nVocê também possui uma bênção feérica. Escolha-a na tabela de Dádivas de Faéria ou determine-a aleatoriamente."],["guardiao","Andarilho Feérico",7,"Detalhe Sedutor","A magia de Faéria protege sua mente. Você tem Vantagem nas salvaguardas para evitar ou encerrar a condição Amedrontado ou Enfeitiçado.\n\nAlém disso, sempre que você ou uma criatura à sua vista a até 36 metros de você for bem-sucedido em uma salvaguarda para evitar ou encerrar a condição Amedrontado ou Enfeitiçado, você pode executar uma Reação para forçar uma criatura diferente à sua vista a até 36 metros de você realizar uma salvaguarda de Sabedoria contra a CD para evitar sua magia. Se falhar, o alvo tem a condição Amedrontado ou Enfeitiçado (à sua escolha) por 1 minuto. O alvo repete a salvaguarda no final de cada um dos turnos dele, encerrando o efeito em si em caso de sucesso."],["guardiao","Andarilho Feérico",11,"Reforços Feéricos","Você pode conjurar a magia Convocar Feérico sem um componente Material. Você também pode conjurá-la uma vez sem um espaço de magia, e restaura a capacidade de conjurá-la deste modo ao completar um Descanso Longo.\n\nAo começar a conjurar a magia, você pode modificá-la para não exigir Concentração e a duração da magia se torna 1 minuto para esta conjuração."],["guardiao","Andarilho Feérico",15,"Andarilho Nebuloso","Você pode conjurar Passo Nebuloso sem gastar um espaço de magia. Você pode fazer isso um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo.\n\nAlém disso, sempre que você conjurar Passo Nebuloso pode levar junto uma criatura voluntária à sua vista a até 1,5 metro de você. Essa criatura se teleporta para um espaço desocupado à sua escolha a até 1,5 metro do seu destino."],["guardiao","Caçador",3,"Conhecimento do Caçador","Você pode recorrer às forças da natureza para revelar certos pontos fortes e fracos de sua presa. Enquanto uma criatura está marcada pela Marca do Predador , você sabe se essa criatura tem Imunidades, Resistências ou Vulnerabilidades, e se a criatura tiver alguma, você sabe quais são."],["guardiao","Caçador",3,"Presa do Caçador","Você recebe uma das seguintes opções de características à sua escolha. Ao completar um Descanso Curto ou Longo, você pode substituir a opção escolhida pela outra.\n\nAssassino de Colossos. Sua tenacidade pode derrubar até mesmo os inimigos mais poderosos. Ao atingir com arma uma criatura com os Pontos de Vida menor que o máximo, você causa 1d8 pontos de dano adicional. Você pode causar esse dano adicional apenas uma vez por turno.\n\nDestruidor de Hordas. Uma vez em cada um dos seus turnos, ao realizar um ataque com uma arma, você pode realizar outro ataque com a mesma arma contra uma criatura diferente que está a 1,5 metro do alvo original, que está dentro do alcance da arma e que você não atacou neste turno."],["guardiao","Caçador",7,"Táticas Defensivas","Você recebe uma das seguintes opções de características à sua escolha. Ao completar um Descanso Curto ou Longo, você pode substituir a opção escolhida pela outra.\n\nDefesa Contra Ataques Múltiplos. Ao ser atingido por uma criatura com uma jogada de ataque, essa criatura tem Desvantagem em todas as outras jogadas de ataque contra você neste turno.\n\nEscapar de Hordas. Ataques de Oportunidade têm Desvantagem contra você."],["guardiao","Caçador",11,"Presa do Caçador Superior","Uma vez por turno, ao causar dano a uma criatura marcada pela Marca do Predador , você também pode causar dano adicional dessa magia a uma criatura diferente à sua vista e a até 9 metros da primeira criatura."],["guardiao","Caçador",15,"Defesa do Caçador Superior","Ao sofrer dano, você pode executar uma Reação para conceder a si mesmo Resistência a esse dano e a qualquer outro dano do mesmo tipo até o final do turno atual."],["guardiao","Senhor das Feras",3,"Companheiro Primal","Você invoca magicamente uma fera primal, que extrai força de seu vínculo com a natureza. Escolha o bloco de estatísticas da fera: Fera da Terra , Fera do Céu ou Fera do Mar . Você também determina o tipo de animal, escolhendo um tipo apropriado para o bloco de estatísticas. Seja qual for a fera que você escolher, ela apresenta sinais primais que indicam a origem sobrenatural dela.\n\nA fera é Amigável a você e seus aliados e obedece aos seus comandos. Ela desaparece se você morrer.\n\nA Fera em Combate. Em combate, a fera age durante seu turno. Ela pode se mover e usar a própria Reação, embora a única ação padrão que ela executa é Esquivar, a menos que você use uma Ação Bônus para comandá-la a executar, execute uma ação do bloco de estatísticas dela ou alguma outra ação. Você também pode sacrificar um ataque ao executar a ação Atacar para ordenar a fera ae realizar a ação Golpe da Fera. Se você tem a condição Incapacitado, a fera age sozinha e não se restringe à ação Esquivar.\n\nRestaurar ou Substituir a Fera. Se a fera morreu na última hora, você pode executar uma ação Usar Magia para tocá-la e gastar um espaço de magia. A fera retorna à vida após 1 minuto com todos os Pontos de Vida restaurados.\n\nSempre que completar um Descanso Longo, você pode invocar uma Fera primal diferente, que aparece em um espaço desocupado a até 1,5 metro de você. Você escolhe o bloco de estatísticas e aparência dela. Se você já tem uma fera devido a esta característica, a antiga desaparece quando a nova surge."],["guardiao","Senhor das Feras",7,"Treinamento Excepcional","Ao executar uma Ação Bônus para ordenar sua fera Companheira Primal, você também pode ordená-la executar a ação Ajudar, Correr, Desengajar ou Esquivar usando a Ação Bônus dela.\n\nAlém disso, sempre que a fera acertar com uma jogada de ataque e causar dano, ela pode causar dano Energético ou o tipo de dano normal dela, à sua escolha."],["guardiao","Senhor das Feras",11,"Fúria Bestial","Ao ordenar sua fera Companheira Primal a executar a ação Golpe da Fera, ela pode usá-la duas vezes.\n\nAlém disso, na primeira vez em cada turno que ela atinge uma criatura sob o efeito da magia Marca do Predador , a fera causa dano Energético adicional igual ao dano bônus dessa magia."],["guardiao","Senhor das Feras",15,"Compartilhar Magias","Ao conjurar uma magia em si, você também pode afetar sua fera Companheira Primal com a magia se a Fera estiver a até 9 metros de você."],["guardiao","Vigilante das Sombras",3,"Emboscador das Sombras","Você dominou a arte de criar emboscadas temíveis, concedendo-lhe os seguintes benefícios.\n\nBônus de Iniciativa. Ao jogar Iniciativa, pode adicionar seu modificador de Sabedoria à jogada.\n\nGolpe Terrível. Ao atacar e atingir uma criatura com uma arma, você pode causar 2d6 pontos de dano Psíquico adicional. Você pode usar este benefício uma vez por turno e um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo.\n\nImpulso do Emboscador. No início do seu primeiro turno de cada combate, seu Deslocamento aumenta em 3 metros até o final deste turno."],["guardiao","Vigilante das Sombras",3,"Magias do Vigilante das Sombras","Ao atingir um nível de Guardião detalhado na tabela Magias do Vigilante das Sombras, você tem a lista de magias sempre preparadas."],["guardiao","Vigilante das Sombras",3,"Visão Umbrosa","Você adquire Visão no Escuro com um alcance de 18 metros. Se você já tem Visão no Escuro, o alcance aumenta em 18 metros.\n\nVocê também se torna capaz de escapar de criaturas que utilizem Visão no Escuro. Enquanto estiver inteiramente na Escuridão, você tem a condição Invisível para qualquer criatura que dependa da Visão no Escuro para vê-lo nessa Escuridão."],["guardiao","Vigilante das Sombras",7,"Mente de Ferro","Você desenvolveu a capacidade de resistir a poderes que alteram a mente. Você adquire proficiência em salvaguardas de Sabedoria. Se você já tem essa proficiência, adquire proficiência em salvaguardas de Carisma ou Inteligência (à sua escolha)."],["guardiao","Vigilante das Sombras",11,"Torrente do Vigilante","O dano psíquico do seu Golpe Terrível se torna 2d8. Além disso, ao usar o efeito Golpe Terrível da sua característica Emboscador das Sombras, você pode causar um dos seguintes efeitos adicionais.\n\nGolpe Repentino. Você pode realizar outro ataque com a mesma arma contra uma criatura diferente que esteja a até 1,5 metro do alvo original e que esteja dentro do alcance da arma.\n\nMedo em Massa. O alvo e cada criatura a até 3 metros dele deve realizar uma salvaguarda de Sabedoria contra a CD para evitar sua magia. Ao falhar, uma criatura tem a condição Amedrontado até o início do seu próximo turno."],["guardiao","Vigilante das Sombras",15,"Esquiva Sombria","Quando uma criatura realiza uma jogada de ataque contra você, você pode executar uma Reação para impor Desvantagem nessa jogada. Se o ataque acertar ou errar, você pode se teleportar até 9 metros para um espaço desocupado à sua vista.\n\nUm Mestre de Todas as Armas e Armaduras uerreiros dominam inúmeros campos de batalha. Cavaleiros em busca de glória, campeões reais, soldados de elite e mercenários experientes — como Guerreiros, todos compartilham uma competência incomparável com armas e armaduras. Eles conhecem bem a morte, tanto ao infligi-la quanto ao desafiá-la.\n\nGuerreiros dominam várias técnicas de combate com armas, e um Guerreiro bem equipado sempre tem a ferramenta certa para qualquer situação de combate. Da mesma forma, um Guerreiro é perito com todos os tipos de armadura. Além dessa familiaridade básica, cada Guerreiro se distingue em certos estilos de combate. Alguns se concentram na arquearia, outros no combate com duas armas e outros em aumentar suas habilidades marciais com magia. Essa combinação de habilidades amplas e especializações extensas torna os Guerreiros combatentes superiores."],["guerreiro","",1,"Estilo de Luta","Você aprimorou suas proezas marciais e tem um talento de Estilo de Luta à sua escolha (veja também o capítulo 5).\n\nSempre que atinge um nível de Guerreiro, você pode substituir o talento que escolheu por um talento diferente de Estilo de Luta."],["guerreiro","",1,"Maestria em Arma","Seu treinamento com armas permite que você utilize as propriedades de maestria com três tipos de armas Simples ou Marciais à sua escolha. Sempre que completar um Descanso Longo, você pode praticar movimentos com armas e alterar uma dessas escolhas de armas. Ao alcançar certos níveis de Guerreiro, você adquire a habilidade de usar as propriedades de maestria de mais tipos de armas, conforme mostrado na coluna Maestria em Armas da tabela Características de Guerreiro."],["guerreiro","",1,"Recuperar Fôlego","Você tem uma reserva limitada de resistência física e mental que pode usar. Como uma Ação Bônus, você pode usá-la para recuperar Pontos de Vida iguais a 1d10 mais seu nível de Guerreiro.\n\nVocê pode usar essa característica duas vezes. Você recupera um uso gasto quando completa um Descanso Curto e restaura todos os usos gastos quando completa um Descanso Longo.\n\nAo atingir certos níveis de Guerreiro, você adquire mais usos dessa característica, conforme mostrado na coluna Recuperar Fôlego da tabela Características de Guerreiro."],["guerreiro","",2,"Mente Tática","Você tem uma mente para táticas dentro e fora do campo de batalha. Ao falhar em um teste de atributo, você pode gastar um uso de seu Recuperar Fôlego para tentar alcançar a vitória. Em vez de recuperar Pontos de Vida, você joga 1d10 e adiciona o resultado ao teste de atributo, potencialmente transformando-o em sucesso. Se o teste ainda assim falhar, esse uso do Recuperar Fôlego não é gasto."],["guerreiro","",2,"Surto de Ação","Você pode se esforçar além de seus limites normais por um momento. No seu turno, você pode executar uma ação adicional, exceto a ação Usar Magia.\n\nApós usar esta característica, você não pode usá-la novamente até completar um Descanso Curto ou Longo. A partir do nível 17, você pode usá-lo duas vezes antes de um descanso, mas apenas uma vez em um turno."],["guerreiro","",3,"Subclasse de Guerreiro","Você adquire uma subclasse de Guerreiro à sua escolha. As subclasses Campeão, Cavaleiro Místico, Combatente Psíquico e Mestre da Batalha estão detalhadas após a descrição desta classe. Uma subclasse é uma especialidade que concede a você características em determinados níveis de Guerreiro. Pelo resto de sua jornada, você adquire cada uma das características de sua subclasse de seu nível de Guerreiro ou menor."],["guerreiro","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. Você adquire essa característica novamente nos níveis 6, 8, 12, 14 e 16 de Guerreiro."],["guerreiro","",5,"Ajuste Tático","Sempre que executar uma Ação Bônus para seu Recuperar Fôlego, você pode mover-se até metade do seu Deslocamento sem provocar Ataques de Oportunidade."],["guerreiro","",5,"Ataque Extra","Você pode atacar duas vezes, em vez de uma, sempre que executar a ação Atacar no seu turno."],["guerreiro","",9,"Indomável","Ao falhar em uma salvaguarda, você pode jogá-la novamente adicionando um bônus igual ao seu nível de Guerreiro. Você deve usar o novo resultado e não pode usar essa característica novamente até completar um Descanso Longo.\n\nA partir do nível 13, você pode usar essa característica duas vezes antes de um Descanso Longo e três vezes antes de um Descanso Longo ao atingir o nível 17."],["guerreiro","",9,"Mestre Tático","Ao atacar com uma arma cuja propriedade de maestria você pode usar, você pode substituir essa propriedade pela propriedade Empurrar, Drenar ou Lentidão para esse ataque."],["guerreiro","",11,"Dois Ataques Extras","Você pode atacar três vezes, em vez de uma, sempre que executar a ação Atacar no seu turno."],["guerreiro","",13,"Ataques Estudados","Você estuda seus oponentes e aprende com cada ataque que realiza. Se você realizar uma jogada de ataque contra uma criatura e errar, você tem Vantagem em sua próxima jogada de ataque contra essa criatura antes do final do seu próximo turno."],["guerreiro","",19,"Dádiva Épica","Você adquire o talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual se qualifica. Dádiva da Proeza em Combate é recomendada."],["guerreiro","",20,"Três Ataques Extras","Você pode atacar quatro vezes, em vez de uma, sempre que executar a ação Atacar no seu turno."],["guerreiro","Campeão",3,"Atleta Extraordinário","Graças ao seu atletismo, você tem Vantagem em jogadas de Iniciativa e testes de Força (Atletismo).\n\nAlém disso, imediatamente após obter um Acerto Crítico, você pode se mover até metade do seu Deslocamento sem provocar Ataques de Oportunidade."],["guerreiro","Campeão",3,"Crítico Aprimorado","Suas jogadas de ataque com armas e Ataques Desarmados obtém Acerto Crítico em jogadas com resultados 19 ou 20 no d20."],["guerreiro","Campeão",7,"Estilo de Luta Adicional","Você adquire outro talento de Estilo de Luta à sua escolha."],["guerreiro","Campeão",10,"Combatente Heroico","A emoção da batalha leva você à vitória. Durante o combate, você pode se conceder Inspiração Heroica sempre que começar seu turno sem ela."],["guerreiro","Campeão",15,"Crítico Superior","Suas jogadas de ataque com armas e Ataques Desarmados agora obtém Acerto Crítico em jogadas com resultados 18 a 20 no d20."],["guerreiro","Campeão",18,"Sobrevivente","Você atinge o auge da resiliência em batalha, concedendo-lhe os seguintes benefícios.\n\nDesafie a Morte. Você tem Vantagem em Salvaguardas Contra Morte. Além disso, ao obter um 18–20 em uma Salvaguarda Contra Morte, você obtém um 20 como resultado.\n\nRegeneração Heroica. No início de cada um dos seus turnos, você recupera Pontos de Vida iguais a 5 mais seu modificador de Constituição se estiver Sangrando e ter ao menos 1 Ponto de Vida."],["guerreiro","Cavaleiro Místico",3,"Conjuração","Você aprendeu a conjurar magias. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras como um Cavaleiro Místico.\n\nTruques. Você conhece dois truques à sua escolha da lista de magias de Mago (veja a seção desta classe para a lista de magias). Raio de Gelo e Toque Chocante são recomendados. Sempre que você atinge um nível de Guerreiro, pode substituir um desses truques por outro truque à sua escolha da lista de magias de Mago.\n\nAo atingir o nível 10 de Guerreiro, você aprende mais um truque de Mago à sua escolha.\n\nEspaços de Magia. A tabela Conjuração de Cavaleiro Místico apresenta quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você ao conjurar com essa característica. Para começar, escolha três magias de 1º círculo da lista de magias de Mago. Escudo Arcano , Mãos Flamejantes e Salto são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você atinge níveis de Guerreiro, conforme mostrado na coluna Magias Preparadas da tabela Conjuração de Cavaleiro Místico. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Mago até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Guerreiro de nível 7, sua lista de magias preparadas pode incluir cinco magias de Mago de 1º ou 2º círculo em qualquer combinação.\n\nMudando Suas Magias Preparadas. Sempre que você atinge um nível de Guerreiro, pode substituir uma magia em sua lista por outra magia de Mago para a qual você tem espaços de magia.\n\nAtributo de Conjuração. Inteligência é seu atributo de conjuração para suas magias de Mago.\n\nFoco de Conjuração. Você pode usar um Foco Arcano como um Foco de Conjuração para suas magias de Mago."],["guerreiro","Cavaleiro Místico",3,"Vínculo com Arma","Você aprende um ritual que cria um vínculo mágico entre você e uma arma. Você realiza o ritual ao longo de 1 hora, o que pode ser concluído durante um Descanso Curto. A arma deve estar ao seu alcance durante todo o ritual e, ao concluí-lo, você toca a arma e estabelece o vínculo. O vínculo falha se outro Guerreiro estiver ligado à arma ou se a arma for um item mágico com o qual outra pessoa está sintonizada.\n\nApós ter vinculado uma arma a si, ela não pode ser desarmada de você, a menos que você tenha a condição Incapacitado. Se ela estiver no mesmo plano de existência, você pode invocar essa arma como uma Ação Bônus, teleportando-a instantaneamente para sua mão. Você pode ter até dois vínculos com armas, mas pode invocar apenas uma de cada vez com uma Ação Bônus. Se você tentar se vincular com uma terceira arma, você deve quebrar o vínculo com uma das outras duas."],["guerreiro","Cavaleiro Místico",7,"Magia de Guerra","Ao executar a ação Atacar no seu turno, você pode substituir um dos ataques por uma conjuração de um de seus truques de Mago que tenha um tempo de conjuração de uma ação."],["guerreiro","Cavaleiro Místico",10,"Golpe Místico","Você aprende a usar seus ataques com armas para reduzir a resistência de uma criatura às suas magias. Ao atingir uma criatura com um ataque usando uma arma, essa criatura sofre Desvantagem na próxima salvaguarda que realizar contra uma magia que você conjurar antes do final do seu próximo turno."],["guerreiro","Cavaleiro Místico",15,"Investida Mística","Ao usar seu Surto de Ação, você pode se teleportar até 9 metros para um espaço desocupado à sua vista. Você pode se teleportar antes ou depois da ação adicional."],["guerreiro","Cavaleiro Místico",18,"Magia de Guerra Aprimorada","Ao executar a ação Atacar no seu turno, você pode substituir dois ataques pela conjuração de uma das suas magias de Mago de 1º ou 2º círculo que tenha um tempo de conjuração de uma ação."],["guerreiro","Combatente Psíquico",3,"Poder Psiônico","Você possui uma fonte de energia psiônica, representada pelos seus Dados de Energia Psiônica, que alimenta os poderes desta subclasse. A tabela Dados de Energia do Combatente Psíquico indica o tipo e a quantidade desses dados conforme você atinge certos níveis de Guerreiro.\n\nQualquer característica desta subclasse que utilize um Dado de Energia Psiônica emprega apenas os dados dessa subclasse. Alguns poderes consomem esse Dado, conforme detalhado na respectiva descrição, e você não pode usar um poder se ele exigir um dado e todos os seus Dados de Energia Psiônica estiverem esgotados.\n\nVocê recupera um de seus Dados de Energia Psiônica gastos ao completar um Descanso Curto, e restaura todos ao completar um Descanso Longo.\n\nGolpe Psiônico. Você pode impulsionar suas armas com força psiônica. Uma vez em cada um dos seus turnos, imediatamente ap
