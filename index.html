ós atingir um alvo a até 9 metros de você com um ataque e causar dano a ele com uma arma, você pode gastar um Dado de Energia Psiônica, jogá-lo e causar dano Energético ao alvo igual ao resultado obtido mais seu modificador de Inteligência.\n\nMovimento Telecinético. Você pode mover um objeto ou uma criatura com sua mente. Como uma ação Usar Magia, escolha um alvo à sua vista a até 9 metros de você; o alvo deve ser um objeto solto que seja Grande ou menor, ou uma criatura voluntária que não seja você. Você transporta o alvo até 9 metros para um espaço desocupado à sua vista. Como alternativa, se o alvo for um objeto Minúsculo, você pode transportá-lo de ou para sua mão.\n\nApós executar essa ação, você não pode fazer isso novamente até completar um Descanso Curto ou Longo, a menos que gaste um Dado de Energia Psiônica (nenhuma ação é necessária) para recuperar o uso.\n\nVínculo Protetivo. Quando você ou outra criatura à sua vista a até 9 metros de você sofrer dano, você pode executar uma Reação para gastar um Dado de Energia Psiônica, jogar o dado e reduzir o dano sofrido pelo resultado mais seu modificador de Inteligência (redução mínima de 1), enquanto cria um escudo momentâneo de força telecinética."],["guerreiro","Combatente Psíquico",7,"Adepto Telecinético","Você dominou novas maneiras de usar suas habilidades telecinéticas, detalhadas abaixo.\n\nEstocada Telecinética. Ao causar dano a um alvo com seu Golpe Psiônico, você pode forçá-lo a realizar uma salvaguarda de Força (CD 8 mais seu modificador de Inteligência e seu Bônus de Proficiência). Se falhar, você pode impor ao alvo a condição Caído ou transportá-lo horizontalmente até 3 metros.\n\nSalto com Impulsão Psíquica. Como uma Ação Bônus, você adquire um Deslocamento de Voo igual ao dobro do seu Deslocamento até o final do turno atual. Após executar essa Ação Bônus, você não pode fazer isso novamente até completar um Descanso Curto ou Longo, a menos que gaste um Dado de Energia Psiônica (nenhuma ação é necessária) para recuperar o uso."],["guerreiro","Combatente Psíquico",10,"Resguardo Mental","Você tem Resistência a Dano Psíquico. Além disso, ao iniciar seu turno com a condição Amedrontado ou Enfeitiçado, você pode gastar um Dado de Energia Psiônica (nenhuma ação é necessária) e encerrar todos os efeitos em você que lhe impõe essas condições."],["guerreiro","Combatente Psíquico",15,"Baluarte de Energia","Você pode proteger a si e aos outros com força telecinética. Como uma Ação Bônus, você pode escolher criaturas, incluindo você mesmo, a até 9 metros, até um número de criaturas igual ao seu modificador de Inteligência (mínimo de uma criatura). Cada uma das criaturas escolhidas tem Cobertura Parcial por 1 minuto ou até você ter a condição Incapacitado.\n\nApós usar essa característica, você não pode fazer isso novamente até completar um Descanso Longo, a menos que gaste um Dado de Energia Psiônica (nenhuma ação é necessária) para recuperar seu uso."],["guerreiro","Combatente Psíquico",18,"Mestre Telecinético","Você sempre tem a magia Telecinese preparada. Com esta característica, você pode conjurá-la sem um espaço de magia ou componentes, e seu atributo de conjuração para ela é a Inteligência. Em cada um dos seus turnos enquanto você mantém a Concentração nela, incluindo o turno quando a conjura, você pode realizar um ataque com arma como uma Ação Bônus.\n\nApós conjurar a magia por meio dessa característica, você não pode fazer isso deste modo até completar um Descanso Longo, a menos que gaste um Dado de Energia Psiônica (nenhuma ação é necessária) para recuperar o uso."],["guerreiro","Mestre da Batalha",3,"Estudioso da Guerra","Você adquire proficiência com um tipo de Ferramentas de Artesão à sua escolha e adquire proficiência em uma perícia à sua escolha das perícias disponíveis para Guerreiros no nível 1."],["guerreiro","Mestre da Batalha",3,"Superioridade em Combate","Sua experiência em combate aprimorou suas técnicas de luta, permitindo que você aprenda manobras com base em dados especiais chamados Dados de Superioridade.\n\nManobras. Você aprende três manobras à sua escolha na seção “Opções de Manobras” mais adiante na descrição desta subclasse. Muitas manobras aprimoram, de alguma forma, um ataque. Você pode usar apenas uma manobra por ataque.\n\nVocê aprende duas manobras adicionais à sua escolha quando atinge os níveis 7, 10 e 15 de Guerreiro. Cada vez que aprende novas manobras, você também pode substituir uma manobra que você conhece por uma diferente.\n\nDados de Superioridade. Você tem quatro Dados de Superioridade, os quais são d8s. Um Dado de Superioridade é gasto ao usá-lo. Você restaura todos os Dados de Superioridade gastos quando completa um Descanso Curto ou Longo.\n\nVocê adquire um Dado de Superioridade adicional ao atingir os níveis 7 (cinco dados no total) e 15 (seis dados no total) de Guerreiro.\n\nSalvaguardas. Se uma manobra exigir uma salvaguarda, a CD é igual a 8 mais seu modificador de Força ou Destreza (à sua escolha) e seu Bônus de Proficiência."],["guerreiro","Mestre da Batalha",7,"Conheça Seu Inimigo","Como uma Ação Bônus, você pode examinar certos pontos fortes e fracos de uma criatura à sua vista a até 9 metros de você; você sabe se essa criatura tem Imunidades, Resistências ou Vulnerabilidades, e se a criatura tiver alguma, você sabe quais são.\n\nApós usar essa característica, você não pode fazer isso novamente até completar um Descanso Longo. Você também pode recuperar um uso da característica gastando um Dado de Superioridade (nenhuma ação é necessária)."],["guerreiro","Mestre da Batalha",10,"Superioridade em Combate Aprimorada","Seu Dado de Superioridade se torna um d10."],["guerreiro","Mestre da Batalha",15,"Implacável","Uma vez por turno, ao usar uma manobra, você pode jogar 1d8 e usar o resultado em vez de gastar um Dado de Superioridade."],["guerreiro","Mestre da Batalha",18,"Superioridade em Combate Suprema","Seu Dado de Superioridade se torna um d12."],["ladino","",1,"Ataque Furtivo","Você sabe atacar sutilmente, explorando a distração do inimigo. Uma vez por turno, ao atingir uma criatura com uma jogada de ataque em que tem Vantagem com uma arma com Acuidade ou uma arma à Distância, você pode causar 1d6 pontos de dano adicional do tipo de dano da arma.\n\nVocê não precisa ter Vantagem na jogada de ataque se pelo menos um de seus aliados estiver a até 1,5 metro do alvo, e o aliado não tem a condição Incapacitado e você não tem Desvantagem na jogada de ataque. O dano adicional aumenta à medida que você adquire níveis de Ladino, conforme mostrado na coluna Ataque Furtivo da tabela Características de Ladino."],["ladino","",1,"Especialista","Você obtém Especialização (veja o glossário de regras) em duas de suas perícias, à sua escolha, nas quais já seja proficiente. Furtividade e Prestidigitação são recomendadas se você tiver proficiência nelas.\n\nNo nível 6 de Ladino, você obtém Especialização em mais duas perícias nas quais já seja proficiente à sua escolha."],["ladino","",1,"Gíria do Ladrão","Você aprendeu vários idiomas nas comunidades onde usou seus talentos gatunos. Você conhece a Gíria dos Ladrões e outro idioma à sua escolha, que você escolhe nas tabelas de idiomas no capítulo 2."],["ladino","",1,"Maestria em Arma","Seu treinamento com armas permite que você use as propriedades de maestria de dois tipos de armas à sua escolha com as quais você tem proficiência, como Adagas e Arcos Curtos.\n\nAo completar um Descanso Longo, você pode alterar os tipos de armas que escolheu. Por exemplo, você pode trocar para as propriedades de maestria de Cimitarras e Espadas Curtas."],["ladino","",2,"Ação Ardilosa","Seu pensamento rápido e agilidade permitem que você se mova e aja rapidamente. No seu turno, você pode executar uma das seguintes ações como uma Ação Bônus: Correr, Desengajar ou Esconder."],["ladino","",3,"Mira Firme","Como uma Ação Bônus, você concede a si mesmo Vantagem em sua próxima jogada de ataque no turno atual. Você pode usar esta característica somente se não tiver se movido durante este turno e, após usá-la, seu Deslocamento é 0 até o final do turno atual."],["ladino","",3,"Subclasse de Ladino","Você adquire uma subclasse de Ladino à sua escolha. As subclasses Adaga Espiritual, Assassino, Ladrão e Trapaceiro Arcano estão detalhadas após a descrição desta classe. Uma subclasse é uma especialidade que concede a você características em determinados níveis de Ladino. Durante toda sua jornada, você adquire cada uma das características de sua subclasse de seu nível de Ladino ou menor."],["ladino","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para o qual atende os pré-requisitos. Você adquire essa característica novamente nos níveis 8, 10, 12 e 16 de Ladino."],["ladino","",5,"Golpe Astuto","Você encontrou maneiras astutas de aplicar seu Ataque Furtivo. Ao causar dano com ele, você pode adicionar um dos seguintes efeitos de Golpe Astuto, cada um com um custo em dados que deve ser subtraído do dano total do Ataque Furtivo. Remova o dado antes de jogar, e o efeito ocorre imediatamente após o dano. Por exemplo, ao escolher o efeito Envenenar, retire 1d6 de dano do Ataque Furtivo antes de jogá-lo.\n\nSe um efeito de Golpe Astuto exigir uma salvaguarda, a CD é igual a 8 mais seu modificador de Destreza e Bônus de Proficiência.\n\nEnvenenar (Custo: 1d6). Você adiciona uma toxina ao seu ataque, forçando o alvo a realizar uma salvaguarda de Constituição. Se falhar, o alvo tem a condição Envenenado por 1 minuto. No final de cada um dos turnos do alvo Envenenado, ele repete a salvaguarda, encerrando o efeito em si em caso de sucesso.\n\nPara usar esse efeito, você deve ter um Kit de Veneno com você.\n\nRetirada (Custo: 1d6). Imediatamente após o ataque, você se move até metade do seu Deslocamento sem provocar Ataques de Oportunidade.\n\nTropeço (Custo: 1d6). Se o alvo for Grande ou menor, ele deve ser bem-sucedido em uma salvaguarda de Destreza ou tem a condição Caído."],["ladino","",5,"Esquiva Sobrenatural","Quando um atacante à sua vista o atinge com uma jogada de ataque, você pode executar uma Reação para reduzir o dano pela metade do ataque (arredondado para baixo)."],["ladino","",7,"Evasão","Você pode se esquivar com agilidade do caminho de certos perigos. Ao ser alvo de um efeito que permita uma salvaguarda de Destreza para receber apenas metade do dano, você não sofre dano se for bem-sucedido na salvaguarda e sofre apenas metade do dano se falhar. Você não pode usar esta característica se tem a condição Incapacitado."],["ladino","",7,"Talento Confiável","Ao realizar um teste de atributo que lhe permita adicionar seu bônus de proficiência em uma perícia ou ferramenta, você pode tratar uma jogada de d20 igual a 9 ou menos como se fosse 10."],["ladino","",11,"Golpe Astuto Aprimorado","Você pode usar até dois efeitos de Golpe Astuto ao causar dano de Ataque Furtivo, pagando o custo do dado por cada efeito."],["ladino","",14,"Golpes Sujos","Você praticou novas maneiras de usar seu Ataque Furtivo de forma engenhosa. Os seguintes efeitos agora estão entre suas opções de Golpe Astuto.\n\nAturdir (Custo: 2d6). O alvo deve ser bem-sucedido em uma salvaguarda de Constituição ou, no próximo turno, pode apenas se mover, executar uma ação ou uma Ação Bônus.\n\nNocaute (Custo: 6d6). O alvo deve ser bem-sucedido em uma salvaguarda de Constituição ou tem a condição Inconsciente por 1 minuto ou até sofrer qualquer dano. O alvo Inconsciente repete a salvaguarda no final de cada um dos turnos dele, encerrando o efeito em caso de sucesso.\n\nObscurecer (Custo: 3d6). O alvo deve ser bem-sucedido em uma salvaguarda de Destreza, ou tem a condição Cego até o final do próximo turno dele."],["ladino","",15,"Mente Escorregadia","Sua mente astuta é excepcionalmente difícil de controlar. Você adquire proficiência em salvaguardas de Sabedoria e Carisma."],["ladino","",18,"Elusivo","Você é tão evasivo que os atacantes raramente conseguem vantagem. Nenhuma jogada de ataque pode ter Vantagem contra você, a menos que você tenha a condição Incapacitado."],["ladino","",19,"Dádiva Épica","Você adquire o talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual se qualifica. A Dádiva do Espírito da Noite é recomendada."],["ladino","",20,"Golpe de Sorte","Você tem uma vocação maravilhosa para ter sucesso quando necessário. Se você falhar em um Teste de D20, pode transformar o resultado em um 20.\n\nApós usar essa característica, você não pode usá-la novamente até completar um Descanso Curto ou Longo."],["ladino","Adaga Espiritual",3,"Lâminas Psíquicas","Você pode manifestar lâminas cintilantes de energia psíquica. Ao executar a ação Atacar ou realizar um Ataque de Oportunidade, você pode manifestar uma Lâmina Psíquica em sua mão livre e atacar com essa lâmina. A lâmina mágica tem as seguintes características: A lâmina desaparece imediatamente após atingir ou errar o alvo, e não deixa marca se causar dano.\n\nApós atacar com a lâmina no seu turno, você pode realizar um ataque corpo a corpo ou à distância com uma segunda lâmina psíquica como uma Ação Bônus no mesmo turno, se sua outra mão estiver livre para criá-la. O dado de dano deste ataque bônus é 1d4 em vez de 1d6."],["ladino","Adaga Espiritual",3,"Poder Psiônico","Você possui uma fonte de energia psiônica, representada pelos seus Dados de Energia Psiônica, que alimenta certos poderes desta subclasse. A tabela Dados de Energia do Adaga Espiritual indica o tipo e a quantidade desses dados conforme você atinge certos níveis de Ladino.\n\nQualquer característica desta subclasse que utilize um Dado de Energia Psiônica emprega apenas os dados dessa subclasse. Alguns poderes consomem esse Dado, conforme detalhado na respectiva descrição, e você não pode usar um poder se ele exigir um dado e todos os seus Dados de Energia Psiônica estiverem esgotados.\n\nVocê recupera um de seus Dados de Energia Psiônica gastos ao completar um Descanso Curto, e restaura todos ao completar um Descanso Longo.\n\nAptidão Reforçada Psiquicamente. Ao falhar em um teste de atributo usando uma perícia ou ferramenta com a qual você tem proficiência, você pode jogar um Dado de Energia Psiônica e adicionar o resultado do teste, transformando potencialmente a falha em sucesso. O dado é gasto apenas se o teste for bem-sucedido.\n\nSussurros Psíquicos. Você pode estabelecer comunicação telepática com outras criaturas. Como uma ação Usar Magia, escolha até um número de criaturas igual ao seu Bônus de Proficiência que estejam à vista e jogue um Dado de Energia Psiônica. Por um número de horas igual ao resultado, essas criaturas podem se comunicar telepaticamente com você e vice-versa. Para enviar ou receber mensagens (nenhuma ação é necessária), você e a outra criatura devem estar a até 1,5 km de distância. Qualquer criatura pode encerrar a conexão telepática a qualquer momento (nenhuma ação é necessária).\n\nNa primeira vez que você usa este poder após um Descanso Longo, não gasta o Dado de Energia Psiônica; nas demais vezes, você o gasta."],["ladino","Adaga Espiritual",9,"Lâminas da Alma","Agora você pode usar os seguintes poderes com suas Lâminas Psíquicas.\n\nGolpes Teleguiados. Ao realizar uma jogada de ataque com sua Lâmina Psíquica e errar o alvo, você pode jogar um Dado de Energia Psiônica e adicionar o resultado jogado à jogada de ataque. Caso o ataque atinja devido a este bônus, o dado é gasto.\n\nTeleporte Psíquico. Como uma Ação Bônus, você manifesta uma Lâmina Psíquica, gasta um dado de Energia Psíquica e o joga, então arremessa a lâmina em um espaço desocupado à sua vista e a até uma distância em metros igual a 3 vezes o resultado do dado. Você então se teleporta para esse espaço, e a lâmina desaparece."],["ladino","Adaga Espiritual",13,"Véu Psíquico","Você pode tecer um véu de estática psíquica para se mascarar. Como uma ação Usar Magia, você tem a condição Invisível por 1 hora ou até encerrar este efeito (nenhuma ação é necessária). Essa invisibilidade encerra se você causar dano a uma criatura ou forçar uma criatura a realizar uma salvaguarda.\n\nVocê pode usar esta característica novamente gastando um Dado de Energia Psiônica (nenhuma ação é necessária) ou após completar um Descanso Longo."],["ladino","Adaga Espiritual",17,"Rasgar Mente","Você pode passar suas Lâminas Psíquicas diretamente pela mente de uma criatura. Ao causar dano de Ataque Furtivo com uma das suas Lâminas Psíquicas a uma criatura, você pode forçá-la a realizar uma salvaguarda de Sabedoria (CD 8 + seu modificador de Destreza + seu Bônus de Proficiência). O alvo tem a condição Atordoado por 1 minuto se falhar, e repete a salvaguarda no final de cada um dos turnos dele, encerrando o efeito sobre si em caso de sucesso.\n\nVocê pode usar esta característica novamente gastando três Dados de Energia Psiônica (nenhuma ação é necessária) ou após completar um Descanso Longo."],["ladino","Assassino",3,"Assassinar","Você é adepto de emboscar um alvo, concedendo-lhe os seguintes benefícios.\n\nIniciativa. Você tem Vantagem nas jogadas de Iniciativa.\n\nGolpe Surpreendente. Durante a primeira rodada de cada combate, você tem Vantagem em jogadas de ataque contra qualquer criatura que não tenha realizado o turno. Caso seu Ataque Furtivo atinja qualquer alvo na rodada, o alvo sofre dano adicional do tipo da arma igual ao seu nível de Ladino."],["ladino","Assassino",3,"Ferramentas de Assassino","Você adquire um Kit de Disfarce e um Kit de Veneno, e tem proficiência com eles."],["ladino","Assassino",9,"Especialista em Infiltração","Você é especialista nas seguintes técnicas que auxiliam suas infiltrações.\n\nMimetismo Magistral. Você pode imitar perfeitamente a fala, a caligrafia ou ambos de outra pessoa se tiver passado pelo menos 1 hora estudando-os.\n\nMira Móvel. Ao usar Mira Firme, seu Deslocamento não é reduzido a 0."],["ladino","Assassino",13,"Armas Venenosas","Ao usar a opção Envenenar do seu Golpe Astuto, o alvo também sofre 2d6 pontos de dano Venenoso sempre que falhar na salvaguarda. Este dano ignora Resistência a dano Venenoso."],["ladino","Assassino",17,"Golpe Mortal","Ao acertar com seu Ataque Furtivo na primeira rodada de um combate, o alvo deve ser bem-sucedido em uma salvaguarda de Constituição (CD 8 mais seu modificador de Destreza e seu Bônus de Proficiência) ou o dano do ataque é dobrado contra o alvo."],["ladino","Ladrão",3,"Andarilho de Telhados","Você treinou para entrar em lugares especialmente difíceis de alcançar, concedendo-lhe esses benefícios.\n\nEscalador. Você adquire um Deslocamento de Escalada igual ao seu Deslocamento.\n\nSaltador. Você pode determinar sua distância de salto usando sua Destreza em vez de sua Força."],["ladino","Ladrão",3,"Mão Leve","Como uma Ação Bônus, você pode executar uma das seguintes coisas.\n\nPrestidigitação. Realize um teste de Destreza (Prestidigitação) para abrir uma fechadura ou desarmar uma armadilha com Ferramentas de Ladrão, ou para roubar um bolso.\n\nUsar Objeto. Execute a ação Usar Objeto ou a ação Usar Magia para utilizar um item mágico que exija essa ação."],["ladino","Ladrão",9,"Furtividade Suprema","Você adquire a seguinte opção de Golpe Astuto.\n\nAtaque Escondido (Custo: 1d6). Se você tem a condição Invisível da ação Esconder, este ataque não encerra essa condição se você encerrar seu turno atrás da Cobertura de Três Quartos ou Cobertura Total."],["ladino","Ladrão",13,"Usar Dispositivo Mágico","Você aprendeu a maximizar o uso de itens mágicos, concedendo-lhe os seguintes benefícios.\n\nSintonização. Você pode sintonizar até quatro itens mágicos ao mesmo tempo.\n\nCargas. Sempre que você usar uma propriedade de item mágico que gaste cargas, jogue 1d6. Em um resultado de 6, você usa a propriedade sem gastar as cargas.\n\nPergaminhos. Você pode usar qualquer Pergaminho Mágico usando Inteligência como seu atributo de conjuração para a magia. Se a magia for um truque ou uma magia de 1º círculo, você pode conjurá-la de forma confiável. Se o pergaminho possuir uma magia de círculo superior, você deve primeiro ser bem-sucedido em um teste de Inteligência (Arcanismo) (CD 10 mais o círculo da magia). Em caso de sucesso, você conjura a magia do pergaminho. Se falhar, o pergaminho se desintegra."],["ladino","Ladrão",17,"Reflexos de Ladrão","Você é habilidoso em emboscadas e rápida fuga do perigo. Em combate, você realiza dois turnos na primeira rodada: o primeiro conforme sua Iniciativa normal e o segundo em sua Iniciativa menos 10."],["ladino","Trapaceiro Arcano",3,"Conjuração","Você aprendeu a conjurar magias. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras como um Trapaceiro Arcano.\n\nTruques. Você conhece três truques: Mãos Mágicas e dois outros truques à sua escolha da lista de magias de Mago (veja a seção desta classe para sua lista). Ilusão Menor e Talho Mental são recomendadas.\n\nAo alcançar um nível de Ladino, você pode substituir um dos seus truques, exceto Mãos Mágicas , por outro truque de Mago à sua escolha.\n\nAo atingir o nível 10 de Ladino, você aprende mais um truque de Mago à sua escolha.\n\nEspaços de Magia. A tabela Conjuração de Trapaceiro Arcano apresenta quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º Círculo ou superior que estão disponíveis para você conjurar com esta característica. Para começar, escolha três magias de Mago de 1º círculo. Disfarçar-se , Enfeitiçar Pessoa e Névoa Obscurecente são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você atinge níveis de Ladino, conforme mostrado na coluna Magias Preparadas da tabela Conjuração de Trapaceiro Arcano. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Mago até que o número de magias em sua lista corresponda ao número da tabela do Trapaceiro Arcano. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Ladino de nível 7, sua lista de magias preparadas pode incluir cinco magias de Mago de 1º ou 2º círculo em qualquer combinação.\n\nMudando Suas Magias Preparadas. Sempre que você atinge um nível de Ladino, pode substituir uma magia em sua lista por outra magia de Mago para a qual você tem espaços de magia.\n\nAtributo de Conjuração. Inteligência é seu atributo de conjuração para suas magias de Mago.\n\nFoco de Conjuração. Você pode usar um Foco Arcano como um Foco de Conjuração para suas magias de Mago."],["ladino","Trapaceiro Arcano",3,"Mãos Mágicas Ligeiras","Ao conjurar Mãos Mágicas , você pode conjurá-la como uma Ação Bônus e pode tornar a mão espectral Invisível. Você pode controlar a mão como uma Ação Bônus e, através dela, pode realizar testes de Destreza (Prestidigitação)."],["ladino","Trapaceiro Arcano",9,"Emboscada Mágica","Se você tem a condição de Invisível quando conjura uma magia em uma criatura, ela tem Desvantagem em qualquer salvaguarda que fizer contra a magia no mesmo turno."],["ladino","Trapaceiro Arcano",13,"Trapaceiro Versátil","Você adquire a capacidade de distrair os alvos com suas Mãos Mágicas . Ao usar a opção Golpe Astuto em seu Ataque em uma criatura, você também pode usar essa opção em outra criatura a até 1,5 metro da mão espectral."],["ladino","Trapaceiro Arcano",17,"Ladrão de Magias","Você adquire a capacidade de roubar magicamente o conhecimento de como conjurar uma magia de outro conjurador.\n\nImediatamente após uma criatura conjurar uma magia que tenha como alvo você ou a inclua em sua área de efeito, você pode executar uma Reação para forçá-la a realizar uma salvaguarda de Inteligência, com CD equivalente à sua CD para evitar sua magia. Se a criatura falhar, você nega o efeito da magia contra si e rouba seu conhecimento se a magia for de 1º círculo ou de um círculo que você possa conjurar (não precisa ser uma magia de Mago). Por 8 horas, você a terá preparada, e a criatura não poderá conjurá-la durante esse período.\n\nApós roubar uma magia com essa característica, você não pode usar esta característica novamente até completar um Descanso Longo.\n\nUm Estudioso Usuário de Magia Arcana agos são reconhecidos por seu estudo aprofundado da magia. Eles conjuram magias explosivas, raios, ilusões e transformações notáveis, além de invocar criaturas de outros planos, prever o futuro e criar barreiras protetoras. Suas magias mais poderosas podem transformar substâncias, invocar meteoros ou abrir portais para outros mundos. Geralmente, os Magos adotam uma abordagem acadêmica, explorando os fundamentos teóricos e categorizando magias em escolas. Figuras renomadas como Bigby, Tasha, Mordenkainen e Yolande contribuíram para a criação de magias icônicas reconhecidas por todo o multiverso.\n\nO máximo que um Mago pode vivenciar de maneira comum é atuar como sábio ou mentor. Muitos oferecem serviços como conselheiros, servem em forças militares ou se envolvem com o crime ou a dominação. Entretanto, a busca pelo conhecimento leva até os magos mais cautelosos a abandonar a segurança de suas bibliotecas e laboratórios em busca de ruínas decadentes e cidades perdidas. A maioria acredita que civilizações antigas guardavam segredos de magia que poderiam conceder um poder maior do que o disponível na atualidade."],["mago","",1,"Adepto de Ritual","Você pode conjurar qualquer magia como um Ritual se essa magia tiver o marcador Ritual e a magia estiver em seu livro de magias. Você não precisa ter a magia preparada, mas deve ler o livro para conjurar uma magia deste modo."],["mago","",1,"Conjuração","Como estudante de magia arcana, você aprendeu a conjurar magias. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras com magias de Mago, que aparecem na lista de magias de Mago mais adiante na descrição da classe.\n\nTruques. Você conhece três truques de Mago à sua escolha. Luz , Mãos Mágicas e Raio de Gelo são recomendados. Ao completar um Descanso Longo, você pode substituir um dos seus truques dessa característica por outro truque de Mago à sua escolha. Ao atingir os níveis 4 e 10 de Mago, você aprende mais um truque de Mago à sua escolha, conforme detalhado na coluna Truques da tabela Características de Mago.\n\nLivro de Magias. Seu aprendizado de mago culminou na criação de um livro único: seu livro de magias. É um objeto Minúsculo que pesa 1,5 quilo, contém 100 páginas e pode ser lido apenas por você ou por alguém que conjure Identificar . Você determina a aparência e os materiais do livro, como um tomo com bordas douradas ou uma coleção de pergaminhos amarrados com barbante.\n\nO livro contém as magias de 1º círculo ou superior que você conhece. Ele começa com seis magias de mago 1º círculo à sua escolha. Armadura Arcana , Detectar Magia , Mísseis Mágicos , Onda Trovejante , Queda Suave e Sono são recomendadas.\n\nAo atingir um nível de Mago após o primeiro, adicione duas magias de Mago à sua escolha ao seu livro de magias. Cada uma dessas magias deve ser de um círculo para o qual você tenha espaços de magia, conforme detalhado na tabela Características de Mago. As magias são o ponto culminante da pesquisa arcana que você faz regularmente.\n\nEspaços de Magia. A tabela Características de Mago mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com essa característica. Para isso, escolha quatro magias do seu livro de magias. As magias escolhidas devem ser de um círculo para o qual você tenha espaços de magia.\n\nO número de magias em sua lista aumenta à medida que você alcança níveis de Mago, conforme detalhado na coluna Magias Preparadas da tabela Características de Mago. Sempre que esse número aumentar, escolha magias adicionais de Mago até que o número de magias em sua lista corresponda ao número na tabela. As magias escolhidas devem ser de um círculo para o qual você possua espaços de magia. Por exemplo, se você é um Mago de nível 3, sua lista de magias preparadas, escolhidas do seu livro de magias, pode incluir seis magias de 1º ou 2º círculo, em qualquer combinação. Se outra característica de Mago lhe conceder magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas essas magias, de outra forma, contam como magias de Mago para você.\n\nMudando Suas Magias Preparadas. Ao completar um Descanso Longo, você pode alterar sua lista de magias preparadas, substituindo qualquer uma das magias por outras do seu livro de magias.\n\nAtributo de Conjuração. Inteligência é seu atributo de conjuração para suas magias de Mago.\n\nFoco de Conjuração. Você pode usar um Foco Arcano ou seu livro de magias como um Foco de Conjuração para suas magias de Mago."],["mago","",1,"Recuperação Arcana","Você pode recuperar um pouco de sua energia mágica estudando seu livro de magias. Ao completar um Descanso Curto, você pode escolher recuperar espaços de magia gastos. Os espaços de magia podem ter um círculo combinado igual a não mais da metade do seu nível de Mago (arredondado para cima), e nenhum dos espaços pode ser de 6º círculo ou superior. Por exemplo, se você é um Mago de nível 4, pode recuperar um valor de até dois círculos de espaços de magia, recuperando um espaço de magia de 2º círculo ou dois espaços de magia de 1º círculo.\n\nVocê pode usar esta característica novamente após completar um Descanso Longo."],["mago","",2,"Acadêmico","Enquanto estudava magia, você também se especializou em outro campo de estudo. Escolha uma das seguintes perícias nas quais você tem proficiência: Arcanismo, História, Investigação, Medicina, Natureza ou Religião. Você tem Especialização na perícia escolhida."],["mago","",3,"Subclasse de Mago","Você adquire uma subclasse de Mago à sua escolha. As subclasses Abjurador, Adivinhador, Evocador e Ilusionista estão detalhadas após a descrição desta classe.Uma subclasse é uma especialidade que concede a você características em determinados níveis de Mago. Durante toda sua jornada, você adquire cada uma das características de sua subclasse de seu nível de Mago ou menor."],["mago","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. Você adquire essa característica novamente nos níveis 8, 12 e 16 de Mago."],["mago","",5,"Memorizar Magia","Ao completar um Descanso Curto, você pode estudar seu livro de magias e substituir uma das magias de Mago de 1º círculo ou superior que você preparou para sua característica Conjuração por outra magia de 1º círculo ou superior do livro."],["mago","",18,"Maestria de Magias","Você alcançou tal domínio sobre certas magias que pode conjurá-las à vontade. Escolha uma magia de 1º e uma de 2º círculo em seu livro de magias que tenham um tempo de conjuração de uma ação. Você sempre tem essas magias preparadas, e pode conjurá-las em seu círculo mais baixo sem gastar um espaço de magia. Para conjurar qualquer uma delas em um círculo superior, você deve gastar um espaço de magia.\n\nAo completar um Descanso Longo, você pode estudar seu livro de magias e substituir uma dessas magias por uma magia elegível do mesmo círculo do livro."],["mago","",19,"Dádiva Épica","Você adquire o talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual se qualifica. Dádiva da Recordação de Magia é recomendado."],["mago","",20,"Assinatura Mágica","Escolha duas magias de 3º círculo em seu livro de magias como suas assinaturas mágicas. Você sempre tem essas magias preparadas e pode conjurá-las, cada uma delas, uma vez no 3º círculo sem gastar um espaço de magia. Ao realizar isso, você não pode conjurá-las deste modo novamente até completar um Descanso Curto ou Longo. Para conjurar uma das magias em um círculo superior, você deve gastar um espaço de magia."],["mago","Abjurador",3,"Proteção Arcana","Você pode tecer magia ao seu redor para se proteger. Ao conjurar uma magia de Abjuração com um espaço de magia, você pode usar simultaneamente um fio da magia para criar uma proteção mágica em si que dura até você completar um Descanso Longo. A proteção tem Pontos de Vida máximos iguais ao dobro do seu nível de Mago mais seu modificador de Inteligência. Ao sofrer dano, a proteção o absorve em vez de você. Aplique qualquer Resistência ou Vulnerabilidade antes de reduzir os Pontos de Vida da proteção. Se o dano reduzir a proteção a 0 Pontos de Vida, você sofre o dano restante. Com 0 Pontos de Vida, a proteção não pode mais absorver dano, mas sua magia permanece. Ao conjurar uma magia Abjuração com um espaço de magia, a proteção restaura um número de Pontos de Vida igual ao dobro do nível do espaço de magia. Você também pode, como uma Ação Bônus, gastar um espaço de magia, e a proteção recupera um número de Pontos de Vida igual ao dobro do nível do espaço de magia gasto.\n\nApós conjurar a proteção, você não pode conjurá-la novamente até completar um Descanso Longo."],["mago","Abjurador",3,"Versado em Abjuração","Escolha duas magias de Mago da escola de Abjuração, cada uma deve ser de 2º círculo ou inferior e adicione-as gratuitamente ao seu livro de magias.\n\nAlém disso, ao adquirir acesso a um novo círculo de espaços de magia nesta classe, você pode adicionar gratuitamente uma magia de Mago da escola de Abjuração ao seu livro de magias. A magia escolhida deve ser de um círculo para o qual você tenha espaços de magia."],["mago","Abjurador",6,"Proteção Projetada","Quando uma criatura à sua vista a até 9 metros de você sofrer dano, você pode executar uma Reação para que sua Proteção Arcana absorva esse dano. Caso isto reduza a proteção a 0 Pontos de Vida, a criatura protegida sofre qualquer dano restante. Se essa criatura tiver alguma Resistência ou Vulnerabilidade, aplique-as antes de reduzir os Pontos de Vida da proteção."],["mago","Abjurador",10,"Rompe-Magia","Você sempre tem as magias Contramagia e Dissipar Magia preparadas. Além disso, você pode conjurar Dissipar Magia como uma Ação Bônus e pode adicionar seu Bônus de Proficiência ao seu teste de atributo.\n\nAo conjurar uma das magias com um espaço de magia, esse espaço não é gasto se a magia falhar em interromper uma magia."],["mago","Abjurador",14,"Resistência à Magia","Você tem Vantagem em salvaguardas contra magias e Resistência ao dano proveniente de magias."],["mago","Adivinhador",3,"Prodígio","Vislumbres do futuro começam a pressionar sua percepção. Ao completar um Descanso Longo, jogue dois d20s e registre os números obtidos. Você pode substituir qualquer Teste de D20 realizado por você ou por uma criatura à sua vista com uma dessas jogadas de previsão. Você deve escolher fazer isso antes da jogada do Teste de D20 e pode substituir uma jogada deste modo apenas uma vez por turno.\n\nCada jogada de previsão pode ser usada apenas uma vez. Ao completar um Descanso Longo você perde quaisquer jogadas de previsão não utilizadas."],["mago","Adivinhador",3,"Versado em Adivinhação","Escolha duas magias de Mago da escola de Adivinhação, cada uma deve ser de 2º círculo ou inferior, e adicione-as gratuitamente ao seu livro de magias. Além disso, ao adquirir acesso a um novo círculo de espaços de magia nesta classe, você pode adicionar gratuitamente uma magia de Mago da escola de Adivinhação ao seu livro de magias. A magia escolhida deve ser de um círculo para o qual você tenha espaços de magia."],["mago","Adivinhador",6,"Perito em Adivinhação","Conjurar magias de Adivinhação é tão fácil para você que gasta apenas uma fração de seus esforços de conjuração. Ao conjurar uma magia de Adivinhação usando um espaço de magia de 2º círculo ou superior, você recupera um espaço de magia gasto. O espaço que você recupera deve ser de um círculo inferior ao espaço que você conjurou e não pode ser superior ao 5º círculo."],["mago","Adivinhador",10,"O Terceiro Olho","Você pode ampliar seus poderes de percepção. Como uma Ação Bônus, escolha um dos seguintes benefícios, que dura até você iniciar um Descanso Curto ou Longo. Você não pode usar essa característica novamente até completar um Descanso Curto ou Longo.\n\nCompreensão Superior. Você pode ler qualquer idioma.\n\nVer o Invisível. Você pode conjurar Ver o Invisível sem gastar um espaço de magia.\n\nVisão no Escuro. Você adquire Visão no Escuro com um alcance de 36 metros."],["mago","Adivinhador",14,"Prodígio Maior","As visões em seus sonhos se intensificam e formam uma imagem mais precisa em sua mente do que está por vir. Jogue três d20s para sua característica Prodígio em vez de dois."],["mago","Evocador",3,"Truque Potente","Seus truques que causam dano afetam até criaturas que evitam os efeitos deles. Ao conjurar um truque em uma criatura e errar o ataque ou o alvo ser bem-sucedido na salvaguarda contra o truque, ele sofre metade do dano (se houver), mas não sofre efeitos adicionais do truque."],["mago","Evocador",3,"Versado em Evocação","Escolha duas magias de Mago da escola de Evocação, cada uma deve ser de 2º círculo ou inferior, e adicione-as gratuitamente ao seu livro de magias.\n\nAlém disso, ao adquirir acesso a um novo círculo de espaços de magia nesta classe, você pode adicionar gratuitamente uma magia de Mago da escola de Evocação ao seu livro de magias. A magia escolhida deve ser de um círculo para o qual você tenha espaços de magia."],["mago","Evocador",6,"Esculpir Magias","Você pode criar zonas de segurança nos efeitos das suas evocações. Ao conjurar uma magia de Evocação que afeta criaturas à sua vista, você pode escolher um número delas igual a 1 mais o círculo da magia. Criaturas escolhidas são bem-sucedidas automaticamente em suas salvaguardas e não sofrem dano se normalmente sofreriam metade do dano em caso de sucesso."],["mago","Evocador",10,"Evocação Potencializada","Ao conjurar uma magia de Mago da escola de Evocação, você pode adicionar seu modificador de Inteligência a uma jogada de dano dessa magia."],["mago","Evocador",14,"Sobrecarga","Você pode aumentar o poder de suas magias. Ao conjurar uma magia de Mago que cause dano com um espaço de magia de 1º a 5º círculo, você pode causar dano máximo com essa magia no turno no qual a conjurar. Ao fazer isso pela primeira vez, você não sofre nenhum efeito adverso. Se usar esta característica novamente antes de completar um Descanso Longo, você sofre 2d12 pontos de dano Necrótico para cada círculo do espaço de magia imediatamente após conjurá-la. Esse dano ignora Resistência e Imunidade.\n\nToda vez que você usa esta característica novamente antes de completar um Descanso Longo, o dano Necrótico por círculo de magia aumenta em 1d12."],["mago","Ilusionista",3,"Ilusões Aprimoradas","Você pode conjurar magias de Ilusão sem fornecer componentes Verbais e se uma magia de Ilusão que você conjurar tiver um alcance de 3 metros ou mais, o alcance aumenta em 18 metros.\n\nVocê também conhece o truque Ilusão Menor . Se já o conhece, você aprende um truque de Mago diferente à sua escolha. O truque não conta para o seu número de truques conhecidos. Você pode criar um som e uma imagem com uma única conjuração de Ilusão Menor e pode conjurá-la como uma Ação Bônus."],["mago","Ilusionista",3,"Versado em Ilusão","Escolha duas magias de Mago da escola de Ilusão, cada uma deve ser de 2º círculo ou inferior e adicione-as gratuitamente ao seu livro de magias.\n\nAlém disso, ao adquirir acesso a um novo círculo de espaços de magia nesta classe, você pode adicionar gratuitamente uma magia de Mago da escola de Ilusão ao seu livro de magias. A magia escolhida deve ser de um círculo para o qual você tenha espaços de magia."],["mago","Ilusionista",6,"Criaturas Espectrais","Você sempre tem as magias Convocar Feérico e Invocar Fera preparadas. Ao conjurar qualquer uma das magias, você pode mudar sua escola para Ilusão, o que faz com que a criatura invocada pareça espectral. Você pode conjurar a versão Ilusão de cada magia sem gastar um espaço de magia, mas conjurá-la sem um espaço de magia reduz pela metade os Pontos de Vida da criatura. Após conjurar qualquer uma das magias sem um espaço de magia, você deve completar um Descanso Longo antes de conjurar novamente a magia desta forma."],["mago","Ilusionista",10,"Autoimagem Ilusória","Ao ser atingido pela jogada de ataque de uma criatura, você pode usar uma Reação para criar uma duplicata ilusória de si entre você e o atacante. O ataque erra automaticamente e a ilusão se dissipa.\n\nApós usar esta característica, você não pode utilizá-la novamente até completar um Descanso Curto ou Longo. Você também pode restaurar seu uso gastando um espaço de magia de 2º círculo ou superior (nenhuma ação é necessária)."],["mago","Ilusionista",14,"Realidade Ilusória","Você aprendeu a tecer magia sombria em suas ilusões para dar a elas uma semi-realidade. Ao conjurar uma magia Ilusão com um espaço de magia, você pode escolher um objeto inanimado e não mágico que faça parte da ilusão e tornar esse objeto real. Você pode executar isso no seu turno como uma Ação Bônus, enquanto a magia estiver em andamento. O objeto permanece real por 1 minuto, durante o qual não pode causar dano ou conferir quaisquer condições. Por exemplo, você pode criar uma ilusão de uma ponte sobre um abismo e, em seguida, torná-la real e atravessá-la.\n\nUm Artista Marcial com um Foco Sobrenatural s Monges praticam um rigoroso treina mento de combate e disciplina mental para se conectarem ao multiverso e canalizarem seus reservatórios internos de poder. Esse poder é interpretado de diferentes maneiras por diversos Monges: como respiração, energia, força vital, essência ou auto consciência. Seja expressado através de impressionantes habilidades marciais ou como manifestações sutis de defesa e velocidade, esse poder permeia todas as ações de um Monge.\n\nOs Monges concentram seu poder interno para produzir efeitos extraordinários, até sobrenaturais. Eles canalizam impressionantes velocidade e força em seus ataques, com ou sem armas. Nas mãos de um Monge, até as armas mais básicas se tornam instrumentos sofisticados de combate.\n\nPara muitos Monges, uma vida estruturada de abstinência ascética ajuda a cultivar o foco físico e mental necessário para aproveitar seu poder. Outros acreditam que a imersão na vibrante confusão da vida alimenta sua determinação e disciplina.\n\nOs Monges veem as aventuras como testes de seu desenvolvimento físico e mental. Motivados por um desejo de cumprir uma missão maior do que apenas matar monstros e saquear tesouros, buscam se transformar em armas vivas."],["monge","",1,"Artes Marciais","Sua prática de artes marciais lhe confere domínio de estilos de combate que usam seu Ataque Desarmado e armas de Monge, que incluem:\n\n• Armas Simples Corpo a Corpo • Armas Marciais Corpo a Corpo que tem a propriedade Leve Você adquire os seguintes benefícios enquanto estiver desarmado ou empunhando apenas armas de Monge e não estiver vestindo armadura ou empunhando um Escudo.\n\nAtaque Desarmado Adicional. Você pode realizar um Ataque Desarmado como uma Ação Bônus.\n\nDado de Artes Marciais. Você pode jogar 1d6 ao invés do dano normal de seu Ataque Desarmado ou armas de Monge. Este dado muda à medida que você atinge níveis de Monge, conforme detalhado na coluna Artes Marciais da tabela Características de Monge.\n\nAtaques com Destreza. Você pode usar seu modificador de Destreza em vez de seu modificador de Força para as jogadas de ataque e dano de seus Ataques Desarmados e armas de Monge. Além disso, quando você usa a opção Empurrar ou Imobilizar do seu Ataque Desarmado, você pode usar seu modificador de Destreza em vez de seu modificador de Força para determinar a CD da salvaguarda."],["monge","",1,"Defesa sem Armadura","Enquanto você não estiver vestindo armadura ou empunhando um Escudo, sua Classe de Armadura base é igual a 10 mais seus modificadores de Destreza e Sabedoria."],["monge","",2,"Foco do Monge","Seu foco e treinamento marcial permitem que você aproveite uma reserva de energia extraordinária dentro de si. Essa energia é representada por Pontos de Foco. Seu nível de Monge determina o número de pontos que você tem, conforme detalhado na coluna Pontos de Foco da tabela Características de Monge. Você pode gastar esses pontos para melhorar ou impulsionar certas características de Monge. Você começa aprendendo três dessas características: Defesa Paciente, Passo do Vento e Torrente de Golpes, cada uma das quais é detalhada abaixo.\n\nAo gastar um Ponto de Foco, ele não está disponível. Você restaura todos os usos gastos ao completar um Descanso Curto ou Longo.\n\nAlgumas características que usam Pontos de Foco exigem que seu alvo realize uma salvaguarda. A CD da salvaguarda é igual a 8 mais seu modificador de Sabedoria e seu Bônus de Proficiência.\n\nDefesa Paciente. Você pode executar a ação Desengajar como uma Ação Bônus. Como alternativa, você pode gastar 1 Ponto de Foco para executar as ações Desengajar e Esquivar como uma Ação Bônus.\n\nPasso do Vento. Você pode executar a ação Correr como uma Ação Bônus. Como alternativa, você pode gastar 1 Ponto de Foco para executar as ações Desengajar e Correr como uma Ação Bônus, e sua distância de salto é dobrada durante o turno.\n\nTorrente de Golpes. Você pode gastar 1 Ponto de Foco para realizar dois Ataques Desarmados como uma Ação Bônus."],["monge","",2,"Metabolismo Incomum","Ao jogar Iniciativa, você pode restaurar todos os Pontos de Foco gastos. Ao realizar isso, jogue seu dado de Artes Marciais e recupere um número de Pontos de Vida igual ao seu nível de Monge mais o valor jogado. Após usar essa característica, você não pode usá-la novamente até completar um Descanso Longo."],["monge","",2,"Movimento sem Armadura","Seu Deslocamento aumenta em 3 metros enquanto você não vestir armadura ou empunhar um Escudo. Esse bônus aumenta quando você atinge certos níveis de Monge, conforme detalhado na tabela Características de Monge."],["monge","",3,"Defletir Ataques","Ao ser atingido devido uma jogada de ataque e o dano dessa jogada incluir dano Contundente, Cortante ou Perfurante, você pode executar uma Reação para reduzir o dano total do ataque. A redução é igual a 1d10 mais seu modificador de Destreza e nível de Monge. Ao reduzir o dano a 0, você pode gastar 1 Ponto de Foco para redirecionar parte da força do ataque. Para isso, escolha uma criatura à vista a até 1,5 metro de você se o ataque for corpo a corpo, ou a até 18 metros se for à distância e sem Cobertura Total. Essa criatura deve ser bem-sucedida em uma salvaguarda de Destreza ou sofre dano igual a duas jogadas de seu dado de Artes Marciais mais seu modificador de Destreza. O dano é do mesmo tipo causado pelo ataque."],["monge","",3,"Subclasse de Monge","Você adquire uma subclasse de Monge à sua escolha. As subclasses Combatente da Mão Espalmada, Combatente da Misericórdia, Combatente das Sombras e Combatente dos Elementos estão detalhadas após a descrição desta classe. Uma subclasse é uma especialidade que concede a você características em determinados níveis de Monge. Durante toda sua jornada, você adquire cada uma das características de sua subclasse de seu nível de Monge ou menor."],["monge","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para o qual atenda os pré-requisitos. Você adquire essa característica novamente nos níveis 8, 12 e 16 de Monge."],["monge","",4,"Queda Lenta","Você pode executar uma Reação ao estar em queda para reduzir qualquer dano recebido da queda em um valor igual a cinco vezes seu nível de Monge."],["monge","",5,"Ataque Extra","Você pode atacar duas vezes, em vez de uma, sempre que executar a ação Atacar no seu turno."],["monge","",5,"Golpe Atordoante","Uma vez por turno, ao acertar uma criatura com uma arma de Monge ou um Ataque Desarmado, você pode gastar 1 Ponto de Foco para tentar um golpe atordoante. O alvo deve realizar uma salvaguarda de Constituição. Se falhar, o alvo tem a condição Atordoado até o início do seu próximo turno. Em caso de sucesso, o Deslocamento do alvo é reduzido pela metade até o início do seu próximo turno, e a próxima jogada de ataque realizada contra o alvo antes disso tem Vantagem."],["monge","",6,"Golpes Potencializados","Ao causar dano com seu Ataque Desarmado, você escolhe entre causar dano Energético ou seu tipo de dano normal."],["monge","",7,"Evasão","Ao ser alvo de um efeito que permita uma salvaguarda de Destreza para receber apenas metade do dano, você não recebe dano em caso de sucesso e sofre apenas metade do dano se falhar.\n\nVocê não se beneficia dessa característica se tem a condição Incapacitado."],["monge","",9,"Movimento Acrobático","Enquanto não vestir armadura ou empunhar um Escudo, você adquire a capacidade de se mover no seu turno ao longo de superfícies verticais e por líquidos sem entrar em queda durante o movimento."],["monge","",10,"Foco Aprimorado","Sua Defesa Paciente, Passo do Vento e Torrente de Golpes adquirem os seguintes benefícios.\n\nDefesa Paciente. Ao gastar um Ponto de Foco para usar Defesa Paciente, você adquire um número de Pontos de Vida Temporários igual a duas jogadas de seus dados de Artes Marciais.\n\nPasso do Vento. Ao gastar um Ponto de Foco para usar Passo do Vento, você pode escolher uma criatura voluntária a até 1,5 metro de si que seja Grande ou menor. Você move a criatura com você até o final do seu turno. O movimento da criatura não provoca Ataques de Oportunidade.\n\nTorrente de Golpes. Você pode gastar 1 Ponto de Foco para usar Torrente de Golpes e realizar três Ataques Desarmados em vez de dois."],["monge","",10,"Restauro Pessoal","Por pura força de vontade, você pode remover uma das seguintes condições de si no final de cada um dos seus turnos: Amedrontado, Enfeitiçado ou Envenenado.\n\nAlém disso, você não sofre níveis de Exaustão por não se alimentar e se hidratar."],["monge","",13,"Defletir Energia","Agora você pode usar sua característica Defletir Ataques contra ataques que causam qualquer tipo de dano, não apenas Contundente, Cortante ou Perfurante."],["monge","",14,"Sobrevivente Disciplinado","Sua disciplina física e mental lhe concede proficiência em todas as salvaguardas.\n\nAlém disso, ao realizar uma salvaguarda e falhar, você pode gastar 1 Ponto de Foco para jogar novamente, e deve usar o novo resultado."],["monge","",15,"Foco Perfeito","Ao jogar Iniciativa e não usar Metabolismo Incomum, você recupera Pontos de Foco gastos até ter 4, se tiver 3 ou menos."],["monge","",18,"Defesa Superior","No início do seu turno, você pode gastar 3 Pontos de Foco para se fortalecer contra danos por 1 minuto ou até ter a condição Incapacitado. Durante esse período, você tem Resistência a todos os tipos de dano, exceto Energético."],["monge","",19,"Dádiva Épica","Você adquire o talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual se qualifica. Dádiva do Ataque Irresistível é recomendada."],["monge","",20,"Corpo e Mente","Você auto aperfeiçoou seu corpo e mente a novos patamares. Seus valores de Destreza e Sabedoria aumentam em 4, até no máximo 25."],["monge","Combatente da Mão Espalmada",3,"Técnica da Mão Espalmada","Ao atingir uma criatura com um ataque concedido por sua Torrente de Golpes, você pode impor um dos seguintes efeitos ao alvo.\n\nDerrubar. O alvo deve ser bem-sucedido em uma salvaguarda de Destreza ou tem a condição Caído.\n\nDesorientar. O alvo não pode realizar Ataques de Oportunidade até o início do próximo turno dele.\n\nEmpurrar. O alvo deve ser bem-sucedido em uma salvaguarda de Força ou é empurrado até 4,5 metros para longe de você."],["monge","Combatente da Mão Espalmada",6,"Integridade Corporal","Você adquire a capacidade de se curar. Como uma Ação Bônus, você pode jogar seu dado de Artes Marciais. Você recupera um número de Pontos de Vida igual ao resultado mais seu modificador de Sabedoria (mínimo de 1 Ponto de Vida recuperado).\n\nVocê pode usar essa característica um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo."],["monge","Combatente da Mão Espalmada",11,"Passo Veloz","Ao executar uma Ação Bônus diferente de Passo do Vento, você também pode usar Passo do Vento imediatamente após essa Ação Bônus."],["monge","Combatente da Mão Espalmada",17,"Palma Vibrante","Você obtém a habilidade de infligir vibrações letais no corpo de outra pessoa. Ao acertar uma criatura com um Ataque Desarmado, você pode gastar 4 Pontos de Foco para iniciar essas vibrações imperceptíveis, que duram por um número de dias igual ao seu nível de Monge. As vibrações são inofensivas, a menos que você execute uma Ação para encerrá-las. Como alternativa, ao executar a ação Atacar no seu turno, você pode renunciar a um dos ataques para acabar com as vibrações. Para encerrá-las, você e o alvo devem estar no mesmo plano de existência. Ao fazer isso, o alvo deve realizar uma salvaguarda de Constituição, sofrendo 10d12 pontos de dano Energético se falhar ou metade do dano em caso de sucesso.\n\nVocê pode ter apenas uma criatura sob o efeito desta característica por vez. Você pode encerrar as vibrações inofensivamente (nenhuma ação é necessária)."],["monge","Combatente da Misericórdia",3,"Implementos de Misericórdia","Você adquire proficiência nas perícias Intuição e Medicina e proficiência com o Kit de Herbalismo."],["monge","Combatente da Misericórdia",3,"Mão de Cura","Com uma ação Usar Magia, você pode gastar 1 Ponto de Foco para tocar uma criatura e restaurar um número de Pontos de Vida igual a uma jogada de seu dado de Artes Marciais mais seu modificador de Sabedoria. Ao usar sua Torrente de Golpes, você pode substituir um dos Ataques Desarmados pelo uso dessa característica sem gastar um Ponto de Foco para a cura."],["monge","Combatente da Misericórdia",3,"Mão de Dolo","Uma vez por turno, ao atingir uma criatura com um Ataque Desarmado e causar dano, você pode gastar 1 Ponto de Foco para causar dano Necrótico adicional igual a uma jogada de seu dado de Artes Marciais mais seu modificador de Sabedoria."],["monge","Combatente da Misericórdia",6,"Toque de Médico","Sua Mão de Cura e Mão de Dolo melhoram, conforme detalhado abaixo.\n\nMão de Cura. Ao usar Mão de Cura, você também pode encerrar uma das seguintes condições na criatura que você curar: Atordoado, Cego, Envenenado, Paralisado ou Surdo.\n\nMão de Dolo. Ao usar Mão de Dolo em uma criatura, você também pode impor a ela a condição Envenenado até o final do seu próximo turno."],["monge","Combatente da Misericórdia",11,"Torrente de Cura e Dolo","Ao usar Torrente de Golpes, você pode substituir cada um dos Ataques Desarmados pelo uso da Mão de Cura sem gastar Pontos de Foco para a cura.\n\nAlém disso, ao realizar um Ataque Desarmado com Torrente de Golpes e causar dano, você pode usar Mão de Dolo com esse ataque sem gastar um Ponto de Foco para Mão de Dolo. Você ainda pode usar Mão de Dolo apenas uma vez por turno.\n\nVocê pode usar esses benefícios um número de vezes igual ao seu modificador de Sabedoria (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo."],["monge","Combatente da Misericórdia",17,"Mão da Misericórdia Final","Seu domínio da energia vital abre a porta para a misericórdia final. Como uma ação Usar Magia, você pode tocar o cadáver de uma criatura que morreu nas últimas 24 horas e gastar 5 Pontos de Foco. A criatura então retorna à vida com um número de Pontos de Vida igual a 4d10 mais seu modificador de Sabedoria. Se a criatura morreu com quaisquer condições a seguir, a criatura revive com as condições removidas: Atordoado, Cego, Envenenado, Paralisado e Surdo. Após usar essa característica, você não pode usá-la novamente até completar um Descanso Longo."],["monge","Combatente das Sombras",3,"Artes das Sombras","Você aprendeu a aproveitar o poder do Sombral, obtendo os seguintes benefícios.\n\nEscuridão. Você pode gastar 1 Ponto de Foco para conjurar a magia Escuridão sem componentes de magia. Você pode ver na área da magia ao conjurar com esta característica. Enquanto a magia persistir, você pode mover sua área de Escuridão para um espaço a até 18 metros de si no início de cada um dos seus turnos.\n\nIlusão Sombria. Você conhece a magia Ilusão Menor . Sabedoria é seu atributo de conjuração para ela.\n\nVisão no Escuro. Você adquire Visão no Escuro com um alcance de 18 metros. Se você já tem Visão no Escuro, seu alcance aumenta em 18 metros."],["monge","Combatente das Sombras",6,"Passo da Sombra","Enquanto estiver inteiramente em Meia-luz ou Escuridão, você pode executar uma Ação Bônus para se teleportar até 18 metros para um espaço desocupado à sua vista que também esteja sob Meia-luz ou Escuridão. Você então tem Vantagem no próximo ataque corpo a corpo que realizar antes do final do turno atual."],["monge","Combatente das Sombras",11,"Passo da Sombra Aprimorado","Você pode usar sua conexão com o Sombral para melhorar seu teleporte. Ao usar Passo da Sombra, você pode gastar 1 Ponto de Foco para remover o requisito no qual você deve iniciar ou encerrar seu turno em Meia-luz ou Escuridão para usar esta característica. Como parte desta Ação Bônus, você pode realizar um Ataque Desarmado imediatamente após se teleportar."],["monge","Combatente das Sombras",17,"Manto da Sombra","Como uma ação Usar Magia enquanto estiver inteiramente em Meia-luz ou Escuridão, você pode gastar 3 Pontos de Foco para envolver-se em sombras por 1 minuto, até ter a condição Incapacitado ou até encerrar seu turno em Luz Plena. Enquanto estiver envolto por essas sombras, você adquire os seguintes benefícios.\n\nInvisibilidade. Você tem a condição Invisível.\n\nParcialmente Incorpóreo. Você pode se mover por espaços ocupados como se fossem Terrenos Difíceis. Se você encerrar seu turno em tal espaço, é deslocado para o último espaço desocupado em que estava.\n\nTorrente de Sombras. Você pode usar sua Torrente de Golpes sem gastar nenhum Ponto de Foco."],["monge","Combatente dos Elementos",3,"Manipular Elementos","Você conhece a magia Elementalismo . Sabedoria é seu atributo de conjuração para ela."],["monge","Combatente dos Elementos",3,"Sintonia Elemental","No início do seu turno, você pode gastar 1 Ponto de Foco para imbuir-se de energia elemental. A energia dura 10 minutos ou até você ter a condição Incapacitado. Você adquire os seguintes benefícios enquanto esta característica estiver ativa.\n\nAtaques Elementais. Ao acertar com seu Ataque Desarmado, você pode causar com ele, à sua escolha, dano Ácido, Elétrico, Gélido, Ígneo ou Trovejante, em vez de seu tipo de dano normal. Ao causar um desses tipos de dano, você também pode forçar o alvo a realizar uma salvaguarda de Força. Se ele falhar, você pode movê-lo até 3 metros em sua direção ou para longe de você, enquanto a energia elemental gira em torno dele.\n\nExtensão. Ao realizar um Ataque Desarmado, seu alcance aumenta em 3 metros à medida que a energia elemental se estende por você."],["monge","Combatente dos Elementos",6,"Explosão Elemental","Como uma ação Usar Magia, você pode gastar 2 Pontos de Foco para fazer com que energia elemental exploda em uma Esfera de 6 metros de raio centrada em um ponto a até 36 metros de você. Escolha um tipo de dano: Ácido, Elétrico, Gélido, Ígneo ou Trovejante. Cada criatura na Esfera deve realizar uma salvaguarda de Destreza. Se falhar, uma criatura sofre dano do tipo escolhido igual a três jogadas de seus dados de Artes Marciais. Em caso de sucesso, uma criatura sofre metade do dano."],["monge","Combatente dos Elementos",11,"Passo dos Elementos","Enquanto sua Sintonia Elemental estiver ativa, você também tem um Deslocamento de Natação e de Voo igual ao seu Deslocamento."],["monge","Combatente dos Elementos",17,"Ápice Elemental","Enquanto sua Sintonia Elemental estiver ativa, você também adquire os seguintes benefícios.\n\nGolpes Potencializados. Uma vez em cada um dos seus turnos, você pode causar dano adicional a um alvo igual a uma jogada de seu dado de Artes Marciais ao atingi-lo com um Ataque Desarmado. O dano adicional é do mesmo tipo causado por esse ataque.\n\nPasso Destrutivo. Ao usar seu Passo do Vento, seu Deslocamento aumenta em 6 metros até o final do turno. Pela duração, qualquer criatura à sua escolha sofre dano igual a uma jogada de seu dado de Artes Marciais quando você entra em um espaço a até 1,5 metro dela. O tipo de dano fica à sua escolha, entre Ácido, Elétrico, Gélido, Ígneo ou Trovejante. Uma criatura pode sofrer esse dano apenas uma vez por turno.\n\nResistência a Dano. Você adquire Resistência a um dos seguintes tipos de dano à sua escolha: Ácido, Elétrico, Gélido, Ígneo ou Trovejante. No início de cada um dos seus turnos, você pode alterar essa escolha. Um Combatente Devotado com Juramentos Sagrados s Paladinos são unidos por seus jura mentos de combater as forças da aniquilação e da corrupção. Seja diante do altar de um deus, em uma clareira sagrada diante de espíritos da natureza ou em momentos de desespero e tristeza com os mortos como as únicas testemunhas, o juramento de um Paladino é um vínculo poderoso. Ele transforma um combatente devoto em um campeão abençoado. Paladinos treinam para dominar armas e armaduras, mas suas habilidades marciais são superadas pelo poder mágico que possuem: curar feridos, punir inimigos e proteger os indefesos e aqueles que lutam ao seu lado. A vida de um Paladino é, quase por definição, uma vida de aventura, pois eles estão na linha de frente da luta cósmica contra a aniquilação. Guerreiros são raros nos exércitos de um mundo, e ainda menos indivíduos podem reivindicar a vocação de um Paladino. Ao receber esse chamado, essas pessoas abençoadas abandonam suas ocupações anteriores para empunhar armas e magia."],["paladino","",1,"Conjuração","Você aprendeu a conjurar magias por meio de oração e meditação. Veja o capítulo 7 para as regras sobre conjuração de magias. As informações abaixo detalham como você usa essas regras com as magias de Paladino, explicadas na lista de magias de Paladino mais adiante na descrição da classe.\n\nEspaços de Magia. A tabela Características de Paladino mostra quantos espaços de magia você tem para conjurar suas magias de 1º círculo ou superior. Você restaura todos os espaços gastos ao completar um Descanso Longo.\n\nMagias Preparadas de 1º Círculo ou Superior. Você prepara a lista de magias de 1º círculo ou superior que estão disponíveis para você conjurar com essa característica. Para começar, escolha duas magias de Paladino de 1º círculo. Destruição Cauterizante e Heroísmo são recomendadas.\n\nO número de magias em sua lista aumenta à medida que você atinge níveis de Paladino, conforme mostrado na coluna Magias Preparadas da tabela Características de Paladino. Sempre que esse número aumentar, escolha magias adicionais da lista de magias de Paladino até que o número de magias em sua lista corresponda ao número da tabela. As magias escolhidas devem ser de um círculo para o qual você possui espaços de magia. Por exemplo, se você é um Paladino de nível 5, sua lista de magias preparadas pode incluir seis magias de Paladino de 1º ou 2º círculo em qualquer combinação. Se outra característica de Paladino lhe der magias que você sempre tem preparadas, essas magias não contam para o número de magias que você pode preparar com esta característica, mas essas magias, de outra forma, contam como magias de Paladino para você.\n\nMudando Suas Magias Preparadas. Sempre que completar um Descanso Longo, você pode substituir uma magia em sua lista por outra magia de Paladino para a qual você tem espaços de magia.\n\nAtributo de Conjuração. Carisma é seu atributo de conjuração para suas magias de Paladino.\n\nFoco de Conjuração. Você pode usar um Símbolo Sagrado como um Foco de Conjuração para suas magias de Paladino."],["paladino","",1,"Maestria em Arma","Seu treinamento com armas permite que você use as propriedades de maestria de dois tipos de armas à sua escolha com as quais você tem proficiência, como Azagaia e Espadas Longas.\n\nSempre que completar um Descanso Longo, você pode alterar os tipos de armas que escolheu. Por exemplo, você pode mudar para usar as propriedades de maestria de Alabardas e Manguais."],["paladino","",1,"Mãos Consagradas","Seu toque abençoado pode aliviar feridas. Você tem uma reserva de poder de cura que reabastece ao completar um Descanso Longo. Com essa reserva, você pode recuperar um número total de Pontos de Vida igual a cinco vezes seu nível de Paladino.\n\nComo uma Ação Bônus, você toca uma criatura (que pode ser você mesmo) e extrair poder dessa reserva de cura para restaurar um número de Pontos de Vida para essa criatura, até o valor máximo restante na reserva. Você também pode gastar 5 Pontos de Vida dessa reserva de poder de cura para remover a condição Envenenado da criatura; esses pontos não restauram Pontos de Vida da criatura."],["paladino","",2,"Destruição do Paladino","Você sempre tem a magia Destruição Divina preparada. Além disso, você pode conjurá-la sem gastar um espaço de magia, não podendo conjurá-la dessa forma novamente antes de completar um Descanso Longo"],["paladino","",2,"Estilo de Luta","Você adquire um talento Estilo de Luta à sua escolha (veja também o capítulo 5). Em vez de escolher um desses talentos, você pode escolher a opção abaixo.\n\nCombatente Abençoado. Você aprende dois truques de Clérigo à sua escolha. Chama Sagrada e Orientação são recomendados. Os truques escolhidos contam como magias de Paladino para você, e Carisma é o atributo de conjuração para elas. Sempre que você atinge um nível de Paladino, pode substituir um desses truques por outro truque de Clérigo."],["paladino","",3,"Canalizar Divindade","Você pode canalizar energia divina diretamente dos Planos Externos, usando-a para causar efeitos mágicos. Você começa com um desses efeitos: Sentido Divino, descrito abaixo. Outras características de Paladino dão opções adicionais de efeito de Canalizar Divindade. Cada vez que você usa Canalizar Divindade desta classe, você escolhe qual efeito desta classe usar.\n\nVocê pode usar Canalizar Divindade desta classe duas vezes e três vezes a partir do nível 11 de Paladino. Você recupera um uso gasto ao completar um Descanso Curto, e restaura todos os usos gastos ao completar um Descanso Longo.\n\nSe um efeito de Canalizar Divindade exigir uma salvaguarda, a CD é igual a CD para evitar magias da característica Conjuração desta classe.\n\nSentido Divino. Como uma Ação Bônus, você pode abrir sua consciência para detectar Celestiais, Ínferos Mortos-Vivos. Pelos próximos 10 minutos ou até você ter a condição Incapacitado, você sabe a localização de qualquer criatura desse tipo a até 18 metros de você e conhece o tipo de criatura. Dentro do mesmo raio, você também detecta a presença de qualquer lugar ou objeto que tenha sido consagrado ou profanado, como na magia Consagrar."],["paladino","",3,"Subclasse de Paladino","Você adquire uma subclasse de Paladino à sua escolha. As subclasses Juramento da Devoção, Juramento da Glória, Juramento de Vingança e Juramento dos Anciões estão detalhadas após a descrição desta classe. Uma subclasse é uma especialidade que lhe concede características em determinados níveis de Paladino. Durante toda sua jornada, você recebe cada uma das características de sua subclasse de seu nível de Paladino ou menor."],["paladino","",4,"Aumento no Valor de Atributo","Você adquire o talento Aumento no Valor de Atributo (veja o capítulo 5) ou outro talento à sua escolha para qual atenda os pré-requisitos. Você adquire essa característica novamente nos níveis 8, 12 e 16 de Paladino."],["paladino","",5,"Ataque Extra","Você pode atacar duas vezes, em vez de uma, sempre que executar a ação Atacar no seu turno."],["paladino","",5,"Montaria Fiel","Você pode pedir auxílio de uma montaria sobrenatural. Você sempre tem a magia Convocar Montaria preparada. Você também pode conjurar a magia uma vez sem gastar um espaço de magia, e restaura a capacidade de fazê-lo ao completar um Descanso Longo."],["paladino","",6,"Aura de Proteção","Você irradia uma aura protetora e invisível em uma Emanação de 3 metros que se origina em você. A aura fica inativa em você, caso tenha a condição Incapacitado.\n\nVocê e seus aliados na aura adquirem um bônus em salvaguardas igual ao seu modificador de Carisma (bônus mínimo de +1).\n\nSe outro Paladino estiver presente, uma criatura pode se beneficiar de apenas uma Aura de Proteção de cada vez; a criatura escolhe qual aura recebe enquanto estiver nela."],["paladino","",9,"Repudiar Inimigos","Como uma ação Usar Magia, você pode fazer um uso de Canalizar Divindade para subjugar inimigos com temor. Ao apresentar seu Símbolo Sagrado ou arma, você pode escolher um número de criaturas igual ao seu modificador de Carisma (no mínimo uma criatura) à sua vista e a até 18 metros de você. Cada alvo deve e ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Amedrontado por 1 minuto ou até sofrer qualquer dano. Enquanto Amedrontado deste modo, um alvo pode realizar apenas uma das opções seguintes nos turnos dele: mover-se, executar uma ação ou executar uma Ação Bônus."],["paladino","",10,"Aura de Coragem","Você e seus aliados têm Imunidade à condição Amedrontado enquanto estiverem em sua Aura de Proteção. Se um aliado Amedrontado entrar na aura, essa condição não tem efeito sobre esse aliado enquanto ele o estiver na aura."],["paladino","",11,"Golpes Radiantes","Seus golpes agora imbuem poder sobrenatural. Ao atingir alvo com uma jogada de ataque usando uma arma Corpo a Corpo ou um Ataque Desarmado, o alvo sofre 1d8 pontos de dano Radiante adicionais."],["paladino","",14,"Toque Restaurador","Ao usar Mãos Consagradas em uma criatura, você também pode remover uma ou mais das seguintes condições da criatura: Amedrontado, Atordoado, Cego, Enfeitiçado, Paralisado ou Surdo. Você deve gastar 5 Pontos de Vida da reserva de cura de Mãos Consagradas para cada uma dessas condições que deseja remover; esses pontos não restauram Pontos de Vida para a criatura."],["paladino","",18,"Aura Expandida","Sua Aura de Proteção agora é uma Emanação de 9 metros."],["paladino","",19,"Dádiva Épica","Você adquire o talento Dádiva Épica (veja o capítulo 5) ou outro talento à sua escolha para o qual se qualifica. Dádiva da Visão Verdadeira é recomendada."],["paladino","Juramento da Devoção",3,"Magias do Juramento da Devoção","A magia do seu juramento garante que você sempre tenha certas magias prontas; ao atingir um nível de Paladino detalhado na tabela Magias do Juramento da Devoção, você sempre tem as magias apresentadas preparadas."],["paladino","Juramento da Devoção",3,"Arma Sagrada","Ao executar a ação Atacar, você pode gastar um uso de seu Canalizar Divindade para imbuir uma arma Corpo a Corpo que você está empunhando com energia positiva. Por 10 minutos ou até usar essa característica novamente, você adiciona seu modificador de Carisma às jogadas de ataque que realizar com essa arma (bônus mínimo de +1) e, cada vez que atingir com ela, você causa o tipo de dano normal da arma ou dano Radiante.\n\nAlém disso, a arma também emite Luz Plena em um raio de 6 metros e Meia-luz por mais 6 metros.\n\nVocê pode encerrar este efeito mais cedo (nenhuma ação é necessária). Este efeito também encerra se você não estiver carregando a arma."],["paladino","Juramento da Devoção",7,"Aura de Devoção","Você e seus aliados têm Imunidade à condição Enfeitiçado enquanto estiverem em sua Aura de Proteção. Se um aliado Enfeitiçado entrar na aura, essa condição não tem efeito sobre esse aliado enquanto ele estiver na aura."],["paladino","Juramento da Devoção",15,"Destruição Protetora","Sua destruição mágica agora irradia energia protetora. Ao conjurar Destruição Divina , você e seus aliados têm Cobertura Parcial enquanto estiverem em sua Aura de Proteção. A aura mantém este benefício até o início do seu próximo turno."],["paladino","Juramento da Devoção",20,"Resplendor Sagrado","Como uma Ação Bônus, você pode imbuir sua Aura de Proteção com poder sagrado, concedendo os benefícios abaixo por 10 minutos ou até a encerrar (nenhuma ação é necessária). Após usar esta característica, você não pode utilizá-la novamente até completar um Descanso Longo. Você também pode recuperar seu uso gastando um espaço de magia de 5º círculo (nenhuma ação é necessária).\n\nDano Radiante. Sempre que um inimigo inicia o turno na sua aura, essa criatura sofre dano Radiante igual ao seu modificador de Carisma mais seu Bônus de Proficiência.\n\nLuz Solar. A aura é preenchida com Luz Plena que é luz solar.\n\nVigília Consagrada. Você tem Vantagem em qualquer salvaguarda que seja forçado a realizar por um Ínfero ou um Morto-Vivo."],["paladino","Juramento da Glória",3,"Atleta Inigualável","Como uma Ação Bônus, você pode gastar um uso do seu Canalizar Divindade para aprimorar seu atletismo. Por 1 hora, você tem Vantagem em testes de Força (Atletismo) e Destreza (Acrobacia), e a distância de seus Saltos Longos e Salto em Altura aumenta em 3 metros (essa distância adicional custa movimento padrão)."],["paladino","Juramento da Glória",3,"Destruição Inspiradora","Imediatamente após conjurar Destruição Divina , você pode gastar um uso do seu Canalizar Divindade e distribuir Pontos de Vida Temporários para criaturas à sua escolha a até 9 metros de si, incluindo você. O número total de Pontos de Vida Temporários é igual a 2d8 mais o seu nível de Paladino, dividido entre as criaturas escolhidas, como preferir."],["paladino","Juramento da Glória",3,"Magias do Juramento da Glória","A magia do seu juramento garante que você sempre tenha certas magias prontas; ao atingir um nível de Paladino detalhado na tabela Magias do Juramento da Glória, você sempre tem as magias apresentadas preparadas."],["paladino","Juramento da Glória",7,"Aura de Vivacidade","Seu Deslocamento aumenta em 3 metros.\n\nAlém disso, sempre que um aliado entra em sua Aura de Proteção pela primeira vez em um turno ou inicia o turno dele na aura, o Deslocamento do aliado aumenta em 3 metros até o final do próximo turno dele."],["paladino","Juramento da Glória",15,"Defesa Gloriosa","Você pode transformar a defesa em um ataque repentino. Quando você ou outra criatura à sua vista a até 3 metros de você é atingida por uma jogada de ataque, você pode executar uma Reação para conceder um bônus à CA do alvo contra esse ataque, fazendo potencialmente com que o ataque erre. O bônus é igual ao seu modificador de Carisma (mínimo de +1). Se o ataque falhar, você pode realizar um ataque com uma arma contra o atacante como parte desta Reação se o atacante estiver no alcance da sua arma.\n\nVocê pode usar essa característica um número de vezes igual ao seu modificador de Carisma (mínimo de uma vez) e restaura todos os usos gastos ao completar um Descanso Longo."],["paladino","Juramento da Glória",20,"Lenda Viva","Você pode se fortalecer com as lendas — verdadeiras ou exageradas — de seus grandes feitos. Como uma Ação Bônus, você recebe os benefícios abaixo por 10 minutos. Após usar essa característica, você não pode utilizá-la novamente até completar um Descanso Longo. Você também pode recuperar seu uso gastando um espaço de magia de 5º círculo (nenhuma ação é necessária).\n\nCarismático. Você é abençoado com uma presença sobrenatural e tem Vantagem em todos os testes de Carisma.\n\nGolpe Infalível. Uma vez em cada um dos seus turnos, ao realizar uma jogada de ataque com uma arma e errar, você pode fazer com que esse ataque atinja.\n\nJogar Novamente a Salvaguarda. Se você falhar em uma salvaguarda, pode usar sua Reação para jogá-la novamente. Você deve usar o novo resultado."],["paladino","Juramento da Vingança",3,"Magias do Juramento da Vingança","A magia do seu juramento garante que você sempre tenha certas magias prontas; quando você atinge um nível de Paladino detalhado na tabela Magias do Juramento da Vingança, você sempre tem as magias apresentadas preparadas."],["paladino","Juramento da Vingança",3,"Voto de Inimizade","Ao executar a ação Atacar, você pode gastar um uso de seu Canalizar Divindade para proferir um voto de inimizade contra uma criatura à sua vista a até 9 metros de si. Você tem Vantagem em jogadas de ataque contra a criatura por 1 minuto ou até usar essa característica novamente.\n\nCaso a criatura caia a 0 Pontos de Vida antes que o voto termine, você pode transferir o voto para uma criatura diferente a até 9 metros de você (nenhuma ação é necessária)."],["paladino","Juramento da Vingança",7,"Vingador Implacável","Seu foco sobrenatural permite que você evite a retirada de um inimigo. Ao atingir uma criatura com um Ataque de Oportunidade, você pode reduzir o Deslocamento da criatura para 0 até o final do turno atual. Você pode, então, se mover até metade de seu Deslocamento como parte da mesma Reação. Esse movimento não provoca Ataques de Oportunidade."],["paladino","Juramento da Vingança",15,"Alma Vingativa","Imediatamente após uma criatura sob o efeito do seu Voto de Inimizade acertar ou errar com uma jogada de ataque, você pode executar uma Reação para realizar um ataque corpo a corpo contra essa criatura se ela estiver ao seu alcance."],["paladino","Juramento da Vingança",20,"Anjo Vingador","Como uma Ação Bônus, você adquire os benefícios abaixo por 10 minutos ou até a encerrar (nenhuma ação é necessária). Após usar esta característica, você não pode utilizá-la novamente até completar um Descanso Longo. Você também pode recuperar seu uso gastando um espaço de magia de 5º círculo (nenhuma ação é necessária).\n\nAura Amedrontadora. Sempre que um inimigo inicia o turno dele em sua Aura de Proteção, ele deve ser bem-sucedido em uma salvaguarda de Sabedoria ou tem a condição Amedrontado por 1 minuto, ou até sofrer qualquer dano. Jogadas de ataque contra a criatura Amedrontada têm Vantagem.\n\nVoo. Você cria asas espectrais nas costas e tem um Deslocamento de Voo de 18 metros, além de poder pairar."],["paladino","Juramento dos Anciões",3,"A Ira da Natureza","Como uma ação Usar Magia, você pode gastar um uso do seu Canalizar Divindade para conjurar videiras espectrais em torno de criaturas próximas. Cada criatura à sua escolha que você possa ver a até 4,5 metros de você deve ser bem-sucedida em uma salvaguarda de Força ou tem a condição Contido por 1 minuto. Uma criatura Contida repete a salvaguarda no final de cada um dos turnos dela, encerrando o efeito em caso de sucesso."],["paladino","Juramento dos Anciões",3,"Magias do Juramento dos Anciões","A magia do seu juramento garante que você sempre tenha certas magias prontas; quando você atinge um nível de Paladino detalhado na tabela Magias do Juramento dos Anciões, você sempre tem as magias apresentadas preparadas."],["paladino","Juramento dos Anciões",7,"Aura de Resistência","Magia antiga repousa tão fortemente em você que forma uma proteção mística, bloqueando a energia que vem de fora do Plano Material; você e seus aliados têm Resistência a dano Necrótico, Psíquico e Radiantes enquanto estiverem em sua Aura de Proteção."],["paladino","Juramento dos Anciões",15,"Sentinela Imortal","Ao ser reduzido a 0 Pontos de Vida e não morto imediatamente, você fica com 1 Ponto de Vida e recupera um número de Pontos de Vida igual a três vezes o seu nível de Paladino. Após usar essa característica, você não pode utilizá-la novamente até completar um Descanso Longo.\n\nAlém disso, você não pode envelhecer magicamente sua aparência não envelhece."],["paladino","Juramento dos Anciões",20,"Campeão Ance
